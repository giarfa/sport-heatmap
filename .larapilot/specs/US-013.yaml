body: |
  #### US-013: Previous / Next window navigation, with older Garmin runs kept

  **Epic:** EP-003 | **Priority:** HIGH | **Points:** 8 | **Status:** TODO
  **Blocked by:** -
  **Type:** Feature
  **Release:** 2.0.0
  **Supersedes:** US-004 criterion "the window always ends on the current week" · US-008 criterion "rows outside the 112-day window are skipped and counted as outside-window"
  **Traces to:** FR-019 (MoSCoW: Must — new) · FR-004 (changed) · FR-018 (changed) · FR-006 · FR-009 · FR-017 — no journey (the PRD has no `## User Journeys`)
  **Prior art:** built-in — `HeatmapWindow` already accepts any date and the daily query and grid cache are keyed on the window start; plain Blade links, no package, no new JavaScript

  **User Story**
  As the Committed Amateur Runner,
  I want Previous and Next buttons that move the 16-week heatmap 4 weeks at a time, and my older Garmin runs kept when I import them,
  so that I can look back at earlier training blocks, not only the last 16 weeks.

  **Demonstrates**
  After implementing this spec, importing a full Garmin Connect export and pressing Previous shows the 16-week window ending 4 weeks earlier, with that period's runs, weekly totals, legend, and date range, down to the window holding the oldest stored run; Next walks forward again and stops on the current window.

  **Acceptance Criteria**
  - [ ] The home page opens on the current window, ending on the current week (unchanged)
  - [ ] Previous shows the 16-week window ending 4 weeks earlier; Next moves 4 weeks forward and never past the current window
  - [ ] Next is disabled on the current window; Previous is disabled once the shown window holds the athlete's oldest stored run, or when no run is stored
  - [ ] The shown period is always stated above the grid as a date range (e.g. "18 May – 6 Sep 2026")
  - [ ] Each window has its own URL on the home page, so a reload or a shared link keeps it; a future, malformed, or unparseable window renders the current window without an error, and a mid-week date is read as that week
  - [ ] A past window renders no out-of-range future cells and no partial week total
  - [ ] The legend and intensity scale are computed from the shown window only (FR-006)
  - [ ] The sync status is the same on every window
  - [ ] Garmin CSV import: running rows dated today or earlier are kept at any age; only future-dated rows are skipped, and the summary counts them as "future-dated" instead of "outside-window"
  - [ ] Older runs go through the same conflict review, Overwrite / Skip, and re-import rules as runs in the current window
  - [ ] After a confirmed Garmin import or a Strava sync, every window of that athlete shows the new data; no cached window grid survives the write
  - [ ] The Strava sync still fetches and reconciles only the current 112 days and never deletes an activity outside them
  - [ ] A signed-out visitor navigates the same way; navigating writes no row, calls no Strava endpoint, and triggers no token refresh (FR-017)
  - [ ] Both controls are keyboard-reachable links named "Previous 4 weeks" and "Next 4 weeks"; a disabled control is announced as disabled and is not a link
  - [ ] At 375 px the controls and grid cause no horizontal page scroll; both themes meet WCAG 2.2 AA contrast for the controls (FR-009)
