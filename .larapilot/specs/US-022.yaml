body: |
  #### US-022: Automatic Garmin Connect sync: daily schedule and Sync now

  **Epic:** EP-002 | **Priority:** HIGH | **Points:** 8 | **Status:** DONE
  **Blocked by:** -
  **Type:** Change request
  **Release:** 3.1.0
  **Supersedes:** US-021 criteria "`php artisan schedule:list` lists no task" and "no stale, failed, or reconnect warning exists in any state" · FR-007 "Last import visibility" as shipped in US-021
  **Traces to:** FR-002 (changed: Once-daily automated Garmin sync — Won't → Must) · FR-010 (changed: Sync now — Won't → Must) · FR-007 (changed: Last sync and import visibility, Must) · FR-003 · FR-017 · FR-018 · Technical Architecture (Data import, Data model, Security, Deploy, CLI tooling, Documentation)
  **Journey:** none — the PRD has no journeys; a second data source behind the existing dashboard
  **Prior art:** custom on Laravel's HTTP client — Garmin's only official client is Python (`garmin/connect-personal-api-python`, Apache-2.0) and no maintained PHP package exists

  **User Story**
  As the Committed Amateur Runner, owner and only user of this instance,
  I want my runs pulled from Garmin Connect automatically every day, and on demand with a Sync now button,
  so that the heatmap is current without exporting and uploading a CSV after every run.

  **Demonstrates**
  After implementing this spec, with `GARMIN_API_KEY` set, `php artisan garmin:sync` (and the scheduled run, and Sync now) stores the owner's whole Garmin running history as runs, a second run changes nothing, CSV-imported runs are linked rather than duplicated, and the dashboard reads "last sync N ago" — or names the cause when the latest sync failed.

  **API facts (probed 2026-11-14 with the owner's key)**
  - Base `https://personal.connectapi.garmin.com`. `POST /personalapitoken-service/personal-api/personal-api-key/token` with `Authorization: ApiKey {key}` answers a **raw JWT body** (not JSON) with an `exp` claim, valid 24 h, no refresh token
  - Data calls: `Authorization: Bearer {token}`, `Accept: application/json`
  - `GET /activitylist-service/activities/search/activities?start=&limit=&startDate=&endDate=` answers a JSON array; fields used here: `activityId`, `activityName`, `activityType.typeKey`, `startTimeLocal` (`Y-m-d H:i:s`), `distance` (m, float), `movingDuration` (s, float), `averageSpeed` (m/s), `elevationGain` (m), `averageHR` (bpm)
  - Running `typeKey` values: `running`, `street_running`, `track_running`, `indoor_running`, `treadmill_running`, `ultra_run`, `obstacle_run` → `Run`; `trail_running` → `TrailRun`; `virtual_run` → `VirtualRun`
  - No rate limit or maximum window is published

  **Acceptance Criteria**

  _Sync (FR-002, FR-003)_
  - [x] With `GARMIN_API_KEY` set, `php artisan garmin:sync` exchanges the key for a token, reuses a cached token until one hour before its `exp`, and reads the owner's activities through the activity search, paging with `start`/`limit` until a page comes back short
  - [x] The command is scheduled once a day; `php artisan schedule:list` shows it
  - [x] Only the running `typeKey` values above are stored, mapped to `Run`, `TrailRun`, or `VirtualRun`; every other type is ignored and counted; an activity whose local start is after today is skipped and counted as future-dated
  - [x] Each stored run carries `source` `garmin_api`, the unique `garmin_activity_id`, name, `distance_meters` (rounded integer), `moving_time_seconds` (rounded), `start_date_local` and `activity_date` from `startTimeLocal`, pace as `round(1000 / averageSpeed)` s/km, ascent and average heart rate as rounded integers; a null or zero `averageSpeed`, a null `elevationGain` or `averageHR` stores an empty metric, never 0
  - [x] The first sync (no run with a Garmin id stored) reads the whole history; later syncs re-read at least the last 7 days, and a run renamed or edited on Garmin in that span is updated
  - [x] A synced activity on the same date within ±2 minutes of a stored run with no Garmin id is the same run: it gains the Garmin id and the API values, no second run is created, and no review is shown
  - [x] Running the sync twice in a row changes nothing; a run deleted on Garmin stays stored
  - [x] After a sync that writes at least one run, every cached window, the intensity scale, and the trend show the new data

  _Sync now (FR-010)_
  - [x] The dashboard shows a "Sync now" button only when `GARMIN_API_KEY` is set; it is a CSRF-protected, throttled `POST`, and a signed-out request is redirected to `/login` and calls nothing
  - [x] After it finishes, the dashboard reports new, updated, linked, ignored, and future-dated counts, or the failure cause
  - [x] Only one sync runs at a time: a Sync now while the scheduled or another sync runs is refused with a message and starts nothing

  _Status and failures (FR-007, FR-017)_
  - [x] Every attempt is recorded in `garmin_syncs` with trigger (scheduled / manual), start and end time, outcome, failure cause, and counts
  - [x] The status line shows the more recent of "last sync N ago" (a successful sync, even one that wrote nothing) and "last import N ago" (a confirmed CSV import that wrote a row)
  - [x] While the latest attempt failed, a warning reads "Garmin key rejected — renew it" when the token exchange answers 401 or 403, or "Garmin unreachable" on a timeout, connection error, or 5xx; the next successful sync removes it
  - [x] A 401 on a data call re-exchanges the token once and retries; a second refusal records the key-rejected failure
  - [x] A failed or partial sync keeps every run written before the failure
  - [x] With no `GARMIN_API_KEY`, the scheduled run calls nothing and records nothing, no Sync now or sync status appears, and the dashboard behaves exactly as today

  _Coexistence with the CSV import (FR-018)_
  - [x] The CSV upload, conflict review, summary counts, throttle, and idempotent re-import behave as before; a CSV row matching an API-synced run goes through the same review, and Overwrite keeps its `garmin_activity_id`

  _Security, docs, tests_
  - [x] The key and the token never appear in the database, a log line, an exception message, or a response; `.env.example` carries an empty `GARMIN_API_KEY`
  - [x] `README.md` explains creating and renewing the key (connect.garmin.com → Settings → Personal API token, expiry 30 days to one year) and the scheduler cron entry needed on the host (Cipi production)
  - [x] Feature tests fake every Garmin HTTP call (no test reaches Garmin): raw-JWT token exchange and reuse, paging, type mapping, metric rounding and empty metrics, linking a CSV run, idempotence, the 401 retry, both failure warnings, no-key behaviour, the concurrency refusal, and the signed-out redirect
  - [x] The developer domain doc for activity import under `.larapilot/docs/devs/` describes the Garmin sync
