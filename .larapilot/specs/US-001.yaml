body: |
  #### US-001: Project foundation, schema and local setup

  **Epic:** EP-001 | **Priority:** HIGH | **Points:** 3 | **Status:** TODO
  **Blocked by:** -

  **User Story**
  As the runner,
  I want a clean local setup with the data model and realistic seed data in place,
  so that I can register a Strava application, run the project on Herd, and build the dashboard
  against believable data before any real sync exists.

  **Demonstrates**
  A fresh clone comes up on Herd following the README alone, `php artisan db:seed` produces a full
  16-week training block, and `php artisan larapilot:quality` passes.

  **Traces to**
  PRD `## Technical Architecture` → **Data model**, **Stack** (Local dev: Laravel Herd),
  **Documentation** (Albert: baseline only), **Development & delivery**. Enabling work — no FR of its own.

  **Acceptance Criteria**
  - [x] `README.md` documents Laravel Herd setup with a `.test` domain — **no Sail, no Docker scaffolding**,
        per the PRD's recorded local dev choice
  - [x] README documents registering the Strava application: required scope `activity:read_all`, the
        authorization callback domain (the Herd HTTPS `.test` URL in development), and where the client
        credentials go
  - [x] README documents running the sync manually and the scheduler cron entry
        (`* * * * * php artisan schedule:run`)
  - [x] `.env.example` lists every required key — Strava client id and secret, the allowlisted athlete ids,
        the daily sync hour and its timezone — with no real values committed
  - [x] Migration extends `users` with `strava_athlete_id` (unique), `strava_access_token`,
        `strava_refresh_token`, `strava_token_expires_at`; both token columns are `TEXT` because the
        `encrypted` cast produces unpredictable length; `password` becomes nullable
  - [x] Migration creates `activities` — `strava_activity_id` (unique), `user_id`, `sport_type`, `name`,
        `distance_meters` (integer), `moving_time_seconds` (integer), `start_date_local`, `activity_date` (date)
        — with an index on `(user_id, activity_date)`
  - [x] Migration creates `sync_runs` — `started_at`, `finished_at`, `status`, `activities_upserted`,
        `activities_deleted`, `error_message`
  - [x] **No `daily_mileage` aggregate table** — the PRD explicitly rejects it; the grid aggregates on read
  - [x] Factories exist for `User`, `Activity` and `SyncRun`
  - [x] A seeder produces a realistic 16-week block including a near-empty illness week, a peak week, and a
        partial current week, so the dashboard can be built and reviewed without touching Strava
  - [x] `php artisan larapilot:quality` passes (Pint + Larastan level 5+)
  - [x] CI workflow runs tests, Pint and Larastan on push; **no deploy stage** — the PRD records the deploy
        target as "not defined yet"
  - [x] No registration routes and no public signup are scaffolded
