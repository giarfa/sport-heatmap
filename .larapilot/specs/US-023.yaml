body: |
  #### US-023: Extended run metrics from the Garmin API and the Garmin CSV

  **Epic:** EP-002 | **Priority:** HIGH | **Points:** 5 | **Status:** IN PROGRESS
  **Blocked by:** US-022
  **Type:** Feature
  **Release:** 3.1.0
  **Traces to:** FR-022 (new — Extended run metrics, MoSCoW: Must) · FR-002 · FR-018 · FR-003
  **Journey:** none — the PRD has no journeys; data enrichment behind the existing import and sync
  **Prior art:** built-in — PHP's CSV reader and the US-022 client; no package

  **User Story**
  As the Committed Amateur Runner, owner and only user of this instance,
  I want every run to keep the richer values Garmin records — effort, running form, course, and bests — whether it came from the sync or the CSV, including runs I imported before,
  so that my history is complete and ready for later views without re-exporting anything.

  **Demonstrates**
  After implementing this spec, re-importing the sample export reports its runs as enriched and they carry calories, max HR, cadence, and the other extended values; a Garmin sync stores the same values plus HR zones, fastest splits, and the location name; the dashboard looks exactly as before.

  **Extended metrics (empty when the source does not carry them, never 0)**

  | Metric | CSV (Italian / English) | API field |
  | --- | --- | --- |
  | Calories | `Calorie` / `Calories` | `calories` |
  | Max heart rate (bpm) | `FC max` / `Max HR` | `maxHR` |
  | Aerobic training effect (one decimal) | `TE aerobico` / `Aerobic TE` | `aerobicTrainingEffect` |
  | Avg / max running cadence (spm) | `Cadenza di corsa media` / `Cadenza di corsa max` · `Avg Run Cadence` / `Max Run Cadence` | `averageRunningCadenceInStepsPerMinute` / `maxRunningCadenceInStepsPerMinute` |
  | Best pace (s/km) | `Passo migliore` / `Best Pace` | from `maxSpeed` |
  | Total descent (m) | `Discesa totale` / `Total Descent` | `elevationLoss` |
  | Avg stride length | `Lunghezza media passo` / `Avg Stride Length` | `avgStrideLength` |
  | Avg vertical ratio (%) | `Rapporto verticale medio` / `Avg Vertical Ratio` | `avgVerticalRatio` |
  | Avg vertical oscillation | `Oscillazione verticale media` / `Avg Vertical Oscillation` | `avgVerticalOscillation` |
  | Avg ground contact time (ms) | `Tempo medio di contatto con il suolo` / `Avg Ground Contact Time` | `avgGroundContactTime` |
  | Avg GCT balance (%) | `Bilanciamento TCS medio` / `Avg GCT Balance` | `avgGroundContactBalance` |
  | Steps | `Passi` / `Steps` | `steps` |
  | Laps | `Numero di Lap` / `Number of Laps` | `lapCount` |
  | Elapsed time (s) | `Tempo trascorso` / `Elapsed Time` | `elapsedDuration` |
  | Min / max elevation (m) | `Quota minima` / `Quota massima` · `Min Elev` / `Max Elev` | `minElevation` / `maxElevation` |
  | Training Stress Score | `Training Stress Score®` | — (CSV only) |
  | Time in HR zones 1–5 (s) | — | `hrTimeInZone_1` … `hrTimeInZone_5` (API only) |
  | Fastest 1 km / 1 mile / 5 km (s) | — | `fastestSplit_1000` / `fastestSplit_1609` / `fastestSplit_5000` (API only) |
  | Location name | — | `locationName` (API only) |

  English header names are confirmed against a real English export during planning; units of stride length and vertical oscillation are normalised to one unit per metric across both sources.

  **Acceptance Criteria**
  - [ ] Each run stores the extended metrics in the table above when its source carries them; a missing column, a `--` placeholder, a null API field, or an unreadable value leaves that metric empty, never 0, and never rejects the row
  - [ ] Importing the sample export (`client-materials/Activities (1).csv`) stores the extended values of its `Corsa` rows from the Italian headers; an English export stores the same values from the English headers
  - [ ] Re-importing an export over runs that are already stored and lack extended metrics fills them without a conflict review; the summary reports them as **enriched**; a second re-import of the same file changes nothing
  - [ ] On Overwrite a `--` extended metric keeps the stored value, as for pace, ascent, and heart rate today
  - [ ] A Garmin sync (US-022) stores the extended metrics of every run it reads, a linked CSV run included; the CSV-only Training Stress Score of a linked run is kept
  - [ ] No start or end coordinates are stored from either source
  - [ ] The day cell detail, grid, legend, scale, and trend render exactly as before; no extended metric is displayed
  - [ ] The migration adds only nullable columns, keeps every stored run and value, and its `down()` drops only the new columns
  - [ ] Tests cover Italian and English extended columns, `--` and missing columns, enrichment and its idempotence, Overwrite keeping stored values on `--`, and the API mapping from a faked search response; the developer domain doc for activity import lists the extended metrics
