body: |
  #### US-021: Remove Strava: the Garmin CSV import is the only way runs enter

  **Epic:** EP-002 | **Priority:** HIGH | **Points:** 8 | **Status:** DONE
  **Blocked by:** US-020
  **Type:** Change request
  **Release:** 3.0.0
  **Supersedes:** US-002 (Strava connection) · US-003 (daily Strava sync) · US-006 (sync status and stale/failed warning) · US-004, US-007, US-012 criteria on "Powered by Strava" and Strava deep-links · US-008 criteria on the sync never reverting overwritten runs · US-011 criterion "the nightly sync skips a CSV-only athlete"
  **Traces to:** FR-001, FR-002, FR-008, FR-010, FR-012, FR-015 (withdrawn — MoSCoW: Won't) · FR-007 (changed: Last import visibility, Must) · FR-003 · FR-004 · FR-006 · FR-011 · FR-017 · FR-018 · FR-019 · FR-020 · Technical Architecture (Auth, Data model, Data import, Security, Privacy, Documentation)
  **Journey:** none — removal of a data source behind every existing page
  **Prior art:** n/a — a removal; no package leaves `composer.json` (the Strava OAuth was hand-rolled on the HTTP client)

  **User Story**
  As the Committed Amateur Runner, owner and only user of this instance,
  I want Strava gone from the app — no connection, no nightly sync, no Strava data — and to load my runs only from the Garmin Connect CSV export,
  so that the instance has one data source I control, holds no third-party tokens, and runs no background job.

  **Demonstrates**
  After implementing this spec, no `strava` route, command, scheduled task, config key, column, or table exists; the runs once synced from Strava are gone; the signed-in owner imports a Garmin CSV and sees the heatmap, detail, navigation, and trend with "last import N ago" as the only status line.

  **Acceptance Criteria**

  _Strava removed_
  - [x] No route under `strava/` is registered; the Strava redirect and callback controllers, `StravaClient`, `StravaOAuth`, the fresh-token middleware, the athlete allowlist, the Strava exceptions and data objects, and `config/strava.php` are deleted; `.env.example` carries no `STRAVA_*` key
  - [x] `php artisan schedule:list` lists no task and `strava:sync` is no longer an Artisan command
  - [x] No page renders "Powered by Strava", "Connect with Strava", a Strava link, a reconnect notice, or the Strava rejection page

  _Data (irreversible migration — accepted by the owner on 2026-10-26)_
  - [x] A migration deletes every activity whose `source` is `strava`; an activity the owner overwrote from a Garmin CSV (already `garmin_csv`) is kept with all its values
  - [x] The same change drops `strava_athlete_id`, `strava_access_token`, `strava_refresh_token`, and `strava_token_expires_at` from `users`, the `sync_runs` table, and `activities.strava_activity_id`; no `strava` value remains possible in `activities.source`; the migration's `down()` restores the schema only, never the deleted rows
  - [x] After the migration runs, the cached heatmap grid is flushed: no window shows a deleted run

  _Garmin-only behaviour (FR-007, FR-017, FR-018, FR-011)_
  - [x] The status line reads "last import N ago" from the newest confirmed import (the newest imported row's `updated_at`); with no imported run it says no runs are imported yet; a re-import that writes nothing does not move it; no stale, failed, or reconnect warning exists in any state
  - [x] An owner with no runs sees an empty state offering only the Garmin CSV import; the "Import Garmin CSV" entry point stays on the dashboard
  - [x] A CSV row is a conflict only against a stored run on the same date within ±2 minutes; Overwrite, Skip, apply-to-all, re-import idempotence, the summary counts, the `garmin-import` throttle, the 5 MB limit, and the session binding behave as before
  - [x] The day cell detail lists name, distance, moving time, pace, ascent, and heart rate (`—` when missing) and carries no external link
  - [x] The heatmap, legend, window navigation, and weekly trend render unchanged from imported runs; the intensity scale and every cached window refresh after each confirmed import; viewing any page writes nothing

  _Docs and tests_
  - [x] `README.md` drops the Strava application registration, the `STRAVA_*` keys, the sync command, and the cron entry, and adds one step: revoke the former app at strava.com/settings/apps; `.larapilot/docs/devs/strava-connection.md` and `activity-sync.md` are removed or rewritten for the Garmin-only flow, and the devs README index follows
  - [x] The Strava tests are deleted; factories and `TrainingBlockSeeder` produce Garmin-sourced runs only, with no `SyncRun` factory; the remaining suite, Pint, and Larastan pass
