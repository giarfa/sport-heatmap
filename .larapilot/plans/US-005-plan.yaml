code: US-005
plan_body: |
  ## Technical Solution

  The intensity scale becomes a value object that is computed once per grid build and carried **inside** `HeatmapGrid`. The cells and the legend are therefore bucketed by the same object, which is what makes the spec's "the swatches and the numbers cannot disagree" guarantee structural rather than a convention someone has to remember.

  **New classes**

  | Class | Role |
  | --- | --- |
  | `app/Data/Heatmap/IntensityScale.php` | Final readonly DTO: the three threshold values in metres, whether it is calibrated or fallback, and the running-day count. Owns `levelFor()`, `legendRows()` and `note()` so no arithmetic or string-building reaches Blade — same contract `DayCell` already follows. |
  | `app/Data/Heatmap/LegendRow.php` | Final readonly DTO: one legend line — level, name, kilometre-range label. |
  | `app/Support/Heatmap/CalibrateIntensityScale.php` | Final readonly invokable: takes the window's daily metre totals, returns an `IntensityScale`. The only place percentile arithmetic and the two fallbacks live. |

  **Changed classes**

  - `app/Support/Heatmap/HeatmapBuilder.php` — calibrates once before assembling weeks, passes the scale into every `DayCell`, and hands it to `HeatmapGrid`.
  - `app/Data/Heatmap/DayCell.php` — gains `public int $level` and `modifier(): string` (`rest` | `future` | `l1`…`l4`) so the Blade class name is a method return, not a conditional in the template.
  - `app/Data/Heatmap/HeatmapGrid.php` — gains `public IntensityScale $scale`.
  - `resources/views/components/heatmap-grid.blade.php` — cell class comes from `$day->modifier()`.
  - `resources/views/dashboard.blade.php` — the rail's legend placeholder card is replaced by the real component.
  - `resources/css/app.css` — `--lv-1`…`--lv-4` in all three token blocks, `.hm-cell--l1`…`--l4`, legend classes; `--lv-run` and `.hm-cell--ran` are **deleted**, not left beside the ramp.

  ### The percentile method is pinned, not left to the implementer

  Thresholds are the **25th, 50th and 75th percentiles by R-7 linear interpolation** (the numpy / Excel `PERCENTILE.INC` default) over the **non-zero** daily metre totals in the window, computed on integer metres and rounded to the nearest whole metre.

  This is not a preference — it is the method that reproduces the mockup. Running both candidate methods over the 68 running days rendered in `index.html`:

  | Method | p25 | p50 | p75 |
  | --- | --- | --- | --- |
  | **R-7 linear interpolation** | 7150 m → **7.2 km** | 9900 m → **9.9 km** | 14050 m → **14.1 km** |
  | Nearest-rank (ceil) | 7000 m → 7.0 km | 9800 m → 9.8 km | 14000 m → 14.0 km |

  The mockup README records **7.2 / 9.9 / 14.1**. Only R-7 matches. An implementation that picks nearest-rank will pass a naive unit test and silently disagree with the visual contract, so TASK-02 pins the method with an explicit regression test against that dataset.

  ### Bucketing rule

  Comparison happens in **metres against the unrounded thresholds**; kilometres are a display concern only.

  ```
  0 metres                      -> level 0 (rest)
  metres <= p25                 -> level 1 (Easy)
  metres <= p50                 -> level 2 (Steady)
  metres <= p75                 -> level 3 (Hard)
  otherwise                     -> level 4 (Peak)
  ```

  Upper-inclusive on each band, which is how the legend reads (`Easy 0.1 – 7.2 km`, `Steady 7.2 – 9.9 km`): a distance landing exactly on a threshold belongs to the **lower** level. Future cells carry level 0 and render with the dashed future treatment, never a heat colour.

  ### The two fallbacks

  Both produce the identical documented fixed bands — `0 / <= 5 / <= 10 / <= 20 / 20+ km`, i.e. thresholds `5000 / 10000 / 20000` metres — and differ only in the sentence the legend prints.

  1. **Sparse** — fewer than four non-zero days in the window. Four is the minimum at which three distinct quartiles can separate at all.
  2. **Degenerate** — the computed thresholds collapse (`p25 == p75`). Without this, a window where every run is the same distance renders every running day at one level, which looks like a bug and hides the data. Checked **after** computing the percentiles, so it catches the general collapse case, not only the all-identical one.

  ### Legend copy (Marika — exact strings, do not improvise)

  | State | Note |
  | --- | --- |
  | Calibrated | `Calibrated to your {n} running days in this window — recomputed after every sync.` |
  | Sparse | `Only {n} running days in this window — too few to calibrate, so fixed bands are shown instead.` |
  | Degenerate | `The runs in this window are too alike to calibrate a scale — fixed bands are shown instead.` |

  The first two are transcribed from `index.html` and `states.html`. The **degenerate note is the one string this spec invents** — the mockup does not draw that state. It is an authorised addition required by the spec's own acceptance criterion, not mockup drift.

  Level names are fixed: **Rest · Easy · Steady · Hard · Peak**. Range labels use an en dash with surrounding spaces exactly as the mockup does: `0 km`, `0.1 – 7.2 km`, `7.2 – 9.9 km`, `9.9 – 14.1 km`, `14.1+ km`.

  ### The intensity ramp

  Hexes are **transcribed verbatim** from `.larapilot/mockups/heatmap-dashboard/README.md` → "The intensity ramp". The dark ramp is a separately selected set of steps for the slate-900 card surface — it is **not** a programmatic inversion of the light values, and must not be generated by flipping an array.

  | Level | Light (on `#ffffff`) | Dark (on `#0f172a`) |
  | --- | --- | --- |
  | 0 | `#e2e8f0` *(already present)* | `#1e293b` *(already present)* |
  | 1 | `#86b6ef` | `#184f95` |
  | 2 | `#3987e5` | `#2a78d6` |
  | 3 | `#256abf` | `#5598e7` |
  | 4 | `#104281` | `#9ec5f4` |

  **Risk — the palette validator is not in this repository.** The README cites `node scripts/validate_palette.js`, but `scripts/` does not exist here; the script lived in the design session, not the codebase. The README's hex table is therefore the **sole** contract. Do not attempt to re-derive, re-tune, or "improve" a step — there is no committed gate that would catch a regression. Committing the validator is out of scope for this spec.

  ### Cache correctness

  The scale rides inside `HeatmapGrid`, so it inherits US-004's cache behaviour with no new invalidation logic: the key already carries the athlete, the window start and the calendar day, and `SyncStravaActivities` already calls `HeatmapGridCache::forget()` on a successful sync. That is precisely what satisfies "recomputed after every sync, not cached across windows" — TASK-06 proves it rather than assuming it.

  ### Architecture notes (John, Andrew)

  - No models, migrations, routes or queries change. `DailyRunningDistance` already returns the whole window in **one grouped aggregate**, so calibration reads an in-memory array — no new query, no N+1 surface.
  - No new dependencies. Percentile arithmetic is a dozen lines; pulling a statistics package for it would fail the vendor policy's own test.
  - `.ai/rules/app.md` — every non-obvious decision (the percentile method, the degenerate guard, the deliberate non-inversion of the dark ramp) carries a `/* … */` block comment stating the reason and the failure mode it avoids, placed at the decision site.
  - `.ai/rules/data.md` — DTOs are `final readonly`, built through named static factories (`IntensityScale::calibrated()`, `::fixedBands()`); spatie/laravel-data is not installed.
  - `.ai/rules/http.md` — `DashboardController` stays a single-action invokable and needs **no change**: the scale arrives inside the grid it already passes to the view.

  ### Accessibility (Elise, Violet)

  WCAG 2.2 AA is held, per the mockup contract. The legend is a `<ul>` of text rows; swatches are `aria-hidden` decorations beside real words and real numbers, so meaning never rests on colour. Cells already announce their exact distance from US-004. The ramp is single-hue and ordered by luminance, so it survives deuteranopia and protanopia. Contrast was validated against the actual card surfaces in both themes — every adjacent step clears 0.06 ΔL and the step nearest the surface clears 2:1 (2.11:1 light, 2.20:1 dark). Swatches reuse `.hm-cell`, which sets `aspect-ratio: 1 / 1`; the legend must override it to `auto` or the swatches inflate.

  "Always visible" is satisfied at every breakpoint: below 1024 px the rail stacks directly beneath the grid card (mockup: grid, then legend, then sync); at and above 1024 px it is the top card of the right rail. No disclosure, no toggle, no collapse.

  ### Out of scope for this spec

  `FR-013` configurable fixed bands, `FR-011` day-cell detail, and any change to grid geometry, weekly totals, or the sync pipeline. The sync-detail rail card stays a US-006 placeholder.

  ## Git & Branching

  - Mode: **GITFLOW** (from `settings.git_mode`) — Gitflow discipline **without** automatic push.
  - `feature/US-004-heatmap-grid` is approved (US-004 is DONE) but still **10 commits ahead of `develop`**. TASK-00 merges it into `develop` with `--no-ff` first, then branches — the same sequence US-004's own TASK-00 used for US-003.
  - Branch: `feature/US-005-intensity-scale` from `develop`.
  - One atomic Conventional Commit per task: `type(US-005): TASK-NN summary`. Never batch tasks into one commit.
  - **No `git push` and no remote PR** unless the user explicitly asks in-session. The PR description toward `develop` is prepared locally.
  - Run `vendor/bin/pint --dirty --format agent` and `php artisan larapilot:quality` before each commit; tests green before every `task-done`.
  - Merge to `develop` only after human `larapilot-review` approval.

  ## Test Data Strategy

  - **No new or changed Eloquent models, migrations, or relationships in this spec** — every task therefore declares `## Test Data: N/A` except where noted below. Nothing in `database/factories/` or `database/seeders/` requires an update, and `migrate:fresh --seed` is unaffected.
  - Existing fixtures cover the demo case: `TrainingBlockSeeder` already produces a realistic 16-week block, which is the calibrated (non-sparse) path.
  - Tests build their distributions from the existing `Activity` factory via `Tests\TestCase` helpers — `allowlistedAthlete()` / `allowlistAthletes()`, never a raw factory user, per `.ai/rules/tests.md`.
  - The sparse and degenerate windows are constructed **inside the tests** (3 activities, and N activities at one distance). They are edge cases, not demo data, so they must not be seeded into the shared dataset.

  ## Test Strategy

  - Bar: **NORMAL** (from `settings.testing`). Pest/PHPUnit feature and unit tests only. **No** Playwright, Dusk, Pest browser, viewport matrix, or axe automation — those belong to `BEST` and are explicitly not planned here.
  - Test tasks are interleaved with implementation (TASK-02 follows TASK-01; TASK-06 follows TASK-05), not stacked at the end.

  **Unit — `CalibrateIntensityScale` and `IntensityScale`** (TASK-02), covering every case the spec's final criterion names:

  | Case | Expectation |
  | --- | --- |
  | 0 non-zero days | fixed bands, sparse note, `n = 0` |
  | 1 non-zero day | fixed bands, sparse note |
  | 3 non-zero days | fixed bands, sparse note — the boundary below which calibration is refused |
  | 4 non-zero days, distinct | **calibrated** — the boundary at which it is allowed |
  | all distances identical | fixed bands, degenerate note — never every day at one level |
  | `p25 == p75` without all-identical | fixed bands, degenerate note |
  | distance exactly `== p25` / `== p50` / `== p75` | lands in the **lower** level (1 / 2 / 3) |
  | 0 metres | level 0, regardless of calibration state |
  | **the mockup's 68-day dataset** | p25/p50/p75 render as **7.2 / 9.9 / 14.1 km** — the regression test that pins R-7 and would fail under nearest-rank |
  | rest days present | zero-distance days are excluded from the distribution, not counted as low mileage |

  **Unit — `DayCell` / `HeatmapBuilder`** (TASK-02): `modifier()` returns `rest` / `future` / `l1`…`l4`; future cells never carry a heat level; the grid exposes the same scale its cells were bucketed with.

  **Feature — rendered dashboard** (TASK-06):

  - The legend renders with computed ranges that match the cells actually rendered — assert the *same* threshold numbers appear in both, so a future regression that recalibrates one without the other fails.
  - A window seeded with 3 runs flips the legend to fixed bands (`0.1 – 5.0`, `5.0 – 10.0`, `10.0 – 20.0`, `20.0+`) and prints the sparse note.
  - A window where every run is the same distance prints the degenerate note and does not render every day at one level.
  - The legend is present in the response on the connected dashboard — the "always visible" criterion.
  - **Recomputation after sync:** build the grid, add activities that change the distribution, run the sync path that calls `HeatmapGridCache::forget()`, assert the re-rendered legend shows the **new** thresholds. This is the criterion "recomputed after every sync, not cached across windows", proven end to end rather than assumed.
  - Athlete isolation on the cached scale stays covered by the existing `HeatmapGridCacheTest`; extend it only if the key shape changes (it should not).

  **Manual tests recommended** (Anne — handoff, allowed at `NORMAL`): view the dashboard at 375 px and 1280 px in **both** themes; confirm the five ramp steps are visually distinguishable in each, that the dark ramp reads lightest-at-peak, and that the legend swatches are square and match the cells. Automated contrast checking is a `BEST`-bar activity and is not planned.

  ## Definition of Done

  Every acceptance criterion in US-005 maps to a task and a test:

  | Criterion | Task | Evidence |
  | --- | --- | --- |
  | Five levels, 1–4 from p25/p50/p75 of non-zero daily distances | TASK-01 | TASK-02 unit |
  | Recomputed after every sync, not cached across windows | TASK-03 | TASK-06 feature |
  | Legend always visible, states actual kilometre ranges | TASK-05 | TASK-06 feature |
  | Sparse fallback (< 4 non-zero days) + stated reason | TASK-01 | TASK-02, TASK-06 |
  | Degenerate fallback (`p25 == p75`) | TASK-01 | TASK-02 |
  | Exact validated hexes, dark ramp not auto-flipped | TASK-04 | manual + code review |
  | Single-hue, luminance-ordered, no colour-alone meaning | TASK-04, TASK-05 | TASK-06 asserts numeric ranges in the DOM |
  | Unit tests for boundaries, 0/1/3/4-day and identical windows, post-sync recomputation | TASK-02, TASK-06 | suite green |
