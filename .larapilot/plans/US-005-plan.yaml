    title: 'Document the scale, the pinned percentile method and the ramp contract'
    body: |-
      ## Description
      Baseline documentation only — `effort` is `STANDARD` and no extended docs were recorded at spec approval. There is no public or partner API here, so no OpenAPI work.

      ## Files Involved
      - README.md
      - CHANGELOG.md

      ## Steps
      1. README — a short section on the intensity scale: the five levels, that thresholds are the p25/p50/p75 of non-zero daily distances **by R-7 linear interpolation**, that they are recomputed on every sync, and the two documented fallbacks with their bands. State plainly that the percentile method is the one that reproduces the mockup's legend and is not interchangeable.
      2. README — note that the ramp hexes are transcribed from `.larapilot/mockups/heatmap-dashboard/README.md` and that the palette validator that produced them is **not** committed to this repository, so the README table is the only contract for anyone tempted to retune a step.
      3. `CHANGELOG.md` — Unreleased / `Added`: the self-calibrating five-level intensity scale and the always-visible numeric legend, with the sparse and degenerate fallbacks.
      4. Confirm the stale US-004 comments deferring the ramp to US-005 were replaced in TASK-04 (`resources/css/app.css`) and TASK-05 (`resources/views/dashboard.blade.php`) — no comment left in the tree should still say the ramp or legend is a future spec.
      5. Ask Alex to record the percentile-method trap as a shared rule with the Boost `record-rule` tool, glob `app/Support/Heatmap/**`, so the next agent does not swap in nearest-rank and quietly desynchronise the legend from the design contract.

      ## Completion Criteria
      - [ ] README documents the levels, the pinned percentile method, and both fallbacks
      - [ ] README records that the palette validator is absent and the mockup table is the contract
      - [ ] CHANGELOG Unreleased updated
      - [ ] No stale comment deferring the ramp or legend to a future spec remains
      - [ ] The percentile-method trap recorded in `.ai/rules` via `record-rule`

