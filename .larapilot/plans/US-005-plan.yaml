    id: TASK-06
    title: 'Feature-test the rendered legend, the sparse flip and post-sync recomputation'
    body: |-
      ## Description
      Prove the two acceptance criteria that only hold end to end: that the legend's numbers agree with the cells actually rendered, and that a sync recomputes the scale rather than serving a cached one. Bar is `NORMAL` — no browser suites.

      ## Files Involved
      - tests/Feature/Dashboard/HeatmapLegendTest.php (new)

      ## Steps
      1. `php artisan make:test --phpunit HeatmapLegendTest`, placed under `tests/Feature/Dashboard` beside the existing dashboard tests.
      2. Sign athletes in through `allowlistedAthlete()` from `Tests\TestCase` per `.ai/rules/tests.md` — never a raw factory user, or the test stops exercising the allowlist guard. Build distributions with the existing `Activity` factory; add no seeder entries.
      3. Calibrated case: seed a window with a known distribution, assert the legend note reads `Calibrated to your {n} running days…`, and assert the rendered threshold numbers appear in **both** the legend and the cell bucketing — so a regression that recalibrates one without the other fails here.
      4. Sparse case: seed exactly 3 runs; assert the legend shows the fixed bands `0.1 – 5.0`, `5.0 – 10.0`, `10.0 – 20.0`, `20.0+` and the note explaining the window is too sparse to calibrate.
      5. Degenerate case: seed several runs all at one distance; assert the degenerate note and that the running days do **not** all render at a single level.
      6. Always-visible: assert the legend markup is present in the connected dashboard response.
      7. **Recomputation after sync:** render the dashboard, add activities that shift the distribution, run the path that calls `HeatmapGridCache::forget()`, re-render, and assert the legend now shows the **new** thresholds. Set `Http::preventStrayRequests()` alongside `Http::fake()` if the exercised path makes any outbound call, and override config with `Config::set()` inside the test.
      8. `php artisan test --compact tests/Feature/Dashboard`, then the full suite once before `task-done`.
      9. Do **not** add Playwright, Dusk, Pest browser, viewport, or axe suites — record the responsive and contrast checks as a `Manual tests recommended` note in the handoff instead.

      ## Completion Criteria
      - [ ] Legend ranges asserted to agree with the rendered cells
      - [ ] Sparse window flips to fixed bands with the stated reason
      - [ ] Degenerate window flips to fixed bands and is not rendered at one level
      - [ ] Legend present without interaction on the connected dashboard
      - [ ] A sync that changes the distribution produces new thresholds on the next request
      - [ ] Full suite green; no browser/E2E tooling added

      ## Git Deliverables
      - Commit: `test(US-005): TASK-06 cover the rendered legend, fallbacks and recalibration`
      - Push: **skip** (`git_mode: GITFLOW`)
      - PR: update the local PR notes
