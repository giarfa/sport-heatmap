    id: TASK-01
    title: 'Compute the intensity scale: percentiles, sparse and degenerate fallbacks'
    body: |-
      ## Description
      Add the value object that carries the five-level scale and the invokable that computes it from the window's daily distances, including both documented fallbacks. This task owns **all** the arithmetic in the spec; nothing downstream recomputes a threshold.

      ## Files Involved
      - app/Data/Heatmap/IntensityScale.php (new)
      - app/Data/Heatmap/LegendRow.php (new)
      - app/Support/Heatmap/CalibrateIntensityScale.php (new)

      ## Steps
      1. `php artisan make:class Data/Heatmap/IntensityScale`, `Data/Heatmap/LegendRow`, `Support/Heatmap/CalibrateIntensityScale`
      2. `LegendRow` — `final readonly`: `int $level`, `string $name`, `string $rangeLabel`.
      3. `IntensityScale` — `final readonly`, private constructor, two named factories per `.ai/rules/data.md`:
         - `IntensityScale::calibrated(int $p25, int $p50, int $p75, int $runningDayCount)`
         - `IntensityScale::fixedBands(int $runningDayCount, bool $degenerate)`
         Fixed-band thresholds are the literals `5000 / 10000 / 20000` metres.
      4. `IntensityScale::levelFor(int $metres): int` — `0` when `$metres === 0`; otherwise `1` when `<= p25`, `2` when `<= p50`, `3` when `<= p75`, else `4`. **Upper-inclusive**: a distance landing exactly on a threshold belongs to the lower level, which is how the legend reads.
      5. `IntensityScale::legendRows(): array<int, LegendRow>` — five rows, names `Rest · Easy · Steady · Hard · Peak`, labels formatted as `0 km`, `0.1 – {p25} km`, `{p25} – {p50} km`, `{p50} – {p75} km`, `{p75}+ km`. Kilometres via `number_format($metres / 1000, 1)`, matching `DayCell::kilometres()`. Use the en dash with surrounding spaces exactly as the mockup does.
      6. `IntensityScale::note(): string` and `isCalibrated(): bool` — the three exact strings from the plan's copy table. The degenerate string is the one this spec invents; use it verbatim.
      7. `CalibrateIntensityScale::__invoke(array $dailyMetres): IntensityScale`:
         - filter to non-zero values, sort ascending
         - **fewer than 4** → `fixedBands($count, degenerate: false)`
         - otherwise compute p25/p50/p75 by **R-7 linear interpolation** — `h = (n - 1) * p`, `value = s[floor(h)] + (h - floor(h)) * (s[ceil(h)] - s[floor(h)])` — and `(int) round()` each to whole metres
         - **then** guard: `p25 === p75` → `fixedBands($count, degenerate: true)`
         - otherwise `calibrated(...)`
      8. Per `.ai/rules/app.md`, carry `/* … */` block comments **at the decision sites**, each naming the failure mode avoided: (a) R-7 is the method that reproduces the mockup's 7.2 / 9.9 / 14.1 — nearest-rank yields 7.0 / 9.8 / 14.0 and silently desynchronises the legend from the design contract; (b) the degenerate guard runs *after* the percentiles so it catches any collapse, not only all-identical windows, and exists so a uniform block does not render every day at one level; (c) comparison is in metres against unrounded thresholds because kilometres are a display concern and rounding at the boundary would move cells between levels.
      9. `vendor/bin/pint --dirty --format agent` and `php artisan larapilot:quality`

      ## Completion Criteria
      - [x] `IntensityScale` and `LegendRow` are `final readonly`; `IntensityScale` is built only through its named factories
      - [x] Percentiles use R-7 linear interpolation on integer metres
      - [x] Sparse fallback triggers below 4 non-zero days; degenerate fallback triggers on `p25 === p75`
      - [x] Both fallbacks emit the identical `0 / <= 5 / <= 10 / <= 20 / 20+` km bands
      - [x] The three legend notes match the plan's copy table verbatim
      - [x] No new Composer dependency added
      - [x] Pint and Larastan level 5 clean

      ## Test Data
      - N/A — no model, migration or relationship changes in this task

      ## Git Deliverables
      - Commit: `feat(US-005): TASK-01 compute the self-calibrating intensity scale`
      - Push: **skip** (`git_mode: GITFLOW`)
      - PR: update the local PR notes
