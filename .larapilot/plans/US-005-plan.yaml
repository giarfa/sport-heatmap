    id: TASK-04
    title: 'Add the validated ramp tokens, level classes and legend styles'
    body: |-
      ## Description
      Bring the four-step ramp into the stylesheet using the exact hexes recorded in the mockup README, in both themes, and add the legend's own classes. Retire the US-004 placeholder fill rather than leaving it beside the ramp. Shares no files with TASK-01…TASK-03 and can run alongside them.

      ## Files Involved
      - resources/css/app.css

      ## Steps
      1. Add `--lv-1` … `--lv-4` to **all three** token blocks that already carry `--lv-0`: `:root`, `html.dark`, and the `@media (prefers-color-scheme: dark) { html:not(.light) }` block. Missing the third silently breaks a JS-disabled visitor on a dark OS.
         - Light: `--lv-1: #86b6ef; --lv-2: #3987e5; --lv-3: #256abf; --lv-4: #104281;`
         - Dark: `--lv-1: #184f95; --lv-2: #2a78d6; --lv-3: #5598e7; --lv-4: #9ec5f4;`
         **Transcribe these.** The dark ramp is a separately selected set of steps for the slate-900 card, not a programmatic flip of the light values, and the palette validator the README cites is not committed to this repo — there is no gate that would catch a retuned step.
      2. Delete `--lv-run` from all three blocks and delete the `.hm-cell--ran` rule. Add `.hm-cell--l1` … `.hm-cell--l4` mapping to `--lv-1` … `--lv-4`. `.hm-cell--rest` and `.hm-cell--future` are unchanged.
      3. Replace the US-004 comment above the token block that says `--lv-1..--lv-4` belongs to US-005 and must not be added yet — it is now false. Replace the one above `.hm-cell--rest` for the same reason. State instead that the hexes are transcribed from the mockup README and that the dark ramp is deliberately not an inversion.
      4. Add the legend classes from the mockup: `.hm-legend-title`, `.hm-legend-note`, `.hm-legend-list`, `.hm-key`, `.hm-key-swatch`, `.hm-key-name`, `.hm-key-range`, plus the `@media (min-width: 480px)` step `.hm-key { font-size: 0.75rem; }` inside the existing 480 px block. `.hm-key-swatch` **must** set `aspect-ratio: auto` — it reuses `.hm-cell`, which sets `1 / 1`, and without the override the swatches inflate.
      5. `npm run build` to confirm the stylesheet compiles.
      6. Smoke-check the dashboard at 375, 768 and 1280 px in both themes; confirm the five steps are distinguishable and the dark ramp reads lightest-at-peak.

      ## Completion Criteria
      - [ ] `--lv-1`…`--lv-4` present in all three token blocks with the exact README hexes
      - [ ] `--lv-run` and `.hm-cell--ran` removed; `.hm-cell--l1`…`--l4` present
      - [ ] Stale US-004 comments deferring the ramp to US-005 replaced
