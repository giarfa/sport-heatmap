    id: TASK-02
    title: 'Unit-test the bucketing, both fallbacks, and the percentile method itself'
    body: |-
      ## Description
      Cover every case the spec's final acceptance criterion names, plus the regression test that pins the percentile method to the one the mockup was drawn with. Bar is `NORMAL`: Pest/PHPUnit only, no browser or viewport suites.

      ## Files Involved
      - tests/Unit/Support/Heatmap/CalibrateIntensityScaleTest.php (new)
      - tests/Unit/Data/Heatmap/IntensityScaleTest.php (new)

      ## Steps
      1. `php artisan make:test --phpunit --unit CalibrateIntensityScaleTest` and `IntensityScaleTest`; place them under the existing `tests/Unit/Support/Heatmap` and `tests/Unit/Data/Heatmap` folders to match the current tree.
      2. `CalibrateIntensityScaleTest` — one test per case:
         - 0, 1 and 3 non-zero days → fixed bands, sparse note, correct count in the note
         - 4 distinct non-zero days → calibrated (the boundary at which calibration is allowed)
         - all distances identical → fixed bands, degenerate note
         - a window where `p25 == p75` **without** every value being identical → fixed bands, degenerate note
         - zero-distance days are excluded from the distribution rather than counted as low mileage
      3. **Method-pinning regression test** — feed the 68 running distances rendered in `.larapilot/mockups/heatmap-dashboard/index.html` and assert the thresholds format to **7.2**, **9.9** and **14.1** km. Extract them once into a private fixture method inside the test with a comment naming the source file. This test is the guard: nearest-rank produces 7.0 / 9.8 / 14.0 and fails it, which is exactly the outcome required.
      4. `IntensityScaleTest` — `levelFor()` boundaries: metres exactly `== p25`, `== p50`, `== p75` land in levels **1, 2, 3** respectively; one metre above each lands in the next level up; `0` metres is level 0 under both calibrated and fallback scales; `legendRows()` returns five rows with the expected names and label formatting for both a calibrated and a fixed-band scale.
      5. `php artisan test --compact tests/Unit/Support/Heatmap/CalibrateIntensityScaleTest.php tests/Unit/Data/Heatmap/IntensityScaleTest.php`
      6. Do **not** add Playwright, Dusk, Pest browser, or viewport E2E suites.

      ## Completion Criteria
      - [x] Windows with 0, 1, 3 and 4 non-zero days each covered
      - [x] All-identical and general `p25 == p75` degenerate windows covered
      - [x] Boundary values landing exactly on p25/p50/p75 asserted to fall in the lower level
      - [x] The mockup's 68-day dataset asserts 7.2 / 9.9 / 14.1 km and would fail under nearest-rank
      - [x] Tests pass; coverage matches the `NORMAL` bar

      ## Git Deliverables
      - Commit: `test(US-005): TASK-02 cover the intensity scale and its fallbacks`
      - Push: **skip** (`git_mode: GITFLOW`)
      - PR: update the local PR notes
