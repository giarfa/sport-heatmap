    id: TASK-03
    title: 'Carry the scale through the builder into every cell and the grid'
    body: |-
      ## Description
      Wire the scale into grid assembly so cells and legend are bucketed by one object. `DashboardController` needs no change — the scale arrives inside the `HeatmapGrid` it already passes to the view — and the cache needs no new invalidation, because US-004's key already carries the athlete, the window start and the calendar day.

      ## Files Involved
      - app/Support/Heatmap/HeatmapBuilder.php
      - app/Data/Heatmap/DayCell.php
      - app/Data/Heatmap/HeatmapGrid.php
      - resources/views/components/heatmap-grid.blade.php
      - tests/Unit/Support/Heatmap/HeatmapBuilderTest.php
      - tests/Unit/Data/Heatmap/DayCellTest.php

      ## Steps
      1. `HeatmapBuilder` — constructor-promote `private CalibrateIntensityScale $calibrate`; in `__invoke`, calibrate **once** from `$dailyMeters` before the week loop, thread the resulting scale through `buildWeek()` into each `DayCell`, and pass it to the `HeatmapGrid` constructor. One calibration per grid build, never per week or per cell.
      2. `DayCell` — add `public int $level` to the constructor. Add `modifier(): string` returning `'rest'`, `'future'`, or `'l1'`…`'l4'`, so Blade never branches on state to pick a class. Future cells carry level 0 and always return `'future'` — a day that has not happened cannot have an intensity.
      3. `HeatmapGrid` — add `public IntensityScale $scale`.
      4. `heatmap-grid.blade.php` — replace `hm-cell--{{ $day->state->value }}` with `hm-cell--{{ $day->modifier() }}`. No other markup change; the sr-only names, titles, caption and scopes stay exactly as US-004 left them.
      5. Update the existing `HeatmapBuilderTest` and `DayCellTest` for the new signatures, and add assertions that ran cells carry the level the grid's own scale assigns, and that future cells never carry a heat level.
      6. `php artisan test --compact` (full suite — this touches shared DTO signatures), then `vendor/bin/pint --dirty --format agent` and `php artisan larapilot:quality`

      ## Completion Criteria
      - [x] The scale is computed exactly once per grid build
      - [x] `HeatmapGrid` exposes the same scale its cells were bucketed with
      - [x] `DayCell::modifier()` covers rest, future and l1–l4; future cells never carry a heat level
      - [x] Blade contains no arithmetic and no state branching for the cell class
      - [x] `DashboardController` and `HeatmapGridCache` are unchanged
      - [x] Full suite green; Pint and Larastan clean

      ## Test Data
      - N/A — no model or schema changes in this task

