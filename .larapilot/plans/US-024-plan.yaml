code: US-024
plan_body: |
  **Release:** 3.2.0

  ## Technical Solution

  US-024 adds an **Aerobic efficiency** card to the dashboard rail, directly under Weekly distance (FR-023). It is computed server-side from columns `activities` already stores (`distance_meters`, `average_pace_seconds_per_km`, `average_heart_rate`, `total_ascent_meters`, `activity_date`, `start_date_local`) — **no migration, no new package, no JavaScript**. It follows the shape US-014 set for the weekly trend: a read query, a pure calculation, a pure chart builder that emits every coordinate and string, readonly DTOs that ride in the cached `HeatmapGrid`, and a markup-only Blade component.

  ### Layers (Controller → Support → Data → Blade)

  1. **`App\Support\Heatmap\EfficiencyRuns`** (read, invokable) — two range queries per grid build through `Activity::onDaysBetween` (the half-open range that keeps the `(user_id, activity_date)` index usable): the shown window plus its 3 lead-in weeks, and the same 19 weeks exactly 52 weeks earlier. Selective columns only; no relation is loaded, so no N+1 risk. Rows become `App\Data\Heatmap\EfficiencyRun` (final readonly) via a named factory that keeps null metrics null — never 0.
  2. **`App\Support\Heatmap\MeasureAerobicEfficiency`** (pure) — every FR-023 rule: qualifying runs, the window's reference heart rate, the outlier guard, the hill adjustment, pace at the reference heart rate, the rolling 4-week medians with the flat-first fallback, last year's series. Returns `App\Data\Heatmap\EfficiencyMeasurement`. No Eloquent, no clock.
  3. **`App\Support\Heatmap\BuildAerobicEfficiency`** (pure) — turns the measurement into `App\Data\Heatmap\AerobicEfficiency`: card state, headline and note strings, y ticks (reuse `TrendTick`), x labels (same four as Weekly distance), dot positions (`EfficiencyDot`), median and last-year polyline segments, weekly table rows (`EfficiencyWeek`), SVG title and table caption. Blade does no arithmetic.
  4. **Wiring** — `HeatmapGrid` gains `public AerobicEfficiency $efficiency`; `HeatmapBuilder` builds it beside the trend; `DashboardController` calls `EfficiencyRuns` inside the existing cache-miss closure. The cache key goes `v6` → `v7` and every new Data class / enum joins `cache.serializable_classes`. Import and sync already call `HeatmapGridCache::forgetAthlete`, so FR-017 freshness comes for free; rendering stays read-only.
  5. **`<x-aerobic-efficiency>`** — markup only, mirrors `.larapilot/mockups/US-024/index.html`, `dark.html`, `states.html`; CSS Part 2 of `.larapilot/mockups/US-024/efficiency.css` ported into `resources/css/app.css` right after the "Weekly trend" block.

  ### Calculation contract (FR-023 + decisions)

  - **Qualifying:** `distance_meters >= 3000`, pace and heart rate both non-null, climb = `total_ascent_meters / (distance_meters / 1000)` ≤ 10 m/km. A null ascent counts as 0 m/km (flat).
  - **Reference HR:** median `average_heart_rate` of the **shown window's** qualifying runs (lead-in and last-year runs excluded), rounded half-up to whole bpm. One value per window; used for every pace-at-reference, both tile points, and last year's line.
  - **Outlier guard:** any run with HR > reference + 10 is neither drawn nor counted (window, lead-in and last year alike).
  - **Speed** comes from the stored pace: `1000 / pace` m/s — the column the qualifying rule requires — not from `moving_time_seconds`. Climb 5–10 m/km → flat-equivalent: speed × (distance + 8 × ascent) / distance. Acceptance example: 5.0 km, 40 m, 30:00, 150 bpm → 5.32 km at 30:00.
  - **Steep runs (> 10 m/km)** with pace, HR, ≥ 3 km and within the outlier guard are drawn as a cross at their **8×-adjusted** pace at the reference HR, and never enter a median (decision `8a053a5ea5155d84`).
  - **Pace at reference HR** = `pace_adjusted × run_HR / reference_HR` seconds per km (algebraically 1 km ÷ (efficiency × reference HR)). Floats inside; rounded half-up to whole seconds only at the edge.
  - **Line point per week** = median over that week and the three before it (lead-in weeks included) of flat runs (< 5 m/km); when those 4 weeks hold fewer than 4 flat runs, the adjusted hilly runs join; fewer than 3 usable runs → no point. Even counts take the mean of the two middle values. The in-progress week gets a point like any other (the mockup's last week has one).
  - **Last year:** the same computation over the weeks exactly 52 weeks earlier (+ their 3 lead-in weeks) with the shown window's reference HR. Absent (no line, no key entry, no table column) when no run at all is stored in those 16 weeks.
  - **Card states:** `Empty` (window has no stored run — same sentence as Weekly distance) · `NotEnoughRuns` (< 8 qualifying runs; count shown) · `NoMedian` (≥ 8 qualifying but no line point: headline replaced by `No 4-week median yet: no 4 weeks hold 3 usable runs.`, dots + table still drawn — decision `7b05de091be150ce`, recorded as a mockup deviation) · `Measured`.
  - **Headline/note:** latest point as `m:ss` + ` /km` + `at N bpm`. Change = first point − latest point on the **rounded** paces, so the note agrees with the figures printed: `25 s/km faster than 16 weeks ago (6:54 /km)`, `… slower …`, `same pace as 16 weeks ago`; the week count = latest position − first position + 1. A single point prints the headline with no comparison. Always followed by ` · N bpm is this window's median heart rate`.

  ### Chart geometry (mockup README "Geometry")

  viewBox `0 0 160 100`, `preserveAspectRatio="none"`; slot i = x 10i..10i+10; line point x = 10i + 5; dot `left = (10i + 1.5 + weekday × 7/6) / 160 × 100 %`; y = (pace − top) / (bottom − top) × 100, faster at the top; gridlines every 15 s; top = fastest value floored to 15 s, bottom = slowest ceiled to 15 s over dots, median line and last-year line (bottom = top + 15 when equal). Only the top tick carries ` /km`. Lines split into segments at every missing point; a lone point is a 4-unit tick (same rule as `BuildWeeklyTrend::closeSegment`). Two-decimal coordinate strings (same `decimal()` form as the weekly trend).

  ### Performance & queries
  Two extra grouped-free selects per **cache miss** only (~100–250 rows); cache hits cost nothing. No index needed beyond `(user_id, activity_date)`. Expected query shape: `select activity_date, start_date_local, distance_meters, average_pace_seconds_per_km, average_heart_rate, total_ascent_meters from activities where user_id = ? and activity_date >= ? and activity_date < ?`.

  ### Open items for implement
  None blocking. Any visible difference from the mockups beyond decision `7b05de091be150ce` is agreed in chat first (Mockup fidelity).

  ## Git & Branching
  - Mode: GITFLOW (no automatic push)
  - Release: **3.2.0** — TASK-00 runs `php artisan larapilot:release-feature --semver=3.2.0 --spec=US-024 --slug=aerobic-efficiency` (opens `release/3.2.0` from `develop` while the version is still `planned`)
  - Branch: `feature/US-024-aerobic-efficiency` from `release/3.2.0`; PR base `release/3.2.0`, never `develop`
  - Per task: one Conventional Commit `type(US-024): TASK-NN …`; code, tests and domain doc in the same commit; push/remote PR only if the user asks
  - The uncommitted `.larapilot/` changes on `develop` (backlog, PRD, decisions, mockups, spec) are committed on `develop` or carried onto the branch before TASK-00, so `release-feature` finds a clean tree
  - Merge into `release/3.2.0` after review approval

  ## Test Data Strategy
  - No schema change: `Activity` and its factory keep their columns. `ActivityFactory` gains climb/heart-rate states (`flat()`, `hilly()`, `steep()`, `atHeartRate(int)`) so tests read as the rules they cover.
  - `TrainingBlockSeeder` gives the 16-week block plausible, correlated pace / heart rate / ascent (mostly flat, ~20 % hilly 5–10 m/km, one steep run, one run > 10 bpm above the block's median, one run under 3 km) and seeds the **same weeks one year earlier** (plus 3 lead-in weeks) with metrics, so the demo shows the dots, both lines and every key entry.
  - Verification runs through `tests/Feature/Database/TrainingBlockSeederTest.php` on the in-memory test database. **Never run `migrate:fresh` / `db:seed` against the dev database** — it is the default SQLite file holding the owner's real runs.

  ## Test Strategy
  - Bar: **NORMAL** — Pest unit + feature tests; no Playwright, Dusk, Pest browser or viewport suites.
  - Interleaved: calculation tests (TASK-03) right after the calculation, chart-builder tests (TASK-05) right after the builder, dashboard feature tests (TASK-08) after the component.
  - Unit: every FR-023 rule as its own named test, including the 5.32 km example, the 148 bpm reference, the 10-bpm guard, flat-first fallback, breaks without interpolation, last year's absence, rounding of the change.
  - Feature: card placement and states on `/`, window navigation recomputes everything (`?to=`), import and sync make a cached window show new data, rendering writes nothing (query log holds no insert/update/delete on `activities`), accessible name + text-alternative table, shape classes per run kind.
  - `vendor/bin/pint --dirty --format agent` and `php artisan larapilot:quality` before handoff.
  - **Manual test handoff:** open the dashboard at 320 / 375 / 768 / 1024 / 1280 px in light and dark, compare with `.larapilot/mockups/US-024/breakpoints.html`; confirm no horizontal scroll at 375 px and that the `Weekly figures` summary is keyboard-reachable with a visible focus ring.
