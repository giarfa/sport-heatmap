      ## Description
      Give tests and the demo dataset runs that exercise every efficiency rule: climb and heart-rate factory states, a block with correlated pace and heart rate, and the same weeks one year earlier.

      ## Files Involved
      - database/factories/ActivityFactory.php
      - database/seeders/TrainingBlockSeeder.php
      - tests/Feature/Database/TrainingBlockSeederTest.php

      ## Steps
      1. Factory states (no column change): `flat()` (ascent < 5 m/km of the run's distance), `hilly()` (5–10 m/km), `steep()` (11–15 m/km), `atHeartRate(int $bpm)`; each derives ascent from the distance already built (state closure reads `$attributes`, as `withExtendedMetrics()` does)
      2. Seeder: block runs with metrics get a heart rate correlated with pace (faster ↔ higher HR, with a slow improvement across the 16 weeks), ~20 % hilly, exactly one steep run, one run more than 10 bpm above the block's median, and one run under 3 km; keep `WITHOUT_HEART_RATE_PERCENT` behaviour
      3. Seeder: the same 16 weeks + 3 lead-in weeks exactly 52 weeks earlier, with metrics and slightly slower efficiency, so last year's line and its key entry appear; keep it guarded to `local` / `testing` like the rest
      4. Extend `TrainingBlockSeederTest`: ≥ 8 qualifying runs in the current window, a steep run and an outlier exist, runs exist 52 weeks earlier
      5. Verify through `php artisan test --filter=TrainingBlockSeederTest` on the in-memory test DB. **Do not run `migrate:fresh` or `db:seed` against the dev database** — it is the owner's real data

      ## Completion Criteria
      - [ ] Factory states produce runs that classify as Flat / Hilly / Steep under the FR-023 thresholds
      - [ ] Seeded demo shows dots, the median line, last year's line, and every key entry
      - [ ] Existing seeder assertions still hold (weekly totals, double-run days, rest week)
      - [ ] Tests pass

      ## Test Data
