      ## Description
      Build the efficiency card with the grid, cache it inside the same `HeatmapGrid` entry, and retire the old cache shape — so navigation recomputes it per window and every import or sync refreshes it with no new invalidation path.

      ## Files Involved
      - app/Data/Heatmap/HeatmapGrid.php (add `public AerobicEfficiency $efficiency`)
      - app/Support/Heatmap/HeatmapBuilder.php (inject `MeasureAerobicEfficiency` + `BuildAerobicEfficiency`; new optional `?EfficiencySample $efficiencySample = null` parameter, empty sample when null so existing callers/tests keep working)
      - app/Http/Controllers/DashboardController.php (type-hint `EfficiencyRuns` as an `__invoke` parameter; call it **inside** the `$build` closure)
      - app/Support/Heatmap/HeatmapGridCache.php (key `v6` → `v7`; extend the "v" comment: v7 retired grids without `efficiency`)
      - config/cache.php (`serializable_classes`: AerobicEfficiency, EfficiencyDot, EfficiencyWeek, AerobicEfficiencyState)
      - tests/Feature/Dashboard/HeatmapGridCacheTest.php (keys v6 → v7; the "old version ignored" case uses v6)

      ## Steps
      1. Builder builds the measurement from the window and sample, then the card from the same `WeekRow`s and `HeatmapGrid::labelFor(...)` — one source for labels
      2. Controller: the extra queries run only on a cache miss, inside the closure (extend the existing block comment)
      3. Check every other `new HeatmapGrid(` / `HeatmapBuilder` call in `app/` and `tests/` and update it
      4. Confirm `ApplyGarminImport` and `SyncGarminActivities` still call `forgetAthlete` after a write (no code change expected)
      5. `php artisan test` (full suite — grid shape touches many tests)

      ## Completion Criteria
      - [x] A cached `v6` grid is never read; `v7` entries round-trip through the database cache store with every new class
      - [x] Cache hit runs no efficiency query; miss runs exactly two
      - [x] Rendering the dashboard writes nothing
