    id: TASK-03
    title: 'Pest coverage for the efficiency calculation'
    type: Test
    status: DONE
    assignee: Anne
    estimate_hours: 3
    dependencies:
      - TASK-02
    body: |
      ## Description
      Cover every FR-023 rule of `MeasureAerobicEfficiency` with one named unit test each, built from `EfficiencyRun` values (no database).

      ## Files Involved
      - tests/Unit/Support/Heatmap/MeasureAerobicEfficiencyTest.php (new)

      ## Steps
      1. Read the `testing-best-practices` skill and `tests/Unit/Support/Heatmap/BuildWeeklyTrendTest.php` for the house style; a small local builder for `EfficiencyRun` keeps cases readable
      2. Cases:
         - reference HR is the rounded median of the window's qualifying runs (148 bpm case); lead-in and last-year runs do not move it
         - each exclusion: 2.9 km run, null pace, null HR, 10.1 m/km climb (drawn Steep, not in any median), HR = reference + 11 (not drawn, not counted), HR = reference + 10 (kept)
         - hill adjustment: 5.0 km, 40 m, 360 s/km, 150 bpm → flat-equivalent 5.32 km; pace at reference computed from it
         - 4.9 m/km is Flat, 5.0 is Hilly, 10.0 is Hilly, 10.1 is Steep
         - line point uses lead-in weeks; flat-only when ≥ 4 flat runs; hilly join when < 4 flat; < 3 usable → null; even count takes mean of middles
         - a gap week in the middle yields null between two points (no interpolation)
         - last year uses the window's reference HR; `hasLastYear` false when no run in the 16 weeks 52 weeks earlier, true with runs that produce no point
         - fewer than 8 qualifying runs → `qualifyingCount` reports the number found
         - `runsPerWeek` counts flat + hilly + steep dots
      3. `php artisan test --filter=MeasureAerobicEfficiencyTest`
      4. Do **not** add Playwright, Dusk, Pest browser or viewport suites

      ## Completion Criteria
      - [x] Every rule in the plan's Calculation contract has a test that fails when the rule is broken
      - [x] Tests pass locally
      - [x] Coverage matches the NORMAL bar

      ## Git Deliverables
      - Commit: `test(US-024): TASK-03 cover the aerobic efficiency calculation`
      - Push: **skip** (`git_mode: GITFLOW`)
      - PR: remote update only if the user asks
