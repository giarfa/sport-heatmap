    id: TASK-02
    title: 'MeasureAerobicEfficiency: FR-023 calculation'
    type: Impl
    status: DONE
    assignee: Alex
    estimate_hours: 5
    dependencies:
      - TASK-01
    body: |
      ## Description
      Implement every FR-023 rule as a pure calculation: qualifying runs, the window's reference heart rate, outlier guard, hill adjustment, pace at reference HR, rolling 4-week medians with the flat-first fallback, and last year's series with the same reference.

      ## Files Involved
      - app/Support/Heatmap/MeasureAerobicEfficiency.php (new, `final readonly`, invokable, no Eloquent, no clock)
      - app/Data/Heatmap/EfficiencyMeasurement.php (new)
      - app/Data/Heatmap/MeasuredRun.php (new: date, weekday, week position, kind, paceAtReference float)
      - app/Enums/EfficiencyRunKind.php (new: `Flat`, `Hilly`, `Steep`)

      ## Steps
      1. Signature: `__invoke(HeatmapWindow $window, EfficiencySample $sample): EfficiencyMeasurement`
      2. Constants with docblocks: `MIN_DISTANCE_METERS = 3000`, `FLAT_MAX_CLIMB = 5`, `HILLY_MAX_CLIMB = 10`, `HILL_FACTOR = 8`, `OUTLIER_BPM = 10`, `MEDIAN_WEEKS = 4`, `MIN_FLAT_RUNS = 4`, `MIN_USABLE_RUNS = 3`, `MIN_QUALIFYING_RUNS = 8`
      3. Qualifying (window runs only) → `qualifyingCount`; reference HR = median HR of those, rounded half-up (`(int) floor($median + 0.5)`); null when none qualify
      4. Classify each run with pace + HR + ≥ 3 km and HR ≤ reference + 10: climb < 5 → `Flat`; 5–10 → `Hilly`; > 10 → `Steep`. Pace at reference = `pace × distance / (distance + 8 × ascent)` for Hilly **and Steep** (decision `8a053a5ea5155d84`), plain pace for Flat; then `× runHR / referenceHR`
      5. Line points per window week (positions 0–15): collect Flat runs of that week and the 3 before (lead-in included); if fewer than 4, add Hilly; fewer than 3 → null; else median (mean of two middles on even counts). Steep runs never enter
      6. Last year: same week loop over `lastYearRuns` (window − 52 weeks) with the **window's** reference HR; `hasLastYear` = any run stored in the 16 last-year weeks (any metrics); outlier guard applied with the same reference
      7. Per window week also carry the count of runs drawn that week (Flat + Hilly + Steep dots) for the table's `Runs` column
      8. Measurement exposes: `referenceHeartRate`, `qualifyingCount`, `hasRuns` (any stored window run), `runs` (window `MeasuredRun`s only — lead-in runs are never drawn), `linePoints` and `lastYearPoints` (`array<int, float|null>` by position), `runsPerWeek`, `hasLastYear`
      9. Block comments on the non-obvious choices: speed from stored pace not moving time; reference from window only; rounding at the edge; steep adjusted but excluded
      10. `php artisan test --filter=MeasureAerobicEfficiency` (TASK-03 adds the full suite; add a smoke test here so the class is covered in this commit)

      ## Completion Criteria
      - [x] 5.0 km / 40 m / 30:00 / 150 bpm is treated as 5.32 km at 30:00
      - [x] One reference HR per window, used by the window line, the steep/hilly dots and last year's line
      - [x] A run < 3 km, without pace or HR, steep, or > reference + 10 never moves a line point; null metrics never read as 0
      - [x] Breaks are nulls, never interpolated
      - [x] Tests pass

      ## Test Data
      - N/A — no model, schema, factory or seeder change in this task

      ## Domain Docs
      - [x] `.larapilot/docs/devs/heatmap-dashboard.md` updated — new `### Aerobic efficiency (US-024, FR-023)` under Functional flow with the rules step by step; Architectural choices: median not mean, reference HR from the window only, speed from stored pace, 10 m/km cap and 8× factor (FR-023 source), steep runs drawn adjusted but excluded (decision 8a053a5ea5155d84); Key invariants: one reference HR per window, steep never moves the line
      - [x] `.larapilot/docs/devs/README.md` index row for heatmap-dashboard: last touched by US-024
      - [x] English, committed with this task

      ## Git Deliverables
      - Commit: `feat(US-024): TASK-02 measure aerobic efficiency`
      - Push: **skip** (`git_mode: GITFLOW`)
      - PR: update the local PR notes toward `release/3.2.0` — open/update remote only if the user asks
