    body: |
      ## Description
      Turn an `EfficiencyMeasurement` into the `AerobicEfficiency` DTO that carries every string and coordinate the card prints — state, headline, note, ticks, x labels, dots, median and last-year segments, table rows, SVG title and caption — so the Blade component does no arithmetic.

      ## Files Involved
      - app/Support/Heatmap/BuildAerobicEfficiency.php (new, `final readonly`, invokable)
      - app/Data/Heatmap/AerobicEfficiency.php (new)
      - app/Data/Heatmap/EfficiencyDot.php (new: kind, left %, top %)
      - app/Data/Heatmap/EfficiencyWeek.php (new: range label, runs, median, last year — `?string`)
      - app/Enums/AerobicEfficiencyState.php (new: `Empty`, `NotEnoughRuns`, `NoMedian`, `Measured`)
      - app/Data/Heatmap/TrendTick.php (reused as is)

      ## Mirrors
      - `.larapilot/mockups/US-024/index.html` (Measured, with last year), `.larapilot/mockups/US-024/states.html` (NotEnoughRuns, Empty, no last year, steep run), `.larapilot/mockups/US-024/README.md` "The card, element by element" + "Geometry"

      ## Steps
      1. Signature: `__invoke(EfficiencyMeasurement $m, array $weeks /* WeekRow[] */, string $windowLabel): AerobicEfficiency` — week labels come from the same `WeekRow`s as the grid, like `BuildWeeklyTrend`
      2. State: no stored window run → `Empty`; `qualifyingCount < 8` → `NotEnoughRuns` with `Not enough runs to measure efficiency: {n} in this window, 8 needed. A run counts when it is at least 3 km with pace and heart rate recorded.`; no line point → `NoMedian` with `No 4-week median yet: no 4 weeks hold 3 usable runs.` (decision `7b05de091be150ce`); else `Measured`
      3. Paces rounded half-up to whole seconds, formatted `m:ss`; headline parts `6:29` / ` /km` / `at 148 bpm`
      4. Note: change = first point − latest point on rounded seconds → `25 s/km faster than 16 weeks ago (6:54 /km)` / `… slower …` / `same pace as 16 weeks ago`; weeks = latest position − first position + 1; single point → no comparison clause; always ` · 148 bpm is this window's median heart rate` (exact mockup wording, middle dot spacing included)
      5. Y axis: 15-s steps; top = fastest of dots ∪ median ∪ last year floored to 15, bottom = slowest ceiled to 15 (+15 when equal); y = (pace − top)/(bottom − top) × 100; only the top tick reads `6:15 /km`
      6. X labels at positions 0, 4, 8, 12 via `WeekRow::weekLabel()`
      7. Dots: left = (10i + 1.5 + weekday × 7/6) / 160 × 100, top = y; two-decimal strings (port `decimal()` from `BuildWeeklyTrend`; extract a tiny shared helper only if it stays readable)
      8. Segments for median and last year: split at nulls, lone point → 4-unit tick (same rule as `BuildWeeklyTrend::closeSegment`)
      9. Key flags: `hasHilly`, `hasSteep`, `hasLastYear`
      10. SVG title: `Pace at 148 bpm per run, 6 Jul – 25 Oct 2026, faster at the top; 4-week median 6:54 to 6:29 per km. Weekly figures below.`; caption `Pace at 148 bpm by week, 6 Jul – 25 Oct 2026`; week rows range labels exactly as the weekly trend's (`6 – 12 Jul`, `27 Jul – 2 Aug`)
      11. `php artisan test --filter=BuildAerobicEfficiency` (smoke here; TASK-05 is the suite)

      ## Completion Criteria
      - [x] Every string in the mockup's card is produced by the builder, word for word
      - [x] Faster paces sit higher (smaller y); axis covers dots and both lines
      - [x] Copy has no colour, verdict, praise, warning or advice — numbers, units, faster / slower only
      - [x] Tests pass

      ## Test Data
      - N/A — no model, schema, factory or seeder change in this task

      ## Domain Docs
      - [x] `.larapilot/docs/devs/heatmap-dashboard.md` updated — Technical design: BuildAerobicEfficiency, its DTOs and the card states; the geometry formulas; the NoMedian state as an agreed mockup deviation (decision 7b05de091be150ce)
      - [x] `.larapilot/docs/devs/README.md` index row for heatmap-dashboard: last touched by US-024
      - [x] English, committed with this task

      ## Git Deliverables
