code: US-008
plan_body: |-
  ## Technical Solution

  US-008 adds a second activity source: a manual upload of the Garmin Connect "Activities" CSV, with a review step for conflicts before anything is written, and a nightly Strava sync that respects what Garmin has won. Delivery target is MVP, but the whole spec is covered and nothing is trimmed. There are no new packages (PHP's `SplFileObject` reads the CSV), no queue (one file of ~100 in-window rows parses well inside a request), and no new table.

  Decisions recorded in the journal during planning:
  - `7baf70c6656a936f`: a Strava activity that appears **after** a Garmin row was imported as *new* (same date, ±2 min) is **linked** to that Garmin row. The sync stores its `strava_activity_id` on the Garmin row and keeps Garmin's values, so the day is never counted twice.
  - `56c5683061907ab8`: running type names map the confirmed `Corsa` / `Running` plus the best-known IT/EN running variants. **Every unrecognised type name is listed with its count in the summary**, so a missed running variant is visible and becomes a one-line addition.

  ### 1. Data model (🗄️ Mike)
  - New `App\Enums\ActivitySource`: `Strava = 'strava'`, `GarminCsv = 'garmin_csv'`.
  - One migration on `activities`: add `source` (string, not null, default `strava`, so existing rows backfill as Strava) and make `strava_activity_id` nullable with `->change()`. The unique index stays, and SQLite allows many NULLs under a unique index. `down()` first deletes rows whose `strava_activity_id` is NULL (Garmin-only rows cannot exist in the old schema), then reverts. That rollback is lossy, and it is documented in the migration's block comment.
  - Meaning of the columns:
    - `source = strava`: owned by the sync.
    - `source = garmin_csv` with a NULL Strava id: imported new from Garmin.
    - `source = garmin_csv` with a Strava id: a Strava twin that Garmin has won. The id is kept only so the sync recognises the twin and leaves it alone.
  - `Activity` model: cast `source` to the enum and add it to `#[Fillable]`. The `@property` docblock becomes `int|null $strava_activity_id` and `ActivitySource $source`. Helpers: `isGarminSourced(): bool` and `stravaUrl(): ?string` (null for Garmin rows, FR-008).
  - No new index: every query in this spec filters on `(user_id, activity_date)` first, and that index already exists.

  ### 2. Shared matching rule: `App\Support\Garmin\StartTimeMatcher` (📐 John)
  - `TOLERANCE_SECONDS = 120`, inclusive. "Within ±2 minutes" includes exactly 2:00, so 1:59 matches and 2:01 does not.
  - `closest(CarbonImmutable $start, iterable $candidates): ?Activity` keeps only candidates on the **same `activity_date`** and within the tolerance, then returns the one with the smallest absolute difference. Ties go to the lowest id, so the result is deterministic.
  - The importer (§4) and the sync (§3) both use this class, so the two cannot drift apart on what counts as "the same run".

  ### 3. Source-aware reconciliation: `ReconcileStravaWindow` (🔧 Alex, 🔗 Matt)
  Still one transaction. It first loads the athlete's stored rows, selecting `id, source, strava_activity_id, start_date_local, activity_date`. That is one query of about 100 rows, with no N+1. Then, for each fetched Strava activity:
  1. Its id belongs to a `garmin_csv` row: **skip**. The row is never reverted and the twin is never re-added.
  2. Its id is not stored at all, and `StartTimeMatcher` finds an unlinked Garmin row (NULL Strava id) on the same date within ±2 min: **link** it. The sync sets only `strava_activity_id` on the Garmin row. No values change and nothing is created. A linked Garmin row is claimed once, so two Strava activities cannot claim the same row.
  3. Otherwise: upsert as today, with `source = strava` explicit in the attributes.

  Delete-on-absence gains `->where('source', ActivitySource::Strava)`, so Garmin rows are never deleted by the sync (FR-002). `SyncOutcome` counts are unchanged in meaning: skipped and linked rows are neither upserted nor deleted. `StravaActivity::toAttributes()` gains `source`.

  ### 4. Parsing the CSV (🔧 Alex, 🔎 Tom)
  - `App\Support\Garmin\GarminCsvColumns` holds the header sets.
    - The first header cell picks the language: `Tipo di attività` means IT, `Activity Type` means EN. Any other first header means the file is rejected as unrecognised.
    - Required columns. IT: `Tipo di attività`, `Data`, `Titolo`, `Distanza`, `Tempo in movimento`. EN: `Activity Type`, `Date`, `Title`, `Distance`, `Moving Time`. A missing one is rejected, and the message names the column.
    - Optional fallback for moving time: `Tempo` / `Time`.
    - A UTF-8 BOM on the first cell is stripped.
  - `App\Support\Garmin\GarminRunningTypes` maps a type name (trimmed, case-insensitive) to a `SportType`:
    - `Run`: `Corsa`, `Running`, `Corsa su strada`, `Street Running`, `Corsa su pista`, `Track Running`, `Tapis roulant`, `Corsa su tapis roulant`, `Treadmill Running`, `Corsa indoor`, `Indoor Running`.
    - `TrailRun`: `Trail running`, `Trail Running`, `Corsa su sentiero`.
    - `VirtualRun`: `Corsa virtuale`, `Virtual Run`, `Virtual Running`.
    - `Corsa` is the only label confirmed by `client-materials/Activities (1).csv`. A block comment states this, plus the rule that unknown names are surfaced in the summary, never silently dropped.
  - `App\Support\Garmin\ParseGarminCsv` is `__invoke(string $path, HeatmapWindow $window, CarbonInterface $today): ParsedGarminCsv`. It throws `App\Exceptions\Garmin\GarminCsvRejectedException` (a fresh, explicit message) for an unreadable or non-CSV file, an unknown header set, a missing required column, or a file with no data rows. The value rules:
    - Distance is km to integer metres. Strip the thousands `,` and parse the decimal `.` (Garmin uses these in both languages, per the sample): `"8.29"` gives 8290 and `"8,240"` gives 8,240,000 m. `"--"` or empty makes the row **invalid** ("missing distance").
    - Moving time `HH:MM:SS`, `MM:SS` or `HH:MM:SS.f` becomes seconds, rounded. If it is `"--"`, fall back to `Tempo` / `Time`. If that is also missing, the row is invalid.
    - Date: `Y-m-d H:i:s` (and `Y-m-d H:i`) via `createFromFormat(..., 'UTC')`, with **no timezone conversion**. Garmin's export is local wall-clock time, the same contract as `StravaActivity`'s `start_date_local`. `activity_date` is the date part.
    - Title: trimmed, empty becomes `Run`, truncated to 255.
    - Outcome per row:
      - non-running type: `ignored[type] += 1`
      - `activity_date > today`, or outside the window: `outsideWindow += 1`
      - unparseable date or distance: `invalid[] = {line, reason}`, and the remaining rows still parse
      - identical rows within one file (same start, distance and moving time) collapse into one
  - DTOs in `app/Data/Garmin/`, all `final readonly`:
    - `GarminCsvRow`, with `toAttributes()` (always `source = garmin_csv`), `toSessionArray()` / `fromSessionArray()` and `isIdenticalTo(Activity)`
    - `ParsedGarminCsv`: rows, ignored by type, outsideWindow, invalid list

  ### 5. Planning and applying the import (🔧 Alex, 📐 John)
  - `App\Support\Garmin\PlanGarminImport` is `__invoke(User, array<int, GarminCsvRow>): GarminImportPlan`. It runs **one** query for the athlete's activities `whereIn('activity_date', $csvDates)`, then sorts every row into one of three groups:
    - **already imported**: a stored `garmin_csv` row with the identical start, distance and moving time
    - **conflict**: `StartTimeMatcher` found a stored row of either source. Each stored row is claimed by at most one CSV row, the closest; the next CSV row is matched against the remaining candidates.
    - **new**: everything else

    The plan exposes a `fingerprint()`: a hash of `rowIndex => activityId` over the conflicts.
  - `App\Actions\Garmin\ApplyGarminImport` is `__invoke(User, GarminImportPlan, array<int, ConflictResolution>): GarminImportSummary`. It runs inside one `DB::transaction`:
    - creates the new rows through `$user->activities()->create(...)`
    - **Overwrite** sets name, distance, moving time, start, `activity_date`, `sport_type` and `source = garmin_csv`, and keeps `strava_activity_id`. All CSV-carried fields win, so the row really is Garmin's.
    - **Skip** touches nothing

    After commit it calls `HeatmapGridCache::forget($user, HeatmapWindow::current(), now())`. It does not authorize, per the actions rule. `ConflictResolution` is a new enum: `Overwrite`, `Skip`.
  - `GarminImportSummary` carries: imported, overwritten, skipped, alreadyImported, ignored by type, outsideWindow, invalid with reasons. It has `toSessionArray()` / `fromSessionArray()` so the summary page can show it as flash data.

  ### 6. HTTP, session binding and UI (🔧 Alex, ✨ Joe, 🎨 Elise, 🔐 Lars)
  - Routes, grouped under `auth`, `strava.fresh` and the name prefix `garmin.import.`:
    - `GET /import/garmin` (`create`) and `POST /import/garmin` (`store`, `throttle:garmin-import`, 10/min per user)
    - `GET /import/garmin/review` (`review`)
    - `POST /import/garmin/confirm` (`confirm`)
    - `POST /import/garmin/cancel` (`cancel`)
    - `GET /import/garmin/summary` (`summary`)

    `bootstrap/app.php` gets `redirectGuestsTo(fn () => route('dashboard'))`: there is no `login` route, so the default `auth` redirect would throw. A guest GET is redirected and a guest POST is refused. Neither writes anything.
  - Single-action controllers in `app/Http/Controllers/Garmin/`.
  - **Session binding:**
    - The upload stores `garmin_import.pending = {token, rows: GarminCsvRow::toSessionArray()[], counts}` in the session only. Nothing is stored in the DB.
    - The upload controller reads the file from the request's temp path and **never calls `store()`**. PHP deletes the temp file at the end of the request.
    - Review and confirm read the rows **only from the session**. No request parameter can name another import.
    - Confirm posts `token` and `fingerprint`, then recomputes the plan from the session rows against the current DB. On a token or fingerprint mismatch, it redirects back to the review with "Your stored activities changed since this review — check the conflicts again." and writes nothing.
    - Cancel forgets the pending import, and so does a successful confirm.
    - Abandoning the review leaves only the session entry, which the next upload replaces.
  - **Form Requests** in `app/Http/Requests/Garmin/`:
    - `UploadGarminCsvRequest`: `required|file|max:5120|mimes:csv,txt`, with an explicit message for each rule
    - `ConfirmGarminImportRequest`: `token`, `fingerprint`, and a `resolutions.*` value in the `ConflictResolution` enum for each conflict

    These are the app's first user-submitted forms, so `.ai/rules/http.md` is amended in the same task: Form Requests are now required for these forms, while query-string input still goes through the private string helper.
  - Views (`resources/views/garmin/`) on `layouts.app`, following the `.larapilot/mockups/US-008/` contract:
    - `create`: a labelled file input, the 5 MB / metric-units hint, and validation and rejection errors linked with `aria-describedby`
    - `review`: a `<table>` with `<caption>`, `<th scope>` headers and stored vs CSV start, distance and moving time. Each conflict row has a fieldset with a legend and Overwrite / Skip radios, **Skip pre-checked**. Stored Strava-sourced rows link to `https://www.strava.com/activities/{id}` (FR-008); Garmin rows have no link. The page also lists the new rows and the counts so far.
    - `summary`: the seven counts, the ignored type names, and the invalid rows with line and reason
  - "Overwrite all" / "Skip all" buttons carry `data-resolve-all` and are handled in `resources/js/app.js`. They are rendered `hidden` and revealed by JS, so without JS they simply do not appear and the per-row radios still work.
  - Mobile first: at 375 px the comparison table reflows as stacked rows (`<td data-label>` pattern). There is no horizontal page scroll, every tap target is at least 44 px, and the light and dark tokens come from the existing CSS variables (`--surface-card`, `--ink`, `--warn-*`).
  - Dashboard entry point: an `@auth` line under the map, mirroring the guest "Owner? Connect with Strava" line: "Import Garmin CSV" linking to `garmin.import.create`. Guests never see it.

  ### Known limitation (🔎 Tom)
  Garmin exports distance in the account's unit setting. The importer assumes a **metric** account, as the PRD is metric-only. The upload hint states this, and the domain doc records it. Imperial exports cannot be detected from the CSV, because pace and distance stay self-consistent in either unit.

  ## Git & Branching
  - Mode: `GITFLOW` (no automatic push)
  - Branch: `feature/US-008-garmin-csv-import` from `develop`
  - TASK-00: bootstrap
  - Per task: one Conventional Commit `type(US-008): TASK-NN …`. Code, tests and domain docs ride together. Push and the remote PR happen **only** if the user asks.
  - Merge after `larapilot-review` approval
  - Uncommitted on `develop`: `.larapilot/client-materials/Activities (1).csv`. TASK-00 commits it on the feature branch as the cited client material, and TASK-06 copies it into `tests/Fixtures/Garmin/`.

  ## Test Data Strategy
  - `ActivityFactory` gets two new states:
    - `garminImported()`: `source = garmin_csv`, `strava_activity_id = null`
    - `garminOverwritten()`: `source = garmin_csv`, Strava id kept

    The default state stays Strava with `source = strava`.
  - `TrainingBlockSeeder`: two runs in the block become Garmin-imported, and one becomes a Garmin-overwritten twin. The demo map then exercises every source, and `migrate:fresh --seed` stays coherent. `TrainingBlockSeederTest` is updated.
  - CSV fixtures live in `tests/Fixtures/Garmin/`:
    - `activities-it.csv`: the client sample, verbatim, with 37 `Corsa` and 3 `Escursionismo` rows dated 2026-07-21 → 2026-10-10
    - `activities-en.csv`: hand-built, with English headers, `Running` / `Treadmill Running` / `Trail Running` / `Virtual Run` / `Hiking`, a `"--"` distance, a `"--"` moving time, a thousands separator, an unparseable date, a future row and an out-of-window row

    Tests pin `now()` to 2026-10-11 so the sample rows fall inside the window.

  ## Test Strategy
  - Bar: `NORMAL`. PHPUnit feature and unit tests (the project uses PHPUnit, not Pest). **No** Playwright, Dusk, browser or viewport suites.
  - `Http::fake()` with `Http::preventStrayRequests()` wherever the sync runs. Owners sign in through `allowlistedAthlete()`.
  - Test tasks are interleaved with the build:
    - TASK-03 (sync) after TASK-02
    - TASK-06 (parser) after TASK-05
    - TASK-09 (HTTP flow) after TASK-08
  - Load-bearing cases:
    - the ±2-minute boundary: 119 s matches, 121 s does not, 120 s matches
    - closest-match selection
    - the sync never reverting, duplicating or deleting a Garmin-won row while Strava still returns its twin
    - late-twin linking
    - re-importing the same file being a no-op
    - abandoning the review and a stale fingerprint both writing nothing
    - guests refused, with zero writes
  - **Manual test handoff** (TASK-10): upload the real sample on Herd at 375 / 768 / 1280 px in light and dark, try the Overwrite-all / Skip-all shortcuts, then run `php artisan strava:sync` and check that overwritten rows are unchanged.

  ## Risks
  - Unconfirmed Garmin running labels: mitigated by listing unknown types in the summary (decision `56c5683061907ab8`).
  - Imperial-unit exports: documented limitation, see above.
  - `->change()` on SQLite rebuilds the table: covered by `migrate:fresh --seed` and `SchemaTest` in TASK-01.
