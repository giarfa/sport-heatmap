    id: TASK-01
    title: 'Activity source column and nullable Strava id (migration, enum, model, factory, seeder)'
    body: |-
      ## Description
      Give `activities` a `source` (Strava or Garmin CSV) and make `strava_activity_id` nullable. Garmin-imported rows have no Strava id, and an overwritten Strava twin keeps its id so the sync can recognise it (FR-002, FR-018). Factory and seeder are updated in this same task.

      ## Files Involved
      - app/Enums/ActivitySource.php (new: `Strava = 'strava'`, `GarminCsv = 'garmin_csv'`)
      - database/migrations/xxxx_add_source_to_activities_table.php (new, via `php artisan make:migration add_source_to_activities_table --table=activities --no-interaction`)
      - app/Models/Activity.php
      - database/factories/ActivityFactory.php
      - database/seeders/TrainingBlockSeeder.php
      - tests/Feature/Database/SchemaTest.php
      - tests/Feature/Database/TrainingBlockSeederTest.php
      - tests/Unit/Models/ActivityTest.php

      ## Steps
      1. Write the migration:
         - `up()`: `$table->string('source')->default('strava')` (existing rows backfill as Strava), then `$table->unsignedBigInteger('strava_activity_id')->nullable()->change()`. The unique index stays, and SQLite accepts many NULLs under it.
         - `down()`: delete rows where `strava_activity_id` is NULL, revert the column to not-null, drop `source`.
         - A block comment states why the rollback is lossy, and why there is no new index: `(user_id, activity_date)` already serves every query.
      2. `Activity` model:
         - Add `source` to `#[Fillable]` and cast it to `ActivitySource`.
         - Docblock: `@property int|null $strava_activity_id` and `@property ActivitySource $source`.
         - Add `isGarminSourced(): bool` and `stravaUrl(): ?string`, which returns `https://www.strava.com/activities/{id}` only for `source = strava` (FR-008).
      3. `ActivityFactory`:
         - The default sets `source => ActivitySource::Strava`.
         - New `garminImported()` state: `source = garmin_csv`, `strava_activity_id = null`, names like `Paese Corsa`.
         - New `garminOverwritten()` state: `source = garmin_csv`, keeps a Strava id.
      4. `TrainingBlockSeeder`: mark two non-current-week runs as `garminImported()` and one as `garminOverwritten()`. Keep every existing shape guarantee (peak week, illness week, partial current week).
      5. Tests:
         - `SchemaTest`: `source` column (string, default `strava`), `strava_activity_id` nullable and still unique.
         - `ActivityTest`: the `source` cast and `stravaUrl()` (null for Garmin rows).
         - `TrainingBlockSeederTest`: asserts the seeded Garmin rows exist.
      6. `php artisan migrate:fresh --seed`, then `php artisan test --compact tests/Feature/Database tests/Unit/Models`
      7. `vendor/bin/pint --dirty --format agent`

      ## Completion Criteria
      - [x] Migration up and down both run; existing rows read as `source = strava`
      - [x] `strava_activity_id` nullable, unique index intact
      - [x] `Activity` docblock, casts, `#[Fillable]` in sync with the migration (Larastan level 5 clean)
      - [x] `stravaUrl()` returns null for Garmin-sourced rows
      - [x] Factory states `garminImported()` / `garminOverwritten()` produce valid rows
      - [x] `migrate:fresh --seed` succeeds with coherent Garmin demo rows
      - [x] Tests pass

      ## Test Data
      - [x] `database/factories/ActivityFactory.php` updated: default `source`, plus the `garminImported()` and `garminOverwritten()` states
      - [x] `TrainingBlockSeeder` seeds two Garmin-imported runs and one Garmin-overwritten twin
      - [x] Factory updated in **this same task** as the migration

      ## Domain Docs
      - [x] `.larapilot/docs/devs/activity-sync.md`: data model section rewritten for `source` and the nullable Strava id. Covers the three row kinds (Strava, Garmin-new, Garmin-won twin), the lossy rollback, and why no new index.
      - [x] `.larapilot/docs/devs/README.md` index row "Last touched by" set to `US-008`
      - [x] English, committed with this task
      ## Git Deliverables
      - Commit: `feat(US-008): TASK-01 add activity source and nullable Strava id`
      - Push: **skip** (`git_mode: GITFLOW`)
      - PR: update the local PR notes toward `develop` — remote only if the user asks
