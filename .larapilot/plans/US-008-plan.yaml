  -
    id: TASK-09
    title: 'Cover the import flow over HTTP (conflicts, boundary, overwrite/skip, re-import, guests, sync interplay)'
    body: |-
      ## Description
      Feature tests for the full upload, review, confirm and summary flow, plus its interplay with the nightly sync. These complete the spec's test criterion.

      ## Files Involved
      - tests/Feature/Garmin/GarminImportFlowTest.php (new)
      - tests/Feature/Garmin/GarminImportAccessTest.php (new)
      - tests/Feature/Dashboard/PublicDashboardTest.php (entry-point visibility)

      ## Steps
      1. Set up the owner with `allowlistedAthlete()` and `Carbon::setTestNow('2026-10-11 12:00:00')`. Uploads use `UploadedFile::fake()->createWithContent()` from the fixtures. Wherever `strava:sync` runs, use `Http::fake()` with `Http::preventStrayRequests()`.
      2. `GarminImportAccessTest`:
         - A guest GET to each import route redirects to `/`.
         - A guest POST to store, confirm and cancel is refused. Activity count is unchanged and no session `garmin_import.pending` exists.
         - The dashboard shows "Import Garmin CSV" to the owner and not to guests.
      3. `GarminImportFlowTest`:
         1. Upload the IT sample on an empty DB. Review lists 37 new rows. Confirm: 37 `garmin_csv` rows, summary ignored 3 (`Escursionismo`).
         2. Upload the EN fixture. Types map, and invalid and outside-window rows are counted and listed.
         3. Rejections each show their message and write nothing: a non-CSV file, >5 MB (`UploadedFile::fake()->create('a.csv', 5121)`), unknown headers, a missing column.
         4. Boundary: a stored Strava run at 09:31:28 against a CSV row at 09:33:27 (119 s) is a conflict; at 09:31:26 (121 s) it is new, not a conflict.
         5. Closest match: two stored runs within ±2 min; the review pairs the CSV row with the closer one.
         6. Overwrite replaces name, distance, moving time and start; `source = garmin_csv`; the Strava id is kept.
         7. Skip leaves the stored row byte-identical.
         8. Abandon (upload, then never confirm) writes nothing.
         9. Cancel clears the pending import.
         10. Stale review: insert a conflicting activity between review and confirm. Confirm redirects to review with the notice and writes nothing.
         11. Re-import: uploading and confirming the same file a second time changes nothing, and the summary shows all already-imported.
         12. Grid cache: after confirm, the `HeatmapGridCache` entry for today is gone.
         13. The raw file is not persisted: `Storage::fake('local')` holds no files after the flow.
         14. Garmin wins over the sync: overwrite a Strava twin, then run `strava:sync` with a fake response that still returns the twin with Strava's values. The row keeps Garmin values, there is no duplicate, and the row is not deleted.
         15. Review HTML: stored Strava rows link to `strava.com/activities/{id}`, and Garmin rows have no Strava link.
      4. `php artisan test --compact tests/Feature/Garmin tests/Feature/Dashboard`
      5. No Playwright, Dusk or browser suites.

