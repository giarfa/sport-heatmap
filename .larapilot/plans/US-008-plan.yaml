    id: TASK-07
    title: 'Plan and apply an import: conflict detection, already-imported, Overwrite/Skip in one transaction'
    body: |-
      ## Description
      Classify parsed rows against stored activities into new, conflict and already-imported, then apply the owner's choices atomically and invalidate the grid cache (FR-018).

      ## Files Involved
      - app/Enums/ConflictResolution.php (new: `Overwrite = 'overwrite'`, `Skip = 'skip'`)
      - app/Support/Garmin/PlanGarminImport.php (new)
      - app/Data/Garmin/GarminImportPlan.php (new)
      - app/Data/Garmin/GarminImportConflict.php (new: row index, `GarminCsvRow`, stored `Activity`)
      - app/Data/Garmin/GarminImportSummary.php (new)
      - app/Actions/Garmin/ApplyGarminImport.php (new)

      ## Steps
      1. `PlanGarminImport::__invoke(User $athlete, array $rows): GarminImportPlan`:
         1. Run **one** query: `$athlete->activities()->whereIn('activity_date', $distinctCsvDates)->get()`. It is served by the `(user_id, activity_date)` index, with no per-row query.
         2. For each row, in CSV order:
            - a stored `garmin_csv` row with `isIdenticalTo` true makes the row **already imported**
            - otherwise `StartTimeMatcher::closest()` over the unclaimed candidates gives a **conflict**, and the matched row is claimed
            - otherwise the row is **new**
         3. A block comment explains claiming: one stored row can answer only one CSV row, otherwise two CSV runs could both overwrite it.
      2. `GarminImportPlan` (`final readonly`):
         - `newRows`, `conflicts` (keyed by row index), `alreadyImported`
         - `fingerprint(): string`, the sha256 of the sorted `rowIndex => activityId` pairs
      3. `ApplyGarminImport::__invoke(User $athlete, GarminImportPlan $plan, array<int, ConflictResolution> $resolutions, ParsedGarminCsv counts): GarminImportSummary`:
         - `DB::transaction` around everything:
           - create each new row through `$athlete->activities()->create($row->toAttributes())`
           - Overwrite: update the stored row with `name`, `distance_meters`, `moving_time_seconds`, `start_date_local`, `activity_date`, `sport_type` and `source = garmin_csv`; `strava_activity_id` is kept
           - Skip: no write
         - after commit, `HeatmapGridCache::forget($athlete, HeatmapWindow::current(), now())`
         - a conflict with no resolution is treated as Skip (defensive; the Form Request already requires one)
         - no authorization, per `.ai/rules/actions.md`
      4. `GarminImportSummary`:
         - imported, overwritten, skipped, alreadyImported, ignoredByType, outsideWindow, invalid
         - `toSessionArray()` / `fromSessionArray()`, `ignoredTotal()`
      5. Quick feature checks go in TASK-09's flow tests. Here, keep `php artisan test --compact` green and run `php artisan larapilot:quality`.

      ## Completion Criteria
      - [x] Classification is correct for new / conflict / already-imported, with closest-match claiming
      - [x] Planning runs exactly one activities query regardless of row count
      - [x] Overwrite replaces the CSV-carried fields and marks `garmin_csv`, keeping the Strava id; Skip writes nothing
      - [x] All writes in one transaction; grid cache forgotten after commit
      - [x] Larastan level 5 clean

      ## Test Data
      - N/A: no schema change (uses the TASK-01 factory states)

      ## Domain Docs
      - [x] `.larapilot/docs/devs/garmin-csv-import.md`, planning half:
        - the conflict rule (same date, ±2 min inclusive, closest, claiming) and the "already imported" identity (start + distance + moving time)
        - what Overwrite replaces and why the Strava id is kept, plus the single transaction
        - rejected alternative: the CSV row hash as an identity, rejected because Garmin exports carry no activity id and a re-export may reorder columns
      - [x] README index row updated
      - [x] English, committed with this task
      ## Git Deliverables
      - Commit: `feat(US-008): TASK-07 plan and apply Garmin imports`
      - Push: **skip** (`git_mode: GITFLOW`)
      - PR: update the local PR notes toward `develop` — remote only if the user asks
