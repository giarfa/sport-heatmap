    id: TASK-02
    title: 'Source-aware sync: StartTimeMatcher, Garmin-won skip, late-twin linking, Strava-only deletes'
    body: |-
      ## Description
      Make `ReconcileStravaWindow` respect Garmin:
      - it never reverts, re-adds or deletes a Garmin-won activity
      - it links a late Strava twin to a Garmin-imported row instead of duplicating it (decision `7baf70c6656a936f`)
      - delete-on-absence touches Strava-sourced rows only (FR-002)

      It also introduces the shared ±2-minute matcher that the importer reuses.

      ## Files Involved
      - app/Support/Garmin/StartTimeMatcher.php (new)
      - app/Actions/Strava/ReconcileStravaWindow.php
      - app/Data/StravaActivity.php (`toAttributes()` gains `source => ActivitySource::Strava`)
      - tests/Unit/Data/StravaActivityTest.php (assert `source` in attributes)

      ## Steps
      1. `StartTimeMatcher` (`final readonly`):
         - `public const TOLERANCE_SECONDS = 120;`, inclusive
         - `closest(CarbonImmutable $start, iterable<Activity> $candidates): ?Activity` keeps only candidates on the same `activity_date` with `abs(diff) <= 120`, picks the smallest diff, and breaks ties on the lowest id
         - A block comment explains why both the sync and the importer must use this one class
      2. `ReconcileStravaWindow`, inside the existing transaction:
         1. Load the athlete's stored rows once: `select(['id', 'source', 'strava_activity_id', 'start_date_local', 'activity_date'])`. That is one query and no N+1. Build:
            - `$garminOwnedIds`: the Strava ids on `garmin_csv` rows
            - `$storedStravaIds`: all non-null Strava ids
            - `$unlinkedGarmin`: `garmin_csv` rows with a NULL Strava id
         2. For each fetched activity:
            - Its id is in `$garminOwnedIds`: `continue`. A block comment says why: Garmin wins permanently and an upsert here would revert it.
            - Its id is not in `$storedStravaIds` and the matcher finds an unlinked Garmin row: set only `strava_activity_id` on that row (`forceFill` + `save`, since the id is an identity column), remove the row from `$unlinkedGarmin`, then `continue`.
            - Otherwise: the existing `updateOrCreate`.
         3. Add `->where('source', ActivitySource::Strava)` to the delete query, with a block comment.
      3. `php artisan test --compact tests/Feature/Strava tests/Unit/Data`: the existing reconciliation tests must stay green unchanged, since every existing row is Strava-sourced
      4. `vendor/bin/pint --dirty --format agent`

      ## Completion Criteria
      - [x] A Strava id owned by a `garmin_csv` row is never upserted or deleted
      - [x] A late Strava twin of a Garmin-new row links to it (one row, Garmin values kept)
      - [x] Delete-on-absence scoped to `source = strava`
      - [x] Still one transaction; stored-row lookup is a single query
      - [x] Existing sync tests pass

      ## Test Data
      - N/A: no schema change (factory states come from TASK-01)

      ## Domain Docs
      - [x] `.larapilot/docs/devs/activity-sync.md`:
        - functional flow: the skip, link and upsert decision order, and Strava-only deletes
        - architectural choices: link vs duplicate (cite decision `7baf70c6656a936f`) and why skip rather than a no-op upsert
        - invariants: "Garmin wins permanently", and the ±2-min inclusive tolerance being shared with the importer
      - [x] README index row updated
      - [x] English, committed with this task
      ## Git Deliverables
      - Commit: `feat(US-008): TASK-02 make the Strava sync source-aware`
      - Push: **skip** (`git_mode: GITFLOW`)
      - PR: update the local PR notes toward `develop` — remote only if the user asks
