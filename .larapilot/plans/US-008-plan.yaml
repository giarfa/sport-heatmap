    id: TASK-05
    title: 'Garmin CSV parser: header sets, running-type map, value parsing, rejection exception, DTOs'
    body: |-
      ## Description
      Parse an Italian or English Garmin Connect "Activities" export into readonly DTOs:
      - running types only (FR-003), with every unrecognised type counted by name (decision `56c5683061907ab8`)
      - rows inside the 112-day window and not in the future
      - invalid rows listed with a reason while the others still parse
      - explicit rejection for an unknown header set, a missing column, or a non-CSV file

      ## Files Involved
      - app/Support/Garmin/GarminCsvColumns.php (new)
      - app/Support/Garmin/GarminRunningTypes.php (new)
      - app/Support/Garmin/ParseGarminCsv.php (new)
      - app/Data/Garmin/GarminCsvRow.php (new)
      - app/Data/Garmin/ParsedGarminCsv.php (new)
      - app/Exceptions/Garmin/GarminCsvRejectedException.php (new)
      - tests/Fixtures/Garmin/activities-it.csv (verbatim copy of `client-materials/Activities (1).csv`)
      - tests/Fixtures/Garmin/activities-en.csv (new, hand-built)

      ## Steps
      1. `GarminCsvColumns`:
         - IT and EN maps from canonical key to header: `type`, `date`, `title`, `distance`, `moving_time` (required), plus `time` (optional fallback)
         - `detect(array $header): array<string, int>` (canonical key to column index) strips a UTF-8 BOM, picks the language from the first cell, and throws `GarminCsvRejectedException::unrecognisedHeaders()` or `::missingColumn($name)`
      2. `GarminRunningTypes::sportTypeFor(string $label): ?SportType` matches trimmed and case-insensitive, using the table in the plan's §4. A block comment says only `Corsa` is confirmed by the client sample, and that unknown labels surface in the summary, never silently.
      3. `ParseGarminCsv::__invoke(string $path, HeatmapWindow $window, CarbonInterface $today): ParsedGarminCsv`:
         - read with `SplFileObject` (`READ_CSV | SKIP_EMPTY | READ_AHEAD`)
         - a non-CSV or unreadable file, or one with no data rows, throws `::notACsv()` / `::empty()`
         - per row, in order:
           1. type: an unknown type goes to `ignored[label]++`
           2. date: `createFromFormat('Y-m-d H:i:s' | 'Y-m-d H:i', …, 'UTC')`, with no tz conversion (same block-comment rationale as `StravaActivity`); a failure is `invalid`, reason "unreadable date"
           3. `activity_date > today` or outside the window: `outsideWindow++`
           4. distance: strip the `,` thousands separator, parse `.` decimal km, `round(km * 1000)`; `"--"`, empty or non-numeric is `invalid` ("missing distance")
           5. moving time: `HH:MM:SS[.f]` or `MM:SS` to rounded seconds; on `"--"` fall back to `time`, and if that is also missing the row is `invalid` ("missing moving time")
           6. title: trimmed, `Run` when empty, max 255
         - rows identical within the file (same start, distance and moving time) collapse into one
         - invalid entries carry the 1-based line number
      4. `GarminCsvRow` (`final readonly`) fields: `sportType`, `name`, `distanceMeters`, `movingTimeSeconds`, `startDateLocal`, `activityDate`. Methods:
         - `toAttributes()`, which always includes `source => ActivitySource::GarminCsv`
         - `toSessionArray()` / `fromSessionArray()`, using scalars only so the session never holds objects
         - `isIdenticalTo(Activity $activity): bool`
      5. `ParsedGarminCsv` (`final readonly`): `rows`, `ignoredByType`, `outsideWindow`, `invalid` (array of `{line, reason}`).
      6. `GarminCsvRejectedException`: named constructors with fresh, user-facing messages. The messages carry no file content beyond a column name.
      7. Fixtures:
         - copy the client sample verbatim
         - build `activities-en.csv` with the EN headers from the plan and rows covering `Running`, `Treadmill Running`, `Trail Running`, `Virtual Run`, `Hiking`, a `"--"` distance, a `"--"` moving time with `Time` present, a `"1,005.20"` distance, an unparseable date, a future date and an out-of-window date
      8. `vendor/bin/pint --dirty --format agent`, then `php artisan larapilot:quality`

      ## Completion Criteria
      - [x] The IT sample parses to 37 `Run` rows and ignores 3 `Escursionismo` (with `now` = 2026-10-11)
      - [x] EN headers parse; types map to Run / TrailRun / VirtualRun; `Hiking` counted as ignored by name
      - [x] `"8.29"` gives 8290 m; `"00:54:23"` gives 3263 s; `start_date_local` stored without tz shift
      - [x] An unknown header set, a missing required column, or a non-CSV file each throw with an explicit message
      - [x] Invalid rows listed with line + reason; remaining rows still returned
      - [x] Larastan level 5 clean

      ## Test Data
      - N/A: no model or schema change (CSV fixtures are added under `tests/Fixtures/Garmin/`)

      ## Domain Docs
      - [x] `.larapilot/docs/devs/garmin-csv-import.md` created from `TEMPLATE.md`, parsing half:
        - accepted header sets, the running-type table and its "unknowns are surfaced" rule
        - value rules (km/thousands/`--`/duration/no-tz date), window and future cutoff
        - the metric-account limitation
      - [x] `.larapilot/docs/devs/README.md` gets a new `garmin-csv-import` index row
      - [x] English, committed with this task
      ## Git Deliverables
      - Commit: `feat(US-008): TASK-05 parse Garmin Connect activity exports`
      - Push: **skip** (`git_mode: GITFLOW`)
      - PR: update the local PR notes toward `develop` — remote only if the user asks
