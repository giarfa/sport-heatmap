    id: TASK-08
    title: 'Owner-only import routes, Form Requests, session-bound review, views, and dashboard entry point'
    body: |-
      ## Description
      Wire the flow end to end. A signed-in owner uploads the CSV, reviews conflicts side by side, confirms or cancels, and sees the summary. Guests are refused and nothing is written. This follows the `.larapilot/mockups/US-008/` contract (FR-009) and puts Strava deep-links only on Strava-sourced stored rows (FR-008).

      ## Files Involved
      - routes/web.php
      - bootstrap/app.php (`redirectGuestsTo(fn () => route('dashboard'))`)
      - app/Providers/AppServiceProvider.php (`RateLimiter::for('garmin-import', …)`, 10/min by user id)
      - app/Http/Requests/Garmin/UploadGarminCsvRequest.php (new)
      - app/Http/Requests/Garmin/ConfirmGarminImportRequest.php (new)
      - app/Http/Controllers/Garmin/ShowGarminImportFormController.php (new)
      - app/Http/Controllers/Garmin/UploadGarminCsvController.php (new)
      - app/Http/Controllers/Garmin/ShowGarminImportReviewController.php (new)
      - app/Http/Controllers/Garmin/ConfirmGarminImportController.php (new)
      - app/Http/Controllers/Garmin/CancelGarminImportController.php (new)
      - app/Http/Controllers/Garmin/ShowGarminImportSummaryController.php (new)
      - app/Support/Garmin/PendingGarminImport.php (new: the one reader/writer of the `garmin_import.pending` session key)
      - resources/views/garmin/create.blade.php, review.blade.php, summary.blade.php (new)
      - resources/views/dashboard.blade.php (`@auth` "Import Garmin CSV" line under the map)
      - resources/js/app.js (`data-resolve-all` handler)
      - resources/css/app.css (stacked-table rules, only if the existing tokens do not cover them)
      - .ai/rules/http.md (amend the "no Form Requests" rule)

      ## Steps
      1. Routes:
         - group: `middleware(['auth', 'strava.fresh'])->prefix('import/garmin')->name('garmin.import.')`
         - `GET /` (create)
         - `POST /` (store, `throttle:garmin-import`)
         - `GET /review` (review)
         - `POST /confirm` (confirm)
         - `POST /cancel` (cancel)
         - `GET /summary` (summary)

         CSRF comes from the `web` group.
      2. `PendingGarminImport` (`final readonly`, takes `Session`):
         - `put(ParsedGarminCsv)` stores `{token: Str::random(40), rows: […toSessionArray()], counts}`
         - `get(): ?array`, `forget()`
         - A block comment says the session is the only binding: no route or input names an import, so no request can reach another one.
      3. `UploadGarminCsvController` (`UploadGarminCsvRequest`):
         - `ParseGarminCsv` on `$request->file('csv')->getRealPath()`, **never `store()`**
         - on `GarminCsvRejectedException`, redirect back with the error on `csv` and write nothing
         - otherwise `PendingGarminImport::put()` and redirect to `review`
      4. `ShowGarminImportReviewController`:
         - no pending import: redirect to `create` with a status
         - otherwise rebuild the rows, run `PlanGarminImport` against the current DB, and render `review` with the plan, `token`, `fingerprint` and counts
      5. `ConfirmGarminImportController` (`ConfirmGarminImportRequest`):
         - load the pending import and recompute the plan
         - a token or fingerprint mismatch redirects to `review` with "Your stored activities changed since this review — check the conflicts again." and writes nothing
         - otherwise `ApplyGarminImport`, `forget()`, flash `GarminImportSummary::toSessionArray()`, redirect to `summary`
      6. `CancelGarminImportController`: `forget()`, then redirect to `dashboard` with the status "Import cancelled. Nothing was written."
      7. `ShowGarminImportSummaryController`: renders from the flash; without a flash, redirects to `dashboard`.
      8. Form Requests:
         - `authorize()` returns `true`; access is decided by the route middleware and a comment says so
         - Upload: `csv` is `required|file|max:5120|mimes:csv,txt`, with explicit messages ("Choose a CSV file.", "The file is larger than 5 MB.", "This is not a CSV file.")
         - Confirm: `token`/`fingerprint` are `required|string`, and `resolutions` is an `array` whose items are `Rule::enum(ConflictResolution::class)`
      9. Views, mobile first per the mockup README:
         - labelled controls; errors linked via `aria-describedby`
         - the review as a real `<table>` with caption and scoped headers; distances in km to one decimal and times as `H:MM:SS`
         - a radio fieldset per conflict, with Skip pre-checked
         - shortcuts are `hidden` buttons revealed by JS
         - "View on Strava" only where `$activity->stravaUrl()` is not null
         - light and dark via the existing CSS variables
         - terse copy in the PRD register
      10. Dashboard: inside `@auth`, a line mirroring the guest one, `<a href="{{ route('garmin.import.create') }}">Import Garmin CSV</a>`, with a min 44 px target.
      11. `.ai/rules/http.md`: rewrite the rule. User-submitted forms (Garmin import) use Form Requests under `app/Http/Requests/{Integration}`. There are still no Policies, because access is the route middleware plus the allowlist. The query-string string-helper guidance stays.
      12. Smoke-check on Herd (`get-absolute-url`) at 375, 768 and 1280 px in light and dark. Then `vendor/bin/pint --dirty --format agent`, `php artisan larapilot:quality` and `php artisan test --compact`.

      ## Completion Criteria
      - [x] Owner sees "Import Garmin CSV" on the dashboard; guests do not
      - [x] Guest GET to any import route redirects to `/`; guest POST is refused; nothing written
      - [x] Upload rejects non-CSV, >5 MB, unknown headers, and missing columns with explicit messages
      - [x] Review lists conflicts side by side with Overwrite / Skip per row, the shortcuts, and the new rows; nothing written before confirm
      - [x] Confirm applies in one transaction; a stale review writes nothing; cancel clears the pending import
      - [x] Summary shows all seven counts, ignored type names, and invalid rows with reasons
      - [x] Raw file never persisted; pending rows live only in the owner's session
      - [x] FR-009: usable at 375 px, labelled controls, table semantics, light + dark (manual smoke)
      - [x] Tests pass

      ## Test Data
      - N/A: no model or schema change

      ## Domain Docs
      - [x] `.larapilot/docs/devs/garmin-csv-import.md`, HTTP half:
        - routes and middleware, session binding (`PendingGarminImport`)
        - the fingerprint staleness check, file never stored, Form Requests
        - rejected alternative: a `pending_imports` table, rejected because it would persist owner data beyond the request and need cleanup
      - [x] `.larapilot/docs/devs/heatmap-dashboard.md`: the owner-only "Import Garmin CSV" entry point, and that an import invalidates the grid cache
      - [x] README index rows updated (`garmin-csv-import`, `heatmap-dashboard`)
      - [x] English, committed with this task
      ## Git Deliverables
