    id: TASK-03
    title: 'Cover the source-aware sync and the start-time matcher'
    body: |-
      ## Description
      Add PHPUnit coverage for the sync rules this spec changes, plus the shared matcher's boundary.

      ## Files Involved
      - tests/Feature/Strava/ReconcileStravaWindowTest.php
      - tests/Feature/Strava/SyncStravaActivitiesCommandTest.php
      - tests/Unit/Support/Garmin/StartTimeMatcherTest.php (new, `php artisan make:test --phpunit --unit Support/Garmin/StartTimeMatcherTest --no-interaction`; fall back to plain `StartTimeMatcherTest` if the generator refuses a sub-path)

      ## Steps
      1. Use the factory states `garminImported()` / `garminOverwritten()`. Do not hand-build rows.
      2. `StartTimeMatcherTest`:
         - 119 s matches, 120 s matches, 121 s does not
         - a different date with the same time never matches
         - with two candidates, the closest wins
         - a tie goes to the lowest id
      3. `ReconcileStravaWindowTest`:
         - A Garmin-overwritten row whose twin Strava **still returns** keeps its Garmin name, distance, time and start, stays `garmin_csv`, and no second row is created.
         - A Garmin-overwritten row whose twin Strava **no longer returns** is not deleted.
         - A Garmin-imported row (NULL id) inside the window, absent from the response, is not deleted.
         - A Strava-sourced row absent from the response is still deleted.
         - Late twin: Strava returns a new id 90 s from a Garmin-imported row's start. The row gets that `strava_activity_id`, keeps its values, and the row count is unchanged. At 121 s it is a new Strava row instead.
         - Running the reconcile twice is idempotent.
      4. `SyncStravaActivitiesCommandTest`: one end-to-end case with `Http::fake()` and `Http::preventStrayRequests()` in `setUp()`. A Garmin-won activity survives `strava:sync`, and `sync_runs` counts exclude it.
      5. `php artisan test --compact --filter='ReconcileStravaWindow|StartTimeMatcher|SyncStravaActivitiesCommand'`
      6. No Playwright, Dusk or browser suites.

