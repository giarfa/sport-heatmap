    id: TASK-07
    title: "Mask stored-run details in a guest's conflict review"
    body: |-
      ## Description
      Fix: guest disclosure of stored-run details in the conflict review (`resources/views/garmin/review.blade.php:66-76`, Robert + Lars Medium). For a guest, the "Stored" side of each clash shows only the stored start time and "Clashes with a stored run"; the signed-in owner's review is unchanged. Owner decision: decision journal, topic `guest conflict review disclosure` (2026-10-12). Traces to FR-018, FR-017, FR-009.

      ## Files Involved
      - `app/Http/Controllers/Garmin/ShowGarminImportReviewController.php` — add `'showsStoredRunDetails' => $request->user() !== null` to the view data; `/* … */` block above it: a signed-in owner reviews their own athlete, a guest reviews the displayed athlete's runs and must not enumerate them by crafting clashing rows (`.ai/rules/app.md`)
      - `resources/views/garmin/review.blade.php` — inside the "Stored" `<td data-label="Stored" class="cmp-pair">`: `@if ($showsStoredRunDetails)` the current `.side` list (Start, Distance, Moving) + `.side-source` (name · Strava link / Garmin import), unchanged; `@else` a `.side` list with only `<div><dt>Start</dt><dd>{{ GarminImportFormat::start($conflict->stored->start_date_local) }}</dd></div>` and `<p class="side-source">Clashes with a stored run</p>`. Nothing else in the view changes (row header, Garmin-file side, legend, Overwrite/Skip, shortcuts, tally, `<caption>`)
      - `tests/Feature/Garmin/GuestGarminImportTest.php` — two new tests (below)
      - `CHANGELOG.md` — `[Unreleased]` `Changed`: the US-011 entry gains "a signed-out visitor's review shows only the start of a clashing stored run"
      - `.larapilot/mockups/US-008/README.md` — one line under the review screen: guest variant of the Stored cell (start only + "Clashes with a stored run"), same classes
      - `.larapilot/docs/devs/garmin-csv-import.md`, `.larapilot/docs/devs/README.md`, `.larapilot/docs/review/US-011.md`

      ## Steps
      1. Controller flag + block comment; keep the controller single-action with collaborators on `__invoke` (`.ai/rules/http.md`)
      2. View branch on `$showsStoredRunDetails` only — no `@auth`, `@guest`, or `auth()` in Blade (rework feedback: decide the switch once)
      3. Tests in `GuestGarminImportTest` (factories only; reuse `upload()` / `review()` / `csv()` helpers and `SAMPLE_FIRST_ROW`; `Http::preventStrayRequests()` already in `setUp()`):
         - `test_a_guest_review_masks_the_stored_side_of_a_clash` — displayed athlete via `allowlistedAthlete()` then sign out (or create the Strava athlete without signing in, like the sibling tests), one stored Strava run `start_date_local` `2026-10-10 09:34:10`, a distinctive `name` (e.g. "Private tempo with Giulia"), `distance_meters` 12_340, `moving_time_seconds` 3_725, `strava_activity_id` 4_242 — values the file row cannot produce; guest uploads `SAMPLE_FIRST_ROW`; review `assertSee('Clashes with a stored run')`, `assertSee(GarminImportFormat::start($stored->start_date_local))`, `assertDontSee($stored->name)`, `assertDontSee(GarminImportFormat::distance(12_340))`, `assertDontSee(GarminImportFormat::duration(3_725))`, `assertDontSee($stored->stravaUrl())`, `assertDontSee('View on Strava')`; Overwrite/Skip radios still present and confirming with Skip still succeeds
         - `test_the_signed_in_owner_review_still_shows_every_stored_detail` — same data, owner signed in via `allowlistedAthlete()`: `assertSee` name, distance, moving time, Strava URL; `assertDontSee('Clashes with a stored run')`
      4. `php artisan test --compact tests/Feature/Garmin`
      5. Smoke the review with a clash as a guest at 375 / 768 / 1280 px, light and dark (Herd URL via Boost `get-absolute-url`): masked cell aligned with the Garmin-file side, no horizontal scroll
      6. `vendor/bin/pint --dirty --format agent`

      ## Completion Criteria
      - [x] A guest's clash shows only the stored start and "Clashes with a stored run" — no name, distance, moving time, Strava link, or source label
      - [x] The Garmin-file side and the Overwrite/Skip choice are unchanged for guests
      - [x] The signed-in owner's review is unchanged
      - [x] The guest/owner switch is decided once in the controller; Blade has no auth check
      - [x] FR-009 holds on the masked cell: 375 px, light and dark (manual smoke)
      - [x] New tests pass; existing Garmin tests stay green
      - [x] Rework feedback addressed

      ## Test Data
      - N/A — no model, schema, factory, or seeder change; tests use the existing `UserFactory` / `ActivityFactory`

      ## Domain Docs
      - [x] `.larapilot/docs/devs/garmin-csv-import.md` — replace the "Open (review, Medium)" bullet in `Key decisions & invariants` with **Invariant — a guest never sees a stored run's details**: the review shows a guest only the start of a clashing stored run and "Clashes with a stored run"; reason (crafted rows within ±2 min would otherwise enumerate the displayed athlete's names, distances, moving times and Strava links, private activities included); _Breaks if:_ the view decides from anything but `showsStoredRunDetails`, or a new stored field is added outside the owner branch. `HTTP flow`: the review controller passes the flag. `Architectural choices`: masked cell vs accepting the disclosure (rejected by the owner, decision journal) vs hiding clashes entirely from guests (rejected — the visitor could not make an informed Overwrite/Skip choice)
      - [x] `.larapilot/docs/devs/README.md` — `garmin-csv-import` row: last touched `US-011` (rework)
      - [x] `.larapilot/docs/review/US-011.md` — drop the guest-disclosure item from `Open (Medium)` in `## Parent actions`; record it under `Fixed:` with the test names
      - [x] English, committed with this task

      ## Git Deliverables
      - Commit: `fix(US-011): TASK-07 mask stored-run details in a guest's conflict review`
      - Push: **skip** (`git_mode: GITFLOW`)
      - PR: update local notes only
