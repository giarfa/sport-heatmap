    id: TASK-03
    title: 'Cover the guest import flow end to end'
    body: |-
      ## Description
      Add PHPUnit feature coverage for the signed-out import exactly as the spec's test criterion lists it, with Strava HTTP faked and stray requests prevented. Traces to FR-018, FR-017.

      ## Files Involved
      - `tests/Feature/Garmin/GuestGarminImportTest.php` (new, `php artisan make:test --phpunit GuestGarminImportTest`, moved under `Garmin/`)
      - Fixtures reused: `tests/Fixtures/Garmin/activities-it.csv`, `tests/Fixtures/Garmin/activities-en.csv`

      ## Steps
      1. `setUp()`: `Http::preventStrayRequests()`, `Http::fake()` for Strava hosts with an assertion helper that no request was sent, `Carbon::setTestNow('2026-10-11 12:00:00')` like the sibling tests; factories only (`UserFactory::stravaConnected()`, `csvOnly()`, `ActivityFactory`)
      2. Guest import into the displayed athlete, both fixtures (data provider): upload review confirm summary counts; rows belong to the displayed athlete; no CSV-only athlete created
      3. Guest import with no stored athlete, both fixtures: confirm creates exactly one CSV-only athlete (null Strava id and tokens) holding the runs; `GET /` then shows that athlete's map, not the connect screen
      4. Every FR-018 behavior holds for a guest: ±2-minute conflict review with Overwrite/Skip, idempotent re-import, abandoning writes nothing, the raw file is never stored
      5. A guest import makes no Strava request and never reads or refreshes a token: the displayed athlete has an **expired** token; after the import its token columns and `strava_token_expires_at` are byte-identical and `Http::assertNothingSent()`
      6. Two guest sessions stay isolated: session A uploads the Italian file, the session is captured and flushed (`flushSession()`), session B uploads the English file; B's review shows only B's rows; confirming in B with A's token fails and writes nothing; restoring A (`withSession()`) confirms A's rows only
      7. Target change mid-review: a guest reviews against no athlete (or the fallback athlete), an allowlisted athlete connects before confirm confirm redirects to the review with the stale notice and writes nothing
      8. Concurrent first import: two pending guest imports confirmed back to back with no stored athlete one CSV-only athlete; the second confirm is sent back to review
      9. The signed-in owner flow is unchanged: the existing `GarminImportFlowTest` still passes untouched
      10. `php artisan test --compact tests/Feature/Garmin`; do **not** add Playwright, Dusk, or browser suites

      ## Completion Criteria
      - [x] Guest import end to end with both header-language fixtures into the displayed athlete and into a newly created CSV-only athlete
      - [x] Two guest sessions isolated
      - [x] A guest import makes no Strava request and leaves tokens untouched
      - [x] Target change and concurrent first import write nothing unexpected
      - [x] Signed-in owner flow unchanged
      - [x] Tests pass at the `NORMAL` bar

      ## Git Deliverables
      - Commit: `test(US-011): TASK-03 cover the signed-out Garmin import`
      - Push: **skip** (`git_mode: GITFLOW`)
      - PR: update local notes only
    type: Test
    status: DONE
    assignee: Anne
    estimate_hours: 4
