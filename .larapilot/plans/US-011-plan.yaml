    id: TASK-01
    title: 'Import target resolution and the CSV-only athlete'
    body: |-
      ## Description
      Give the import pipeline one target athlete — the signed-in owner, else the displayed athlete, else none — and let a confirmed first import create a local CSV-only athlete inside the import transaction. Traces to FR-018, FR-017, FR-001 (clarified). No HTTP change yet: the owner flow must stay green.

      ## Files Involved
      - `app/Support/Garmin/ResolveGarminImportTarget.php` (new, `final readonly`, `__invoke(?User $signedIn): ?User` `$signedIn ?? ($this->resolveDisplayedAthlete)()`)
      - `app/Actions/Garmin/CreateCsvOnlyAthlete.php` (new action: `firstOrCreate` on `email = 'csv-athlete@garmin.invalid'` with `name = 'Garmin CSV athlete'`; Strava columns, password, `email_verified_at` left null; class constants for both placeholders)
      - `app/Models/User.php` (`isCsvOnly(): bool` — `strava_athlete_id === null`; docblock unchanged, no column change)
      - `app/Support/Garmin/PlanGarminImport.php` (`?User $athlete`; null no stored activities, every row new, still zero queries)
      - `app/Data/Garmin/GarminImportPlan.php` (carries `?int $athleteId`; `fingerprint()` hashes it alongside conflicts and already-imported rows)
      - `app/Actions/Garmin/ApplyGarminImport.php` (`?User $athlete`; when null and `newRows` is non-empty, create the athlete via `CreateCsvOnlyAthlete` **inside** the existing `DB::transaction`; when null and nothing to write, write nothing; forget the grid cache of the athlete actually written; never `save()` the passed user — it may be the narrow `id, strava_athlete_id` select)
      - `database/factories/UserFactory.php` (`csvOnly()` state)
      - `tests/Unit/Support/Garmin/ResolveGarminImportTargetTest.php`, `tests/Feature/Garmin/CsvOnlyAthleteImportTest.php` (new, via `php artisan make:test --phpunit`)
      - `.larapilot/docs/devs/garmin-csv-import.md`, `.larapilot/docs/devs/README.md`

      ## Steps
      1. `php artisan make:class Support/Garmin/ResolveGarminImportTarget` and `php artisan make:class Actions/Garmin/CreateCsvOnlyAthlete`; constructor-promoted `private readonly` dependencies (`.ai/rules/actions.md`)
      2. Add `User::isCsvOnly()` and `UserFactory::csvOnly()` (domain-realistic: the placeholders above, all Strava columns null)
      3. Thread `?User` through `PlanGarminImport` and `ApplyGarminImport`; add `athleteId` to `GarminImportPlan` and its fingerprint. Block comments (`/* … */`) state why: the fingerprint carries the target so a target change mid-review fails the existing stale check; the athlete is created inside the transaction so a failed insert leaves no empty athlete; the fixed `.invalid` email + UNIQUE index is what makes a second CSV-only athlete impossible
      4. Update the two controllers' calls minimally (`$request->user()` passed through the new resolver) so the signed-in flow compiles and stays unchanged; the route change is TASK-02
      5. Tests: resolver returns the signed-in user over the displayed athlete, the displayed athlete for a guest, null with no stored activity; `ApplyGarminImport(null, …)` creates exactly one CSV-only athlete with the rows and no tokens; a second call reuses it; a null target with an empty plan writes nothing and creates no athlete; the fingerprint differs when only the target id differs; a failure inside the transaction leaves no athlete row
      6. `php artisan test --compact tests/Feature/Garmin tests/Unit/Support/Garmin` — existing `GarminImportFlowTest` stays green
      7. `vendor/bin/pint --dirty --format agent`

      ## Completion Criteria
      - [x] One target resolver used by review and confirm; it never selects a token column for a guest
      - [x] A confirmed import with no target creates one CSV-only athlete (no Strava id, no tokens) in the same transaction as its runs
      - [x] No empty CSV-only athlete is ever created
      - [x] The plan fingerprint changes when the target changes
      - [x] Signed-in owner import behavior unchanged; existing Garmin tests pass
      - [x] New tests pass

      ## Test Data
      - [x] `database/factories/UserFactory.php` gains `csvOnly()` in this task
      - [x] Seeder: N/A by design — a seeded CSV-only athlete beside the demo Strava athlete would never be displayed (see plan Test Data Strategy)
      - [x] No migration (columns already nullable; `name`/`email` filled with placeholders)

      ## Domain Docs
      - [x] `.larapilot/docs/devs/garmin-csv-import.md` — `Functional flow` §2–3 (null target, CSV-only athlete creation), `Technical design` (new classes), `Architectural choices` (placeholder identity vs a migration making `name`/`email` nullable — rejected; resolver vs reading `$request->user()` in each controller — rejected), `Key decisions & invariants` (at most one CSV-only athlete; created only with rows; fingerprint carries the target)
      - [x] Folder `README.md` index row updated (`US-011`)
      - [x] English, committed with this task

      ## Git Deliverables
      - Commit: `feat(US-011): TASK-01 resolve the import target and create a CSV-only athlete`
      - Push: **skip** (`git_mode: GITFLOW`)
      - PR: update local notes only
    type: Impl
    status: DONE
    assignee: Mike
    estimate_hours: 4
    dependencies:
      - TASK-00
  -
    id: TASK-02
    title: 'Open the import routes to signed-out visitors'
    body: |-
      ## Description
      Drop `auth` from the `garmin.import.*` group so a guest can GET and POST upload, review, confirm, cancel, and summary, with every guard the spec keeps: `strava.fresh` (no-op for guests), CSRF, 5 MB, `garmin-import` throttle, session binding. Make the confirm lock instance-wide and resolve the target inside it. Traces to FR-018, FR-017.

      ## Files Involved
      - `routes/web.php` (group middleware `['strava.fresh']`; the block comment rewritten: open by the owner's choice, PRD Security accepted risk, what still guards it)
      - `app/Http/Controllers/Garmin/ShowGarminImportReviewController.php`, `ConfirmGarminImportController.php` (target from `ResolveGarminImportTarget` with `$request->user()`; confirm: `Cache::lock('garmin-import:confirm', 30)->block(10, …)` with the target resolved inside the closure; block comment on why the key is instance-wide)
      - `app/Http/Controllers/Garmin/ShowGarminImportFormController.php`, `UploadGarminCsvController.php` (docblocks: no longer "owner-only")
      - `app/Http/Requests/Garmin/UploadGarminCsvRequest.php`, `ConfirmGarminImportRequest.php` (`authorize()` docblocks: access is `strava.fresh` + the session binding, not `auth`)
      - `app/Support/Garmin/PendingGarminImport.php` (docblock: "visitor's session", not "owner's")
      - `bootstrap/app.php` (`redirectGuestsTo` comment: no route uses `auth` today; kept so a future one cannot throw on the missing login route)
      - `app/Providers/AppServiceProvider.php` (limiter comment: guests are keyed by IP — behavior already correct, no code change expected)
      - `.ai/rules/http.md` (correct the sentence "access is the route middleware (auth + strava.fresh …)" to the US-011 truth)
      - `tests/Feature/Garmin/GarminImportAccessTest.php` (rewritten)
      - `.larapilot/docs/devs/garmin-csv-import.md`, `.larapilot/docs/devs/strava-connection.md`, `.larapilot/docs/devs/README.md`

      ## Steps
      1. Change the route group; keep `throttle:garmin-import` on `store` and `confirm`
      2. Switch both controllers to the resolver; move target resolution inside the confirm lock; rename `$owner` `$athlete` / `$target` so the code no longer claims an owner
      3. Rewrite the docblocks and the project rule listed above
      4. Rewrite `GarminImportAccessTest`: a guest reaches the upload form (200) and the review/summary GETs redirect to the form/dashboard only for lack of a pending import or summary (never for lack of sign-in); the `garmin.import.*` routes gather `web` (CSRF) and `throttle:garmin-import` on `store`/`confirm` and not `auth`; an 11th guest upload in a minute is `429`; a guest upload over 5 MB is rejected with nothing written; a signed-in athlete removed from the allowlist is still refused (`strava.fresh`); the signed-in owner still reaches the form
      5. `php artisan route:list --path=import` to confirm the middleware; `php artisan test --compact tests/Feature/Garmin`
      6. `vendor/bin/pint --dirty --format agent`

      ## Completion Criteria
      - [x] Every import page answers a signed-out GET/POST without a Strava sign-in
      - [x] CSRF (web group), 5 MB, and the `garmin-import` throttle stay in force for guests (tested)
      - [x] No route accepts an import id or an athlete id
      - [x] Confirm lock is instance-wide; the target is resolved inside it
      - [x] A signed-in owner removed from the allowlist is still refused; the owner flow is unchanged
      - [x] Tests pass

      ## Test Data
      - N/A — no model/schema changes in this task

      ## Domain Docs
      - [x] `.larapilot/docs/devs/garmin-csv-import.md` — `HTTP flow` (middleware, guests, instance-wide lock, target inside the lock, stale review on a target change), `Key decisions & invariants` (open import is an accepted risk to re-decide before a public deployment)
      - [x] `.larapilot/docs/devs/strava-connection.md` — `redirectGuestsTo` no longer serves a route; the displayed athlete is also the guest import target and may be CSV-only
      - [x] Folder `README.md` index rows updated (`garmin-csv-import` purpose no longer "Owner-only"; `strava-connection` `US-011`)
      - [x] English, committed with this task

      ## Git Deliverables
      - Commit: `feat(US-011): TASK-02 open the Garmin import routes to signed-out visitors`
      - Push: **skip** (`git_mode: GITFLOW`)
      - PR: update local notes only
    type: Impl
    status: DONE
    assignee: Alex
    estimate_hours: 3
    dependencies:
      - TASK-01
