code: US-011
plan_body: |
  ## Technical Solution

  US-011 opens the existing US-008 Garmin import pipeline to signed-out visitors without touching its parsing, planning, or reconciliation rules. The change has four seams:

  1. **One import target, resolved the same way on review and confirm.** A new `App\Support\Garmin\ResolveGarminImportTarget` returns `$request->user() ?? ResolveDisplayedAthlete()` — the signed-in owner imports into their own athlete, a guest into the displayed athlete (FR-017), and `null` means "no athlete yet". `ResolveDisplayedAthlete` already selects only `id` and `strava_athlete_id`, so a guest import never loads, decrypts, or refreshes a token by construction. The resolved target id is folded into `GarminImportPlan::fingerprint()`: if the target changes between review and confirm (an allowlisted athlete connects mid-review, the visitor signs in, a concurrent guest creates the CSV-only athlete), the existing stale-review path redirects back to the review and writes nothing. No route or field ever names an import or an athlete.
  2. **The CSV-only athlete.** `PlanGarminImport` accepts `?User`: with no target every row is new. `ApplyGarminImport` accepts `?User`; when it is null and the plan has new rows, it creates the athlete through a new `App\Actions\Garmin\CreateCsvOnlyAthlete` **inside the same `DB::transaction`** as the activity inserts, so the import stays all-or-nothing. Placeholder identity (🗄️ Mike, settled here — no migration): `name = 'Garmin CSV athlete'`, `email = 'csv-athlete@garmin.invalid'` (RFC 2606 `.invalid`, the same convention as `ConnectStravaAthlete`'s `@strava.invalid`), `password`, `email_verified_at`, `strava_athlete_id` and every token column null. The fixed email plus the existing `users.email` UNIQUE index makes a second CSV-only athlete impossible, and the action uses `firstOrCreate` on it. A plan with no new rows and no target writes nothing at all (no empty athlete is created). `User::isCsvOnly()` (`strava_athlete_id === null`) is the single predicate every other seam uses.
  3. **Routes and concurrency.** `auth` is dropped from the `garmin.import.*` group; `strava.fresh` stays (a no-op for guests, still guards a signed-in owner's allowlist and token). CSRF stays from the `web` group, the 5 MB rule from `UploadGarminCsvRequest`, and `throttle:garmin-import` on upload and confirm (already keyed by user id, else IP). The confirm lock becomes instance-wide (`garmin-import:confirm`) and the target is resolved **inside** the lock: this is a single-athlete instance, and a per-athlete key cannot exist before the CSV-only athlete does. Two guests confirming a first import at once therefore serialise; the second re-plans against the athlete the first just created, fails the fingerprint, and is sent back to review. `bootstrap/app.php`'s `redirectGuestsTo` no longer serves any route; it stays as the safety net for any future `auth` route (the comment is rewritten to say so).
  4. **Sync status and the nightly sync for a CSV-only athlete (FR-007, FR-002).** `SyncStravaActivities::connectedAthletes()` already requires a Strava id and both tokens, so a CSV-only athlete is never selected and nothing is logged — US-011 pins that with a test and documents it. `ResolveSyncStatus` branches on `isCsvOnly()`: it reads no `sync_runs` at all (they describe the Strava sync, which never touches this athlete) and builds `SyncStatus::forCsvOnly()` from the latest `updated_at` of the athlete's `garmin_csv` activities. A new `SyncHealth::CsvOnly` case never warns and never shows the skeleton; the chip reads "Imported {relative}", the detail card "Last import / Outcome: Garmin CSV / Runs in window". The latest-`updated_at` derivation was chosen over a new `users.garmin_imported_at` column (no migration, as the spec expects); its trade-off — a re-import that changes nothing does not move the stamp, so the label always means "data last changed by an import" — is recorded in the domain doc.

  **Entry points (FR-009, Marika's copy).** The dashboard shows "Import Garmin CSV" to every visitor in the existing discreet text line under the map; a guest sees it beside "Connect with Strava". The connect screen gains a secondary 44 px "Import Garmin CSV" control below the Strava button (Strava orange stays on the Strava button only) and its intro copy names both ways in. The import screens already follow `.larapilot/mockups/US-008/`; no new mockup is needed — same tokens, same `btn` styles, light and dark. `noindex, nofollow` and "Powered by Strava" stay on every screen.

  **Known limitation (documented, not built):** if a CSV-only athlete exists and the owner later connects Strava, the owner becomes the displayed athlete (FR-017) and the CSV-only athlete's runs are no longer shown; merging them is out of scope for US-011 and is written into `Extension points & gotchas` of `garmin-csv-import.md`.

  **Architecture notes (📐 John / 👾 Andrew).** Controllers stay single-action with collaborators on `__invoke`; Form Requests keep `authorize(): true` (access is still the route middleware — now `strava.fresh` only — and the session binding); the docblocks and `.ai/rules/http.md` sentence that say "auth + strava.fresh" are corrected. No new package, no Policy, no queue. Query shape: the plan stays one `activities` query (served by `(user_id, activity_date)`); the CSV-only status adds one `max(updated_at)` query on the same index prefix.

  **Security (🔐 Lars).** The open import is an accepted risk recorded in PRD Security (decision journal, 2026-10-12). Kept and tested for guests: CSRF via the `web` group, 5 MB limit, `garmin-import` throttle by IP, pending rows bound to the visitor's own session, no import id in any route, the raw file never stored, and no Strava call or token read on a guest request.

  ## Git & Branching
  - Mode: `GITFLOW` — no automatic push, no remote PR unless the user asks in-session
  - Branch: `feature/US-011-guest-garmin-import` from `develop`
  - TASK-00: bootstrap the branch and record the spec/PRD/backlog changes already in the working tree
  - Per task: one Conventional Commit `type(US-011): TASK-NN …`; code, tests, and domain docs ride in the same commit
  - Internal PR description toward `develop` prepared locally; merge after `larapilot-review` approval
  - `CHANGELOG.md` → `[Unreleased]` updated in TASK-05 (user-facing behavior change)

  ## Test Data Strategy
  - No migration, no new model. `User` gains no column; `UserFactory` gains a `csvOnly()` state (name `Garmin CSV athlete`, email `csv-athlete@garmin.invalid`, every Strava column null) used by tests
  - `ActivityFactory` is reused as is (`garminImported()`, `garminOverwritten()`, `onDate()`) for CSV-only athletes' runs
  - `DatabaseSeeder` / `TrainingBlockSeeder` unchanged on purpose: the demo athlete is a Strava athlete with a 16-week block, and a seeded CSV-only athlete would never be displayed beside it (lowest id wins the fallback). The CSV-only screens are exercised by feature tests and by the manual handoff on a fresh database with `.larapilot/client-materials/Activities (1).csv`
  - `php artisan migrate:fresh --seed` must still succeed (verified in TASK-06)

  ## Test Strategy
  - Bar: `NORMAL` — PHPUnit feature and unit tests (`php artisan make:test --phpunit`), no Playwright, Dusk, or browser suites
  - Every test touching the import or the dashboard sets `Http::preventStrayRequests()` and fakes Strava where a sync runs (`.ai/rules/tests.md`); signed-in owners come from `allowlistedAthlete()` / `allowlistAthletes()`
  - Interleaved: TASK-01 ships unit/feature tests for the target resolution, the CSV-only athlete, and the fingerprint; TASK-02 rewrites `GarminImportAccessTest` for open access (reachability, CSRF in the stack, throttle, 5 MB); TASK-03 is Anne's guest-flow suite (both fixtures into the displayed athlete and into a new CSV-only athlete, two isolated guest sessions, no Strava request and untouched tokens, concurrent first import, target change mid-review, owner flow unchanged); TASK-04 covers `SyncStatus::forCsvOnly`, `ResolveSyncStatus`, the dashboard with a CSV-only athlete, and the nightly sync skip without logs; TASK-05 covers the entry points on the dashboard and connect screen
  - Superseded assertions are rewritten, not deleted silently: `GarminImportAccessTest::test_a_guest_get_is_redirected_home`, `test_a_guest_post_is_refused_with_nothing_written`, `PublicDashboardTest::test_the_fallback_page_keeps_noindex_the_attribution_and_no_garmin_entry_point`, and `test_the_owner_sees_the_import_garmin_csv_entry_point_and_guests_do_not` now assert the US-011 behavior
  - Manual test handoff (TASK-06): the spec's Demonstrates walk-through at 375 / 768 / 1280 px, light and dark
  - Quality gate: `php artisan larapilot:quality` (Pint + Larastan level 5) and `vendor/bin/pint --dirty --format agent` before every commit

  ## Domain Docs
  - `garmin-csv-import.md` — open access, target resolution, CSV-only athlete, instance-wide lock, fingerprint carries the target (TASK-01, TASK-02)
  - `activity-sync.md` — a CSV-only athlete is never selected by `strava:sync`, nothing is logged (TASK-04)
  - `heatmap-dashboard.md` — CSV-only sync status, entry points for every visitor and on the connect screen (TASK-04, TASK-05)
  - `strava-connection.md` — the displayed athlete may be a CSV-only athlete; `redirectGuestsTo` no longer serves a route (TASK-02)
  - `README.md` index rows refreshed in each task that touches a file

  ## Rework (2026-10-12) — mask stored-run details for guests

  Review feedback (Robert + Lars, Medium): with the import open, a guest can upload crafted rows within ±2 minutes of stored runs and the conflict review discloses the displayed athlete's activity name, distance, moving time and Strava link (private activities included) without confirming anything. Owner decision (decision journal, topic `guest conflict review disclosure`, 2026-10-12): **mask it**.

  - **One switch, decided once.** `ShowGarminImportReviewController` passes `showsStoredRunDetails` (`$request->user() !== null`) to `garmin.review`, with a `/* … */` block stating why: the import target of a signed-in owner is always their own athlete, a guest's is someone else's. Blade branches on the flag only — no `@auth`/`@guest`, no `auth()` in the view. The confirm path re-renders through the same controller (stale/lock redirects), so it inherits the flag.
  - **Masked cell (guest).** The "Stored" `<td>` keeps `data-label="Stored"` and the `.side` list with the single `Start` row (stored `start_date_local`, so the visitor can tell which clash is which), then `<p class="side-source">Clashes with a stored run</p>`. No name, distance, moving time, Strava link, or source label ("Strava" / "Garmin import"). The Garmin-file side, the row header (the file's own run name), the `<fieldset>` legend (file data), and Overwrite/Skip are unchanged. Signed-in owner: byte-identical to today.
  - **What is still visible to a guest, on purpose:** the existence and start time of a stored run that clashes with a row they uploaded, and the tally counts — needed to make an informed Overwrite/Skip choice, and already implied by the accepted "anyone can import/overwrite" risk. Recorded as the invariant in `garmin-csv-import.md`.
  - **FR-009 on the masked cell:** same tokens and classes, no new CSS; at 375 px the stacked card keeps Stored/Garmin side by side at 49 %; light and dark via the existing variables.
  - DONE tasks TASK-00…TASK-06 are preserved. TASK-07 (Fix) ships the mask with its tests and docs in one commit; TASK-08 (Anne) re-runs the full suite and the quality gate and extends the manual handoff.
