  -
    id: TASK-04
    title: 'Sync status and nightly sync for a CSV-only athlete'
    body: |-
      ## Description
      A CSV-only athlete shows no stale or failed sync warning; its status reflects the latest import (FR-007), and the nightly sync skips it without logging an error or warning (FR-002, FR-018).

      ## Files Involved
      - `app/Enums/SyncHealth.php` (new case `CsvOnly`; docblock: five states)
      - `app/Data/SyncStatus.php` (named constructor `forCsvOnly(?CarbonInterface $lastImportedAt, int $runsInWindow, CarbonInterface $now)`; `needsWarning()` false and `showsSkeleton()` false for it; every string stays here: `chipLabel()` "Imported {relative}", `detailHeading()` "Sync" / "Import", `lastRunHeading()` "Last run" / "Last import", `lastRunLabel()` in the sync timezone, `outcomeLabel()` "Garmin CSV", `emptyWindowNote()` — "…after your next activity syncs." vs "…after your next import.")
      - `app/Support/Sync/ResolveSyncStatus.php` (branch on `$athlete->isCsvOnly()`: no `sync_runs` query; latest import = `max(updated_at)` of the athlete's `garmin_csv` activities; block comment on why sync_runs are ignored and on the re-import trade-off)
      - `resources/views/components/sync-detail.blade.php`, `resources/views/dashboard.blade.php` (headings and the empty-window line read from `SyncStatus`; markup unchanged otherwise)
      - `app/Console/Commands/SyncStravaActivities.php` (no logic change expected — `connectedAthletes()` already requires a Strava id and both tokens; docblock names the CSV-only athlete)
      - `tests/Unit/Data/SyncStatusTest.php`, `tests/Unit/Support/Sync/ResolveSyncStatusTest.php`, `tests/Feature/Dashboard/SyncStatusTest.php`, `tests/Feature/Strava/SyncStravaActivitiesCommandTest.php` (extended)
      - `.larapilot/docs/devs/heatmap-dashboard.md`, `.larapilot/docs/devs/activity-sync.md`, `.larapilot/docs/devs/README.md`

      ## Steps
      1. Add the enum case and `SyncStatus::forCsvOnly()`; keep existing states' copy byte-identical
      2. Branch `ResolveSyncStatus`; the CSV-only path runs two queries (the window count it already runs, plus one `max('updated_at')` on `activities` filtered by `user_id` and `source`)
      3. Move the hard-coded `Sync` / `Last run` / empty-window strings into `SyncStatus` so Blade stays markup-only
      4. Tests — unit: a CSV-only status never warns, never shows the skeleton, labels "Imported 3 hours ago" / "Last import" / "Garmin CSV"; resolver: a CSV-only athlete ignores a **failed** and a **stale** `sync_runs` history; feature: `GET /` for a displayed CSV-only athlete with a failed sync run on record renders the map, the chip "Imported …", no `role="alert"`, and writes nothing / sends nothing; command: with only a CSV-only athlete stored the command exits success, writes no `sync_runs` row, and `Log` receives no warning or error; with a connected athlete plus a CSV-only one only the connected athlete is fetched and the CSV-only runs are untouched
      5. `php artisan test --compact tests/Unit/Data tests/Unit/Support/Sync tests/Feature/Dashboard tests/Feature/Strava/SyncStravaActivitiesCommandTest.php`
      6. Smoke the dashboard at 375 / 768 / 1280 px in light and dark with a CSV-only athlete (Herd URL via Boost `get-absolute-url`)
      7. `vendor/bin/pint --dirty --format agent`

      ## Completion Criteria
      - [x] A CSV-only athlete shows no stale or failed warning; the chip and detail card reflect the latest import
      - [x] Existing sync states render exactly as before
      - [x] The nightly sync skips a CSV-only athlete with no error or warning logged
      - [x] Viewing a CSV-only athlete signed out writes nothing and calls no one
      - [x] UI usable at mobile/tablet/desktop, light and dark (manual smoke)
      - [x] Tests pass

      ## Test Data
      - N/A — no model/schema changes; tests use `UserFactory::csvOnly()` (TASK-01) and `SyncRunFactory` states

      ## Domain Docs
      - [x] `.larapilot/docs/devs/heatmap-dashboard.md` — `Functional flow` (CSV-only status branch), `Technical design` (`SyncHealth::CsvOnly`, `forCsvOnly()`), `Architectural choices` (derived `max(updated_at)` vs a `garmin_imported_at` column — rejected, no migration; ignoring instance-wide `sync_runs` for a CSV-only athlete), `Key decisions & invariants` (a re-import that changes nothing does not move the stamp)
      - [x] `.larapilot/docs/devs/activity-sync.md` — a CSV-only athlete is never selected by `strava:sync` and nothing is logged for it
      - [x] Folder `README.md` index rows updated (`US-011`)
      - [x] English, committed with this task

