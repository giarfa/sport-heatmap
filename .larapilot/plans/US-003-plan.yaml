    id: TASK-08
    title: 'Cover the sync command end to end and its schedule registration'
    body: |-
      ## Description
      Add PHPUnit coverage for `strava:sync` against a faked Strava API — the demonstration the spec asks for (populate, re-run unchanged, edit and delete upstream) plus the `sync_runs` and exit-code contract, and assert the schedule registration.

      ## Files Involved
      - tests/Feature/Strava/SyncStravaActivitiesCommandTest.php (new)
      - tests/Feature/Console/ScheduleTest.php (new)

      ## Steps
      1. `php artisan make:test --phpunit SyncStravaActivitiesCommandTest`; `use RefreshDatabase`; `setUp()` sets `Http::preventStrayRequests()` and zero backoff; athletes from `allowlistedAthlete()`.
      2. Command cases, driven with `$this->artisan('strava:sync')`:
         - a faked two-page response populates the window; assert the row count, that a ride in the payload was not stored, and that the `sync_runs` row is `succeeded` with the right counts
         - running it a second time against the identical response reports `0 / 0`, leaves every `updated_at` untouched, and writes a second `sync_runs` row — the spec's "running it twice changes nothing"
         - an activity edited upstream (distance corrected) propagates on the next run; one deleted upstream disappears
         - `500` on every attempt: `assertExitCode(Command::FAILURE)`, the `sync_runs` row is `failed` with the status in `error_message` and no token anywhere in it, and the activities table is **unchanged** from before the run
         - a rejected refresh token surfaces as a failed run with a reconnect message, not an unhandled exception
         - no connected athlete: exit `SUCCESS`, no `sync_runs` row written
         - an athlete whose id is no longer on the allowlist is skipped
         - a crashed run leaves the `running` row visible: assert the row exists with `status = running` and `finished_at = null` at the point the client throws an unhandled error
      3. `php artisan make:test --phpunit ScheduleTest` — resolve `Illuminate\Console\Scheduling\Schedule` from the container and assert over `events()`: exactly one event whose command contains `strava:sync`, expression `0 3 * * *` for the default hour, and the configured timezone. Add a case that sets `strava.sync_hour` to a different value and asserts the expression follows it, so the configuration is proven load-bearing rather than decorative.
      4. `php artisan test --compact tests/Feature/Strava/SyncStravaActivitiesCommandTest.php tests/Feature/Console/ScheduleTest.php`, then the full `php artisan test`

      ## Completion Criteria
      - [ ] The spec's demonstration is covered: populate, re-run unchanged, upstream edit, upstream delete
      - [ ] Failure covered: non-zero exit, failed `sync_runs` row, untouched activities table
      - [ ] The schedule is asserted for both the command and the configured hour/timezone
      - [ ] No test reaches the network
      - [ ] Full `php artisan test` is green

      ## Git Deliverables
