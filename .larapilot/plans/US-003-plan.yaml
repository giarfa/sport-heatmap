    id: TASK-07
    title: 'Add the strava:sync command, its sync_runs lifecycle and the daily schedule'
    body: |-
      ## Description
      Add the Artisan command the README already documents, wire it to the client and the reconciliation Action, record every attempt in `sync_runs`, and register it to run once a day at the configured hour and timezone.

      ## Files Involved
      - app/Console/Commands/SyncStravaActivities.php (new)
      - routes/console.php

      ## Steps
      1. `php artisan make:command SyncStravaActivities --no-interaction`; signature `strava:sync`, description naming the 112-day reconciliation. Collaborators are constructor-promoted `private readonly` (`StravaClient`, `ReconcileStravaWindow`).
      2. Resolve the athletes to sync: connected (`strava_athlete_id` and tokens present) **and** still on the allowlist via `AthleteAllowlist` — an athlete removed from `.env` must stop being synced, the same rule `EnsureFreshStravaToken` enforces on the web. Block comment recording that.
      3. No connected athlete → print a clear line, write **no** `sync_runs` row, exit `SUCCESS`. Block comment: a fabricated "succeeded, 0/0" row would tell US-006's indicator that a sync happened when none did, and "never synced" is a first-run state that spec renders deliberately.
      4. Otherwise: create the `sync_runs` row with `started_at = now()` and `status = SyncRunStatus::Running` **before** the first request, so a crashed process leaves visible evidence rather than nothing.
      5. Per athlete: `$window = HeatmapWindow::current()`, fetch through `StravaClient::activitiesInWindow()`, then apply through `ReconcileStravaWindow`, aggregating `SyncOutcome`s. All fetching for one athlete completes before its reconcile — that ordering is what makes "no half-applied window" true.
      6. Success: update the row with `finished_at`, `status = Succeeded`, the aggregated counts, `error_message = null`; print a one-line summary; return `SUCCESS`.
      7. Failure — catch `StravaApiException` and `StravaReconnectRequiredException`: update the row with `finished_at`, `status = Failed`, counts `0`, and `error_message` set to the exception message (status and rate-limit headers only — `.ai/rules/app.md` forbids credentials in logs, and this string is rendered on the dashboard by US-006). `Log::warning` with the athlete id and the reason, never a token. Return `Command::FAILURE` so the scheduler's `onFailure` and any cron mail see a non-zero exit.
      8. `routes/console.php` — register with the `Schedule` facade:
         `Schedule::command('strava:sync')->dailyAt(sprintf('%02d:00', (int) config('strava.sync_hour')))->timezone((string) config('strava.sync_timezone'))->withoutOverlapping();`
         Block comment: `withoutOverlapping()` because a run that outlives its window would otherwise overlap the next day's, and two concurrent reconciles of the same window race on the delete pass.
      9. Leave a clearly marked comment at the success point identifying it as the seam where US-004 will invalidate the cached grid — no cache key is invented here.
      10. `php artisan schedule:list` to confirm the registration, then `php artisan larapilot:quality`

      ## Completion Criteria
      - [ ] `php artisan strava:sync` reconciles the 112-day window and prints a summary
      - [ ] `php artisan schedule:list` shows the command daily at the configured hour in the configured timezone
      - [ ] Every attempt writes exactly one `sync_runs` row: running → succeeded or failed, with counts and an error message
      - [ ] A failure exits non-zero and leaves the window untouched
      - [ ] An athlete removed from the allowlist is not synced
      - [ ] No token value reaches `sync_runs.error_message` or the log
      - [ ] Pint and Larastan level 5 pass

      ## Test Data
      - N/A — no schema change. `SyncRunFactory` already provides the `running()`, `failed()` and `stale()` states TASK-08 needs.

      ## Git Deliverables
      - Commit: `feat(US-003): TASK-07 add the daily strava:sync command and its schedule`
      - Push: **skip** (`git_mode: GITFLOW`)
      - PR: update the local PR notes
