    id: TASK-01
    title: 'Define the 112-day window and the Strava API client configuration'
    body: |-
      ## Description
      Give the 112-day window one canonical definition that US-003, US-004 and US-005 all read, and add the Strava API settings the sync client needs — endpoints and page size as literals, retry behaviour as overridable configuration.

      ## Files Involved
      - config/heatmap.php (new)
      - config/strava.php
      - app/Support/Heatmap/HeatmapWindow.php (new)

      ## Steps
      1. `config/heatmap.php`: `window_weeks => 16` as a **literal** with a block comment stating why it is not an `env()` lookup — the grid is 16 rows by product definition (FR-004), and an environment file must not be able to change the span the percentile scale calibrates against. Follow the commenting style of `config/strava.php`.
      2. `config/strava.php`, appended in the existing section style:
         - `api_base_url => 'https://www.strava.com/api/v3'` — **literal**, same reasoning as `token_url`: pointing it elsewhere would send a live bearer token to another host
         - `activities_per_page => 200` — literal; Strava's maximum page size, the value that makes "paginate until the response is short" cheap
         - `max_activity_pages => 10` — literal safety stop, so a Strava change that never returns a short page cannot spin forever
         - `retry_attempts => 3` and `retry_backoff_ms => [1000, 2000, 4000]` — literals, overridden to `[0, 0, 0]` by tests via `Config::set()`
      3. `app/Support/Heatmap/HeatmapWindow.php` — `final readonly` class in the `App\Support\Heatmap` namespace (`.ai/rules/app.md`: sub-namespace per domain, matching `App\Support\Strava`):
         - `public function __construct(public CarbonImmutable $startsOn, public CarbonImmutable $endsOn)`
         - `public static function current(?CarbonInterface $today = null): self` — `startsOn` = start of the ISO week (Monday) of today, minus `window_weeks - 1` weeks; `endsOn` = end of that ISO week (Sunday). Both at start of day.
         - `public function contains(CarbonInterface $date): bool` — inclusive on both ends, compared as dates
         - `public function afterTimestamp(): int` — `startsOn` as a UTC epoch, for the Strava `after` query parameter
         - `public function days(): int` — asserts the 112 the spec names, and gives US-004 its row count source
         - Block comment on `current()` recording that the window is anchored to the ISO week rather than to "today minus 112 days", because the grid's bottom row must always be the current, in-progress week
      4. `php artisan larapilot:quality`

      ## Completion Criteria
      - [ ] `HeatmapWindow::current()` returns a Monday start and a Sunday end spanning exactly 112 days
      - [ ] `window_weeks`, the API base URL and the page size are literals — no new `env()` keys, so `.env.example` is unchanged
      - [ ] `contains()` is inclusive at both ends and ignores time of day
      - [ ] Pint and Larastan level 5 pass

      ## Test Data
      - N/A — no model or schema changes in this task

      ## Git Deliverables
      - Commit: `feat(US-003): TASK-01 add the heatmap window and Strava API configuration`
      - Push: **skip** (`git_mode: GITFLOW`)
      - PR: update the local PR notes
    type: Impl
    status: TODO
    assignee: Alex
    estimate_hours: 1.5
    dependencies:
      - TASK-00
  -
    id: TASK-02
    title: 'Add the StravaActivity DTO with run-only filtering at the boundary'
    body: |-
      ## Description
      Carry a Strava activity across the API boundary as a readonly DTO, doing every defensive cast and the run-only filter in one place, so no raw Strava array reaches the reconciliation Action or Eloquent (`.ai/rules/data.md`).

      ## Files Involved
      - app/Data/StravaActivity.php (new)

      ## Steps
      1. `final readonly class StravaActivity` in `App\Data`, mirroring `StravaTokens`: promoted public properties `stravaActivityId` (int), `sportType` (`SportType`), `name` (string), `distanceMeters` (int), `movingTimeSeconds` (int), `startDateLocal` (`CarbonImmutable`), `activityDate` (`CarbonImmutable`).
      2. `public static function fromApiPayload(array $payload): ?self` — named static factory, returns `null` when the payload is not a storable running activity:
         - `sport_type` missing, non-string, or not in `SportType::values()` → `null` (FR-003: discarded at sync time, never persisted). Fall back to the legacy `type` key only if `sport_type` is absent, and document why in a block comment.
         - `id` missing or non-numeric → `null`; a payload without an identity cannot be upserted
         - `start_date_local` missing or not a `Y-m-d\TH:i:s\Z` string → `null`
         - `distance` → `(int) round(...)`; Strava sends metres as a float and the column is an integer (FR-003)
         - `moving_time` → `(int)`, defaulting to `0`
         - `name` → cast defensively, trimmed, empty string falls back to `'Run'` (the column is `NOT NULL`)
      3. Date handling — the load-bearing detail. Block comment inside the factory: Strava labels `start_date_local` with a `Z` although it is already the athlete's wall-clock time, so `Carbon::parse()` plus an app timezone would silently move a late-evening run to the next day. Build `startDateLocal` with `CarbonImmutable::createFromFormat('Y-m-d\TH:i:s\Z', $raw, 'UTC')` and take `activityDate` from `substr($raw, 0, 10)` — no conversion is ever applied.
      4. `public function toAttributes(): array` — the exact attribute array `ReconcileStravaWindow` writes, with an `@return array{...}` shape for Larastan.
      5. `@param array<string, mixed> $payload` docblocks throughout; `php artisan larapilot:quality`

      ## Completion Criteria
      - [ ] Non-running sport types return `null` and can never reach persistence
      - [ ] Distances are integer metres; `activity_date` is derived from the raw local date string with no timezone conversion
      - [ ] A malformed or identity-less payload returns `null` instead of throwing — one bad row must not fail the whole run
      - [ ] Pint and Larastan level 5 pass

      ## Test Data
      - N/A — no model or schema changes in this task

      ## Git Deliverables
      - Commit: `feat(US-003): TASK-02 add the StravaActivity DTO with run-only filtering`
      - Push: **skip** (`git_mode: GITFLOW`)
      - PR: update the local PR notes
    type: Impl
    status: TODO
    assignee: Alex
    estimate_hours: 1.5
    dependencies:
      - TASK-00
  -
    id: TASK-03
    title: 'Add StravaClient with pagination, backoff and mid-sync token refresh'
    body: |-
      ## Description
      Add the authenticated HTTP wrapper the PRD names in `### Core Components`: it is the only class that talks to the Strava activities API, and it owns the access token, pagination, retry/backoff, and the `401`-mid-sync refresh.

      ## Files Involved
      - app/Services/Strava/StravaClient.php (new)
      - app/Exceptions/Strava/StravaApiException.php (new)
      - app/Actions/Strava/EnsureFreshAccessToken.php

      ## Steps
      1. `StravaApiException extends RuntimeException` in `App\Exceptions\Strava`, alongside `StravaOAuthException` and in its style — named constructors `requestFailed(int $status, ?string $rateLimitUsage)`, `unreachable(ConnectionException $previous)`, `malformedResponse()`. Per `.ai/rules/app.md`, messages carry **status and rate-limit headers only** — never a token, never a response body, never a reused Guzzle message that embeds the request URL. Chain the previous exception.
      2. `EnsureFreshAccessToken::__invoke(User $user, ?string $rejectedToken = null)`:
         - Refresh when `needsRefresh($user)` **or** `$rejectedToken !== null && $rejectedToken === (string) $this->readToken($user, 'strava_access_token')`
         - Extract that condition into a private `mustRefresh(User $user, ?string $rejectedToken): bool` used both before and after the lock, so the existing post-lock re-read still short-circuits: a caller whose token was already rotated by another process finds a token different from the rejected one and returns it without a second refresh
         - Add a block comment recording why the rejected token — rather than a `bool $force` — is the argument: `force` would re-refresh unconditionally after the lock and retire the refresh token the winner just stored, which is the exact race this Action exists to prevent
         - The docblock line reserving this seam for US-003 is now satisfied; update it to describe the argument
      3. `StravaClient` in `App\Services\Strava`, constructor-promoted `private readonly EnsureFreshAccessToken $ensureFreshAccessToken`:
         - `public function activitiesInWindow(User $user, HeatmapWindow $window): array` — returns `array<int, StravaActivity>`
         - Loop pages from 1: `GET {api_base_url}/athlete/activities` with `after` = `$window->afterTimestamp()`, `per_page` = `strava.activities_per_page`, `page` = n. Stop when a page returns fewer items than the page size, when a page is empty, or at `strava.max_activity_pages` (log a warning at the cap — hitting it means the window assumption is wrong).
         - Map each item through `StravaActivity::fromApiPayload()`, dropping `null`s, then keep only activities whose `activityDate` satisfies `$window->contains(...)`
         - Timeouts in the same shape as `StravaOAuth`: `connectTimeout(5)`, `timeout(15)` — this runs in a scheduled command, not in front of a browser, so the read timeout is a little more generous
      4. Retry, using Laravel 13's `retry(int $times, array|int $sleepMilliseconds, callable $when, bool $throw)`:
         - `retry(config('strava.retry_attempts'), config('strava.retry_backoff_ms'), $when, throw: false)`
         - `$when(Throwable $e, PendingRequest $request)`: retry on `ConnectionException`; on a `RequestException` retry when the status is `429` or `>= 500`; on `401`, call `($this->ensureFreshAccessToken)($user, rejectedToken: $currentToken)`, set the new bearer with `$request->withToken($fresh)`, update the tracked token, and retry **once** — Laravel's documented pattern for re-authenticating inside a retry
         - Guard the `401` branch so it can only fire once per page: a token that is fresh and still rejected means the authorisation is gone, and retrying is a loop
         - After the loop, a still-failed response throws `StravaApiException::requestFailed($response->status(), $response->header('X-RateLimit-Usage'))`. 🔗 Matt: recording `X-RateLimit-Limit` / `X-RateLimit-Usage` here is how the allowance this application actually has becomes visible in `sync_runs.error_message`, without hardcoding a number the PRD deliberately leaves open.
         - Catch `ConnectionException` around the send and rethrow as `StravaApiException::unreachable()`, mirroring `StravaOAuth::postToTokenEndpoint()`
         - Let `StravaReconnectRequiredException` from the refresh propagate untouched — the command turns it into a failed `sync_runs` row
      5. `php artisan larapilot:quality`

      ## Completion Criteria
      - [ ] One `after`-filtered pass paginates at `per_page=200` and stops on the first short page
      - [ ] `429` and `5xx` are retried with the configured backoff; an exhausted retry raises `StravaApiException` carrying the status and the rate-limit headers
      - [ ] A `401` mid-sync refreshes the token and re-sends the same page once; a second `401` after a fresh token fails instead of looping
      - [ ] No token value, response body, or request URL appears in any exception message or log line
      - [ ] The existing `EnsureFreshAccessToken` tests still pass unchanged — the new argument is optional and the lock semantics are untouched
      - [ ] Pint and Larastan level 5 pass

      ## Test Data
      - N/A — no model or schema changes in this task

      ## Git Deliverables
      - Commit: `feat(US-003): TASK-03 add StravaClient with pagination, backoff and mid-sync refresh`
      - Push: **skip** (`git_mode: GITFLOW`)
      - PR: update the local PR notes
    type: Impl
    status: TODO
    assignee: Alex
    estimate_hours: 3
    dependencies:
      - TASK-01
      - TASK-02
  -
    id: TASK-04
    title: 'Cover the Strava client: pagination, backoff, refresh mid-sync and filtering'
    body: |-
      ## Description
      Add PHPUnit coverage for `StravaClient` and `StravaActivity` against a faked Strava API — the pagination, retry and refresh behaviour the acceptance criteria name explicitly.

      ## Files Involved
      - tests/Feature/Strava/StravaClientTest.php (new)
      - tests/Unit/Data/StravaActivityTest.php (new)

      ## Steps
      1. `php artisan make:test --phpunit StravaClientTest` and `php artisan make:test --phpunit --unit StravaActivityTest`; move them under the `Strava` / `Data` subdirectories to match the existing layout.
      2. `setUp()` per `.ai/rules/tests.md`: `Http::preventStrayRequests()`, `Config::set('strava.retry_backoff_ms', [0, 0, 0])` so the backoff path is exercised without a sleeping suite. Athletes come from `allowlistedAthlete()`.
      3. A private `stravaActivityPayload(array $overrides = []): array` helper builds API-shaped payloads — do not add these shapes to `database/factories`.
      4. `StravaClientTest` cases:
         - a full page followed by a short page issues exactly two requests and returns both pages' activities; assert the `after`, `per_page=200` and `page` query values with `Http::assertSent()`
         - a single short page issues exactly one request
         - non-running sport types in the response are absent from the returned array
         - an activity dated before `HeatmapWindow::current()->startsOn` is filtered out even though Strava returned it
         - `429` then `200` returns the activities and sends two requests
         - `500` on every attempt raises `StravaApiException`, having attempted `retry_attempts` times, and the message carries the status and the rate-limit header but **no** token
         - `401` then `200`: the refresh endpoint is faked, the retry re-sends with the rotated bearer (assert the `Authorization` header changed between attempts), and the rotated pair is persisted
         - `401` twice with a freshly refreshed token fails instead of looping
         - the `max_activity_pages` cap stops the loop when every page comes back full
      5. `StravaActivityTest` cases: run-only filtering including the legacy `type` fallback; float metres round to integer; a `23:40Z` local start attributes to that same calendar day under a non-UTC `app.timezone` (`Config::set('app.timezone', 'Australia/Sydney')`) — the regression this DTO exists to prevent; malformed and identity-less payloads return `null`.
      6. `php artisan test --compact tests/Feature/Strava/StravaClientTest.php tests/Unit/Data/StravaActivityTest.php`

      ## Completion Criteria
      - [ ] Pagination, `429` backoff, `5xx` exhaustion, `401` refresh-and-retry, and sport/window filtering are all covered
      - [ ] No test reaches the network — `preventStrayRequests()` is set in `setUp()`
      - [ ] The suite adds no measurable wall-clock time from backoff sleeps
      - [ ] `php artisan test` is green

      ## Git Deliverables
      - Commit: `test(US-003): TASK-04 cover the Strava client and activity DTO`
      - Push: **skip** (`git_mode: GITFLOW`)
      - PR: update the local PR notes
    type: Test
    status: TODO
    assignee: Anne
    estimate_hours: 2.5
    dependencies:
      - TASK-03
  -
    id: TASK-05
    title: 'Add ReconcileStravaWindow: transactional upsert and delete-on-absence'
    body: |-
      ## Description
      Add the Action that applies a fetched window to the database in one transaction: upsert on `strava_activity_id`, delete local activities inside the window that Strava no longer returns, and report the counts.

      ## Files Involved
      - app/Actions/Strava/ReconcileStravaWindow.php (new)
      - app/Data/SyncOutcome.php (new)

      ## Steps
      1. `SyncOutcome` — `final readonly` class in `App\Data`: `public function __construct(public int $upserted, public int $deleted)` plus `public function plus(self $other): self` so the command can aggregate across athletes. It sits in `App\Data` as the counterpart of the inbound DTO — note in its docblock that it is a result object, not an external payload.
      2. `ReconcileStravaWindow` — invokable Action per `.ai/rules/actions.md`: one job, `__invoke(User $user, HeatmapWindow $window, array $activities): SyncOutcome`, no authorization check (the command has already resolved which athletes may sync), no HTTP of its own.
      3. Inside a single `DB::transaction`:
         - Upsert each activity through the relation — `$user->activities()->updateOrCreate(['strava_activity_id' => $activity->stravaActivityId], $activity->toAttributes())` — so ownership comes from the relation, never from a mass-assigned `user_id` (`.ai/rules/models.md`, and the block comment already on `Activity`)
         - Count as upserted only what actually changed: `wasRecentlyCreated || wasChanged()`. Block comment on why: `updateOrCreate` on an unchanged row issues no `UPDATE`, and counting it anyway would report daily churn that never happened and make the idempotency criterion untestable from `sync_runs`.
         - Delete: `$user->activities()->whereBetween('activity_date', [$window->startsOn, $window->endsOn])->whereNotIn('strava_activity_id', $seenIds)->delete()`, capturing the affected count. Block comment: the window bounds are what keep this from deleting the athlete's history outside the visible range, and `$seenIds` must come from the **complete** fetch — reconciling page by page would delete everything not on the current page.
         - Guard the empty-`$seenIds` case explicitly: an empty response is a legitimate "no runs in 16 weeks" and must delete the whole window, so `whereNotIn` with an empty array must not be short-circuited into a no-op by accident. Cover it in TASK-06.
      4. Return `new SyncOutcome($upserted, $deleted)`.
      5. `php artisan larapilot:quality`

      ## Completion Criteria
      - [ ] Upsert keys on `strava_activity_id` and propagates changed distance, name and sport type
      - [ ] Local activities inside the window absent from the fetch are deleted; activities outside the window are untouched
      - [ ] The upserted count reflects real changes only, so a second identical run reports `0 / 0`
      - [ ] All writes happen in one transaction — a throw mid-apply leaves the window exactly as it was
      - [ ] `user_id` is never mass-assigned; writes go through the `activities()` relation
      - [ ] Pint and Larastan level 5 pass

      ## Test Data
      - N/A — no schema change. The existing `ActivityFactory` (`onDate()`, `trailRun()`, `virtualRun()`) covers every fixture TASK-06 needs; no factory or seeder edit is required.

      ## Git Deliverables
      - Commit: `feat(US-003): TASK-05 add the transactional window reconciliation`
      - Push: **skip** (`git_mode: GITFLOW`)
      - PR: update the local PR notes
