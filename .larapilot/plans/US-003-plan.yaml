code: US-003
plan_body: |-
  ## Technical Solution

  US-003 turns the connected Strava account (US-002) into data. It adds one Artisan command, one HTTP client, one reconciliation Action, and the shared definition of the 112-day window — nothing else. No queue worker (PRD `### Performance & Scalability`: the run is a handful of requests and ~100 rows, well inside the default timeout), no new package, no schema change (US-001 already shipped `activities` and `sync_runs`; the PRD explicitly rejects a `daily_mileage` aggregate).

  **Layering** — `SyncStravaActivities` (command, orchestration + `sync_runs` lifecycle) → `StravaClient` (all HTTP: token, pagination, retry) → `ReconcileStravaWindow` (all persistence: one transaction, upsert + delete-absent). `App\Data\StravaActivity` carries the payload across the boundary so no Strava array shape reaches the Action or Eloquent, per `.ai/rules/data.md`. Each layer is independently testable against `Http::fake()`, which is what the acceptance criteria ask for.

  ### The window — one definition, two specs

  📐 John: the 112-day window is not the sync's private concept — US-004 renders exactly the same span and US-005 computes percentiles over it. It gets **one** home now, before two specs invent their own week arithmetic and drift by a day:

  - `config/heatmap.php` → `window_weeks => 16` as a **literal**, not `env()` (`.ai/rules/config.md`: product invariants are literals — the grid is 16 rows by definition, an environment file must not be able to make it 12).
  - `App\Support\Heatmap\HeatmapWindow` — a `final readonly` value object with `HeatmapWindow::current()`: `startsOn` = `startOfWeek(today)` minus 15 weeks (ISO-8601 Monday), `endsOn` = `endOfWeek(today)` (Sunday), plus `contains(CarbonInterface $date): bool` and `afterTimestamp(): int` for the Strava `after` parameter. US-004 consumes the same object.

  ### Date attribution — no timezone math at all

  🗄️ Mike: Strava returns `start_date_local` as an ISO-8601 string with a misleading `Z` suffix — it is already the athlete's local wall-clock time, not UTC. Parsing it with `Carbon::parse()` and letting the app timezone touch it is exactly how a 22:30 run lands on the wrong day. `activity_date` is therefore taken from the **first ten characters of the raw string**, and `start_date_local` is built with an explicit `createFromFormat(..., 'UTC')` so nothing converts it. That is what makes the AC "attribution does not depend on server timezone" literally true rather than approximately true.

  ### Reconciliation — fetch everything, then apply once

  All pages are collected in memory **before** a single write happens, and the upsert + delete run inside one `DB::transaction`. Two acceptance criteria fall out of that ordering: a retry exhausted on page 3 leaves no half-applied window (nothing was written yet), and the delete-absent set is computed against the complete response rather than against a partial one — reconciling page by page would delete every activity that happened to be on page 2.

  Idempotency is a property of `updateOrCreate`, not of a guard: when every attribute matches, Eloquent finds no dirty attributes and issues no `UPDATE`, so `updated_at` does not move. The second consecutive run is byte-identical, and the test asserts that by snapshotting `updated_at` rather than by counting rows.

  ### Sport filtering

  `SportType::values()` (US-001) is the filter, applied in `StravaActivity::fromApiPayload()` at the boundary: a ride is discarded before a DTO exists for it, so no path can persist one. Note the second-order case the AC names: an activity whose sport type is *edited on Strava* from `Run` to `Ride` disappears from the response's running set and is therefore **deleted** by the delete-absent pass — not left stale.

  ### Token refresh mid-sync

  `EnsureFreshAccessToken` (US-002) already refreshes on the expiry margin, and its docblock reserved this seam. It gains one optional argument, `?string $rejectedToken`: the client passes the token Strava just answered `401` to, and the Action refreshes when the stored token is still that same rejected value. The existing distributed lock and post-lock re-read are unchanged, so the race the Action was built to prevent (two refreshes retiring each other's rotated refresh token) is not reopened — the second caller through the lock sees a token different from the rejected one and returns it. The retry hook then re-sends the page with the new bearer, which is Laravel's documented `retry(..., function (Throwable $e, PendingRequest $request))` pattern.

  ### Rate limits — 🔗 Matt

  The PRD deliberately hardcodes no quota, and this plan does not either. The strategy is unchanged: one `after`-filtered pass at `per_page=200` costs one or two requests a day, orders of magnitude below any allowance Strava currently issues. What the plan **does** add is visibility — on a `429` or an exhausted retry, the `X-RateLimit-Limit` and `X-RateLimit-Usage` response headers are recorded verbatim in the `sync_runs.error_message`, so the actual allowance for this application is discoverable from the failure itself instead of from the dashboard. The README notes that the owner should confirm the allowance in the Strava developer dashboard; no code branches on a number.

  ### Deliberately out of scope

  - **Grid cache invalidation** — the PRD's cached grid does not exist until US-004. The command's success path is the documented single seam where US-004 will hook the invalidation; US-003 does not invent a cache key for code that is not written. Flagged here for whoever plans US-004.
  - **Manual re-sync (FR-010)** and the dashboard's sync indicator (FR-007 / US-006) — this spec only guarantees that `sync_runs` is written correctly for US-006 to read.
  - **`sync_runs.user_id`** — the schema US-001 shipped has no athlete column and the PRD's data model does not include one. One row per command run, counts aggregated; correct for a single-athlete instance and not worth a migration that FR-016 ("Won't") would be the only reason for.

  ## Git & Branching

  - Mode: `GITFLOW` (from `settings.git_mode`) — branch and atomic commits, **no automatic push, no remote PR** unless explicitly requested in session.
  - Branch: `feature/US-003-strava-daily-sync` from `develop`.
  - TASK-00 bootstraps the branch and drafts the internal PR description locally.
  - One Conventional Commit per task: `type(US-003): TASK-NN summary` — never batched across tasks.
  - ⌨️ Sarah: `develop` moved after US-002 merged; rebase onto `develop` before the first code commit, and again if it drifts. She leads any conflict resolution.
  - Merge to `develop` only after human `larapilot-review` approval.

  ## Test Data Strategy

  - **No new model, no new migration, no new factory.** `ActivityFactory` (with `onDate()`, `trailRun()`, `virtualRun()`), `SyncRunFactory` (with `failed()`, `running()`, `stale()`) and `UserFactory` (`stravaConnected()`, `stravaTokenExpired()`) already cover every case this spec needs.
  - 🧪 Anne: Strava **API payloads** are test fixtures, not factory output — a private `stravaActivityPayload()` helper per test class builds them, so a change to the API shape is fixed in one place per suite and never leaks into `database/factories`.
  - `TrainingBlockSeeder` stays the canonical demo dataset; TASK-09 re-verifies `php artisan migrate:fresh --seed` still succeeds after the window object lands (the seeder's 16-week block and `HeatmapWindow` must agree on where the window starts).
  - Every test signs athletes in through `allowlistedAthlete()` / `allowlistAthletes()` from `Tests\TestCase` (`.ai/rules/tests.md`) and sets `Http::preventStrayRequests()` in `setUp()`.

  ## Test Strategy

  - Bar: **`NORMAL`** (from `settings.testing`) — PHPUnit feature and unit tests. **No** Playwright, Dusk, Pest browser, or viewport suites. This spec has no UI, so no manual test handoff is needed beyond the README's manual-run instructions.
  - Interleaved, not batched at the end: TASK-04 covers the client, TASK-06 the reconciliation, TASK-08 the command and the schedule registration.
  - Retry backoff is configuration (`strava.retry_backoff_ms`), so tests set it to `[0, 0, 0]` with `Config::set()` — the backoff path is exercised without a suite that sleeps for seconds.
  - Acceptance-criteria coverage map:

  | Acceptance criterion | Covered by |
  | --- | --- |
  | Scheduled once daily at configured hour/timezone | TASK-08 — asserts the registered event's expression, timezone and command |
  | Full 112-day window, `after`, pagination at max page size | TASK-04 (pagination, `after` value, page size) |
  | Running sport types only | TASK-04 (DTO filter) + TASK-06 (nothing else persisted) |
  | Integer metres; date from Strava local start | TASK-04 (rounding) + TASK-06 (late-evening run attribution) |
  | Upsert on `strava_activity_id` | TASK-06 (changed distance, name, sport type) |
  | Delete-on-absence inside the window | TASK-06 (absent activity deleted; activity outside the window untouched) |
  | Idempotent across two runs | TASK-06 (`updated_at` unmoved) + TASK-08 (double command run) |
  | `sync_runs` row per run with counts and error | TASK-08 (success and failure rows) |
  | `429`/`5xx` retried with backoff; exhausted retry fails, exits non-zero, no half-applied window | TASK-04 (retry + exhaustion) + TASK-08 (exit code, empty tables, failed row) |
  | Token refresh mid-sync | TASK-04 (`401` → refresh → retry succeeds) |

  ## Quality Gate

  `php artisan larapilot:quality` (Pint + Larastan level 5) must pass before each `task-done`. 👾 Andrew: Larastan level 5 with no IDE helper means every new class carries full docblocks and array-shape annotations for the Strava payloads — `.ai/rules/models.md` applies to the models already in place, and the same discipline applies to the new DTO's `@param array{...}` shapes.
