      ## Description
      The README currently states that the sync command does not exist yet. Replace that with how it actually behaves, and record the rate-limit check the PRD leaves to the owner.

      ## Files Involved
      - README.md
      - CHANGELOG.md

      ## Steps
      1. README `## Running the sync`: remove the "not implemented yet" callout and the line saying `schedule:list` reports nothing. Document what one run does — reconciles the full 112-day window, stores only `Run` / `TrailRun` / `VirtualRun`, upserts on the Strava activity id, deletes activities removed upstream, and records the attempt in `sync_runs`. Keep the existing `php artisan strava:sync` and cron entry verbatim; add `php artisan schedule:list` as the way to confirm the daily registration.
      2. Add a short **Rate limits** note — 🔗 Matt: one run costs one or two requests, the application hardcodes no quota, and the owner should confirm the allowance issued to this application in the Strava developer dashboard. Record that a `429` is retried with backoff and that the observed `X-RateLimit-Usage` is written into `sync_runs.error_message` when a run fails, which is where to look.
      3. Confirm `.env.example` needs no change — the window, page size, endpoints and backoff are all literals; `STRAVA_SYNC_HOUR` and `STRAVA_SYNC_TIMEZONE` already exist and are now genuinely load-bearing.
      4. `CHANGELOG.md` under `Unreleased` → `Added`: the daily Strava sync command, the reconciliation of the 112-day window, and the `sync_runs` audit trail.
      5. Verify the demo dataset still stands up alongside the new window definition: `php artisan migrate:fresh --seed`, then `php artisan strava:sync` against a connected athlete with no faked API returns a recorded failure rather than a crash.
      6. `php artisan larapilot:quality` and the full `php artisan test`

