    body: |-
      ## Description
      Add PHPUnit coverage for `ReconcileStravaWindow` — the persistence half of the acceptance criteria, tested directly against DTOs so the assertions are about the database, not about HTTP.

      ## Files Involved
      - tests/Feature/Strava/ReconcileStravaWindowTest.php (new)

      ## Steps
      1. `php artisan make:test --phpunit ReconcileStravaWindowTest`; `use RefreshDatabase`; athletes from `allowlistedAthlete()`.
      2. Build `StravaActivity` DTOs through `StravaActivity::fromApiPayload()` with a local payload helper, so the tests exercise the same boundary the client uses.
      3. Cases:
         - a new activity is created with integer metres, the right `activity_date`, and `user_id` set from the relation
         - a changed distance, a rename, and a sport type changed `Run` → `TrailRun` all propagate on the second reconcile
         - an activity present locally and absent from the fetch, inside the window, is deleted
         - an activity **outside** the window is left untouched even though it is absent from the fetch
         - an activity whose sport type was edited on Strava from `Run` to `Ride` disappears from the fetch's running set and is therefore deleted — the second-order case of FR-003
         - an empty fetch clears the whole window and reports the deleted count
         - **idempotency**: reconcile the same fetch twice; assert the second call reports `0 / 0`, row count is unchanged, and every `updated_at` is byte-identical to the snapshot taken after the first call
         - a second athlete's activities are never touched by the first athlete's reconcile
         - a failure mid-apply rolls the whole transaction back — force it by reconciling a payload that violates the `strava_activity_id` unique index against another athlete's row, then assert the first athlete's window is unchanged
      4. `php artisan test --compact tests/Feature/Strava/ReconcileStravaWindowTest.php`

