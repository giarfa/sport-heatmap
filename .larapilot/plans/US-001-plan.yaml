    id: TASK-10
    title: 'Full verification pass: quality gate and clean-clone check'
    body: |
      ## Description
      Close the spec by running every gate the acceptance criteria name, over the whole repository rather than task by task.

      ## Files Involved
      - (whole repository — fixes only where a gate fails)

      ## Steps
      1. `vendor/bin/pint --format agent` — repository-wide, applying fixes.
      2. `php artisan larapilot:quality` — Pint plus Larastan level 5. Fix every reported issue; **do not lower the Larastan level** and do not add baseline entries to silence findings.
      3. `php artisan test --compact` — the full suite, not a filter.
      4. `php artisan migrate:fresh --seed` from a clean database, one final time.
      5. Re-read the acceptance criteria one by one against the working tree and confirm each is genuinely satisfied — in particular the three verify-only ones: no `daily_mileage` table, no registration routes, quality green.
      6. Confirm `git status` is clean and that `.env` and `database/database.sqlite` are untracked.
      7. Confirm one commit per task on `feature/US-001-foundation-schema-setup`, each message carrying `US-001` and its task id.
      8. Update the local internal PR description with the final task list. **Do not push** (`git_mode: GITFLOW`).
      9. Note for the reviewer: the manual test handoff from the plan's Test Strategy — following the README end to end on a clean clone — is a human step and is not covered by the suite.

      ## Completion Criteria
      - [ ] `php artisan larapilot:quality` passes (Pint + Larastan level 5, no lowered level, no new baseline)
      - [ ] `php artisan test --compact` fully green
      - [ ] `php artisan migrate:fresh --seed` succeeds from clean
      - [ ] All 13 acceptance criteria verified against the working tree
      - [ ] `.env` and `database/database.sqlite` untracked; working tree clean
      - [ ] One Conventional Commit per task on the feature branch; local PR description updated

      ## Test Data
      - N/A — verification only; no schema or factory changes expected

      ## Git Deliverables
      - Commit: `chore(US-001): TASK-10 apply quality gate fixes` (skip if no fixes were needed)
      - Push: **skip** (`git_mode: GITFLOW`)
      - PR: finalise local PR description toward `develop`
