    id: TASK-02
    title: 'Extend users with Strava identity and token columns'
    body: |
      ## Description
      Extend the existing `users` table with the Strava athlete identity and OAuth token storage, make `password` nullable, and update the `User` model and factory so the encrypted casts are exercised by the demo data.

      ## Files Involved
      - database/migrations/xxxx_add_strava_columns_to_users_table.php (new)
      - app/Models/User.php
      - database/factories/UserFactory.php

      ## Steps
      1. `php artisan make:migration add_strava_columns_to_users_table --no-interaction`
      2. In `up()`: add `strava_athlete_id` (string, nullable, unique), `strava_access_token` (**`text`**, nullable), `strava_refresh_token` (**`text`**, nullable), `strava_token_expires_at` (timestamp, nullable); change `password` to nullable via `->nullable()->change()`. Both token columns are `text` because the Eloquent `encrypted` cast produces ciphertext of unpredictable length — a `string` column would truncate it. Laravel 13 changes SQLite columns natively; no `doctrine/dbal` needed.
      3. Write a working `down()` that drops the added columns and restores `password` to non-nullable.
      4. `User` model: add the new columns to `$fillable`; in `casts()` add `'strava_access_token' => 'encrypted'`, `'strava_refresh_token' => 'encrypted'`, `'strava_token_expires_at' => 'datetime'`; add both token columns to `$hidden` alongside `password`.
      5. `UserFactory`: default state leaves the Strava columns null and `password` null (there is no password login — FR-001). Add states `stravaConnected()` (athlete id, both tokens, expiry ~6 hours out) and `stravaTokenExpired()` (expiry in the past) for the sync and refresh specs to reuse.
      6. `php artisan migrate:fresh` then `php artisan migrate:fresh --seed` — both must succeed.
      7. `vendor/bin/pint --dirty --format agent`

      ## Completion Criteria
      - [x] Migration adds `strava_athlete_id` (unique), `strava_access_token` (TEXT), `strava_refresh_token` (TEXT), `strava_token_expires_at`
      - [x] `users.password` is nullable and `down()` reverses the migration cleanly
      - [x] `User` casts both tokens as `encrypted` and hides them from serialization
      - [x] `UserFactory` has `stravaConnected()` and `stravaTokenExpired()` states producing valid records
      - [x] `php artisan migrate:fresh --seed` succeeds
      - [x] Pint clean

      ## Test Data
      - [x] `database/factories/UserFactory.php` updated in **this same task** as the migration and model
      - [x] Default state and both Strava states produce persistable users
      - [x] Seeder wiring is handled in TASK-06 (`TrainingBlockSeeder`); `DatabaseSeeder` must still run green after this task

      ## Git Deliverables
      - Commit: `feat(US-001): TASK-02 extend users with Strava identity and token columns`
      - Push: **skip** (`git_mode: GITFLOW`)
      - PR: update local PR notes
