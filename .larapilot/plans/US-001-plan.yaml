    id: TASK-09
    title: 'Add the CI workflow: tests, Pint and Larastan'
    body: |
      ## Description
      Add a single GitHub Actions workflow running the three quality gates on every push and pull request. **No deploy stage** — the PRD records the deploy target as "not defined yet", so nothing deploy-shaped enters this backlog.

      ## Files Involved
      - .github/workflows/ci.yml (new)

      ## Steps
      1. Trigger on `push` and on `pull_request` targeting `develop` and `main`.
      2. Single job on `ubuntu-latest`, `shivammathur/setup-php` at **PHP 8.4** (matching the local runtime) with the `sqlite3`, `pdo_sqlite` and `mbstring` extensions.
      3. Steps: checkout → setup PHP → cache Composer → `composer install --prefer-dist --no-interaction --no-progress` → copy `.env.example` to `.env` → `php artisan key:generate` → `touch database/database.sqlite` → `php artisan migrate --force`.
      4. Gates, each a separate step so a failure names itself in the run summary:
         - `vendor/bin/pint --test`
         - `vendor/bin/phpstan analyse --no-progress --memory-limit=1G` (level 5 from `phpstan.neon.dist` — **never lowered**)
         - `php artisan test`
         - `composer audit`
      5. Add the Vite build step (`npm ci && npm run build`) — the project has a Vite frontend and a broken build should fail CI, not the reviewer's browser.
      6. Confirm the workflow file sits alongside the existing `.github/skills/` directory without disturbing it.
      7. Validate the YAML parses (`php -r` with a YAML parse, `yamllint`, or `actionlint` if available) before committing — a malformed workflow fails silently on the forge.

      ## Completion Criteria
      - [x] `.github/workflows/ci.yml` runs on push and on PRs to `develop` and `main`
      - [x] Pint, Larastan level 5, PHPUnit, `composer audit` and the Vite build all run as distinct steps
      - [x] PHP 8.4 with SQLite extensions
      - [x] **No deploy stage present**
      - [x] YAML validated

      ## Test Data
      - N/A — CI configuration only

      ## Git Deliverables
      - Commit: `ci(US-001): TASK-09 add test, Pint and Larastan workflow`
      - Push: **skip** (`git_mode: GITFLOW`) — note the workflow will only actually execute once a remote exists and the branch is pushed
      - PR: update local PR notes
