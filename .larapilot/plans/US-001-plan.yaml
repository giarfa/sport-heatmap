    id: TASK-06
    title: 'Seed a realistic 16-week training block'
    body: |
      ## Description
      Compose the factories into a coherent 16-week demo block for one fixed athlete, so the heatmap, the intensity scale and the sync-status indicator can all be built and reviewed without ever calling Strava.

      ## Files Involved
      - database/seeders/TrainingBlockSeeder.php (new)
      - database/seeders/DatabaseSeeder.php

      ## Steps
      1. `php artisan make:seeder TrainingBlockSeeder --no-interaction`
      2. Create one fixed demo athlete via `User::factory()->stravaConnected()` with a stable name, email and `strava_athlete_id` so repeated seeds are recognisable.
      3. Generate **16 consecutive ISO weeks anchored to the current week** — the current, in-progress week is the last row; the block is computed relative to `now()` and never hard-coded, so it cannot drift out of the 112-day window over time.
      4. Shape the block so the dashboard has something worth looking at:
         - a **near-empty illness week** (0–1 activities, low distance) somewhere mid-block
         - a **peak week** (6–7 activities, the highest weekly total in the whole block)
         - the **current week partial** — activities only up to and including today, **none dated in the future** (FR-004 renders future days as out-of-range)
         - normal weeks varying between roughly 3 and 6 running days, so percentile bucketing has a real distribution to work on (FR-006)
         - two or three days with **two runs**, so FR-011 has a case to display
         - a handful of `trailRun()` and `virtualRun()` activities among the plain runs
      5. Add two or three `SyncRun` rows: at least one older run and a most-recent **successful** one finished a few hours ago, so FR-007 renders the healthy state by default.
      6. Wire `TrainingBlockSeeder` into `DatabaseSeeder` and remove or replace the default `Test User` block — it has no `strava_athlete_id` and would show up as a second, empty athlete.
      7. `php artisan migrate:fresh --seed` and inspect the result: 16 distinct weeks, no future-dated activity, no orphan foreign keys.
      8. `vendor/bin/pint --dirty --format agent`

      ## Completion Criteria
      - [x] `php artisan migrate:fresh --seed` succeeds from a clean database
      - [x] Exactly one demo athlete, with a Strava athlete id
      - [x] 16 consecutive ISO weeks of activities ending with the current in-progress week
      - [x] Illness week, peak week and partial current week all present and distinguishable
      - [x] No activity dated after today; no orphan foreign keys
      - [x] At least one successful recent `SyncRun`

      ## Test Data
      - [x] `database/seeders/TrainingBlockSeeder.php` composes `User`, `Activity` and `SyncRun` factories — no attribute definitions duplicated from the factories
      - [x] `DatabaseSeeder` calls it and no longer creates the stray default `Test User`
      - [x] Volumes exercise the UI: ~60–90 activities across the window, not an empty table and not random orphans

      ## Git Deliverables
      - Commit: `feat(US-001): TASK-06 seed a realistic 16-week training block`
      - Push: **skip** (`git_mode: GITFLOW`)
      - PR: update local PR notes
