    id: TASK-03
    title: 'Add Activity model, migration, SportType enum and factory'
    body: |
      ## Description
      Add the `Activity` entity — the only table the heatmap reads — with its composite index, its backed sport-type enum, and a domain-realistic factory.

      ## Files Involved
      - app/Models/Activity.php (new)
      - app/Enums/SportType.php (new)
      - database/migrations/xxxx_create_activities_table.php (new)
      - database/factories/ActivityFactory.php (new)
      - app/Models/User.php (relationship)

      ## Steps
      1. `php artisan make:model Activity -mf --no-interaction`
      2. `php artisan make:enum SportType --string --no-interaction` (or `make:class` if unavailable) — backed string enum with TitleCase keys `Run = 'Run'`, `TrailRun = 'TrailRun'`, `VirtualRun = 'VirtualRun'` (FR-003). Add a `values(): array<int, string>` helper the sync command will filter on. These are the only sport types ever stored; everything else is discarded at sync time.
      3. Migration: `strava_activity_id` (unsigned big integer, unique), `user_id` (`foreignId` constrained, `cascadeOnDelete`), `sport_type` (string), `name` (string), `distance_meters` (integer), `moving_time_seconds` (integer), `start_date_local` (datetime), `activity_date` (date), timestamps. Add the composite index `$table->index(['user_id', 'activity_date'])` **in this same migration** — it serves the only query the product makes (PRD data model).
      4. Distances stay **integer metres**; no float column anywhere (FR-003 — kilometres are a presentation concern only).
      5. `Activity` model: `$fillable`, `casts()` mapping `sport_type` to `SportType::class`, `activity_date` to `'date'`, `start_date_local` to `'datetime'`, `distance_meters` and `moving_time_seconds` to `'integer'`; `user(): BelongsTo` relation with an explicit return type.
      6. `User` model: add `activities(): HasMany`.
      7. `ActivityFactory`: domain-realistic values — distance 4 000–25 000 metres, moving time consistent with the distance at a plausible pace (never an independent random), `sport_type` defaulting to `SportType::Run`, `name` from a small pool of runner-plausible titles ("Morning Run", "Easy shakeout", "Long run"), `start_date_local` within the last 112 days, and `activity_date` **always derived from `start_date_local`** so the two can never disagree. States: `trailRun()`, `virtualRun()`, `onDate(CarbonInterface $date)`.
      8. `php artisan migrate:fresh --seed`
      9. `vendor/bin/pint --dirty --format agent`

      ## Completion Criteria
      - [x] `activities` has every column from the acceptance criteria with the stated types
      - [x] Composite index `(user_id, activity_date)` created in the same migration
      - [x] `SportType` backed enum with exactly `Run`, `TrailRun`, `VirtualRun`; cast on the model
      - [x] `user_id` foreign key cascades on delete; `User::activities()` relation present
      - [x] `ActivityFactory` produces coherent records where `activity_date` matches `start_date_local` and pace is plausible
      - [x] `php artisan migrate:fresh --seed` succeeds
      - [x] Pint clean

      ## Test Data
      - [x] `database/factories/ActivityFactory.php` created in **this same task** as the migration and model
      - [x] States `trailRun()`, `virtualRun()`, `onDate()` defined for the seeder and later specs to reuse
      - [x] Seeder composition happens in TASK-06

      ## Git Deliverables
      - Commit: `feat(US-001): TASK-03 add Activity model with SportType enum and factory`
      - Push: **skip** (`git_mode: GITFLOW`)
      - PR: update local PR notes
