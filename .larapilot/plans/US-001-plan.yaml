    id: TASK-01
    title: 'Strava configuration surface: .env.example keys and config/strava.php'
    body: |
      ## Description
      Declare every environment key the Strava integration needs and bind them through a dedicated config file, so no later spec calls `env()` outside `config/` (which returns `null` once `config:cache` runs).

      ## Files Involved
      - .env.example
      - config/strava.php (new)

      ## Steps
      1. Append a Strava block to `.env.example` with empty values — **no real credentials, ever**:
         - `STRAVA_CLIENT_ID=`
         - `STRAVA_CLIENT_SECRET=`
         - `STRAVA_REDIRECT_URI=` (the Herd HTTPS `.test` callback URL in development)
         - `STRAVA_ALLOWED_ATHLETE_IDS=` (comma-separated allowlist — FR-001)
         - `STRAVA_SYNC_HOUR=3` (0–23, local hour of the daily sync — FR-002)
         - `STRAVA_SYNC_TIMEZONE=Europe/Rome` (the only timezone-sensitive configuration in the product)
         Add a short comment above the block pointing at the README's Strava registration section.
      2. Create `config/strava.php` returning `client_id`, `client_secret`, `redirect_uri`, `allowed_athlete_ids` (parsed from the comma-separated string into a filtered `array<int, string>`), `sync_hour` (cast to int), `sync_timezone`. Include an array-shape PHPDoc for the returned structure.
      3. Confirm the parsing handles an empty string as an empty array, not `['']` — an allowlist that silently contains one empty entry is a security bug waiting for FR-001.
      4. `php artisan config:show strava` to verify the shape resolves.
      5. `vendor/bin/pint --dirty --format agent`

      ## Completion Criteria
      - [x] `.env.example` lists client id, client secret, redirect URI, allowlisted athlete ids, sync hour and sync timezone, all with empty or safe placeholder values
      - [x] No real credential value is committed anywhere
      - [x] `config/strava.php` exposes every key; `allowed_athlete_ids` is an array and is empty (not `['']`) when the env var is blank
      - [x] `php artisan config:show strava` resolves without error
      - [x] Pint clean

      ## Test Data
      - N/A — no model or schema changes in this task

      ## Git Deliverables
      - Commit: `feat(US-001): TASK-01 add Strava configuration keys and config file`
      - Push: **skip** (`git_mode: GITFLOW`)
      - PR: update local PR notes
