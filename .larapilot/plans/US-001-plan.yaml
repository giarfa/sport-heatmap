code: US-001
plan_body: |
  ## Technical Solution

  Enabling spec. It brings the repository from a bare Laravel 13 skeleton to a state where the heatmap dashboard and the Strava sync can be built against realistic data, on Laravel Herd, with the quality gates green.

  **Starting point (verified):** Laravel 13.30.1 on PHP 8.4.23, SQLite, Blade + Tailwind CSS 4 + Vite 8. Only the default `users` / `cache` / `jobs` migrations exist, only the `User` model and `UserFactory`. **The git repository has zero commits and no `develop` branch.** PHPUnit 12.5 is the test runner — Pest is not installed and must not be introduced.

  ### Schema (Mike)

  Three migrations, one concern each, each owning its own indexes:

  1. **`users` extension** — `strava_athlete_id` (nullable, unique), `strava_access_token` (`TEXT`, nullable), `strava_refresh_token` (`TEXT`, nullable), `strava_token_expires_at` (nullable timestamp); `password` becomes nullable. Both token columns are `TEXT` because the Eloquent `encrypted` cast produces ciphertext of unpredictable length — a `VARCHAR(255)` would truncate. Laravel 13 changes SQLite columns natively; no `doctrine/dbal` is required.
  2. **`activities`** — `strava_activity_id` (unique), `user_id` (FK, cascade delete), `sport_type`, `name`, `distance_meters` (integer), `moving_time_seconds` (integer), `start_date_local` (datetime), `activity_date` (date), plus the composite index `(user_id, activity_date)` in the same migration. Distances stay integer metres end to end; kilometres exist only at presentation time (FR-003).
  3. **`sync_runs`** — `started_at`, `finished_at` (nullable), `status`, `activities_upserted`, `activities_deleted`, `error_message` (nullable text). Powers FR-007.

  **No `daily_mileage` aggregate table.** The PRD rejects it explicitly: the grid aggregates ~100 rows by `activity_date` on read and the assembled grid is cached. TASK-05 carries an assertion that the table does not exist, so a later spec cannot reintroduce it by accident.

  ### Architecture decisions recorded here (John, Mike, Andrew)

  - **Integer primary keys, not UUIDs — deliberate deviation.** The Larapilot scaffolding default is UUID PKs on new models. This spec extends the existing auto-increment `users` table, and `activities.user_id` must match it; mixing key types across two tables in a single-user private instance buys nothing. Integer keys throughout. Recorded here rather than left implicit.
  - **`SportType` backed enum** (`Run`, `TrailRun`, `VirtualRun`) cast on `Activity::$casts`, stored as its string value. The sync spec filters on exactly these three values (FR-003); a bare string column would push stringly-typed comparisons into the sync command and the grid builder. TitleCase enum keys per the project PHP conventions.
  - **`config/strava.php`** binds every `STRAVA_*` env key. No later spec should reach for `env()` outside a config file — `config:cache` in any deployed environment would return `null`.
  - **Deferred, not planned here:** the PRD leaves the `laravel/socialite` + `socialiteproviders/strava` vs hand-rolled authorization-code exchange decision open "at planning". That decision belongs to the **FR-001 spec**, not to this one — no OAuth code and no new Composer dependency enters US-001. This spec only documents the Strava application registration and the env keys the chosen approach will need either way.

  ### Demo data (Alex)

  A dedicated `TrainingBlockSeeder` composes `User` + `Activity` factories into a coherent 16-week block for a single fixed demo athlete, so the dashboard and the intensity scale can be built and reviewed before any Strava call exists. The block is generated relative to the current ISO week so it never goes stale.

  ### Documentation (Albert)

  Baseline README only, per the PRD: Herd setup with a `.test` domain (no Sail, no Docker), Strava application registration (`activity:read_all`, callback domain, where credentials go), running the sync manually, and the scheduler cron entry.

  ### CI (Jack policy, Sarah authors)

  One GitHub Actions workflow on PHP 8.4 running PHPUnit, Pint and Larastan level 5 on push and on pull requests to `develop` and `main`. **No deploy stage** — the PRD records the deploy target as "not defined yet".

  ### Out of scope for US-001

  Strava OAuth flow, the sync command, `StravaClient`, `HeatmapBuilder`, `IntensityScale`, the dashboard view, and any new Composer dependency. This spec creates the ground they stand on.

  ## Git & Branching

  - **Mode: `GITFLOW`** (from `settings.git_mode`) — branch and atomic commits, internal PR prepared locally. **No `git push`, no remote PR** unless the user explicitly asks in-session.
  - **The repository has no commits and no branches yet.** TASK-00 therefore does more than the standard bootstrap: it stages the existing skeleton, creates the initial commit on `main`, cuts `develop` from it, then cuts the feature branch from `develop`.
  - Branch: `feature/US-001-foundation-schema-setup` from `develop`.
  - Per task: exactly one Conventional Commit, `type(US-001): TASK-NN summary`. Never batch two tasks into one commit.
  - Merge to `develop` only after human `/larapilot-review` approval.
  - Sarah leads any Git mechanics (conflict resolution, rebase onto `develop`, history hygiene).

  ## Test Data Strategy

  - Factories for **every** entity this spec touches, updated in the **same task** as the migration and model — never deferred: `UserFactory` (extended), `ActivityFactory` (new), `SyncRunFactory` (new).
  - Factory states carry domain meaning: `UserFactory::stravaConnected()` / `withoutStrava()`; `ActivityFactory::trailRun()` / `virtualRun()` / `onDate()`; `SyncRunFactory::failed()` / `running()`.
  - **Demo dataset** (`TrainingBlockSeeder`, wired into `DatabaseSeeder`): one fixed demo athlete with a Strava athlete id, ~16 weeks of running activities anchored to the current ISO week, containing at minimum —
    - a **near-empty illness week** (0–1 activities, low distance),
    - a **peak week** (6–7 activities, clearly the highest weekly total in the block),
    - a **partial current week** with activities only up to today and none after,
    - a scattering of double-run days so the day-cell detail spec (FR-011) has something to show,
    - a handful of `TrailRun` / `VirtualRun` activities alongside plain `Run`,
    - two or three `SyncRun` rows, the most recent successful, so FR-007 has state to render.
  - Distances are domain-realistic integer metres (roughly 5–25 km per run), never generic Faker numbers.
  - `php artisan migrate:fresh --seed` must succeed and produce this dataset before any entity task is marked done.

  ## Test Strategy

  - **Bar: `NORMAL`** (from `settings.testing`). **PHPUnit, not Pest** — Pest is not installed in this project and must not be introduced. Create tests with `php artisan make:test --phpunit {Name}`.
  - **No Playwright, no Dusk, no Pest browser, no viewport matrix, no journey E2E** — those belong to the `BEST` bar only. This spec has no UI anyway.
  - Test tasks are interleaved with implementation, not stacked at the end: TASK-05 lands after the three entity tasks, TASK-07 after the seeder.
  - **TASK-05 — schema, models, factories** (`tests/Feature/`, `tests/Unit/`):
    - every new column exists on its table with the expected nullability;
    - the `(user_id, activity_date)` composite index exists on `activities`;
    - **no `daily_mileage` table exists** — the PRD's explicit rejection, asserted;
    - `strava_access_token` / `strava_refresh_token` round-trip through the `encrypted` cast and the **raw stored value differs from the plaintext** (an `encrypted` cast silently mis-declared is invisible otherwise);
    - `users.password` accepts `null`;
    - `strava_athlete_id` uniqueness is enforced;
    - `Activity::$casts` maps `sport_type` to the `SportType` enum, `activity_date` to a date and `start_date_local` to a datetime;
    - `activities.user_id` cascades on user delete;
    - each factory (`User` with its Strava states, `Activity` with its states, `SyncRun` with its states) produces persistable, coherent records.
  - **TASK-07 — seeder and guard rails** (`tests/Feature/`):
    - the seeder produces ~16 distinct ISO weeks of activities for the demo athlete;
    - the illness week's total is materially below the block median and the peak week's is the maximum;
    - the current week contains no activity dated after today;
    - `activity_date` always matches the date part of `start_date_local`;
    - at least one `SyncRun` exists and the latest is successful;
    - **no registration route is registered** — `Route::has('register')` is false and no route path contains `register`; likewise no `login` password route. Public signup is explicitly out of scope (FR-016, Won't) and this test keeps it that way.
  - **Manual test handoff (Anne, for the human reviewer):** on a clean clone, follow `README.md` end to end on Herd — `composer setup`, open the `.test` URL, run `php artisan migrate:fresh --seed`, confirm the 16-week block is present in the database, and confirm `php artisan larapilot:quality` exits clean. The README being *followable* is an acceptance criterion and cannot be asserted in PHPUnit.
  - Command per task: `php artisan test --compact --filter={TestName}`. Full suite (`php artisan test --compact`) at TASK-10.

  ## Quality Gates

  - `vendor/bin/pint --dirty --format agent` after every task that touches PHP.
  - `php artisan larapilot:quality` green (Pint + Larastan level 5) before handoff — TASK-10. Larastan level is never lowered below 5.

  ## Risks & Notes

  - **Zero-commit repository.** TASK-00 is the highest-risk task in the plan: the initial commit defines what is tracked forever. `.gitignore` must exclude `database/database.sqlite` *before* it runs, or the SQLite file is committed and every seed thereafter dirties the working tree.
  - **SQLite column changes.** Making `users.password` nullable is a `->change()` on SQLite. Laravel 13 supports it natively, but the migration must be verified against a real `migrate:fresh` and not only reviewed.
  - **Encrypted cast + `TEXT`.** Getting this wrong is silent: the tokens still save, they are just truncated or unencrypted. The TASK-05 raw-value assertion is the only thing that catches it.
  - **Seeder staleness.** The block is generated relative to the current ISO week rather than hard-coded dates, so it cannot drift out of the visible 112-day window over time.
tasks:
  -
    id: TASK-00
    title: 'Bootstrap git history, develop branch and feature branch'
    body: |
      ## Description
      Bootstrap Gitflow for this spec. The repository currently has **zero commits and no branches with history** — so this task creates the initial commit on `main`, cuts `develop` from it, then cuts the feature branch from `develop`. Prepare the internal PR description toward `develop` locally. Do **not** push (`git_mode: GITFLOW`).

      ## Files Involved
      - .gitignore (one line added)
      - (otherwise git only — no application files)

      ## Steps
      1. Append `/database/database.sqlite` to `.gitignore` **before** staging, so the SQLite file is never tracked (every `migrate:fresh --seed` would otherwise dirty the tree).
      2. Verify nothing sensitive is about to be committed: `git status --short` and confirm `.env` is excluded while `.env.example` is included.
      3. `git add -A && git commit` — initial commit on `main`: `chore: initial Laravel 13 skeleton with Larapilot artifacts`.
      4. `git checkout -b develop` from `main`.
      5. `git checkout -b feature/US-001-foundation-schema-setup` from `develop`.
      6. Draft the internal PR title and body toward `develop` — title `US-001: Project foundation, schema and local setup`; body links `.larapilot/plans/US-001-plan.yaml` and lists the planned tasks. Keep it local.
      7. Anchor commit: `chore(US-001): TASK-00 bootstrap feature branch` (empty commit allowed).

      ## Completion Criteria
      - [x] `.gitignore` excludes `/database/database.sqlite`
      - [x] `main` has an initial commit containing the skeleton; `.env` is **not** tracked
      - [x] `develop` exists locally
      - [x] `feature/US-001-foundation-schema-setup` exists locally and is checked out
      - [x] PR title/body drafted toward `develop` (remote not opened)

      ## Test Data
      - N/A — git only

      ## Git Deliverables
      - Commit: `chore: initial Laravel 13 skeleton with Larapilot artifacts` on `main`
      - Commit: `chore(US-001): TASK-00 bootstrap feature branch` (empty commit allowed)
      - Push: **skip** (`git_mode: GITFLOW`)
      - PR: prepare locally — open remote only if the user requests push
