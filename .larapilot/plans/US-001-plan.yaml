    id: TASK-08
    title: 'Write the baseline README'
    body: |
      ## Description
      Write the baseline `README.md` so a fresh clone comes up on Laravel Herd following the document alone. The PRD scopes documentation to baseline only — no OpenAPI, no diagrams, no manuals.

      ## Files Involved
      - README.md

      ## Steps
      1. **What this is** — two or three lines: a private single-athlete Strava training heatmap.
      2. **Requirements** — PHP 8.4, Composer, Node, SQLite, and **Laravel Herd** on macOS. State explicitly that there is **no Sail and no Docker**; the PRD recorded Herd as a deliberate choice, so a reader does not go looking for a `docker-compose.yml`.
      3. **Local setup on Herd** — park or link the project directory in Herd, note the resulting `.test` domain, then `composer setup` (the existing script covers install, `.env`, key generation, migrate, npm install and build), then `npm run dev` for asset watching. Show the HTTPS `.test` URL as the app URL and note that `APP_URL` must match it.
      4. **Registering the Strava application** — walk through creating the app in the Strava developer dashboard: the required scope is **`activity:read_all`** (read-only; no write scope is ever requested), the authorization callback domain is the Herd `.test` host in development, and the resulting client id and secret go into `.env` as `STRAVA_CLIENT_ID` and `STRAVA_CLIENT_SECRET` — **never committed**. Note that access is restricted to the athlete ids listed in `STRAVA_ALLOWED_ATHLETE_IDS`.
      5. **Environment variables** — a table of every `STRAVA_*` key from `.env.example` with its meaning and an example value.
      6. **Database and demo data** — `php artisan migrate:fresh --seed` produces a full 16-week block, so the dashboard can be developed without connecting to Strava.
      7. **Running the sync** — the manual command invocation and the scheduler cron entry:
         ```
         * * * * * cd /path/to/sport-heatmap && php artisan schedule:run >> /dev/null 2>&1
         ```
         Note that the daily hour and its timezone come from `STRAVA_SYNC_HOUR` / `STRAVA_SYNC_TIMEZONE`. Mark the sync command itself as landing in a later spec, so the README is honest about what exists today.
      8. **Tests and quality** — `php artisan test --compact` and `php artisan larapilot:quality`.
      9. Re-read the document as someone who has never seen the project: every command must be runnable in order, with no implied step.

      ## Completion Criteria
      - [x] Herd setup documented with a `.test` domain; no Sail or Docker instructions anywhere
      - [x] Strava application registration documented — `activity:read_all` scope, callback domain, credential placement
      - [x] Every `STRAVA_*` env key documented
      - [x] Manual sync invocation and the `* * * * * php artisan schedule:run` cron entry both present
      - [x] Seeding and test/quality commands documented
      - [x] A fresh clone can be brought up following the README alone

      ## Test Data
      - N/A — documentation only

      ## Git Deliverables
      - Commit: `docs(US-001): TASK-08 add baseline README with Herd and Strava setup`
      - Push: **skip** (`git_mode: GITFLOW`)
      - PR: update local PR notes
