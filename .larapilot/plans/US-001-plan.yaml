    id: TASK-04
    title: 'Add SyncRun model, migration and factory'
    body: |
      ## Description
      Add the `SyncRun` entity that records the outcome of every sync attempt. It is what FR-007 renders as "synced 6 hours ago" or as the explicit stale/failed warning.

      ## Files Involved
      - app/Models/SyncRun.php (new)
      - app/Enums/SyncRunStatus.php (new)
      - database/migrations/xxxx_create_sync_runs_table.php (new)
      - database/factories/SyncRunFactory.php (new)

      ## Steps
      1. `php artisan make:model SyncRun -mf --no-interaction`
      2. Backed string enum `SyncRunStatus` with TitleCase keys `Running = 'running'`, `Succeeded = 'succeeded'`, `Failed = 'failed'` — FR-007 branches on these three states and a bare string would push the comparison into Blade.
      3. Migration: `started_at` (datetime), `finished_at` (datetime, nullable — a run in flight has none), `status` (string), `activities_upserted` (unsigned integer, default 0), `activities_deleted` (unsigned integer, default 0), `error_message` (text, nullable), timestamps. Index `started_at` — the dashboard's only query is "most recent successful run".
      4. `SyncRun` model: `$fillable`, `casts()` mapping `started_at` / `finished_at` to `'datetime'`, `status` to `SyncRunStatus::class`, both counters to `'integer'`.
      5. `SyncRunFactory`: default state is a **succeeded** run finished a few hours ago with plausible counters and a null `error_message`. States: `failed()` (finished, non-null `error_message`, zero counters), `running()` (null `finished_at`, zero counters), `stale()` (started more than 48 hours ago — the FR-007 warning threshold).
      6. `php artisan migrate:fresh --seed`
      7. `vendor/bin/pint --dirty --format agent`

      ## Completion Criteria
      - [x] `sync_runs` has `started_at`, `finished_at`, `status`, `activities_upserted`, `activities_deleted`, `error_message`
      - [x] `SyncRunStatus` enum cast on the model
      - [x] `SyncRunFactory` default is a successful recent run; `failed()`, `running()` and `stale()` states defined
      - [x] `php artisan migrate:fresh --seed` succeeds
      - [x] Pint clean

      ## Test Data
      - [x] `database/factories/SyncRunFactory.php` created in **this same task** as the migration and model
      - [x] States cover the three outcomes FR-007 must render, plus the 48-hour stale case
      - [x] Seeder composition happens in TASK-06

      ## Git Deliverables
      - Commit: `feat(US-001): TASK-04 add SyncRun model with status enum and factory`
      - Push: **skip** (`git_mode: GITFLOW`)
      - PR: update local PR notes
