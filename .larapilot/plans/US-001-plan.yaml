    id: TASK-07
    title: 'Test seeder shape and the no-public-signup guard'
    body: |
      ## Description
      Assert that the demo block really has the shape the dashboard work depends on, and lock in the acceptance criterion that no registration route and no public signup exist.

      ## Files Involved
      - tests/Feature/Database/TrainingBlockSeederTest.php (new)
      - tests/Feature/Routing/NoPublicSignupTest.php (new)

      ## Steps
      1. Create both with `php artisan make:test --phpunit {Name}` — PHPUnit, not Pest.
      2. **Seeder test** — run `TrainingBlockSeeder` and assert:
         - exactly one user exists and it has a `strava_athlete_id`
         - activities span **16 distinct ISO year-weeks**, the last of which is the current one
         - the illness week's total distance is materially below the block median
         - the peak week's total is the maximum across the block
         - **no activity has an `activity_date` after today**
         - for every activity, `activity_date` equals the date part of `start_date_local`
         - every activity's `sport_type` is one of the three `SportType` cases
         - at least one `SyncRun` exists and the most recent one is `SyncRunStatus::Succeeded`
      3. **No-public-signup test** — assert `Route::has('register')` is false, no registered route URI contains `register`, and `GET /register` returns 404. Public signup is FR-016 (Won't) and this test is what keeps a later starter-kit install from quietly reopening it.
      4. `php artisan test --compact --filter=TrainingBlockSeeder` and `--filter=NoPublicSignup`; both green.
      5. No browser, E2E or viewport suites — `settings.testing` is `NORMAL`.

      ## Completion Criteria
      - [x] Tests pass locally under PHPUnit
      - [x] Seeder shape asserted: 16 weeks, illness week, peak week, no future-dated activity, date consistency
      - [x] Absence of any registration route asserted

      ## Git Deliverables
      - Commit: `test(US-001): TASK-07 cover seeder shape and no-public-signup guard`
      - Push: **skip** (`git_mode: GITFLOW`)
