    id: TASK-05
    title: 'Test schema, casts and factories'
    body: |
      ## Description
      Cover the schema and the models with PHPUnit feature and unit tests. Two of these assertions exist specifically to stop silent regressions: the encrypted-cast check (a mis-declared cast still saves, it just stores plaintext) and the `daily_mileage` absence check (the PRD rejects that table explicitly).

      ## Files Involved
      - tests/Feature/Database/SchemaTest.php (new)
      - tests/Feature/Models/UserStravaColumnsTest.php (new)
      - tests/Unit/Models/ActivityTest.php (new)
      - tests/Unit/Models/SyncRunTest.php (new)

      ## Steps
      1. Create tests with `php artisan make:test --phpunit {Name}` — **PHPUnit, not Pest**. Pest is not installed in this project and must not be introduced.
      2. Reuse the factories from `database/factories/` — never redefine model attributes inside a test.
      3. **Schema tests** (`Schema::hasColumn`, `Schema::getIndexes`):
         - `users` has all four Strava columns; `password` is nullable
         - `activities` has every required column with the expected types
         - the `(user_id, activity_date)` composite index exists on `activities`
         - `sync_runs` has all six columns
         - **`Schema::hasTable('daily_mileage')` is false** — the PRD's explicit rejection, asserted so no later spec reintroduces it
      4. **Encrypted cast test:** save a user with known token strings, read them back through the model (plaintext matches), then read the same row with `DB::table('users')->find(...)` and assert the **raw stored value differs from the plaintext** and is non-empty.
      5. `strava_athlete_id` uniqueness is enforced (expect a `QueryException` on a duplicate).
      6. A user can be created with `password` null.
      7. `Activity` casts: `sport_type` returns a `SportType` instance, `activity_date` a date, `start_date_local` a datetime; deleting the user cascades the activities away.
      8. `SyncRun` casts: `status` returns a `SyncRunStatus`; `failed()` state has a non-null `error_message`; `running()` state has a null `finished_at`.
      9. Every factory and every state produces a persistable record.
      10. `php artisan test --compact --filter=Schema` and the model filters; all green.
      11. Do **not** add Playwright, Dusk, Pest browser or viewport suites — `settings.testing` is `NORMAL`.

      ## Completion Criteria
      - [x] Tests pass locally under PHPUnit
      - [x] Encrypted tokens verified against the **raw** database value, not only the model accessor
      - [x] `daily_mileage` absence asserted
      - [x] Composite index presence asserted
      - [x] Every factory state covered

      ## Git Deliverables
      - Commit: `test(US-001): TASK-05 cover schema, casts and factories`
      - Push: **skip** (`git_mode: GITFLOW`)
      - PR: update local PR notes
