code: US-010
plan_body: |-
  ## Technical Solution

  Root cause: `config/cache.php` keeps the Laravel 13 default `serializable_classes => false`, so every serializing store (`database` in `.env.example`, `file`, `redis`) calls `unserialize()` with no allowed classes and turns the cached `HeatmapGrid` into `__PHP_Incomplete_Class`. `HeatmapGridCache::remember()` declares a `HeatmapGrid` return type, so every cache hit throws a `TypeError` and `GET /` answers 500. The suite runs the `array` store with `serialize => false`, which is why no test caught it since US-004.

  Fix, two layers:

  1. **Allowlist** (`config/cache.php`) — `serializable_classes` lists exactly the classes a cached grid is made of: `App\Data\Heatmap\HeatmapGrid`, `WeekRow`, `DayCell`, `LegendRow`, `IntensityScale`, `App\Enums\DayCellState`, `Carbon\CarbonImmutable` (verified: CarbonImmutable serializes to scalar props only and restores with only itself allowed). Never `true` — the default exists to stop gadget chains if `APP_KEY` leaks (Lars).
  2. **Self-healing read** (`HeatmapGridCache::remember()`) — read the entry; when it is not a `HeatmapGrid` (written before the fix, by an older class shape, or by a class later removed from the allowlist), build the grid and overwrite the entry instead of returning it. The method keeps its signature, so the controller and the sync command do not change.

  Rejected: caching the grid as a plain array with `toArray()/fromArray()` mappers — more code across five DTOs for no gain over an allowlist the framework already provides; `serializable_classes => true` — reopens the gadget-chain risk the default closes.

  Query shape unchanged: no new query on the dashboard path.

  ## Git & Branching
  - Mode: GITFLOW
  - Branch: `feature/US-010-fix-cached-grid-unserialize` from `develop`
  - TASK-00: bootstrap
  - Per task: one Conventional Commit; push/PR remote only when the user asks
  - Merge after `larapilot-review` approval

  ## Test Data Strategy
  - No model or schema change: factories and seeders stay as they are
  - Tests use the existing `User` and `Activity` factories and the TestCase athlete helpers
  - `migrate:fresh --seed` keeps producing the seeded demo athlete used in the manual check

  ## Test Strategy
  - Bar: NORMAL — Pest/PHPUnit feature tests, no browser or viewport suites
  - Regression: `tests/Feature/Dashboard/HeatmapGridCacheTest.php` switches to the serializing `database` store with `Config::set()` and requests `/` twice — both 200, same grid; fails on `develop` without the fix
  - Self-healing: an entry that is not a `HeatmapGrid` under the grid key is rebuilt and the page renders 200
  - Allowlist: a class outside the list (e.g. `stdClass`) still comes back as `__PHP_Incomplete_Class` from the database store
  - Full suite + `larapilot:quality` before each commit

  ## Manual test handoff
  1. `CACHE_STORE=database`, open `/` twice (signed out and signed in) → 200 both times.
  2. With an entry cached before the fix still in the `cache` table, open `/` → 200 without clearing the cache.
