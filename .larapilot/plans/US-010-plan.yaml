    id: TASK-02
    title: 'Cover the cached grid round trip through a serializing store'
    body: |-
      ## Description
      Add regression coverage for the cached-grid 500 with a serializing cache store.

      ## Files Involved
      - tests/Feature/Dashboard/HeatmapGridCacheTest.php

      ## Steps
      1. Use existing factories and the TestCase athlete helpers — no new factory definitions
      2. `Config::set('cache.default', 'database')` in the new tests (never edit `.env` or `phpunit.xml`)
      3. Cases: a signed-out visitor and a signed-in athlete request `/` twice — both 200, the second served from the cache with the same weekly totals; an entry under the grid key that is not a `HeatmapGrid` is rebuilt and the page renders 200; a class outside the allowlist (`stdClass`) still comes back from the database store as `__PHP_Incomplete_Class`
      4. Confirm the round-trip test fails with `serializable_classes => false`
      5. `php artisan test --filter=HeatmapGridCacheTest`, then the full suite
      6. Do **not** add Playwright, Dusk, Pest browser, or viewport E2E suites

      ## Completion Criteria
      - [x] Round-trip regression test fails without the fix and passes with it
      - [x] Unrestorable-entry and allowlist cases pass
      - [x] Full suite passes

