    id: TASK-01
    title: 'Allowlist the grid classes for cache unserialize and rebuild unrestorable entries'
    body: |-
      ## Description
      Fix: the cached heatmap grid cannot be unserialized under `serializable_classes => false`, so every cache hit on `/` throws a `TypeError` (500).

      ## Files Involved
      - config/cache.php
      - app/Support/Heatmap/HeatmapGridCache.php
      - .larapilot/docs/devs/heatmap-dashboard.md
      - .larapilot/docs/devs/README.md
      - CHANGELOG.md

      ## Steps
      1. `config/cache.php`: replace `'serializable_classes' => false` with an explicit list — `HeatmapGrid`, `WeekRow`, `DayCell`, `LegendRow`, `IntensityScale`, `DayCellState`, `CarbonImmutable` — and rewrite the comment block to say why each is there and why the list must never become `true`
      2. `HeatmapGridCache::remember()`: read the key; return it when it is a `HeatmapGrid`; otherwise build via the closure, `put` it with the same TTL, and return it. Keep the signature and PHPDoc style
      3. `php artisan test` and `php artisan larapilot:quality`

      ## Completion Criteria
      - [x] A serializing store restores the cached grid as a `HeatmapGrid`
      - [x] A cached entry that is not a `HeatmapGrid` is rebuilt, never returned
      - [x] `serializable_classes` is an explicit list, never `true`
      - [x] Root cause named in the commit body
      - [x] Tests pass

      ## Test Data
      - N/A — no model/schema changes in this task

      ## Domain Docs
      - [x] `.larapilot/docs/devs/heatmap-dashboard.md` — grid cache section: serialization allowlist, the self-healing read, the rejected array-mapper and `true` alternatives, and the invariant that a new class nested in the grid must join the allowlist
      - [x] Folder `README.md` index row updated (last spec US-010)
      - [x] English, committed with this task

      ## Git Deliverables
      - Commit: `fix(US-010): TASK-01 allowlist the cached grid classes for unserialize`
      - Push: **skip** (`git_mode: GITFLOW`)
      - PR: prepare/update local notes
