code: US-016
plan_body: |
  **Release:** 2.0.1

  ## Technical Solution

  Root cause: `composer.json:13` lists `andreapollastri/larapilot` under `require`. `composer install --no-dev` therefore installs it, package discovery registers its service provider, and every `/larapilot/*` route (dashboard, `.env` reader, database dump, file writes) exists on a deployed host, gated only by `APP_ENV` (`AccessPolicy::mode()` returns `open` for `local`/`testing`). `laravel/boost` and `laravel/mcp` reach the app only through Larapilot (`composer why` confirms: `andreapollastri/larapilot 5.2.0 requires laravel/boost`, `laravel/boost requires laravel/mcp`), so they ride into production with it — today `composer.lock` lists all three under `packages` (production), not `packages-dev`.

  Fix (John / Andrew):
  1. Move `andreapollastri/larapilot: ^5.0` from `require` to `require-dev` — same constraint, no version bump.
  2. Refresh `composer.lock` with the **minimal** change: the three packages (and any transitive dependency only they pull in) move from `packages` to `packages-dev`, `content-hash` changes, **no locked version changes**. Use `composer update --lock --minimal-changes` (Composer 2.10.2 is installed); if Composer insists on bumping a version, stop and use `composer update andreapollastri/larapilot --minimal-changes` instead, then confirm with `git diff composer.lock` that only section membership and the hash moved.
  3. No application code references the package: `bootstrap/providers.php` lists only `AppServiceProvider`, and `app/`, `config/`, `routes/`, `bootstrap/`, `database/` carry no `Larapilot` or `Laravel\Boost` symbol. `bootstrap/cache/` is git-ignored, so no stale `packages.php` / `services.php` ships — `post-autoload-dump` regenerates them with `package:discover` on every install.
  4. `tests/Feature/Routing/NoPublicSignupTest.php` keeps its `larapilot/` exclusion: it is still correct for the dev install and harmless under `--no-dev`.

  Guard (Anne): a regression test reads `composer.json` and `composer.lock` and fails whenever a development-only package sits on the production side. It is written first and observed **red** against the current manifest before the move.

  Deploy contract (Albert / Jack): README states that every deployment runs `composer install --no-dev --optimize-autoloader`. The PRD leaves the deploy platform open (deferred to `larapilot-ship`); this spec adds no deploy scaffolding. The `.env.example` hardening (`APP_DEBUG=false`, `BOOST_ENABLED=false`, …) and the remaining host-checklist keys belong to the separate v2.0.1 `.env.example` fix — **out of scope here**.

  Out of scope: CI changes (`ci.yml` keeps `composer install` with dev dependencies — the test suite needs them); the Medium Boost finding's `.env.example` side; any Larapilot or Boost version change.

  ## Git & Branching
  - Mode: GITFLOW (no automatic push)
  - Release: 2.0.1 (`planned`) — TASK-00 runs `php artisan larapilot:release-feature --semver=2.0.1 --spec=US-016 --slug=larapilot-dev-dependency`, which opens `release/2.0.1` and branches `feature/US-016-larapilot-dev-dependency` from it
  - PR base: `release/2.0.1`, not `develop`
  - Per task: one Conventional Commit carrying `US-016` and the task id; the fix commit uses the `fix(deps):` scope and names the root cause (acceptance criterion)
  - No `git push`, no remote PR unless the user asks in-session
  - Merge after `larapilot-review` approval (auto-approve is on)
  - `CHANGELOG.md` `[Unreleased]` gets a `### Security` line — deploy-visible behavior changes (no developer dashboard on `--no-dev` hosts)

  ## Test Data Strategy
  - No schema, model, factory, or seeder change — Test Data is N/A for every task
  - The `--no-dev` verification (TASK-03) runs in a throw-away git worktree under the session scratchpad with its own `.env` copied from `.env.example` and its own `database/database.sqlite`. **Never** run `migrate:fresh`, `--seed`, or `composer install --no-dev` in the main working copy: the dev database is the default SQLite file holding real data, and a `--no-dev` install there would remove Larapilot and Boost from the developer's own `vendor/`

  ## Test Strategy
  - Bar: NORMAL — PHPUnit (the project uses PHPUnit, not Pest); no Playwright, Dusk, or browser E2E
  - Regression test (TASK-01): `tests/Unit/ComposerDependenciesTest.php` — a data provider of development-only packages; asserts none is under `composer.json` `require` (`andreapollastri/larapilot`, `laravel/boost`, `laravel/pail`) and none of `andreapollastri/larapilot`, `laravel/boost`, `laravel/mcp` is in `composer.lock` `packages`. Must be red on the current manifest, green after the move
  - `--no-dev` evidence (TASK-03, Anne with Oliver): route list, HTTP status of `/larapilot`, `/larapilot/api/*` and the `.env`/dump endpoints through the HTTP kernel, `vendor/` contents, `package:discover`, then dev install + full suite — all in the scratch worktree
  - Main working copy: `php artisan test --compact` and `php artisan larapilot:quality` green before every commit
  - Lars re-runs the v2.0.1 security gate at `/larapilot-ship`, not in this spec
