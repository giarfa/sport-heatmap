    id: TASK-02
    title: 'README: deployments run composer install --no-dev'
    body: |
      ## Description
      Document the deploy contract: every deployment runs `composer install --no-dev --optimize-autoloader`, and why — the developer dashboard and Boost are development-only and must never be installed on a host.

      ## Files Involved
      - README.md (section `### Before putting this on a real host`, around line 115)

      ## Steps
      1. In `### Before putting this on a real host`, before the settings table, add a short paragraph and code block: deployments install with `composer install --no-dev --optimize-autoloader`; this leaves out the Larapilot dashboard (`/larapilot/*`, which can read `.env` and dump the database) and Laravel Boost; a plain `composer install` on a host reinstalls them
      2. Add the quick check a deployer can run: `php artisan route:list --path=larapilot` must list no route
      3. Do **not** touch the `APP_DEBUG` / `APP_ENV` / `SESSION_SECURE_COOKIE` table or add `BOOST_ENABLED` and the other host keys — they belong to the `.env.example` fix of v2.0.1
      4. Keep the README's existing voice (plain prose, reasons stated, no marketing)

      ## Completion Criteria
      - [x] README states every deployment runs `composer install --no-dev --optimize-autoloader`, with the reason
      - [x] README gives the `route:list --path=larapilot` check
      - [x] Host-key table unchanged

      ## Test Data
      - N/A — documentation only

      ## Domain Docs
      - N/A — no domain behavior changes; this is the project README (baseline docs, Albert)

      ## Git Deliverables
      - Commit: `chore(US-016): TASK-02 document --no-dev deployments in the README`
      - Push: **skip** (`git_mode: GITFLOW`)
      - PR: update the local PR notes
