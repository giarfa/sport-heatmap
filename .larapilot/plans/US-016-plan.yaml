  -
    id: TASK-01
    title: 'Regression test, then move Larapilot to require-dev and refresh the lock'
    body: |
      ## Description
      Fix: `andreapollastri/larapilot` ships as a production dependency. Write the regression test first and watch it fail, then move the package to `require-dev` and refresh `composer.lock` so Larapilot, Boost, and MCP become development-only.

      ## Files Involved
      - tests/Unit/ComposerDependenciesTest.php (new — `php artisan make:test --phpunit --unit ComposerDependenciesTest --no-interaction`)
      - composer.json
      - composer.lock
      - CHANGELOG.md

      ## Steps
      1. **Test first (Anne).** `ComposerDependenciesTest` extends `Tests\TestCase` like its `tests/Unit` siblings and reads the manifests with `base_path('composer.json')` / `base_path('composer.lock')`:
         - `test_development_only_packages_are_not_production_requirements` — `#[DataProvider]` over `andreapollastri/larapilot`, `laravel/boost`, `laravel/pail`; asserts the key is absent from `require`. Failure message names the package and says it would install on a `--no-dev` host
         - `test_development_tooling_is_locked_as_a_development_package` — `#[DataProvider]` over `andreapollastri/larapilot`, `laravel/boost`, `laravel/mcp`; asserts the name is absent from `composer.lock` `packages` (the production section). This is what proves Boost and MCP leave deployed hosts (acceptance criterion on Boost)
         - PHPDoc on the class: why the guard exists (v2.0.0 High finding, OWASP A05/A01) — no inline comments
      2. `php artisan test --compact --filter=ComposerDependenciesTest` → **red** on the current manifest (larapilot in `require`, three packages in lock `packages`). Note the failing output for the PR body
      3. Move `"andreapollastri/larapilot": "^5.0"` from `require` to `require-dev` (keep `sort-packages` order: it sorts first in `require-dev`)
      4. `composer update --lock --minimal-changes`; if a locked version changes, revert and use `composer update andreapollastri/larapilot --minimal-changes`. `git diff composer.lock`: only `content-hash` and the `packages` → `packages-dev` moves, every `version` unchanged
      5. `composer install` (dev — restores nothing, confirms the lock installs) and `php artisan package:discover` — Larapilot and Boost still discovered locally
      6. Local setup unchanged: `php artisan larapilot:context plan` still runs; `php artisan route:list --path=larapilot` still lists the dashboard routes; `/larapilot` still opens on Herd (resolve the URL with Boost `get-absolute-url`)
      7. `php artisan test --compact --filter=ComposerDependenciesTest` → green; then `php artisan test --compact` and `php artisan larapilot:quality` → green
      8. `vendor/bin/pint --dirty --format agent`
      9. `CHANGELOG.md` `[Unreleased]` → `### Security`: the developer dashboard and Boost are development-only dependencies; deployments with `composer install --no-dev` no longer register `/larapilot/*`

      ## Completion Criteria
      - [x] Regression test observed red on the pre-fix manifest, green after
      - [x] `andreapollastri/larapilot` under `require-dev` with constraint `^5.0`; absent from `require`
      - [x] `composer.lock`: `andreapollastri/larapilot`, `laravel/boost`, `laravel/mcp` in `packages-dev`, none in `packages`; no locked version changed
      - [x] Local dev install still discovers Larapilot; `php artisan larapilot:*` runs; `/larapilot` opens on Herd
      - [x] Full suite and `larapilot:quality` green
      - [x] CHANGELOG `[Unreleased]` updated

      ## Test Data
      - N/A — no model or schema change

      ## Domain Docs
      - N/A — no domain behavior changes (activity-sync, garmin-csv-import, heatmap-dashboard, strava-connection are untouched); `.larapilot/docs/devs/` has no deploy/security note to amend. The deploy rule lands in the README (TASK-02)

      ## Git Deliverables
      - Commit: `fix(deps): US-016 TASK-01 move andreapollastri/larapilot to require-dev` — body: root cause (`composer.json:13` put Larapilot in `require`, so `--no-dev` installed it and package discovery registered `/larapilot/*`; Boost and MCP rode in through it), files touched, and the red→green test evidence
      - Push: **skip** (`git_mode: GITFLOW`)
      - PR: update the local PR notes
