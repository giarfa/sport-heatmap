    id: TASK-03
    title: 'Verify a --no-dev install: no /larapilot route, 404s, suite green after dev install'
    body: |
      ## Description
      Prove the fix on a real `--no-dev` install (Anne, with Oliver's unauthenticated re-test): no `/larapilot/*` route, 404 on the dashboard, its API and the `.env`/database-dump endpoints, no Boost or MCP in `vendor/`, `package:discover` clean; then a dev install on the same checkout passes the full suite. Runs in a throw-away worktree — never in the main working copy.

      ## Files Involved
      - (verification only — no repository files change; evidence goes into the local PR body)

      ## Steps
      1. Before step 2, list the exact dashboard paths to probe: `php artisan route:list --path=larapilot` in the **main** working copy — pick `/larapilot`, two `/larapilot/api/*` routes, the `.env` reader and the database-dump route
      2. `git worktree add --detach {scratchpad}/us016-nodev feature/US-016-larapilot-dev-dependency`
      3. In the worktree: `cp .env.example .env` (keeps `APP_ENV=local`, the worst case from the finding), `touch database/database.sqlite`, `composer install --no-dev --optimize-autoloader --no-interaction`, `php artisan key:generate`, `php artisan migrate --force` (the worktree's own SQLite file only)
      4. Evidence on the `--no-dev` install:
         - `composer install` output shows `package:discover` ran without error and did not list `andreapollastri/larapilot` or `laravel/boost`
         - `ls vendor/andreapollastri vendor/laravel/boost vendor/laravel/mcp` → none exists
         - `php artisan route:list --path=larapilot` → no matching route; `php artisan route:list | grep -i -E "boost|mcp"` → nothing
         - Through the HTTP kernel, without serving: `php artisan tinker --execute '…'` handling `Illuminate\Http\Request::create($path)` for each path of step 1 → status `404` for every one (unauthenticated)
         - `php artisan larapilot:context plan` → command not defined
      5. Dev install on the same checkout: `composer install --no-interaction`, `php artisan package:discover`, `php artisan test --compact` → green
      6. `git worktree remove --force {scratchpad}/us016-nodev`
      7. Paste the evidence (commands and one-line results, not full output) into the local PR body under `## Verification (--no-dev)`

      ## Completion Criteria
      - [x] After `composer install --no-dev`: no `/larapilot*` route, no Boost/MCP route, Larapilot/Boost/MCP absent from `vendor/`
      - [x] `/larapilot`, the probed `/larapilot/api/*` routes and the `.env`/dump endpoints return 404 unauthenticated (Oliver's re-test)
      - [x] `package:discover` and the full suite pass after the subsequent dev install
      - [x] Worktree removed; main working copy, its `vendor/` and its SQLite database untouched
      - [x] Evidence recorded in the PR body

      ## Test Data
      - N/A — the worktree uses its own empty SQLite file; no factory or seeder change

      ## Domain Docs
      - N/A — verification only

      ## Git Deliverables
      - Commit: none — verification only; nothing in the repository changes
      - Push: **skip** (`git_mode: GITFLOW`)
      - PR: update the local PR body with the evidence
