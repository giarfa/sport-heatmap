    title: 'Day cell detail: tappable ran days and the native dialog'
    body: |-
      ## Description
      Make ran-day cells open a server-rendered detail listing each run with distance, moving time, pace, ascent, and heart rate; Strava runs link to Strava, Garmin runs do not; keyboard-operable, usable at 375 px, light and dark (FR-011, FR-008, FR-009).

      Mirrors: `.larapilot/mockups/US-012/day-detail.html`, `.larapilot/mockups/US-012/dark.html`, `.larapilot/mockups/US-012/breakpoints.html`

      ## Files Involved
      - resources/views/components/heatmap-grid.blade.php
      - resources/views/components/day-detail.blade.php (new)
      - resources/views/dashboard.blade.php
      - resources/js/app.js
      - resources/css/app.css

      ## Steps
      1. Read the US-012 mockup README (Fidelity contract, Deviations) and every screen above first; any visible deviation is agreed with the user in chat and logged (`decision-log --topic="mockup deviation"`) before coding
      2. Grid: a `Ran` cell with `hasDetail()` renders a `<button type="button" data-day-detail="…" aria-haspopup="dialog" aria-controls="…">` filling the `<td>` with the sr-only name inside; rest/future cells unchanged; cell size, `<colgroup>` widths, and td padding untouched (heatmap-dashboard README → grid geometry)
      3. `<x-day-detail>`: one `<dialog>` per ran day after the table — `aria-labelledby` heading (date + day total), per run `<dl>` with unit-labelled values, `—` for missing, "View on Strava" only when `stravaUrl` is set (`target="_blank" rel="noopener"`), 44 × 44 px close button (`<form method="dialog">`)
      4. `app.js`: delegated click → `showModal()`; on `close` return focus to the opening cell; optional backdrop-click close per the mockup; no dependency
      5. CSS: bottom sheet below `sm`, centred dialog from `sm`, tokens from the existing theme, light + dark, motion only under `prefers-reduced-motion: no-preference`; no horizontal page scroll at 320/375 px
      6. Smoke-check at 375, 768, 1280 px, both themes, keyboard only
      7. `php artisan test --compact tests/Feature/Dashboard`; `npm run build`

      ## Completion Criteria
      - [ ] Tap, click, Enter, Space open a ran day's detail; Esc closes and returns focus to the cell
      - [ ] Rest and future days open nothing
      - [ ] Every value labelled with its unit; missing metric reads `—`; no imperial unit
      - [ ] Strava run links to its activity; Garmin run has no link
      - [ ] Usable at 375 px without horizontal page scroll; light and dark meet WCAG 2.2 AA (manual smoke OK under NORMAL)
      - [ ] Matches the approved mockups; deviations agreed and recorded
      - [ ] Tests pass

