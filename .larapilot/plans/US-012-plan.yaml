    id: TASK-06
    title: 'Apply metrics on Overwrite and backfill, and show them on the conflict review'
    body: |-
      ## Description
      Overwrite replaces the stored metrics with the CSV's except where the CSV says `--`; an already-imported run gains only the metrics it lacks; the review page shows pace, ascent, and heart rate side by side.

      Mirrors: `.larapilot/mockups/US-012/review-metrics.html` (on top of `.larapilot/mockups/US-008/review.html`)

      ## Files Involved
      - app/Data/Garmin/GarminImportPlan.php
      - app/Support/Garmin/PlanGarminImport.php
      - app/Actions/Garmin/ApplyGarminImport.php
      - app/Support/Garmin/GarminImportFormat.php
      - resources/views/garmin/review.blade.php
      - resources/css/app.css (only if the review table needs a row style)

      ## Steps
      1. Read the US-012 and US-008 mockup READMEs and the review screens first; deviations are agreed with the user before coding (**Mockup fidelity**)
      2. `GarminImportPlan`: add `array<int, Activity> $alreadyImportedActivities` (row index => matched stored run); `PlanGarminImport` fills it in the identity pass it already runs; fingerprint unchanged
      3. `ApplyGarminImport` (same transaction): Overwrite fills `toAttributes()` without the null metrics; for each already-imported pair fill only stored-null metrics from `metricAttributes()` and `save()` only when dirty; forget the grid cache whenever any row was written, a backfill-only import included; block comments on both rules
      4. `GarminImportFormat::pace()` (`5:23 /km`), `ascent()` (`45 m`), `heartRate()` (`152 bpm`), `—` for null
      5. Review table: three rows/columns per the mockup, stored vs CSV; mobile first, usable at 375 px, light + dark
      6. `php artisan test --compact tests/Feature/Garmin`

      ## Completion Criteria
      - [ ] Overwrite: CSV metrics win; a `--` metric keeps the stored value
      - [ ] Already imported: only empty metrics filled; nothing set changes; re-import of the same file changes nothing
      - [ ] Summary counts unchanged; backfilled runs still count as "already imported"
      - [ ] Grid cache forgotten after a backfill-only import
      - [ ] Review page shows the three metrics side by side, `—` for missing, matches the mockup at 375 / 768 / 1280 px (manual smoke)
      - [ ] Tests pass

      ## Test Data
      - N/A — no model/schema change in this task

      ## Domain Docs
