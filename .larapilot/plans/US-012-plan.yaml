    id: TASK-02
    title: 'Add the three metric columns to activities, with factory and seeder'
    body: |-
      ## Description
      Add nullable `average_pace_seconds_per_km`, `total_ascent_meters`, `average_heart_rate` to `activities`, expose them on `Activity`, and keep the demo dataset coherent.

      ## Files Involved
      - database/migrations/xxxx_add_run_metrics_to_activities_table.php (`php artisan make:migration add_run_metrics_to_activities_table --table=activities --no-interaction`)
      - app/Models/Activity.php
      - database/factories/ActivityFactory.php
      - database/seeders/TrainingBlockSeeder.php
      - tests/Feature/Database/SchemaTest.php
      - tests/Feature/Database/TrainingBlockSeederTest.php
      - tests/Unit/Models/ActivityTest.php

      ## Steps
      1. Migration: three `unsignedInteger(...)->nullable()` columns; `down()` drops them; block comment on why no index and why null ≠ 0
      2. `Activity`: add to `#[Fillable]` (they are values, not identity), `'integer'` casts, `@property int|null` lines in the class docblock (Larastan's only type source)
      3. Factory: definition fills realistic metrics derived from the generated run (pace = moving time / km, ascent 5–180 m, heart rate 135–172 bpm); states `withoutMetrics()` and `withoutHeartRate()`
      4. `TrainingBlockSeeder`: metrics on most runs, a few without HR, two Garmin days with empty metrics, one day with a Strava run and a Garmin run
      5. `php artisan migrate:fresh --seed`; `php artisan migrate:rollback --step=1 && php artisan migrate` to prove reversibility
      6. `php artisan test --compact tests/Feature/Database tests/Unit/Models/ActivityTest.php`

      ## Completion Criteria
      - [ ] Migration reversible; columns nullable; no default `0`
      - [ ] `Activity` fillable, casts, and docblock in sync with the migration
      - [ ] `ActivityFactory` produces realistic metrics; `withoutMetrics()` / `withoutHeartRate()` states exist
      - [ ] Seeder demo covers every detail state (all metrics, no HR, no metrics, Strava + Garmin on one day)
      - [ ] `migrate:fresh --seed` succeeds
      - [ ] Tests pass

      ## Test Data
