    id: TASK-05
    title: 'Parse pace, ascent and heart rate from Garmin CSV exports'
    body: |-
      ## Description
      Read the optional `Passo medio` / `Avg Pace`, `Ascesa totale` / `Total Ascent`, `FC Media` / `Avg HR` columns into each parsed run; a missing column, `--`, or an unreadable value leaves only that metric empty and never rejects the row (FR-018).

      ## Files Involved
      - app/Support/Garmin/GarminCsvColumns.php
      - app/Support/Garmin/ParseGarminCsv.php
      - app/Data/Garmin/GarminCsvRow.php
      - tests/Fixtures/Garmin/activities-it-metrics.csv (new)
      - tests/Fixtures/Garmin/activities-en-metrics.csv (new)
      - tests/Feature/Garmin/ParseGarminCsvTest.php

      ## Steps
      1. `GarminCsvColumns`: add `avg_pace`, `total_ascent`, `avg_hr` to both header sets and to `OPTIONAL_KEYS`; check `headerSetFor()` still ignores optional keys for language detection; block comment citing decision `98fe4bd16f3263d6` (English names from the fixture, unconfirmed by a real export)
      2. `ParseGarminCsv`: private `paceSecondsPerKm()`, `ascentMeters()`, `heartRate()` — `m:ss` / `h:mm:ss` pace (reuse the `durationSeconds()` grammar; `0` → null), ascent with `,` thousands separators and optional decimal rounded, HR digits with optional decimal rounded (`0` → null); `''` / `--` / unreadable → null; bounded digit counts so no int overflow
      3. `GarminCsvRow`: three nullable ints in constructor, `toAttributes()`, `toSessionArray()`, `fromSessionArray()` (`?? null` so a pending upload serialized before the deploy still confirms — block comment); new `metricAttributes()` returning only the non-null metrics; identity methods unchanged
      4. Fixtures: Italian and English exports with metric values, a `1,234` ascent, an `1:05:10` pace, one row with pace `abc`, one row with `--` metrics
      5. Unit-level parser cases in `ParseGarminCsvTest`: `"5:23"` → 323; `"1,234"` → 1234; `"152"` → 152; `--` → null; `abc` → null and the row is still imported and not in `invalid`; a file without the three columns still parses; the verbatim client sample yields null metrics on every `Corsa` row
      6. `php artisan test --compact tests/Feature/Garmin/ParseGarminCsvTest.php`

      ## Completion Criteria
      - [ ] Both languages parse the three metrics into whole seconds/metres/bpm
      - [ ] Missing column, `--`, unreadable → that metric null, never `0`, row not counted invalid
      - [ ] Pending session uploads without the new keys still rebuild
      - [ ] Tests pass

      ## Test Data
      - N/A — no model/schema change; new CSV fixtures only

      ## Domain Docs
