    id: TASK-08
    title: "Carry each day's runs inside the cached heatmap grid"
    body: |-
      ## Description
      Build the per-run detail data with the grid, in one extra query per cache miss, so the detail and the grid share one cache entry and one invalidation.

      ## Files Involved
      - app/Data/Heatmap/DayRun.php (new — `php artisan make:class Data/Heatmap/DayRun --no-interaction`)
      - app/Support/Heatmap/DailyRuns.php (new)
      - app/Data/Heatmap/DayCell.php
      - app/Support/Heatmap/HeatmapBuilder.php
      - app/Support/Heatmap/HeatmapGridCache.php
      - app/Http/Controllers/DashboardController.php
      - config/cache.php (`serializable_classes`)
      - tests/Unit/Data/Heatmap/DayRunTest.php (new), tests/Unit/Data/Heatmap/DayCellTest.php, tests/Unit/Support/Heatmap/HeatmapBuilderTest.php, tests/Feature/Dashboard/HeatmapGridCacheTest.php

      ## Steps
      1. `DayRun` (final readonly, scalars only, `fromActivity(Activity)` factory using `Activity::stravaUrl()`): formatting methods `kilometres()`, `movingTime()`, `pace()`, `ascent()`, `heartRate()`, `accessibleSummary()`; `—` for null
      2. `DailyRuns`: one query — `select` the needed columns, window bounds on `activity_date`, `orderBy('start_date_local')` — grouped by date; block comment on the query shape (no relation, no per-day query)
      3. `DayCell`: `array<int, DayRun> $runs` + `hasDetail()`; `HeatmapBuilder` takes the runs map and attaches it only to `Ran` cells
      4. `HeatmapGridCache`: add a shape-version segment to the key (`heatmap:grid:v2:`) with a block comment on the uninitialized-readonly failure mode; add `DayRun` to `cache.serializable_classes`
      5. `DashboardController`: the cached build closure calls `DailyRuns` beside `DailyRunningDistance`
      6. Unit tests: `DayRun` formatting (`5:23 /km`, `45 m`, `152 bpm`, `—`, `8.3 km`), builder attaches runs only to ran days and in start order, cache key changed, the cached grid round-trips through a serializing store
      7. `php artisan test --compact tests/Unit/Data/Heatmap tests/Unit/Support/Heatmap tests/Feature/Dashboard`

      ## Completion Criteria
      - [ ] One query for the runs per cache miss; no N+1
      - [ ] Runs live inside the cached grid; sync and import invalidation cover the detail with no new call site
      - [ ] Old cache entries cannot break the dashboard after deploy
      - [ ] Tests pass

      ## Test Data
      - N/A — no model/schema change in this task

      ## Domain Docs
      - [ ] `.larapilot/docs/devs/heatmap-dashboard.md`: technical design (DayRun, DailyRuns, runs inside the cached grid), architectural choice (in-grid vs JSON-on-open, rejected), cache key version invariant
