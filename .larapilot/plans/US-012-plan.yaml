code: US-012
plan_body: |
  **Release:** 2.0.0

  ## Technical Solution

  US-012 adds three per-run metrics — average pace, total ascent, average heart rate — to both import paths and surfaces them in a new day cell detail (FR-011). Delivery target is MVP: one thin vertical slice, no new package, no new JS dependency, no queue.

  ### Data model (🗄️ Mike)
  - One reversible migration on `activities`: nullable `unsignedInteger` columns `average_pace_seconds_per_km`, `total_ascent_meters`, `average_heart_rate`. `NULL` means "the source did not record it" — never `0`. No index: no query filters or sorts on them; every read still goes through `(user_id, activity_date)`.
  - `down()` drops the three columns (SQLite drop column is supported by the installed Laravel); lossless for every other column.
  - The existing integer PKs stay (existing schema; the UUID default applies to new models only — no new model here).

  ### Strava path (🔗 Matt) — FR-003, FR-002
  - `App\Data\StravaActivity` gains `?int $averagePaceSecondsPerKm`, `?int $totalAscentMeters`, `?int $averageHeartRate`, cast defensively in `fromApiPayload()`:
    - pace = `round(1000 / average_speed)` when `average_speed` is numeric and `> 0`; otherwise null (zero/absent speed).
    - ascent = `round(total_elevation_gain)` when numeric and `>= 0`; otherwise null.
    - heart rate = `round(average_heartrate)` when numeric and `> 0`; Strava omits the key when no HR was recorded → null.
  - `toAttributes()` carries the three keys, so `ReconcileStravaWindow`'s existing `updateOrCreate` backfills Strava runs stored before this spec on the next sync. Side effect, documented: the first sync after deploy reports those rows as upserted once (they really changed).
  - Garmin-won twins are still skipped before any write (`$garminOwnedIds`), so the sync never reverts a Garmin-won run's metrics. A late-linked Garmin-new twin keeps writing only `strava_activity_id`: Garmin's metrics stay, empty ones included (invariant recorded in the domain doc).
  - Scope `activity:read_all` already returns the three fields — no OAuth change, no `.env.example` change.

  ### Garmin path (FR-018)
  - `GarminCsvColumns` gains three **optional** keys per language — `avg_pace` (`Passo medio` / `Avg Pace`), `total_ascent` (`Ascesa totale` / `Total Ascent`), `avg_hr` (`FC Media` / `Avg HR`). They join `OPTIONAL_KEYS`, so they never take part in language detection and a file without them still imports. English names per decision `98fe4bd16f3263d6` (fixture headers, not yet confirmed by a real English export).
  - `ParseGarminCsv` reads them per row with three private parsers that return `null` for missing column, `''`, `--`, or anything unreadable — never an `invalid` row:
    - pace: `m:ss` or `h:mm:ss` (reuse the `durationSeconds()` grammar) → seconds per km; `0` → null.
    - ascent: digits with `,` thousands separators and an optional decimal → rounded whole metres.
    - heart rate: digits with an optional decimal → rounded whole bpm; `0` → null.
  - `GarminCsvRow` gains the three nullable ints; `toAttributes()` includes them; `toSessionArray()` / `fromSessionArray()` carry them with `?? null` defaults so a pending upload serialized before the deploy still confirms. Identity (`isIdenticalTo`, `identityKey`) is unchanged: metrics are not part of what makes a run "the same run".
  - `GarminCsvRow::metricAttributes()` returns only the metrics the CSV actually holds (non-null). It is what both rules below are built from.
  - `GarminImportPlan` keeps, for each already-imported row, the stored `Activity` it matched (new `alreadyImportedActivities` map, row index => Activity). The fingerprint is unchanged (it already hashes the already-imported indexes).
  - `ApplyGarminImport`, inside the existing transaction:
    - **Overwrite**: `fill(toAttributes() minus the null metrics)` — a `--` metric keeps the stored value; everything else is Garmin's as today.
    - **Already imported**: fill only the stored metrics that are null with the CSV's non-null ones; `save()` only when dirty. Nothing set is ever changed, so re-importing the same file changes nothing.
    - The grid cache is forgotten whenever anything was written, backfill-only imports included.
    - Summary counts are unchanged; a backfilled run still counts as "already imported" (no new counter — not in the spec).
  - Review page: pace, ascent, heart rate side by side for the stored run and the CSV row, via new `GarminImportFormat::pace()`, `ascent()`, `heartRate()` that print `—` for null.

  ### Day cell detail (✨ Joe, 🎨 Elise) — FR-011, FR-008, FR-009, FR-017
  - New `App\Data\Heatmap\DayRun` (final readonly, scalars only): name, distance metres, moving seconds, the three metrics, `?string $stravaUrl` (from `Activity::stravaUrl()`, so the FR-008 rule stays in one place). Formatting lives on the DTO — `kilometres()` (`8.3 km`), `movingTime()`, `pace()` (`5:23 /km`), `ascent()` (`45 m`), `heartRate()` (`152 bpm`), each `—` when null — so Blade does no arithmetic, like `DayCell`.
  - New `App\Support\Heatmap\DailyRuns`: **one** query per cache miss — `select` of the needed columns for the window, `orderBy('start_date_local')`, grouped in PHP by `activity_date` into `array<string, array<int, DayRun>>`. No relation is loaded, so no N+1. Expected volume: ≤ a few hundred rows per 112-day window.
  - `DayCell` gains `array $runs` (`array<int, DayRun>`, empty for rest/future) and `hasDetail()` (true only for `Ran` with runs). `HeatmapBuilder` receives the runs map beside `$dailyMeters`; `DailyRunningDistance` stays the source of the distance totals (unchanged, tested aggregate).
  - Cache: the runs are built **inside** the cached grid, so the detail and the grid share one entry and one invalidation (sync and import already call `HeatmapGridCache::forget`). `DayRun` joins `cache.serializable_classes`. The key gets a shape version (`heatmap:grid:v2:…`): an old cached `DayCell` unserialized without `$runs` would leave a readonly property uninitialized and fail in Blade until the 24 h TTL expires — the existing "incomplete class = miss" guard does not catch that case.
  - Blade: a ran-day cell becomes a `<button type="button">` filling the `<td>` (the sr-only accessible name moves inside it; `aria-haspopup="dialog"`, `aria-controls`). Rest and future cells stay static. The detail is a native `<dialog>` per ran day, server-rendered after the table in a new `<x-day-detail>` component: heading with the date and the day total, one block per run (`<dl>` with unit-labelled values), "View on Strava" link for Strava runs only (`target="_blank" rel="noopener"`), close button 44 × 44 px.
  - JS: a small delegated handler in `resources/js/app.js` (existing style) — click on `[data-day-detail]` → `showModal()`; the dialog's `close` event returns focus to the cell that opened it. Esc is native to `<dialog>`; Enter/Space are native to `<button>`. No Alpine, no Livewire, no package.
  - Layout per the US-012 mockup: bottom sheet at 375 px (full width, no horizontal page scroll), centred dialog from `sm`; light and dark from the existing tokens; motion only under `prefers-reduced-motion: no-preference`. Cell size is unchanged: at 320 px cells are ≈ 26 px, above the WCAG 2.2 AA 24 × 24 px target minimum, so the grid is not shrunk (heatmap-dashboard README → "tap-through to a day drawer").
  - Signed-out visitors get the same detail (accepted privacy risk, PRD Privacy & legal). The dashboard path stays read-only by structure: no new write, no Strava call — the detail is part of the page already rendered.

  ### Personal data (⚖️ Violet)
  Average heart rate is health data. The PRD records showing it to signed-out visitors as an accepted privacy risk on a single-owner, `noindex` instance; this spec adds no new processor, no export, no log of the values. No new legal page or consent surface.

  ### Coordination with the other 2.0.0 specs
  US-013 (window navigation) will touch `HeatmapWindow`, `ParseGarminCsv`'s window filter, and the cache key; US-014 adds the trend beside the grid. US-012 keeps its changes to those files minimal (new optional columns in the parser; a version segment in the cache key) so whichever lands second rebases with small, local conflicts — Sarah runs `release-sync` / rebases onto `release/2.0.0` before review.

  ### Rejected alternatives
  - Fetch the detail over a JSON route on open — a second cache, a second invalidation path, and a request per tap; rejected (spec: same invalidation as the grid).
  - Alpine/Livewire for the drawer — the app has neither; rejected (Joe's note).
  - Shrinking cells to 44 px targets — breaks the 320 px grid; rejected (mockup README).
  - Storing pace as speed or as a float — the spec fixes whole seconds per km.

  ## Git & Branching
  - Mode: GITFLOW (no automatic push)
  - Release: 2.0.0 — TASK-00 runs `php artisan larapilot:release-feature --semver=2.0.0 --spec=US-012 --slug=run-metrics-day-detail` (it opens `release/2.0.0`, still `planned`); branch `feature/US-012-run-metrics-day-detail` from `release/2.0.0`
  - Per task: one Conventional Commit `type(US-012): TASK-NN …`; code, tests, and domain docs in the same commit
  - PR toward `release/2.0.0`, prepared locally; push/remote PR only if the user asks
  - Merge after `larapilot-review` approval; Sarah syncs with `release-sync` if `develop` or sibling 2.0.0 features moved

  ## Test Data Strategy
  - Alex/Mike update `ActivityFactory`: the definition fills realistic metrics derived from the run (pace = moving time / km, ascent 5–180 m, heart rate 135–172 bpm); new states `withoutMetrics()` (Garmin `--` sample behaviour) and `withoutHeartRate()` (Strava run with no HR strap); `garminImported()` keeps metrics unless combined with `withoutMetrics()`
  - `TrainingBlockSeeder` (the 68-day demo block): most runs carry all three metrics; a handful have no heart rate; two Garmin-imported days with empty metrics; one day with two runs (one Strava with a link, one Garmin without) so the detail demo shows every state
  - New fixtures: `tests/Fixtures/Garmin/activities-it-metrics.csv`, `activities-en-metrics.csv` (metric values, a thousands-separated ascent, an `h:mm:ss` pace, one unreadable pace); the verbatim client sample `activities-it.csv` stays the `--` case
  - `php artisan migrate:fresh --seed` before the entity task's `task-done`

  ## Test Strategy
  - Bar: NORMAL — PHPUnit feature and unit tests (the project uses PHPUnit, not Pest); no Playwright, Dusk, browser, or viewport suites
  - Strava: `Http::fake()` + `Http::preventStrayRequests()` in `setUp()`; runs with/without HR, zero/absent speed, backfill of a stored run, Garmin-won twin untouched
  - Garmin: Italian and English metric fixtures, sample `--` rows → null (never 0), unreadable metric → row imported, not invalid; Overwrite keeps stored value on `--`; backfill of an already-imported run; second re-import changes nothing; review page shows the three metrics side by side
  - Dashboard: ran-day cells are buttons, rest/future are not; detail content for a Strava run (link) and a Garmin run (no link); `—` for missing; signed-out view writes no row and makes no HTTP call; detail reflects a sync and a confirmed (backfill-only) import
  - Unit: `StravaActivity::fromApiPayload` metric casting, `DayRun` formatting, `HeatmapBuilder` runs per cell, Garmin metric parsers
  - Manual test handoff (Anne, in the review notes): 320/375/768/1280 px, keyboard (Tab to a cell, Enter/Space opens, Esc closes and focus returns), VoiceOver read-out, light and dark contrast
  - Gate: `php artisan larapilot:quality` (Pint + Larastan level 5) green before review
