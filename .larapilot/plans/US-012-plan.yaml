    id: TASK-03
    title: 'Store pace, ascent and heart rate from the Strava sync'
    body: |-
      ## Description
      Carry `average_speed`, `total_elevation_gain`, and `average_heartrate` across the Strava boundary as whole-number metrics, so the nightly sync stores them for new runs and backfills runs already stored (FR-003), without touching Garmin-won twins (FR-002).

      ## Files Involved
      - app/Data/StravaActivity.php
      - app/Actions/Strava/ReconcileStravaWindow.php (comment only, unless a change proves necessary)
      - tests/Unit/Data/StravaActivityTest.php

      ## Steps
      1. Add `?int $averagePaceSecondsPerKm`, `?int $totalAscentMeters`, `?int $averageHeartRate` to the constructor; cast in `fromApiPayload()` per the plan (pace `round(1000 / speed)` only when speed is numeric and `> 0`; ascent rounded when numeric and `>= 0`; HR rounded when numeric and `> 0`; otherwise null) with a block comment on why zero speed is "not recorded", not "infinitely slow"
      2. Add the three keys to `toAttributes()` and its array-shape docblock
      3. In `ReconcileStravaWindow`, add a block comment above the Garmin-won `continue` and the late-twin link stating that neither path writes metrics, and why
      4. Unit tests: all three present; HR absent; speed `0` and absent; non-numeric values; rounding (`2.86 m/s` → 350 s/km, `45.6 m` → 46, `151.7` → 152)
      5. `php artisan test --compact tests/Unit/Data/StravaActivityTest.php`

      ## Completion Criteria
      - [ ] Strava runs carry the three metrics after a sync; missing values stay null
      - [ ] Already-stored Strava runs gain them through the existing `updateOrCreate`
      - [ ] Garmin-won twins and late-linked Garmin runs keep their metrics
      - [ ] No OAuth scope or config change
      - [ ] Tests pass

