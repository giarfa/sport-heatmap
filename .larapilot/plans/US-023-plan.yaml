    id: TASK-01
    title: 'Schema: 27 nullable extended-metric columns on activities, model casts, factory states, seeder'
    assignee: Mike
    estimate_hours: 3
    dependencies:
      - TASK-00
    type: Impl
    status: DONE
    body: |
      ## Description
      Add the extended run metrics of FR-022 to `activities`: only nullable columns, no default, no index, every stored run and value kept. Make them mass-assignable and typed on `Activity`. Keep the factory and the demo dataset coherent in this same task. Column names, types, and units follow the **Columns** table of the plan body.

      ## Files Involved
      - `database/migrations/2026_11_14_xxxxxx_add_extended_metrics_to_activities_table.php` (`php artisan make:migration add_extended_metrics_to_activities_table --table=activities --no-interaction`)
      - `app/Models/Activity.php` — `#[Fillable]` gains the 27 columns (identity columns stay out); `casts()` adds `integer` / `float` / `string`; the class `@property int|null` / `float|null` / `string|null` docblock lists every new column (`.ai/rules/models.md`)
      - `database/factories/ActivityFactory.php` — `withExtendedMetrics()`, `withApiOnlyMetrics()`, `withTrainingStressScore()`; the default definition unchanged
      - `database/seeders/TrainingBlockSeeder.php`
      - `tests/Feature/Database/ExtendedRunMetricsMigrationTest.php` (new), `tests/Feature/Database/SchemaTest.php`, `tests/Feature/Database/TrainingBlockSeederTest.php`

      ## Steps
      1. Migration `up()`:
         - add the columns in the order of the plan table: decimals as `decimal(p,1)`, elevations as signed `integer`, `location_name` as `string(255)`, all `->nullable()`
         - a `/* */` block states why there is no default and no index (`NULL` = not recorded, `0` would read as a measurement; read only with the run's row), mirroring `add_run_metrics_to_activities_table`
         - `down()` drops exactly the 27 new columns
      2. `Activity`: fillable, casts (decimal columns ⇒ `float`), docblock. `user_id`, `source`, and `garmin_activity_id` stay non-fillable.
      3. Factory states:
         - `withExtendedMetrics()` — values derived from the run's own distance, moving time, and pace (see the plan **Test Data Strategy**), all one-decimal values pre-rounded
         - `withApiOnlyMetrics()` — zones 1–5 summing ≤ elapsed, `fastest_1k_seconds` only when ≥ 1 km, `fastest_mile_seconds` only when ≥ 1,609 m, `fastest_5k_seconds` only when ≥ 5 km, and a location name such as `Lazise`, `Verona`, or `Bolzano`
         - `withTrainingStressScore()`
      4. `TrainingBlockSeeder`:
         - API-synced last 4 weeks ⇒ `withExtendedMetrics()->withApiOnlyMetrics()`
         - CSV middle weeks ⇒ `withExtendedMetrics()`, about 20% `withTrainingStressScore()`
         - oldest metric-less weeks unchanged (the older export that a re-import enriches)
      5. Tests:
         - `ExtendedRunMetricsMigrationTest` — the 27 columns exist and are nullable; a run stored before the migration keeps every value and reads null extended metrics; `down()` removes only the 27 and keeps every row and every other column
         - `SchemaTest` asserts no latitude/longitude column on `activities`
         - `TrainingBlockSeederTest` asserts:
           - recent synced runs carry zones, splits, and a location
           - some CSV runs carry TSS
           - the oldest runs carry no extended metric
           - every seeded run satisfies `elapsed ≥ moving` and `min ≤ max` elevation
      6. Verify on the in-memory DB: `php artisan test --compact --filter='SchemaTest|ExtendedRunMetricsMigrationTest|ActivityTest|TrainingBlockSeederTest|SeederMeetsMigrationOwnerTest'`. **Never `migrate:fresh --seed` on the dev DB.** To apply on dev, copy `database/database.sqlite` aside, then run `php artisan migrate`.
      7. `vendor/bin/pint --dirty --format agent`

      ## Completion Criteria
      - [x] Migration adds only the 27 nullable columns; `down()` drops only them; existing runs and values are kept (test)
      - [x] `Activity` fillable, casts, and `@property` docblock are in sync with the migration (Larastan level 5 clean)
      - [x] Factory states produce coherent, domain-realistic extended metrics; the default definition is unchanged
      - [x] Seeder yields runs with CSV+API metrics, CSV-only TSS, and no metrics, and its test asserts each
      - [x] No coordinate column exists
      - [x] Targeted tests pass on the in-memory DB

      ## Test Data
      - [x] `database/factories/ActivityFactory.php` updated (`withExtendedMetrics()`, `withApiOnlyMetrics()`, `withTrainingStressScore()`)
      - [x] `TrainingBlockSeeder` composes the new states with meaningful volumes
      - [x] Factory and seeder updated in **this same task** as the migration

      ## Domain Docs
      - [x] `.larapilot/docs/devs/garmin-csv-import.md` — `### Data model (activities)` lists the 27 columns with unit, type, and empty rule; the `Architectural choices` section records columns vs JSON vs 1:1 table and why
      - [x] `.larapilot/docs/devs/README.md` index row for `garmin-csv-import` → last touched by `US-023`
      - [x] English, committed with this task

      ## Git Deliverables
      - Commit: `feat(US-023): TASK-01 add extended run metric columns with factory and seeder`
      - Push: **skip** (`git_mode: GITFLOW`)
      - PR: update the local PR notes toward `release/3.1.0`; open or update the remote only if the user asks
