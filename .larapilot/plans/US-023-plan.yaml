      - [x] Null, missing, or unreadable API fields ⇒ the metric is empty, and the activity is still stored
      - [x] A linked CSV run gains the API values and keeps its TSS and any CSV-only value
      - [x] No coordinate is read or stored
      - [x] Existing sync tests pass unchanged; a second sync changes nothing

