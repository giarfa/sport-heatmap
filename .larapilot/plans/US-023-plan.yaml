    status: DONE
    body: |
      ## Description
      A Garmin sync stores the extended metrics of every run it reads (FR-022, FR-002), a linked CSV run included. A null or unreadable API field leaves the metric empty and never makes the activity invalid. The CSV-only Training Stress Score of a linked run is kept. No start or end coordinates are read.

      ## Files Involved
      - `app/Data/Garmin/ExtendedRunMetrics.php` — `fromApiPayload(array<string, mixed>)`:
        - numeric fields accept int|float only; anything else ⇒ null
        - same bounds and "0 ⇒ null" as the Columns table
        - `maxSpeed` (m/s) ⇒ `best_pace_seconds_per_km = round(1000 / v)`
        - `avgStrideLength` is already cm
        - `elapsedDuration`, `hrTimeInZone_N`, and `fastestSplit_*` are rounded to whole seconds
        - `locationName` is trimmed, cut at 255, `''` ⇒ null
        - TSS is always null (not an API field)
      - `app/Data/Garmin/GarminApiActivity.php`:
        - new `ExtendedRunMetrics $extendedMetrics = new ExtendedRunMetrics` parameter, filled in `fromApiPayload()`
        - `metricAttributes()` spreads `toAttributes()`; the `toRunAttributes()` PHPDoc shape is updated
        - a `/* */` block: coordinates (`startLatitude`, …) are deliberately not read
      - `tests/Fixtures/Garmin/api/activities-page-mixed.json`:
        - every running activity gains realistic extended fields **and** `startLatitude` / `startLongitude` / `endLatitude` / `endLongitude`
        - one running activity carries `null` for every extended field
        - one carries strings/garbage
        - non-running entries unchanged
      - `app/Actions/Garmin/SyncGarminActivities.php` — **no logic change expected**; update the comment on the update/link paths so it names the extended metrics ("a metric the API leaves empty, including the CSV-only TSS, is never blanked")
      - `.env.example` / `config/services.php` — no change (no new configuration)

      ## Steps
      1. Implement `fromApiPayload()` with `/* */` blocks for the unit normalisation (stride already cm, best pace from speed) and for why coordinates are skipped.
      2. Wire `GarminApiActivity` as listed. Its required-field validation is unchanged: an extended field never invalidates an activity.
      3. Confirm with the existing `GarminSyncTest` and `GarminApiActivityTest` that create, link, and update still behave the same. A second sync over the same page must leave `updated` at 0: one-decimal rounding at the boundary keeps `isDirty()` false.
      4. `php artisan test --compact --filter='GarminApiActivityTest|GarminSyncTest|GarminSyncCommandTest|SyncGarminNowTest'`
      5. `vendor/bin/pint --dirty --format agent`

      ## Completion Criteria
