code: US-023
plan_body: |
  **Release:** 3.1.0

  ## Technical Solution

  US-023 enriches every stored run with the extended metrics Garmin records (FR-022), from both entry points, without changing what the dashboard shows. It extends the two existing paths and adds no new flow:

  - **CSV import (FR-018)** — `GarminCsvColumns` learns the extended headers as optional keys in both languages, `ParseGarminCsv` reads them, and `GarminCsvRow` carries them. The existing "fill only empty metrics of an already-imported run" step in `ApplyGarminImport` becomes the **enrichment** path, now counted and reported.
  - **API sync (FR-002)** — `GarminApiActivity::fromApiPayload()` maps the extended API fields. `SyncGarminActivities` already writes `toRunAttributes()` on create, link, and update, so the extended values flow through with no change to the action.

  ### One value object for the extended metrics (John)

  A new `App\Data\Garmin\ExtendedRunMetrics` final readonly DTO holds the 27 nullable values. It has two named factories that do all the defensive parsing at the boundary (`.ai/rules/data.md`):
  - `fromCsvValues(array<string, string> $raw)` — canonical key ⇒ raw cell text
  - `fromApiPayload(array<string, mixed> $payload)`

  It also provides:
  - `toAttributes()` — **only the non-null values**, keyed by column
  - `toSessionArray()` / `fromSessionArray()` — compact: only the non-null keys, and missing keys read as null, so an upload parked before the deploy still confirms

  `GarminCsvRow` and `GarminApiActivity` each gain one `public ExtendedRunMetrics $extendedMetrics = new ExtendedRunMetrics` constructor parameter. Their `metricAttributes()` spreads `...$this->extendedMetrics->toAttributes()`. That single change carries the existing invariants to the new columns:
  - a `--` / null never blanks a stored value: Overwrite, link, and update all fill only the keys present
  - the metrics stay outside run identity (`isIdenticalTo()` / `identityKey()`), so a re-import still recognises its runs
  - the CSV-only Training Stress Score of a linked run is never touched by a sync, because the API attributes never carry that key

  Rejected alternatives:
  - 27 more constructor arguments on each DTO: duplicated parsing, unreadable signatures
  - one JSON `extended_metrics` column: no per-metric "fill only empty", no casts, opaque to Larastan, and the AC demands nullable columns
  - a separate `activity_metrics` 1:1 table: an extra join for data no page reads yet

  Shared CSV number parsing moves out of `ParseGarminCsv` into `App\Support\Garmin\GarminCsvValues`, a final class of static, pure parsers that both the parser and the DTO use, so there is one parser per value shape:
  - `thousands-separated number`
  - `duration`
  - `pace`
  - `signed number`
  - `left balance`

  `ParseGarminCsv` keeps its behaviour for the existing columns, guarded by the existing tests.

  ### Columns (all nullable, no default, no index — read only with the run's own row)

  | Column | Type | CSV (it / en) | API | Rule |
  | --- | --- | --- | --- | --- |
  | `calories` | unsigned int | `Calorie` / `Calories` | `calories` | whole kcal, 0 ⇒ null, ≤ 20,000 |
  | `max_heart_rate` | unsigned small int | `FC max` / `Max HR` | `maxHR` | whole bpm, 0 ⇒ null, ≤ 250 |
  | `aerobic_training_effect` | decimal(3,1) | `TE aerobico` / `Aerobic TE` | `aerobicTrainingEffect` | 0.0–5.0, one decimal (0.0 is a real Garmin reading) |
  | `average_running_cadence` / `max_running_cadence` | unsigned small int | `Cadenza di corsa media` / `max` · `Avg Run Cadence` / `Max Run Cadence` | `averageRunningCadenceInStepsPerMinute` / `maxRunningCadenceInStepsPerMinute` | whole spm, 0 ⇒ null, ≤ 400 |
  | `best_pace_seconds_per_km` | unsigned int | `Passo migliore` / `Best Pace` | from `maxSpeed` (m/s) ⇒ `round(1000 / v)` | same rule as average pace |
  | `total_descent_meters` | unsigned int | `Discesa totale` / `Total Descent` | `elevationLoss` | whole m, 0 kept, ≤ 20,000 |
  | `average_stride_length_cm` | decimal(5,1) | `Lunghezza media passo` / `Avg Stride Length` (**metres**, `1.00`) | `avgStrideLength` (**centimetres**) | **normalised to cm**, one decimal, 0 ⇒ null, ≤ 500 |
  | `average_vertical_ratio_percent` | decimal(4,1) | `Rapporto verticale medio` / `Avg Vertical Ratio` | `avgVerticalRatio` | one decimal, 0 ⇒ null, ≤ 100 |
  | `average_vertical_oscillation_cm` | decimal(4,1) | `Oscillazione verticale media` / `Avg Vertical Oscillation` (cm, `9.6`) | `avgVerticalOscillation` (cm) | cm, one decimal, 0 ⇒ null, ≤ 50 |
  | `average_ground_contact_time_ms` | unsigned small int | `Tempo medio di contatto con il suolo` / `Avg Ground Contact Time` | `avgGroundContactTime` | whole ms, 0 ⇒ null, ≤ 2,000 |
  | `average_ground_contact_balance_left_percent` | decimal(4,1) | `Bilanciamento TCS medio` / `Avg GCT Balance` (`49.8% S / 50.2% D`, `49.8% L / 50.2% R`) | `avgGroundContactBalance` | the **left** share, one decimal, 0 ⇒ null, ≤ 100 |
  | `steps` | unsigned int | `Passi` / `Steps` (`8,240`) | `steps` | whole, 0 ⇒ null, ≤ 1,000,000 |
  | `lap_count` | unsigned small int | `Numero di Lap` / `Number of Laps` | `lapCount` | whole, 0 ⇒ null, ≤ 10,000 |
  | `elapsed_time_seconds` | unsigned int | `Tempo trascorso` / `Elapsed Time` | `elapsedDuration` | whole s, 0 ⇒ null, ≤ 36,000,000 |
  | `min_elevation_meters` / `max_elevation_meters` | **signed** int | `Quota minima` / `Quota massima` · `Min Elev` **or** `Min Elevation` / `Max Elev` **or** `Max Elevation` (`1,065`) | `minElevation` / `maxElevation` | whole m, 0 and negatives kept, −500…9,000 |
  | `training_stress_score` | decimal(6,1) | `Training Stress Score®` (both) | — | one decimal, **0.0 ⇒ null** (every real local export writes `0.0` when no power data exists), ≤ 10,000 |
  | `hr_zone_1_seconds` … `hr_zone_5_seconds` | unsigned int | — | `hrTimeInZone_1` … `_5` | whole s, 0 kept (a real zero), ≤ 36,000,000 |
  | `fastest_1k_seconds` / `fastest_mile_seconds` / `fastest_5k_seconds` | unsigned int | — | `fastestSplit_1000` / `_1609` / `_5000` | whole s, 0 ⇒ null, ≤ 36,000,000 |
  | `location_name` | string(255) | — | `locationName` | trimmed, `''` ⇒ null, cut at 255 |

  Decimal columns are cast `float`; every value is rounded to one decimal **at the DTO boundary**, so a second sync or re-import compares equal and `isDirty()` stays false. Eloquent compares `float` casts with an epsilon.

  **Formats were read off nine real Italian exports during planning:** thousands separators in calories, steps, and elevation; `S`/`D` balance letters; stride in metres; TSS always `0.0`. The committed sample `client-materials/Activities (1).csv` is an anonymised copy in which every extended column is `--` except `Tempo trascorso`. Its import therefore stores **elapsed time only** and leaves the rest null. New synthetic fixtures (`activities-it-extended.csv`, `activities-en-extended.csv`) carry populated values in the real formats.

  **English headers** (decision journal: *us-023 english garmin extended headers*): standard Garmin English names. Where Garmin's spelling varies, both are accepted (`Min Elev` / `Min Elevation`, `Max Elev` / `Max Elevation`, balance letters `L`/`R`). They are not yet confirmed by a real English export, so they are flagged as unconfirmed in the domain doc. A real export later is a one-line fix in `GarminCsvColumns`. Header lookup moves from one text per key to a **list of accepted texts per key**. Extended keys are optional and never count toward language detection.

  **No coordinates.** `startLatitude`, `startLongitude`, `endLatitude`, and `endLongitude` are never read. The API fixture carries them, and a test proves no column receives them and the schema has no latitude/longitude column.

  ### Enrichment (FR-022 "reported as enriched")

  `ApplyGarminImport::fillEmptyMetricsOfAlreadyImportedRuns()` returns how many already-imported runs gained at least one metric. `GarminImportSummary` gains `enriched`. The two counts partition the already-imported rows:
  - `alreadyImported` — identical rows that changed nothing
  - `enriched` — identical rows that filled at least one empty metric

  `fromSessionArray()` reads a missing `enriched` as 0. The rule is unchanged: a stored value is never replaced, so a second re-import enriches 0 and writes nothing. Enrichment covers both the 3 US-012 metrics and the 27 new ones, through one code path.

  The **import summary page** gains one `Enriched` tally row, and its lede counts enrichment as a change. This is a motivated deviation from the US-008 `summary.html` mockup (required by the AC). It is logged with `decision-log --topic="mockup deviation"` and a `## Deviations` row in `.larapilot/mockups/US-008/README.md`. **No other screen changes**: the day cell detail, grid, legend, scale, and trend are untouched. `DailyRuns` already selects only the columns `DayRun` reads, so neither the grid cache nor the views ever see an extended value.

  ### Sync (no action change)

  - `SyncGarminActivities` keeps its shape: `toRunAttributes()` now includes the extended keys
  - update path: an API-linked run whose extended values differ is saved and counted `updated` once, and a second sync changes nothing
  - link path: a CSV run gains the API values and keeps its TSS
  - known limit, documented: a later sync re-reads only the last 7 days, so API runs synced **before** this deploy outside that window keep empty API-only metrics (zones, splits, location). Production is unaffected because 3.1.0 ships US-022 and US-023 together and the first production sync reads the whole history. Only the dev database holds such runs.

  ### Query shape

  - no new reads on hot paths
  - import planning keeps its single `(user_id, activity_date)` query, and enrichment reuses the stored runs the plan already holds (`alreadyImportedActivities`): no extra query per row
  - sync keeps one query per page
  - session payload stays compact because only non-null extended keys are parked (5,000-row bound unchanged)

  ## Git & Branching
  - Mode: `GITFLOW` — no automatic push
  - Release: **3.1.0** — the branch comes from `release/3.1.0`, and the PR targets `release/3.1.0`
  - TASK-00 first (decision journal: *us-022 merge before us-023*):
    1. commit the pending `.larapilot/` artifacts on `feature/US-022-garmin-connect-sync`
    2. merge that approved branch into `release/3.1.0` locally (`--no-ff`, no push)
    3. `php artisan larapilot:release-feature --semver=3.1.0 --spec=US-023 --slug=extended-run-metrics`
  - Per task: one Conventional Commit `type(US-023): TASK-NN …`, with code, tests, and domain docs together
  - Push and remote PR: only when the user asks in-session
  - Merge into `release/3.1.0` after `larapilot-review` approval

  ## Test Data Strategy
  - **Mike/Alex** keep `ActivityFactory` and `TrainingBlockSeeder` current in TASK-01, the same task as the migration
  - `ActivityFactory::withExtendedMetrics()`: the CSV-and-API metrics, coherent with the run:
    - `elapsed ≥ moving time`
    - `best pace < average pace`
    - `steps ≈ cadence × minutes`
    - `descent ≈ ascent`
    - `min ≤ max elevation`
  - `ActivityFactory::withApiOnlyMetrics()`:
    - HR zones summing to at most the elapsed time
    - fastest splits only for distances the run covers
    - a location name
  - `ActivityFactory::withTrainingStressScore()`
  - The default definition stays **without** extended metrics, so every existing test keeps its meaning
  - Demo dataset (`TrainingBlockSeeder`):
    - the last 4 weeks of API-synced runs carry CSV+API metrics and API-only metrics
    - the CSV runs of the middle weeks carry CSV extended metrics, and a few carry a TSS
    - the oldest weeks have none (the "older export" that a re-import enriches)
  - **Never `migrate:fresh --seed` on the dev database.** `database/database.sqlite` holds the owner's real runs and there is no `.env.testing`.
    - Seeders are verified by `TrainingBlockSeederTest` / `SeederMeetsMigrationOwnerTest` on the in-memory test DB (`phpunit.xml` ⇒ `:memory:`)
    - The additive migration reaches dev only through `php artisan migrate`, after copying `database/database.sqlite` aside

  ## Test Strategy
  - Bar: **NORMAL**, PHPUnit (`php artisan make:test --phpunit`), feature-first, no browser/E2E/viewport suites
  - **Anne** interleaves three test tasks: CSV parsing (TASK-03), import enrichment and screens (TASK-05), API mapping and sync (TASK-07)
  - Cases come straight from the acceptance criteria:
    - Italian and English extended columns
    - `--` and missing columns
    - unreadable and out-of-bound values (empty, never 0, row never rejected)
    - the sample export storing elapsed time only
    - enrichment and its idempotence
    - Overwrite keeping stored values on `--`
    - API mapping from a faked search response
    - linked CSV run keeping TSS
    - second sync no-op
    - no coordinates
    - dashboard unchanged
    - migration additive with a reversible `down()`
  - Existing suites (`ParseGarminCsvTest`, `GarminImportFlowTest`, `GarminSyncTest`, `Dashboard/*`) must pass **unchanged** except where a partitioned count is asserted
  - HTTP is faked with `Http::fake()` + `Http::preventStrayRequests()` in `setUp()`, and config is set with `Config::set()` (`.ai/rules/tests.md`)
  - Every page test signs in through `signInOwner()`
  - Manual test handoff in TASK-09:
    - re-import a real Italian export over the dev copy
    - a real `garmin:sync` on dev, comparing one linked run's CSV and API values to confirm the stride/oscillation unit normalisation
