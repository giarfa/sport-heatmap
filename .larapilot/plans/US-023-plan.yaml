    id: TASK-02
    title: 'ExtendedRunMetrics DTO, shared CSV value parsers, extended headers (it/en with aliases), CSV row wiring'
    assignee: Alex
    estimate_hours: 4
    dependencies:
      - TASK-01
    type: Impl
    status: DONE
    body: |
      ## Description
      Read the extended metrics out of Italian and English Garmin CSV exports into a typed DTO that rides on `GarminCsvRow`. A missing column, `--`, or an unreadable or out-of-bound value leaves that metric null and never rejects the row (FR-022, FR-018).

      ## Files Involved
      - `app/Data/Garmin/ExtendedRunMetrics.php` (new, `php artisan make:class Data/Garmin/ExtendedRunMetrics --no-interaction`) — final readonly; 27 nullable promoted properties; `fromCsvValues()`, `toAttributes()`, `toSessionArray()`, `fromSessionArray()`; `fromApiPayload()` is added in TASK-06
      - `app/Support/Garmin/GarminCsvValues.php` (new) — static pure parsers extracted from `ParseGarminCsv`:
        - `wholeNumber(string, min, max, zeroIsEmpty)` — strips `,` thousands separators; signed when `min < 0`
        - `oneDecimal(string, min, max, zeroIsEmpty)`
        - `durationSeconds(string)`
        - `paceSecondsPerKm(string)`
        - `leftBalancePercent(string)` — `49.8% S / 50.2% D` and `49.8% L / 50.2% R` ⇒ 49.8, the left side found by its letter (S/L) rather than by position
      - `app/Support/Garmin/GarminCsvColumns.php`:
        - `HEADER_SETS` values become `list<string>` of accepted header texts per key
        - extended keys are added to `OPTIONAL_KEYS`
        - `Min Elev` / `Min Elevation` and `Max Elev` / `Max Elevation` are aliases
        - a `/* */` block cites the decision *us-023 english garmin extended headers* (unconfirmed English names)
      - `app/Support/Garmin/ParseGarminCsv.php` — builds `ExtendedRunMetrics::fromCsvValues()` from the optional cells; existing pace/ascent/HR parsing delegates to `GarminCsvValues` with unchanged behaviour
      - `app/Data/Garmin/GarminCsvRow.php`:
        - new `ExtendedRunMetrics $extendedMetrics = new ExtendedRunMetrics` parameter
        - `metricAttributes()` spreads its `toAttributes()`
        - `toSessionArray()` adds a compact `extended` key, and `fromSessionArray()` reads it with `?? []`
        - the array-shape PHPDoc is updated
      - `app/Data/Garmin/ParsedGarminCsv.php` — only if its session shape PHPDoc names row keys
      - `tests/Fixtures/Garmin/activities-it-extended.csv`, `tests/Fixtures/Garmin/activities-en-extended.csv` (new) — **synthetic** values in the real formats observed in local exports:
        - `1,028` kcal
        - `8,240` steps
        - `1,065` / `1,100` elevation
        - `1.00` stride (metres)
        - `9.6` oscillation
        - `9.4` ratio
        - `302` GCT
        - `49.8% S / 50.2% D` balance
        - TSS `0.0` and one row with a real TSS such as `48.3`
        - one row of `--`
        - one row of unreadable values
        - the English file uses `Min Elev` / `Max Elev`
        - no real personal data

      ## Steps
      1. `GarminCsvValues`: move the number, duration, and pace helpers out of `ParseGarminCsv` unchanged, then add the signed, one-decimal, and balance parsers. Bounds and "0 ⇒ null" follow the plan's Columns table.
      2. `ExtendedRunMetrics::fromCsvValues()`: canonical key ⇒ raw text, and stride **metres × 100 ⇒ cm** (one decimal). `/* */` blocks explain:
         - the unit normalisation
         - TSS `0.0` ⇒ null
         - zero kept for descent, elevation, and TE
      3. `GarminCsvColumns`: accepted-text lists, optional extended keys, and language detection still driven only by the required keys.
      4. Wire `ParseGarminCsv` and `GarminCsvRow` as listed. Metrics stay out of `isIdenticalTo()` / `identityKey()`.
