    id: TASK-02
    title: 'Add the StravaTokens DTO and the StravaOAuth service'
    type: Impl
    status: DONE
    dependencies:
      - TASK-01
    body: |
      ## Description
      The single class that speaks to Strava's OAuth endpoints, plus the readonly DTO that carries a token
      set across the boundary so no array shape from Strava leaks into controllers or Eloquent (John).
      Hand-rolled on Laravel's `Http` facade — no new Composer dependencies (see the plan's
      "Why hand-rolled, not Socialite").

      ## Files Involved
      - app/Data/StravaTokens.php
      - app/Services/Strava/StravaOAuth.php
      - app/Exceptions/Strava/StravaOAuthException.php

      ## Steps
      1. `php artisan make:class Data/StravaTokens` — a `final readonly class` with promoted constructor
         properties: `string $accessToken`, `string $refreshToken`, `CarbonImmutable $expiresAt`,
         `?string $athleteId`, `?string $athleteName`, `array $scopes` (PHPDoc `array<int, string>`).
         Two named constructors:
         - `fromExchangeResponse(array $payload, string $grantedScope): self` — Strava's exchange response
           embeds the `athlete` object, so `athleteId` is `(string) $payload['athlete']['id']` and
           `athleteName` is firstname + lastname trimmed; `scopes` is `explode(',', $grantedScope)`
         - `fromRefreshResponse(array $payload, self $previous): self` — the refresh response carries **no**
           athlete object, so carry the athlete id, name and scopes forward from `$previous`
         - `expiresAt` comes from the `expires_at` **unix timestamp** Strava returns, not `expires_in`
         - Add `hasScope(string $scope): bool`
      2. `php artisan make:class Exceptions/Strava/StravaOAuthException` extending `RuntimeException`, with
         static factories `tokenEndpointFailed(int $status)` and `malformedTokenResponse(string $missingKey)`.
         The messages carry the **status and the missing key only** — never the response body, which holds
         live tokens
      3. `php artisan make:class Services/Strava/StravaOAuth` with three methods, all reading
         `config('strava.*')` and never `env()`:
         - `authorizationUrl(string $state): string` — `config('strava.authorize_url')` plus
           `http_build_query` of `client_id`, `redirect_uri`, `response_type=code`, `approval_prompt=auto`,
           `scope` (from config), `state`
         - `exchangeAuthorizationCode(string $code, string $grantedScope): StravaTokens` —
           `Http::asForm()->post(config('strava.token_url'), [...'grant_type' => 'authorization_code'])`
         - `refreshAccessToken(StravaTokens $current): StravaTokens` — same endpoint,
           `grant_type=refresh_token`; **returns the rotated refresh token**, because Strava issues a new one
           on every refresh and keeping the old one breaks the next call
      4. In both POST methods: on `$response->failed()` throw `StravaOAuthException::tokenEndpointFailed()`;
         assert `access_token`, `refresh_token` and `expires_at` are present or throw
         `malformedTokenResponse()`. Do not call `->throw()` — the wrapped exception is what the callback and
         the refresh middleware branch on
      5. `php artisan larapilot:quality --fix`

      ## Completion Criteria
      - [x] `StravaTokens` is `final readonly`, fully typed, with an `array<int, string>` PHPDoc on `$scopes`
      - [x] `StravaOAuth::authorizationUrl()` embeds the config scope and the caller's `state`
      - [x] Both token calls return a `StravaTokens` or throw `StravaOAuthException` — never a raw array, never a 500 from an unhandled Guzzle exception
      - [x] The refresh path returns Strava's rotated refresh token, not the one passed in
      - [x] No client secret, access token or response body reaches a log line or an exception message
      - [x] Pint and Larastan level 5 clean

      ## Test Data
      - N/A — no model or schema changes in this task

      ## Git Deliverables
      - Commit: `feat(US-002): TASK-02 add StravaTokens DTO and StravaOAuth service`
      - Push: **skip** (`git_mode: GITFLOW`)
      - PR: update the local PR notes
