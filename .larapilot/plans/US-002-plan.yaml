    id: TASK-08
    title: 'Add transparent token refresh and the reconnect state'
    type: Impl
    status: TODO
    dependencies:
      - TASK-06
    body: |
      ## Description
      The seam US-003's `StravaClient` will call before every Strava request, plus the failure mode: when the
      refresh token is dead the athlete gets an explicit reconnect screen, never a 500. Wiring it as
      middleware on the dashboard route gives US-002 an HTTP surface to demonstrate that against; it sends
      zero requests while the stored token is still valid.

      ## Files Involved
      - app/Actions/Strava/EnsureFreshAccessToken.php
      - app/Exceptions/Strava/StravaReconnectRequiredException.php
      - app/Http/Middleware/EnsureFreshStravaToken.php
      - bootstrap/app.php
      - routes/web.php
      - database/factories/UserFactory.php

      ## Steps
      1. `php artisan make:class Exceptions/Strava/StravaReconnectRequiredException` extending
         `RuntimeException`, with a `render(Request $request): Response` method: log the athlete out, invalidate
         and regenerate the session token, and return `response()->view('strava.connect', ['reconnect' => true], 200)`
         — the `$reconnect` flag TASK-06 built into the view. Rendering the connect screen rather than
         redirecting keeps the reason visible in one round trip
      2. `php artisan make:class Actions/Strava/EnsureFreshAccessToken` with `__invoke(User $user): string`:
         - no `strava_refresh_token` on the user → throw `StravaReconnectRequiredException`
         - `strava_token_expires_at` is null, past, or within `config('strava.token_refresh_margin_seconds')`
           of now → refresh; otherwise return the stored access token **without any HTTP call**
         - on refresh: call `StravaOAuth::refreshAccessToken()`, persist the **rotated** access *and* refresh
           tokens plus the new expiry, and return the new access token
         - catch `StravaOAuthException` and rethrow as `StravaReconnectRequiredException`, so callers have one
           failure type to handle. Log at warning level with the athlete id and HTTP status — never the tokens
      3. `php artisan make:middleware EnsureFreshStravaToken` — no-op for guests; for an authenticated user
         invoke the action and continue. Register the alias `strava.fresh` in `bootstrap/app.php`
         (`->withMiddleware(fn (Middleware $middleware) => $middleware->alias([...]))`) and attach it to the
         `dashboard` route in `routes/web.php`
      4. Add `UserFactory::stravaTokenExpiringSoon()` — builds on `stravaConnected()` with
         `strava_token_expires_at` inside the refresh margin but not yet past, so TASK-09 has a named fixture
         for the margin branch instead of an inline magic offset
      5. `php artisan larapilot:quality --fix`

      ## Completion Criteria
      - [ ] A valid, comfortably unexpired token results in **zero** HTTP requests
      - [ ] An expired token, and a token inside the safety margin, both trigger exactly one refresh
      - [ ] The rotated refresh token is persisted — the next refresh still works
      - [ ] A dead refresh token renders the connect screen in reconnect state, `200`, athlete logged out — not a 500
      - [ ] `UserFactory::stravaTokenExpiringSoon()` exists and `php artisan migrate:fresh --seed` still succeeds
      - [ ] No token value appears in any log line
      - [ ] Pint and Larastan level 5 clean

      ## Test Data
      - [ ] `database/factories/UserFactory.php` updated with the `stravaTokenExpiringSoon()` state, in this same task
      - [ ] Seeders unchanged — `TrainingBlockSeeder` already produces a Strava-connected athlete; re-verify `migrate:fresh --seed`
      - [ ] No migration or schema change

      ## Git Deliverables
      - Commit: `feat(US-002): TASK-08 refresh Strava tokens transparently and add the reconnect state`
      - Push: **skip** (`git_mode: GITFLOW`)
      - PR: update the local PR notes
