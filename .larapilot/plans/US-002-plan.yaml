  -
    id: TASK-04
    title: 'Add the athlete allowlist gate and the ConnectStravaAthlete action'
    type: Impl
    status: DONE
    dependencies:
      - TASK-02
    body: |
      ## Description
      The access decision and the only write path in the flow, split from the controller so both are unit
      testable and so the "allowlist first, persistence second" ordering is structural rather than a comment.

      ## Files Involved
      - app/Support/Strava/AthleteAllowlist.php
      - app/Actions/Strava/ConnectStravaAthlete.php

      ## Steps
      1. `php artisan make:class Support/Strava/AthleteAllowlist` with `allows(string $athleteId): bool` —
         `in_array($athleteId, config('strava.allowed_athlete_ids'), strict: true)`. Strict comparison
         matters: the config filter in US-001 keeps only all-digit **strings**, and a loose compare would let
         `0` match. An empty allowlist returns `false` for everything — the gate fails closed
      2. `php artisan make:class Actions/Strava/ConnectStravaAthlete` with
         `__invoke(StravaTokens $tokens): User`, wrapped in `DB::transaction`:
         - look the user up by `strava_athlete_id`; reuse it on reconnect, instantiate a new `User` on first
           connect — never a second row for the same athlete
         - assign `strava_athlete_id`, `strava_access_token`, `strava_refresh_token` and
           `strava_token_expires_at` **explicitly**: US-001 keeps these out of `$fillable` on purpose, so no
           `fill()` / `create()` / `updateOrCreate()` shortcut here
         - `name` from `$tokens->athleteName`, falling back to `'Athlete '.$tokens->athleteId` when Strava
           returns a blank name
         - `email`: only when absent, `sprintf('athlete-%s@strava.invalid', $tokens->athleteId)`. Strava does
           not expose an email under `activity:read_all` and the column is `NOT NULL UNIQUE`; `.invalid` is
           the RFC 2606 reserved TLD, so the address can never resolve. Add a comment saying exactly this
         - set `email_verified_at` on creation — there is no verification flow to run
      3. `php artisan larapilot:quality --fix`

      ## Completion Criteria
      - [x] `AthleteAllowlist::allows()` is strict and fails closed on an empty allowlist
      - [x] `ConnectStravaAthlete` runs inside a transaction and assigns Strava columns explicitly, never via mass assignment
      - [x] Reconnecting the same athlete updates the existing row instead of creating a second user
