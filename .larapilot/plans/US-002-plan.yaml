    id: TASK-03
    title: 'Cover the StravaOAuth service against a faked Strava'
    type: Test
    status: DONE
    dependencies:
      - TASK-02
    body: |
      ## Description
      Anne: the read-only scope guarantee and the refresh-token rotation are the two things in this service
      that fail silently if they regress. Both get an assertion here, against `Http::fake()` — no test in
      this spec ever reaches the network.

      ## Files Involved
      - tests/Feature/Strava/StravaOAuthTest.php

      ## Steps
      1. `php artisan make:test --phpunit Strava/StravaOAuthTest`
      2. `setUp`: `Config::set('strava.client_id' / 'client_secret' / 'redirect_uri')` to fixtures;
         `Http::preventStrayRequests()`
      3. Authorize URL cases:
         - contains `scope=activity%3Aread_all`, `response_type=code`, the configured `redirect_uri`, and the
           `state` passed in
         - `assertStringNotContainsString('write', $url)` — the read-only invariant, asserted rather than assumed
      4. Exchange cases:
         - a faked 200 with `access_token`, `refresh_token`, `expires_at` and an `athlete` object maps onto
           `StravaTokens`, including athlete id as a **string** and `expiresAt` from the unix `expires_at`
         - the request body sent to `/oauth/token` carries `grant_type=authorization_code` and the code
         - a faked 400 throws `StravaOAuthException`, and the exception message contains neither the client
           secret nor any token value
         - a faked 200 missing `refresh_token` throws `StravaOAuthException`
      5. Refresh cases:
         - a faked 200 returns the **rotated** refresh token and the new expiry, and carries the athlete id
           forward from the previous DTO (the refresh response has no athlete object)
         - the request body carries `grant_type=refresh_token`
         - a faked 401 throws `StravaOAuthException`
      6. `php artisan test --filter=StravaOAuthTest`
      7. Do **not** add Playwright, Dusk, Pest browser or viewport suites — `settings.testing` is `NORMAL`

      ## Completion Criteria
      - [x] All cases above pass
      - [x] `Http::preventStrayRequests()` is active, so an unfaked endpoint fails the test rather than hitting Strava
      - [x] Pint and Larastan level 5 clean

      ## Git Deliverables
      - Commit: `test(US-002): TASK-03 cover StravaOAuth authorize, exchange and refresh`
      - Push: **skip** (`git_mode: GITFLOW`)
      - PR: update the local PR notes
