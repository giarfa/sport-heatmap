    body: |
      ## Description
      Albert's baseline documentation for this spec, plus the full-suite gate before handoff. The README has
      to be enough for a cold clone to register a Strava application and sign in — the OAuth redirect URI is
      the one setting that fails confusingly when it is wrong.

      ## Files Involved
      - README.md
      - CHANGELOG.md (new)
      - .larapilot/plans/US-002-plan.yaml (PR description notes only — no manual edits to workflow YAML)

      ## Steps
      1. README — add a **Strava setup** section covering:
         - registering the application at `https://www.strava.com/settings/api`, and that the Authorization
           Callback Domain there must match the host in `STRAVA_REDIRECT_URI` (under Herd, the HTTPS `.test`
           domain) or Strava rejects the callback with an opaque error
         - every `STRAVA_*` env key, including the allowlist format (comma-separated athlete ids; non-numeric
           entries are discarded and an empty list rejects everyone) and `STRAVA_TOKEN_REFRESH_MARGIN`
         - how to find your own numeric Strava athlete id
         - that the app requests `activity:read_all` only and never write access
         - that sign-in creates a synthetic `athlete-{id}@strava.invalid` address because Strava exposes no
           email under this scope, and that nothing is ever sent to it
      2. Create `CHANGELOG.md` at the repo root in Keep a Changelog format with an `## [Unreleased]` section:
         under `### Added`, Strava OAuth sign-in with athlete allowlist and transparent token refresh; under
         `### Security`, allowlist enforced before any persistence, rate-limited OAuth routes, encrypted
