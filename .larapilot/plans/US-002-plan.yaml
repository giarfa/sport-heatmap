    id: TASK-09
    title: 'Cover token refresh and the reconnect failure mode'
    type: Test
    status: TODO
    dependencies:
      - TASK-08
    body: |
      ## Description
      Anne: two of the spec's four required test scenarios live here — an expired token triggers a refresh,
      and a refresh failure surfaces as a reconnect state rather than a 500.

      ## Files Involved
      - tests/Feature/Strava/EnsureFreshAccessTokenTest.php
      - tests/Feature/Strava/ReconnectStateTest.php

      ## Steps
      1. `php artisan make:test --phpunit Strava/EnsureFreshAccessTokenTest`, using the US-001 factory states:
         - `stravaConnected()` (expiry six hours out) → returns the stored token and `Http::assertNothingSent()`
         - `stravaTokenExpired()` → exactly one request to `/oauth/token` with `grant_type=refresh_token`;
           the user row now holds the new access **and** refresh tokens and the new expiry
         - `stravaTokenExpiringSoon()` → refreshes as well, proving the safety margin is honoured and not just
           the hard expiry
         - a user with a null `strava_token_expires_at` → refreshes
         - a user with no refresh token → `StravaReconnectRequiredException`, no HTTP request sent
         - faked `401` on refresh → `StravaReconnectRequiredException`, and the stored tokens are left
           untouched rather than half-written
      2. `php artisan make:test --phpunit Strava/ReconnectStateTest` — the HTTP surface:
         - `stravaTokenExpired()` user with a faked `401` on refresh visits `GET /` → `200`, connect screen,
           the reconnect alert is present, `assertGuest()`, **not** a 500
         - `stravaTokenExpired()` user with a successful faked refresh visits `GET /` → `200`, dashboard,
           still authenticated, tokens updated in the database
         - a guest visiting `GET /` sends no Strava request at all — the middleware is a no-op for guests
      3. `php artisan test --filter=EnsureFreshAccessToken` and `--filter=ReconnectState`
      4. No browser, Dusk, Playwright or viewport suites — `settings.testing` is `NORMAL`

      ## Completion Criteria
      - [ ] All cases above pass
      - [ ] The reconnect case asserts a `200` and the absence of a server error, so a regression to a 500 fails the build
      - [ ] The valid-token case asserts `Http::assertNothingSent()`
      - [ ] Pint and Larastan level 5 clean

      ## Git Deliverables
      - Commit: `test(US-002): TASK-09 cover token refresh and the reconnect failure mode`
      - Push: **skip** (`git_mode: GITFLOW`)
