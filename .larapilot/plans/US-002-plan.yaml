code: US-002
plan_body: |
  ## Technical Solution

  US-002 makes Strava the only identity provider: no password login, no registration, no second athlete.
  The OAuth callback is the single place a session can be created, so it is also the single place the
  access decision is made.

  **Flow.** `GET /` renders the connect screen for a guest and the dashboard for the signed-in athlete —
  never an error, never a redirect loop. "Connect with Strava" hits `GET /auth/strava/redirect`, which
  mints a CSRF `state`, stores it in the session, and sends the browser to Strava's `/oauth/authorize`
  with `response_type=code` and `scope=activity:read_all`. Strava returns to `GET /auth/strava/callback`,
  which runs a fixed gate order:

  1. `error=access_denied` in the query (the athlete pressed Cancel on Strava) → back to the connect
     screen with a neutral message. Nothing persisted.
  2. `state` missing, or not `hash_equals` the session value → 403. Nothing persisted.
  3. Granted `scope` does not contain `activity:read_all` (the athlete unticked the permission box) →
     403 rejection screen naming the missing scope. Nothing persisted.
  4. Exchange the authorization code for tokens. Strava's token response carries the `athlete` object
     inline, so the athlete id is known **before** anything is written.
  5. **Allowlist check** against `config('strava.allowed_athlete_ids')`. Not on it → 403 rejection screen
     naming the athlete id. Nothing persisted: no user row, no tokens, no session.
  6. Only now: persist user and tokens inside a transaction, regenerate the session, log in, redirect to
     the dashboard.

  Steps 1–5 touch no database and no auth guard, which is what makes the "nothing persisted" acceptance
  criterion assertable by counting rows after the attempt rather than by inspecting intent.

  **Components** — all new in this spec:

  | Class | Responsibility |
  | --- | --- |
  | `App\Data\StravaTokens` | readonly DTO: access token, refresh token, expiry, athlete id, athlete name, granted scopes |
  | `App\Services\Strava\StravaOAuth` | authorize URL, code exchange, refresh — the only class that talks to Strava's OAuth endpoints |
  | `App\Support\Strava\AthleteAllowlist` | `allows(string $athleteId): bool` over `config('strava.allowed_athlete_ids')` |
  | `App\Actions\Strava\ConnectStravaAthlete` | transaction: find-or-create the user by athlete id, assign tokens explicitly, return the user |
  | `App\Actions\Strava\EnsureFreshAccessToken` | returns a usable access token, refreshing and persisting when expired or inside the safety margin |
  | `App\Http\Middleware\EnsureFreshStravaToken` | applies the above to authenticated requests; no-op for guests |
  | `App\Exceptions\Strava\StravaOAuthException` | the token endpoint returned non-2xx or a malformed body |
  | `App\Exceptions\Strava\StravaReconnectRequiredException` | the refresh token is dead — renderable, becomes the reconnect screen |

  **Why hand-rolled, not Socialite** — this resolves the open decision the spec handed to planning.
  `laravel/socialite` v5.31 itself allows Guzzle `^8.0`, but it hard-requires `league/oauth1-client ^1.11`,
  which caps at Guzzle `^7`. `composer require laravel/socialite socialiteproviders/strava -W` therefore
  resolves by **downgrading `guzzlehttp/guzzle` 8.1.0 → 7.15.5** (plus `psr7` and `promises`) and
  installing eight packages, including OAuth **1** plumbing this product never calls. Strava is
  authorization-code OAuth2 only: one redirect, one token POST, one refresh POST. `StravaOAuth` does that
  on Laravel's `Http` facade in well under a hundred lines, the app stays on Guzzle 8 for US-003's
  `StravaClient`, and the `state` guard is six lines of `Str::random` plus `hash_equals`.
  **This spec adds no new dependencies.**

  **Token refresh.** `EnsureFreshAccessToken` is the seam US-003's `StravaClient` will call before every
  API request. It refreshes when `strava_token_expires_at` is past **or** within
  `config('strava.token_refresh_margin_seconds')` (default 300), then persists the rotated pair — Strava
  rotates the refresh token on every refresh, so storing only the access token would break the *next*
  refresh — and returns the access token. A `400`/`401` from the refresh endpoint means the athlete
  revoked access on Strava's side: it raises `StravaReconnectRequiredException`, which renders as the
  connect screen in a reconnect state rather than a 500. Wiring it as middleware on the dashboard route
  gives US-002 an HTTP surface to assert that against, and it costs zero requests while the token is valid.

  **Security** (Lars):

  - `state` CSRF guard on every callback; `session()->regenerate()` on login to close session fixation.
  - Both OAuth routes behind a named limiter (`throttle:strava-oauth`, 10/min per IP). The AC requires it
    on the callback; the redirect route is included because it is the cheaper one to hammer.
  - Scope pinned to a fixed `config('strava.scope')` constant, not an env value, so no write scope can be
    requested by editing an environment file.
  - Tokens land on the `encrypted` casts from US-001, and the Strava columns stay out of `$fillable`, so
    the callback assigns them explicitly. Client id and secret are read only through `config('strava.*')`
    and never logged; token endpoint failures log the HTTP status, never the response body.
  - Strava returns no email address under `activity:read_all`, so the required `users.email` column is
    filled with a synthetic `athlete-{id}@strava.invalid` — unique per athlete, documented in the README,
    never mailed. `.invalid` is the RFC 2606 reserved TLD, so it can never resolve.

  ## Decisions resolved in planning

  | Question | Decision | Owner |
  | --- | --- | --- |
  | Socialite vs hand-rolled OAuth (the spec's open decision) | **Hand-rolled** on the `Http` facade, zero new dependencies — Socialite forces a Guzzle 8 → 7 downgrade via `league/oauth1-client` | Andrew, Lars, user |
  | Branch base — `develop` holds only the skeleton commit while US-001 (DONE) sits unmerged, 18 commits ahead | **TASK-00 merges US-001 into `develop`** (`--no-ff`, local only), then branches US-002 from `develop` | Sarah, user |
  | Persisted light/dark toggle | **Deferred to US-004.** US-002 ships the layout shell honouring `prefers-color-scheme`; the toggle button and its persistence belong with the screen it lives on | Elise, Joe |
  | Logout / disconnect | **Out of scope.** FR-012 (disconnect and purge) is a Should in Future Phases; US-002 adds no logout route | Mark |
  | "Powered by Strava" attribution | **US-004** owns FR-008. US-002's only Strava mark is the orange connect button, which the brand guidelines expect on exactly that control | Elise |

  ## Git & Branching

  - Mode: `GITFLOW` — branch and atomic commits, **no automatic push**, PR description prepared locally.
  - Pre-step (TASK-00): merge `feature/US-001-foundation-schema-setup` into `develop` with `--no-ff`.
    `develop` currently holds only the skeleton commit and US-002 depends on the US-001 schema; without
    this, every later feature branch inherits a stale base and stacks 18 unrelated commits into its diff.
  - Branch: `feature/US-002-strava-oauth-connect` from `develop`.
  - Per task: one Conventional Commit, `type(US-002): TASK-NN summary`. Never batch tasks into one commit.
  - Push and remote PR: **skip** unless the user asks in-session.
  - Merge to `develop` only after `larapilot-review`.

  ## Test Data Strategy

  No new Eloquent models and no schema change: US-001 already ships the `strava_*` columns, the
  `encrypted` casts, and `UserFactory::stravaConnected()` / `stravaTokenExpired()`.

  - **One factory state to add:** `UserFactory::stravaTokenExpiringSoon()` — expiry inside the refresh
    safety margin but not yet past, so the margin branch has a named fixture instead of a magic
    `now()->addSeconds(60)` inline in a test.
  - **Seeders: unchanged.** `DatabaseSeeder` deliberately creates no generic user, and
    `TrainingBlockSeeder` already produces a Strava-connected athlete with a 16-week block — that is the
    fixture the dashboard is developed against. Verify `php artisan migrate:fresh --seed` still succeeds
    after TASK-00's merge.
  - **Never** commit a real Strava token, athlete id, client id, or client secret to a factory, seeder,
    test, or `.env.example`. Tests use `Http::fake()` and `Config::set()`.

  ## Test Strategy

  - Bar: `NORMAL` — PHPUnit feature and unit tests. **No** Playwright, Dusk, Pest browser, or viewport
    matrix; responsive behaviour gets a manual smoke handoff instead.
  - Every Strava HTTP call is faked with `Http::fake()`, plus `Http::preventStrayRequests()` in the OAuth
    tests so an unfaked endpoint fails loudly rather than reaching the network.
  - Test tasks interleave with implementation (TASK-03 after TASK-02, TASK-05 after TASK-04, and so on) —
    never stacked at the end.

  Anne's required cases, mapped to the acceptance criteria:

  | Acceptance criterion | Test |
  | --- | --- |
  | Only `activity:read_all` is ever requested | Authorize URL query contains `scope=activity:read_all` and matches no `write` substring |
  | Allowlist checked before anything is created | Non-allowlisted callback → `assertGuest()`, `users` count unchanged, token columns empty |
  | Rejection screen, nothing persisted | 403 + rejection view + the assertions above |
  | Tokens through `encrypted` casts | The raw `users` row read via the query builder is not the plaintext token; the model attribute is |
  | Transparent refresh | Expired token and inside-margin token each trigger exactly one refresh request and persist the rotated pair; a valid token triggers none |
  | Refresh failure → reconnect, not 500 | Faked `401` on the refresh endpoint → reconnect screen, `assertGuest()`, no unhandled exception |
  | Callback is rate limited | Exceeding the limiter returns `429` |
  | Signed-out dashboard renders the connect screen | `GET /` as a guest → `200` + connect view, not a redirect and not a 500 |

  Also covered beyond the ACs, because the callback is the only route that mints a session: `state`
  mismatch and missing `state` → 403; `error=access_denied` → connect screen; granted scope missing
  `activity:read_all` → 403; the session id changes on successful login.

  **Manual test handoff** (`NORMAL` bar, no browser automation): connect and rejection screens at 375 px,
  768 px and 1280 px against `states.html` states 1 and 2; keyboard-only tab to the connect button and
  confirm the focus ring; both screens under `prefers-color-scheme: dark`.

  ## Scope seams — what US-002 deliberately does not build

  - The heatmap grid, the intensity ramp tokens, the sync status chip, the "Powered by Strava" footer and
    the theme toggle — **US-004, US-005, US-006**. US-002 ships `layouts/app.blade.php` and the base
    surface/ink/accent tokens as the shell those specs fill in, plus a placeholder dashboard body that
    US-004 replaces.
  - `StravaClient`, pagination, retry/backoff and the sync command — **US-003**, which consumes
    `EnsureFreshAccessToken` from this spec.
  - Disconnect and purge (FR-012), manual re-sync (FR-010) — Future Phases.
