    id: TASK-07
    title: 'Cover the end-to-end OAuth flow, rejection and rate limiting'
    type: Test
    status: TODO
    dependencies:
      - TASK-06
    body: |
      ## Description
      Anne: the acceptance criteria for this spec are mostly negative — what must *not* happen when the wrong
      athlete completes the flow. Assert them by counting rows after the attempt, not by trusting the branch.

      ## Files Involved
      - tests/Feature/Strava/StravaConnectFlowTest.php

      ## Steps
      1. `php artisan make:test --phpunit Strava/StravaConnectFlowTest`, `RefreshDatabase`,
         `Http::preventStrayRequests()`, allowlist set via `Config::set('strava.allowed_athlete_ids', ['4821196'])`
      2. Redirect route: `GET /auth/strava/redirect` issues a redirect to `www.strava.com/oauth/authorize`
         carrying `scope=activity%3Aread_all` and a `state`, and stores that state in the session
      3. **Happy path** — allowlisted athlete: seed the session state, fake the token endpoint with an athlete
         id on the allowlist, `GET /auth/strava/callback?code=…&state=…&scope=read,activity:read_all` →
         redirect to `/`, `assertAuthenticated()`, exactly one user carrying the athlete id and both tokens,
         and the session id changed
      4. **Rejection** — non-allowlisted athlete, the spec's headline criterion: same flow with an athlete id
         **off** the list → `403`, the rejection view, and then
         `assertGuest()`, `$this->assertDatabaseCount('users', 0)`, and `assertDatabaseEmpty('users')` so the
         claim "no session exists, no tokens are stored, and no user record is written" is asserted against
         empty tables rather than inferred
      5. `state` mismatch → `403`, `assertGuest()`, no user row
      6. `state` missing entirely → `403`
      7. State is single-use: replaying the same callback twice → the second attempt is `403`
      8. `error=access_denied` → redirect to `/`, `assertGuest()`, no user row, no request sent to the token
         endpoint (`Http::assertNothingSent()`)
      9. Granted scope missing `activity:read_all` → `403`, rejection view, no token exchange attempted
      10. Token endpoint returns 400 → `503` and the rejection view, **not** a 500, `assertGuest()`, no user row
      11. **Rate limiting**: hit `/auth/strava/callback` past the limiter and assert `429`
      12. Reconnect: an already-connected allowlisted athlete completing the flow again updates the row and
          leaves `User::count()` at 1
      13. `php artisan test --filter=StravaConnectFlowTest`
      14. No browser, Dusk, Playwright or viewport suites — `settings.testing` is `NORMAL`

      ## Completion Criteria
      - [ ] All cases above pass
      - [ ] Every rejection case asserts `assertGuest()` **and** an empty `users` table
      - [ ] The rate-limit case asserts `429`
      - [ ] Pint and Larastan level 5 clean

      ## Git Deliverables
      - Commit: `test(US-002): TASK-07 cover the Strava OAuth flow, rejection and rate limiting`
      - Push: **skip** (`git_mode: GITFLOW`)
      - PR: update the local PR notes
