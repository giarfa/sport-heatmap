    id: TASK-06
    title: 'Wire the OAuth routes, controllers, guards and rate limiter'
    type: Impl
    status: TODO
    dependencies:
      - TASK-03
      - TASK-05
    body: |
      ## Description
      The HTTP surface: the redirect that starts the flow, the callback that ends it, and the dashboard route
      that renders the connect screen to a guest. Blade views land here as **minimal semantic stubs** carrying
      the required copy; TASK-10 styles them to the mockup. Splitting it this way keeps every task
      independently green — the controllers never reference a view that does not exist yet.

      ## Files Involved
      - routes/web.php
      - app/Http/Controllers/Strava/StravaRedirectController.php
      - app/Http/Controllers/Strava/StravaCallbackController.php
      - app/Http/Controllers/DashboardController.php
      - app/Providers/AppServiceProvider.php
      - resources/views/strava/connect.blade.php
      - resources/views/strava/rejected.blade.php
      - resources/views/dashboard.blade.php
      - resources/views/welcome.blade.php (delete)

      ## Steps
      1. `AppServiceProvider::boot()` — register the named limiter:
         `RateLimiter::for('strava-oauth', fn (Request $request) => Limit::perMinute(10)->by($request->ip()))`
      2. `routes/web.php`:
         - `GET /` → `DashboardController` , name `dashboard`
         - `GET /auth/strava/redirect` → `StravaRedirectController`, name `strava.redirect`,
           middleware `throttle:strava-oauth`
         - `GET /auth/strava/callback` → `StravaCallbackController`, name `strava.callback`,
           middleware `throttle:strava-oauth`
         - delete the closure returning `welcome`, and delete `resources/views/welcome.blade.php`
      3. `StravaRedirectController` (invokable): `Str::random(40)` into `session('strava.oauth_state')`, then
         `redirect()->away($stravaOAuth->authorizationUrl($state))`
      4. `StravaCallbackController` (invokable) — the gates run in this exact order, and **nothing is written
         until gate 5 passes**:
         1. `$request->query('error') === 'access_denied'` → redirect to `dashboard` with a neutral
            `status` flash. Nothing persisted
         2. `state` missing, or `! hash_equals((string) session()->pull('strava.oauth_state', ''), (string) $request->query('state'))`
            → `abort(403)`. Pull the state either way so it is single-use
         3. the granted `scope` query parameter does not contain `activity:read_all` →
            `response()->view('strava.rejected', ['reason' => 'scope'], 403)`
         4. `$stravaOAuth->exchangeAuthorizationCode($code, $grantedScope)` — wrap
            `StravaOAuthException` and render the rejection view with a failure reason, status 503; do not
            let it become a 500
         5. `! $allowlist->allows($tokens->athleteId)` →
            `response()->view('strava.rejected', ['athleteId' => $tokens->athleteId, 'reason' => 'allowlist'], 403)`.
            **This is the acceptance criterion**: no token, no user row, no session has been created at this point
         6. `$user = $connectStravaAthlete($tokens);` then `Auth::login($user, remember: true)`,
            `$request->session()->regenerate()`, `redirect()->intended(route('dashboard'))`
      5. `DashboardController` (invokable): `Auth::check()` → `view('dashboard')`; guest → `view('strava.connect')`.
         Returns `200` in both cases — never a redirect, never an error (acceptance criterion)
      6. Stub views, semantics only, styling in TASK-10. Copy per `states.html` states 1 and 2 (Marika):
         - `strava/connect.blade.php` — one `<h1>`, the body line "Connect Strava to build your 16-week
           heatmap. Read-only access to your activities — nothing is ever posted on your behalf.", a link to
           `route('strava.redirect')` labelled "Connect with Strava", and the footnote "Requests the
           `activity:read_all` scope." Accepts an optional `$reconnect` flag rendering a `role="alert"`
           banner — TASK-08 uses it
         - `strava/rejected.blade.php` — "This instance is private" plus "Athlete #{id} is not on this
           instance's allowlist, so no session was created and nothing was stored.", and a Back link to
           `route('dashboard')`
         - `dashboard.blade.php` — placeholder body, replaced by the grid in US-004
      7. `php artisan route:list --except-vendor` — confirm three routes, correct names, throttle applied,
         and still no route whose URI mentions `register` (the existing `NoPublicSignupTest` guards this)
      8. `php artisan larapilot:quality --fix`

      ## Completion Criteria
      - [ ] The five rejection gates run before any write, in the order above
      - [ ] Both OAuth routes carry `throttle:strava-oauth`
      - [ ] Successful login regenerates the session id
      - [ ] `GET /` returns 200 with the connect view for a guest and the dashboard view for the athlete
      - [ ] `welcome.blade.php` is deleted and no route references it
      - [ ] `NoPublicSignupTest` still passes — no registration route was introduced
      - [ ] Pint and Larastan level 5 clean

      ## Test Data
      - N/A — no model or schema changes in this task

      ## Git Deliverables
      - Commit: `feat(US-002): TASK-06 add Strava OAuth routes, controllers, guards and rate limiting`
      - Push: **skip** (`git_mode: GITFLOW`)
      - PR: update the local PR notes
