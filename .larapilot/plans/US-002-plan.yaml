    id: TASK-01
    title: 'Extend the Strava config surface with scope, endpoints and refresh margin'
    type: Impl
    status: DONE
    dependencies:
      - TASK-00
    body: |
      ## Description
      US-001 shipped `config/strava.php` with credentials, the athlete allowlist and the sync schedule. Add
      the four keys the OAuth flow needs. `scope` is a **fixed literal, not an env value** — pinning it in
      code is what makes "no write scope is ever requested" a property of the repository rather than of
      whatever `.env` happens to be deployed (Lars).

      ## Files Involved
      - config/strava.php
      - .env.example
      - tests/Feature/Config/StravaConfigTest.php

      ## Steps
      1. Add to `config/strava.php`, following the existing commented-section style:
         - `'scope' => 'activity:read_all'` — literal, with a comment stating that read-only is a product
           invariant and that no `write`/`activity:write` scope is ever requested (FR-001)
         - `'authorize_url' => 'https://www.strava.com/oauth/authorize'`
         - `'token_url' => 'https://www.strava.com/oauth/token'`
         - `'token_refresh_margin_seconds' => (int) env('STRAVA_TOKEN_REFRESH_MARGIN', 300)` — how long
           before expiry a token is treated as already expired
      2. Extend the `@var array{...}` shape docblock on `$config` with the four new keys — Larastan level 5
         reads it
      3. Add `STRAVA_TOKEN_REFRESH_MARGIN=300` to `.env.example` under the existing Strava block, with a
         one-line comment. Do **not** add real credential values
      4. Write `tests/Feature/Config/StravaConfigTest.php`: `scope` is exactly `activity:read_all`; `scope`
         contains no `write`; both endpoint URLs are `https://` on `strava.com`; the refresh margin defaults
         to 300 and casts a string env value to `int`
      5. `php artisan test --filter=StravaConfigTest`
      6. `php artisan larapilot:quality --fix`

      ## Completion Criteria
      - [x] `config('strava.scope')` returns `activity:read_all` and is not env-driven
      - [x] `config('strava.authorize_url')` / `config('strava.token_url')` resolve to the official endpoints
      - [x] `config('strava.token_refresh_margin_seconds')` is an int, default 300
      - [x] `.env.example` documents `STRAVA_TOKEN_REFRESH_MARGIN` and still carries no real secrets
      - [x] `StravaConfigTest` passes; Pint and Larastan level 5 clean

      ## Test Data
      - N/A — no model or schema changes in this task

      ## Git Deliverables
      - Commit: `feat(US-002): TASK-01 add OAuth scope, endpoints and refresh margin to Strava config`
      - Push: **skip** (`git_mode: GITFLOW`)
      - PR: update the local PR notes
