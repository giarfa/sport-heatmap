code: US-014
plan_body: |
  **Release:** 2.0.0

  ## Technical Solution

  FR-020 adds a server-rendered weekly-distance chart (bars + 4-week rolling average) to the dashboard rail, between the legend and the sync card. It is pure Blade + inline SVG + CSS: no new frontend dependency, no script (PRD Technical Architecture; mockup `.larapilot/mockups/US-014/README.md`).

  ### Data flow
  1. **Bars come from the grid, not a second sum.** `HeatmapBuilder` already produces 16 `WeekRow`s with `totalMeters` (FR-005). The trend is built from those exact rows, so every bar equals the weekly total the grid prints, to 0.1 km.
  2. **Lead-in weeks — the one extra query.** The rolling average of the first three shown weeks needs the 3 weeks before the window. New `App\Support\Heatmap\LeadInDistance` runs one grouped `SUM(distance_meters)` over `[startsOn − 21 days, startsOn − 1 day]` (served by the `(user_id, activity_date)` index) and folds the days into 3 weekly totals in PHP (no SQLite week functions). It runs **only on a grid cache miss**, inside the build closure. That makes it +1 query on a miss and +0 on a hit (AC: at most one extra query).
  3. **Oldest run.** `OldestRunDate` is already read on every request (US-013). The controller passes it into the build closure, so the history rule ("no point for a week with fewer than three weeks of history since the week of the oldest stored run") costs no query.
  4. **Built inside `HeatmapBuilder`, cached with the grid.** `HeatmapBuilder` gains a constructor dependency `BuildWeeklyTrend` and two trailing parameters (`array $leadInWeekMeters = []`, `?CarbonInterface $oldestRun = null`). After assembling the weeks it builds the `WeeklyTrend` from them. `HeatmapGrid` gains a required `public WeeklyTrend $trend`. Because the trend sits in the cached grid, the existing generation bump (`HeatmapGridCache::forgetAthlete` on sync and confirmed import) retires it with the grid, and no separate chart cache can outlive a write.
     - *Rejected:* (a) widening `DailyRunningDistance` by 21 days. It costs zero queries but feeds pre-window days into `CalibrateIntensityScale` and breaks FR-006 (scale from the shown window only). (b) Building the trend in the controller per request: either an extra query on every request or a second cache. (c) A `withTrend()` on a nullable property, which would leave a half-built grid type that Blade has to null-check.
  5. **Cache shape.** `HeatmapGridCache` key segment `v3` → `v4` (HeatmapGrid gains a readonly property; see the existing comment on uninitialized readonly properties). The new classes (`WeeklyTrend`, `TrendBar`, `TrendTick`) are added to `cache.serializable_classes`, or the database store restores them as `__PHP_Incomplete_Class`.

  ### The trend arithmetic (`App\Support\Heatmap\BuildWeeklyTrend`)
  All in **integer metres**, rounded once at the edge, and pinned to the mockup fixture as the R-7 legend is pinned (`.ai/rules/heatmap.md` spirit):
  - **Bar km** = `WeekRow::kilometres()` (same string the grid prints). Geometry uses that 0.1-km-rounded value, as the mockup generator does.
  - **Rolling average** for week *i* = mean of weeks *i−3 … i*, taking lead-in weeks for *i < 3*. Sum metres, divide by 4, round half-up to 0.1 km. The mockup's 18 May point is (22.0 + 0.0 + 18.6 + 38.8)/4 = 19.85, which must render **19.9**. A test pins this half-up case.
  - **No point** when the week is partial (so on the current window the line stops at the last completed week), when there is no oldest run, or when `weekStart < startOfWeek(oldestRun) + 3 weeks`. Unknown weeks are never averaged as 0 km. Points are contiguous by construction (history gap only at the start, partial only at the end), but the builder still returns **segments** (`array<int, string>` of polyline `points`) so a future rule can't draw a line across a gap. A lone point becomes a 4-unit horizontal tick (`x−2,y x+2,y`).
  - **Y axis:** `max` = the largest of the bar values **and** the line points (a point fed by lead-in weeks can outrun every bar). `step` = the smallest of 5, 10, 20, 25, 30, 40, 50, 75, 100, 150, 200 that is ≥ max ÷ 3 (200 when none). `top = step × ⌈max ÷ step⌉`. Ticks every `step` from 0 to `top`; only the top label carries " km". Fixtures: current window → step 30 / top 90; past window → step 25 / top 75.
  - **SVG geometry** (`viewBox 0 0 160 100`, `preserveAspectRatio="none"`): slot *i* bar `x = i*10+2`, width 6; point `x = i*10+5`; `y = 100 − km/top*100`. Coordinates are rendered with 2 decimals. A 0 km week becomes a baseline stub, never a gap. A partial bar is washed fill + dashed outline + an HTML `PARTIAL` tag at `bottom: calc({h}% + 2px)`.
  - **X labels:** weeks 1, 5, 9, 13 (`j M`), flush with their bars.
  - **Strings:** SVG title `Weekly running distance, {grid label}, oldest week first`. Per-bar accessible name / tooltip: `18 – 24 May 2026: 38.8 km; 4-week average 19.9 km` · `31 Aug – 6 Sep 2026: 44.1 km so far, partial week` · `15 – 21 Jun 2026: 55.2 km; no 4-week average yet`. Ranges crossing a year read `29 Dec 2025 – 4 Jan 2026`. Table row header: the range without the year (`18 – 24 May`). Note: `4-week average 67.7 km · week of 24 Aug` (the last drawn point), or `The 4-week average starts once 4 weeks of runs are stored.` when no point exists. Key flags: `hasPartial`, `hasZeroWeek`.
  - **Empty:** `WeeklyTrend::isEmpty()` mirrors `HeatmapGrid::hasRuns()`. An empty window shows `No runs in this window, so there is nothing to chart.` with no axis and no bars.

  ### Rendering
  - `resources/views/components/weekly-trend.blade.php` and `weekly-trend-skeleton.blade.php`, **markup only** (no arithmetic, like `heatmap-legend.blade.php`). The dashboard rail order is legend → trend → sync, and the rail `aria-label` becomes `Legend, weekly trend and sync detail` (mockup `index.html`). The skeleton shows when `$status->showsSkeleton()` (16 bars, `aria-hidden`). The connect screen is untouched, so it has no chart.
  - CSS: port **Part 2 → "Weekly trend"** of `.larapilot/mockups/US-014/trend.css` into `resources/css/app.css` next to the grid rules. **Do not port "Window navigation"** from Part 2: US-013 owns and already shipped it, and the README says it is drawn for context only. No new tokens: bars `--lv-2`, line `--ink` over a `--surface-card` halo, gridlines `--hairline`, axis text `--ink-muted`, `vector-effect: non-scaling-stroke` on every stroke.
  - FR-017: the build path reads only, has no `strava.fresh` side effects for guests, and calls no Strava endpoint.

  ### Laravel idioms & quality (Andrew)
  Final readonly DTOs in `app/Data/Heatmap`, invokable `final readonly` support classes in `app/Support/Heatmap`, block comments (`/* … */`) for every non-obvious decision (`.ai/rules/app.md`), no Form Request (no new input), no new route, no new package. The hot path is unchanged in shape: the cached grid on a hit, 3 grouped queries on a miss (daily distance, daily runs, lead-in). Larastan level 5 and Pint via `php artisan larapilot:quality`.

  ### Cost (Aurora)
  None. One inline SVG of ~20 elements per page, no script, no font, no new service.

  ## Git & Branching
  - Mode: GITFLOW, no automatic push
  - Release: **2.0.0**. TASK-00 runs `php artisan larapilot:release-feature --semver=2.0.0 --spec=US-014 --slug=weekly-mileage-trend`, which branches `feature/US-014-weekly-mileage-trend` **from `release/2.0.0`**
  - Per task: one Conventional Commit `type(US-014): TASK-NN …`, with code, tests and domain docs together
  - PR prepared locally toward `release/2.0.0` (not `develop`); push / remote PR only if the user asks
  - Merge into `release/2.0.0` after `larapilot-review` approval (auto-approve is on). US-014 is the last open story of v2.0.0, so approval hands over to `/larapilot-release`

  ## Test Data Strategy
  - No model, migration, enum or relationship changes, so no factory change.
  - `TrainingBlockSeeder` already seeds 7 weeks of Garmin history before the 16-week block, so after `php artisan migrate:fresh --seed` the current window draws a line from its first week. Previous shows a window with the 0 km week, and history-gap behaviour is reachable by stepping back. Verify this during TASK-04 (manual) and do not change the seeder.
  - Unit fixtures reuse the mockup's dataset (README **Sample data**): the 16 weekly totals of the current window, the 3 lead-in weeks (22.0, 0.0, 18.6 km), and the oldest run in the week of 30 Mar 2026, with "today" Saturday 5 Sep 2026.

  ## Test Strategy
  - Bar: **NORMAL**. PHPUnit (the project's runner) feature and unit tests. **No** Playwright, Dusk, browser or viewport suites.
  - Unit (`tests/Unit/Support/Heatmap/BuildWeeklyTrendTest.php`, `LeadInDistanceTest` as feature-DB test): every number in the README's sample table (bars + averages); the half-up 19.85 → 19.9 case; axis step/top 30/90 and 25/75; a line point that outruns every bar raises the top; the short-history first point (6 Jul); 0 km stub; partial bar with no point; past window with no partial and a full 16-point line; lone point → tick; no oldest run → no points; accessible-name strings including a year-crossing range; empty window.
  - Feature (`tests/Feature/Dashboard/WeeklyTrendTest.php`): the card renders in the rail with 16 named bars whose values equal the grid's week totals; `?to=` past window; empty window message; connect screen has no chart; skeleton during the first sync; guest sees the same card, writes no domain row, and makes no HTTP call (`Http::preventStrayRequests()`); after `forgetAthlete` (sync or confirmed import) the chart shows the new data; **query budget**: a cache-miss request makes exactly one more query than the grid alone, and a cache-hit request makes none for the chart.
  - Existing tests to keep green: `HeatmapBuilderTest` (new constructor dependency), `HeatmapGridCacheTest` (key v4, new serializable classes), `WindowNavigationTest`, `PublicDashboardTest`.
  - **Manual test handoff:** at 320 / 375 / 768 / 1024 / 1280 px in light and dark, check no horizontal page scroll, the chart beside the grid from `lg` and stacked below the legend under `lg`, the `<details>` summary reachable by keyboard with a visible focus ring, and the partial tag aligned on its bar. Then Previous → the line spans 16 weeks with no PARTIAL.
