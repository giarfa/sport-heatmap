    id: TASK-01
    title: 'Weekly trend builder, DTOs, and lead-in distance query'
    body: |
      ## Description
      Add the weekly-trend model: the `WeeklyTrend` / `TrendBar` / `TrendTick` DTOs, the `LeadInDistance` query (the one extra query), and `BuildWeeklyTrend`, which turns 16 `WeekRow`s + 3 lead-in weekly totals + the oldest run date into every number and string the chart prints. No rendering and no wiring yet.

      ## Files Involved
      - app/Data/Heatmap/WeeklyTrend.php (new; final readonly: `bars`, `ticks`, `xLabels`, `lineSegments`, `title`, `note`, `hasPartial`, `hasZeroWeek`, `isEmpty()`)
      - app/Data/Heatmap/TrendBar.php (new; final readonly: `rangeLabel` (no year, table), `accessibleName` (with year), `kilometres`, `averageKilometres` (?string), `x`, `y`, `height` (2-decimal strings), `heightPercent`, `isPartial`, `isZero`)
      - app/Data/Heatmap/TrendTick.php (new; final readonly: `label`, `bottomPercent`, `y`)
      - app/Support/Heatmap/LeadInDistance.php (new; invokable, `(User $athlete, HeatmapWindow $window): array<int, int>`, 3 weekly metre totals, oldest first)
      - app/Support/Heatmap/BuildWeeklyTrend.php (new; invokable, `(array<int, WeekRow> $weeks, array<int, int> $leadInWeekMeters, ?CarbonInterface $oldestRun, string $windowLabel): WeeklyTrend`)

      ## Steps
      1. `php artisan make:class` for each new class, then make them `final readonly` with PHPDoc array shapes, matching `IntensityScale` / `LegendRow` / `DailyRunningDistance`.
      2. `LeadInDistance`: one `selectRaw('activity_date, SUM(distance_meters) as meters')` over `[startsOn->subDays(21), startsOn->subDay()]`, `groupBy('activity_date')`, folded into 3 weekly buckets in PHP. Add a block comment on why it is separate from `DailyRunningDistance` (FR-006: the scale must see only the shown window).
      3. `BuildWeeklyTrend`, per the plan's **The trend arithmetic**: integer-metre rolling mean with half-up rounding to 0.1 km; the no-point rules (partial week, no oldest run, `weekStart < startOfWeek(oldestRun)+3 weeks`); y-axis nice step over bars **and** points; geometry `x = i*10+2` / point `x = i*10+5` / `y = 100 − km/top*100` from the printed 0.1-km values, 2-decimal output; lone point → 4-unit tick; polyline segments; x labels at weeks 1/5/9/13; all strings exactly as in mockup `.larapilot/mockups/US-014/index.html` and the README **Accessibility** section.
      4. Block comments (`/* … */`) on the decisions that would otherwise be "simplified" away: rounding from the printed value, max covering line points, never averaging unknown weeks as 0, segments rather than one polyline.
      5. Write the unit tests in this task only as far as needed to drive the code. The full fixture suite is TASK-02.

      ## Completion Criteria
      - [x] For the mockup dataset, `BuildWeeklyTrend` yields the README sample table, step 30 / top 90, and the `index.html` polyline `points` string exactly
      - [x] `LeadInDistance` issues exactly one query and returns 3 weekly totals (zeros for empty weeks)
      - [x] No Eloquent model, request, or view reaches the DTOs; Blade will need no arithmetic
      - [x] Larastan level 5 clean on the new files

      ## Test Data
      - N/A — no model/schema changes; fixtures are built in tests from the mockup dataset

      ## Domain Docs
      - [x] `.larapilot/docs/devs/heatmap-dashboard.md`: new **Weekly trend** subsection under Technical design (classes, the rolling-average and axis rules, the history rule) and Architectural choices (separate lead-in query vs widening the daily query, rejected because of FR-006)
      - [x] Folder `README.md` index row: last touched by `US-014`
      - [x] English, committed with this task

      ## Git Deliverables
      - Commit: `feat(US-014): TASK-01 weekly trend builder and lead-in distance query`
      - Push: **skip** (`git_mode: GITFLOW`)
      - PR: update the local PR notes only
