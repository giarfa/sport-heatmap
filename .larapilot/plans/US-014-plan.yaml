    id: TASK-02
    title: 'Pin the weekly trend to the mockup fixture (unit tests)'
    body: |
      ## Description
      Add PHPUnit coverage that pins `BuildWeeklyTrend` and `LeadInDistance` to the mockup contract, the same way `CalibrateIntensityScaleTest` pins R-7.

      ## Files Involved
      - tests/Unit/Support/Heatmap/BuildWeeklyTrendTest.php (new — `php artisan make:test --phpunit --unit Support/Heatmap/BuildWeeklyTrendTest` then move if needed)
      - tests/Feature/Dashboard/LeadInDistanceTest.php (new; uses the DB)

      ## Steps
      1. Use `ActivityFactory` / `UserFactory` states (check them first). Build `WeekRow` fixtures through `HeatmapBuilder` from daily metres, not by hand, so the bars are the grid's totals.
      2. Fixture: the README **Sample data**: current window 18 May – 6 Sep 2026, today Sat 5 Sep 2026, lead-in 22.0 / 0.0 / 18.6 km, oldest run in the week of 30 Mar 2026.
      3. Cover:
         - every bar and every average in the README table; the partial week has no average and the line stops at 24 Aug
         - 19.85 → **19.9** (half-up) for the 18 May point
         - axis: current step 30 / top 90 (tick labels `0`, `30`, `60`, `90 km`); past window (20 Apr – 9 Aug) step 25 / top 75, no partial bar, 16 points, the 4 May 0 km stub
