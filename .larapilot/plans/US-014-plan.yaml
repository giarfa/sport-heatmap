    id: TASK-03
    title: 'Carry the trend in the cached window grid'
    body: |
      ## Description
      Wire the trend into the cached window payload: `HeatmapBuilder` builds it, `HeatmapGrid` carries it, the controller feeds the lead-in totals and the oldest run into the build closure, and the cache key and serializable classes move with the new shape.

      ## Files Involved
      - app/Support/Heatmap/HeatmapBuilder.php (constructor gains `BuildWeeklyTrend`; `__invoke` gains `array $leadInWeekMeters = []`, `?CarbonInterface $oldestRun = null`)
      - app/Data/Heatmap/HeatmapGrid.php (new required `public WeeklyTrend $trend`)
      - app/Support/Heatmap/HeatmapGridCache.php (key `v3` → `v4`; update the comment explaining the bump)
      - config/cache.php (`serializable_classes` += `WeeklyTrend`, `TrendBar`, `TrendTick`)
      - app/Http/Controllers/DashboardController.php (inject `LeadInDistance`; the build closure passes `$leadIn($athlete, $window)` and `$oldestRun`; `$oldestRun` is already read before the closure)
      - tests/Unit/Support/Heatmap/HeatmapBuilderTest.php (constructor update)
      - tests/Feature/Dashboard/HeatmapGridCacheTest.php (key / restore expectations, if any assert the shape)

      ## Steps
      1. Build the trend at the end of `HeatmapBuilder::__invoke` from the `$weeks` it just built, plus `HeatmapGrid::label()`'s range string. Add a block comment: the trend is built from the same `WeekRow`s so a bar cannot disagree with its row.
      2. Controller: keep `LeadInDistance` **inside** the closure, so it runs only on a cache miss. The uncached branch (`$canHoldRuns` false) also goes through `$build()` and gets an empty trend. Add a block comment on the query budget (AC: at most one extra query).
      3. Bump the cache key to `v4` and register the new classes. Without that, a database-store hit restores `__PHP_Incomplete_Class` and the `instanceof` miss path rebuilds on every request.
      4. `php artisan test --compact tests/Unit/Support/Heatmap tests/Feature/Dashboard`

      ## Completion Criteria
      - [x] `HeatmapGrid::$trend` is always set; no nullable path reaches Blade
      - [x] Cache miss: exactly one query more than before; cache hit: no query for the chart
      - [x] `forgetAthlete` (sync, confirmed import) retires the trend with the grid; there is no separate chart cache
      - [x] Guest path unchanged: no write, no Strava call (FR-017)
      - [x] Existing heatmap and dashboard tests pass

      ## Test Data
      - N/A — no model/schema changes in this task

      ## Domain Docs
      - [x] `.larapilot/docs/devs/heatmap-dashboard.md`: Functional flow step 3 (lead-in query on a miss, trend built with the grid), cache key `v4`, serializable classes, and the invariant "the chart lives in the cached grid, never in its own cache"
      - [x] English, committed with this task

      ## Git Deliverables
      - Commit: `feat(US-014): TASK-03 carry the weekly trend in the cached window grid`
      - Push: **skip** (`git_mode: GITFLOW`)
      - PR: update the local PR notes only
