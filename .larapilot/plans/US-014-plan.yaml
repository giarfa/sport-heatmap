         - short history: oldest run in the week of 15 Jun means the first point falls on 6 Jul and earlier weeks have none (never averaged as 0)
         - lone point → tick segment; no oldest run → no segment and the "starts once 4 weeks" note
         - accessible names: normal, partial, no-average, and a year-crossing range (`29 Dec 2025 – 4 Jan 2026`)
         - empty window → `isEmpty()` true
         - `LeadInDistance`: one query (`DB::enableQueryLog()` / `DB::listen`), 3 buckets, a run on `startsOn` itself excluded, a run 21 days before included, other athletes' runs excluded
