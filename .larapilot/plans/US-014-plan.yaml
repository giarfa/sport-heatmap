  -
    id: TASK-04
    title: 'Weekly trend card in the dashboard rail (Blade + CSS)'
    body: |
      ## Description
      Render the trend card in the dashboard rail, mirroring the US-014 mockups: the SVG chart, the HTML axis labels and partial tag, the key, the note, the "Weekly figures" `<details>` table, the empty state and the first-sync skeleton. Light and dark, mobile-first.

      **Mirrors:** `.larapilot/mockups/US-014/index.html` (primary, current window), `.larapilot/mockups/US-014/dark.html`, `.larapilot/mockups/US-014/past-window.html`, `.larapilot/mockups/US-014/states.html` (short history, figures expanded, empty window, first sync in flight, connect screen), `.larapilot/mockups/US-014/breakpoints.html`
      **Design system:** Tailwind CSS (PRD Technical Architecture; `.larapilot/design-systems/tailwind/`). No new tokens: reuse `--lv-2`, `--ink`, `--surface-card`, `--hairline`, `--ink-muted`, `--accent` from `resources/css/app.css`.

      ## Files Involved
      - resources/views/components/weekly-trend.blade.php (new; `@props(['trend'])`; markup only, comment `{{-- Markup only … --}}` as in `heatmap-legend.blade.php`)
      - resources/views/components/weekly-trend-skeleton.blade.php (new; 16 skeleton bars, `aria-hidden`)
      - resources/views/dashboard.blade.php (rail: legend → trend → sync; rail `aria-label="Legend, weekly trend and sync detail"`; skeleton when `$status->showsSkeleton()`)
      - resources/css/app.css (port **Part 2 → "Weekly trend"** of `.larapilot/mockups/US-014/trend.css`; **not** its "Window navigation" block or the mockup-only states gallery)

      ## Steps
      1. Read the mockup README (element table, Geometry, Accessibility, Deviations) and every screen listed above before writing markup. Never work from memory.
      2. Card: `<section class="card p-4 trend" aria-labelledby="trend-heading">` with `h3` "Weekly distance". The SVG has `viewBox="0 0 160 100" preserveAspectRatio="none" role="group"`, named by its `<title>`. Each bar is `<g role="img"><title>…</title><rect …></g>`. Gridlines, baseline and line are `aria-hidden`. No text and no circles inside the SVG. The y labels, x labels and `PARTIAL` tag are HTML positioned in %.
      3. Key: Weekly total · 4-week average · Partial week (only when `hasPartial`) · 0 km week (only when `hasZeroWeek`), drawn as shapes.
      4. `<details class="trend-figures">` with `<summary>` "Weekly figures" (min 44 px tall, focus ring kept), and a table with an `sr-only` caption, `th scope="col"` / `th scope="row"`, the partial tag in the row header, and the missing average as `—` + `sr-only` "none".
      5. Empty window: heading + `No runs in this window, so there is nothing to chart.`, with no axis and no bars. The connect screen is not touched.
      6. `npm run build`; `php artisan migrate:fresh --seed`. Smoke at 320 / 375 / 768 / 1024 / 1280 px in light and dark: chart beside the grid from `lg`, stacked under the legend below `lg`, no horizontal page scroll at 375 px. Step back with Previous: no partial bar, 16-point line. The seeded data should give the current window a line from week 1.
      7. Any visible difference from the mockups is raised in chat **before** it is coded, then `decision-log --topic="mockup deviation"` and a row in the README `## Deviations` (Mockup fidelity, ux-1).
      8. `php artisan test --compact tests/Feature/Dashboard`

      ## Completion Criteria
      - [x] The card matches `index.html` / `dark.html` / `past-window.html` / `states.html` element by element
      - [x] Partial and average are never conveyed by colour alone (dashed outline + washed fill + PARTIAL tag + "partial week" in the name; line vs bar shape); 0 km is a stub
