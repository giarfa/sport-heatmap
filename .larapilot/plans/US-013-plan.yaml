code: US-013
plan_body: |
  **Release:** 2.0.0

  ## Technical Solution

  US-013 makes the 16-week window navigable and stops the Garmin importer from dropping runs older than the current window. FR-019 is new; FR-004 and FR-018 change; FR-006, FR-009, and FR-017 must keep holding on every window.

  **What already works (prior art, built in):** `HeatmapWindow` takes any date, `HeatmapBuilder` already renders a window that ends before today with no future cells and no partial week (`$date > $today` is the only Future rule), `DailyRunningDistance` / `DailyRuns` query any window through the `(user_id, activity_date)` index, and `CalibrateIntensityScale` calibrates on whatever daily totals it gets, so the legend follows the shown window (FR-006) with no change. No package and no JavaScript are added.

  ### 1. The window from the URL (`app/Support/Heatmap/HeatmapWindow.php`)
  - **URL shape:** the home page keeps `/` for the current window. A past window is `/?to=YYYY-MM-DD`, where the date is the **Sunday that ends the window** (it matches the heading "16 weeks to 9 Aug"). Any date is read as the week that contains it, so a mid-week date is that week (AC).
  - New named constructors and queries on the readonly class: `endingInWeekOf(CarbonInterface $day)`; `fromRequestedEnd(string $requested, CarbonInterface $today)`; `previous()` (4 weeks back); `next(CarbonInterface $today)` (4 weeks forward, clamped to `current($today)`); `isCurrent(CarbonInterface $today)`. The 4-week step is a new literal `heatmap.navigation_step_weeks => 4` in `config/heatmap.php`, next to `window_weeks`, with the same "literal, not env()" rationale.
  - **Parsing is strict and never throws:** only `^\d{4}-\d{2}-\d{2}$`, parsed with `CarbonImmutable::createFromFormat('!Y-m-d', …)` and a round-trip check (`2026-02-31` is unparseable, not 3 March). An empty, malformed, unparseable, or **future** week gives `current($today)`. The controller reads `to` through a private helper that returns `''` for anything non-string (`.ai/rules/http.md`: `?to[]=x` must not 500).
  - A requested window **older than the oldest run** is rendered as asked (an empty grid with its date range); Previous is then disabled. It is not clamped, so a shared link never silently changes meaning.

  ### 2. Navigation state (`app/Data/Heatmap/WindowNavigation.php`, new readonly DTO)
  - Built per request, **outside** the grid cache, from the shown window, `$today`, and the athlete's oldest run date: `previousUrl: ?string`, `nextUrl: ?string`, `heading(): string`, `rangeLabel(): string`. The Blade component does no arithmetic, as with `heatmap-grid` and `heatmap-legend`.
  - **Previous is available** only when `oldestRunDate !== null && oldestRunDate < window->startsOn`. That one rule covers both disabled cases of the AC: no run is stored, or the shown window already holds the oldest run. **Next is available** unless the window is the current one. Next from a window 1–3 weeks behind current lands on the current window (clamp), and its URL is plain `/` (no `to`), so the current window has one URL only.
  - **Oldest run date:** new `app/Support/Heatmap/OldestRunDate.php`, one `MIN(activity_date)` aggregate served by the `(user_id, activity_date)` index. It is read fresh on every request, not cached: it is one indexed query, and a fresh read cannot outlive an import.

  ### 3. Every window invalidated on write (`app/Support/Heatmap/HeatmapGridCache.php`)
  - Today `forget()` drops only the current window's key. With navigable windows, a confirmed import of older runs or a sync would leave every other cached window stale. The cache store is `database`, which does not support tags.
  - **Per-athlete generation counter:** `heatmap:grid:generation:{athleteId}` is stored with `forever()`. The grid key becomes `heatmap:grid:v3:{athleteId}:g{generation}:{windowStart}:{today}`. `forgetAthlete(User $athlete)` replaces `forget(...)` and increments the generation. Every window key changes in one write, and orphaned entries expire through `grid_cache_ttl`. A missing generation reads as 0. The `v3` bump follows the existing "shape of the key" rule in the key() comment.
  - Callers: `SyncStravaActivities` (after each athlete's reconcile) and `ApplyGarminImport` (any import with a target, as today). Each replaces `forget($athlete, HeatmapWindow::current(), now())` with `forgetAthlete($athlete)`.
  - The cached object stays `HeatmapGrid` with no new property. The new `HeatmapGrid::hasRuns()` is a method, so cached shapes do not change.

  ### 4. Dashboard (`DashboardController`, `dashboard.blade.php`, new `<x-window-nav>`)
  - The controller resolves `$window = HeatmapWindow::fromRequestedEnd($this->requestedEnd($request), $today)`, builds the grid through the cache exactly as now, then reads `OldestRunDate` and builds `WindowNavigation`.
  - **Sync status is the same on every window:** `ResolveSyncStatus` is always called with `HeatmapWindow::current($today)`, never with the shown window. The chip, warning, sync card, and skeleton therefore do not move when the visitor navigates.
  - **Empty window note:** it follows the **shown** grid (`$grid->hasRuns()`), not `status->runsInWindow`. Copy (Marika, terse): on the current window it stays as now; on a past window it reads "No runs stored in these 16 weeks."
  - **Heading and range:** `h1` "Last 16 weeks" on the current window, "16 weeks to 9 Aug" on a past one (mirrors `US-014/past-window.html`). The range line above the grid stays `{grid label} · running distance per day` ("18 May – 6 Sep 2026"). The `<title>` follows the heading.
  - **Controls** (decision 46f30df8a6f0ac7a): `<nav class="win-nav" aria-label="Window">` holds two controls. Each is either an `<a class="win-btn" href>` with the accessible name "Previous 4 weeks" / "Next 4 weeks", or, when unavailable, a native `<button type="button" class="win-btn win-btn--off" disabled>` with the same name. A disabled button is announced as disabled and is not a link (AC). Visible text "Previous" / "Next" with arrows, and an sr-only " 4 weeks", so the visible label is contained in the accessible name (WCAG 2.5.3). Port `.win-nav`, `.win-btn`, and `.win-btn--off` from `US-014/trend.css` Part 2 into `resources/css/app.css`. Tap targets stay at the 2.75 rem (44 px) minimum, and the focus-visible outline comes from the layout.
  - `noindex, nofollow` and the Strava attribution stay. A `?to=` page is not indexed either (FR-017).
  - **Read-only by structure (FR-017):** navigation adds only reads (`OldestRunDate`, the grid queries on a cache miss). `strava.fresh` stays a no-op for guests, and nothing on the path calls `EnsureFreshAccessToken` or `StravaClient`.

  ### 5. Garmin import keeps older runs (FR-018)
  - `ParseGarminCsv::__invoke(string $path, CarbonInterface $today)` drops its `HeatmapWindow` argument. A running row dated **today or earlier** is kept at any age, and only a row after today is skipped, counted as `futureDated`. Callers: `UploadGarminCsvController`.
  - **Rename `outsideWindow` → `futureDated`** in `ParsedGarminCsv`, `GarminImportSummary`, `ApplyGarminImport`, and the review and summary views. The label "Outside 16 weeks" becomes "Future-dated". `fromArray()` of both DTOs also reads the legacy `outside_window` key, so a pending upload already in a session when this deploys still opens.
  - **Run cap:** `MAX_RUNS` goes from 1,000 to **5,000** (decision 17affbd2ffbcf2fe). Its comment is updated. The 5 MB rule of `UploadGarminCsvRequest` is unchanged.
  - Conflict review, Overwrite / Skip, identity (re-import is a no-op), and metric backfill are unchanged in code. `PlanGarminImport` already queries stored runs by the file's dates, not by the window, so older runs go through the same rules (AC). This is pinned by tests.

  ### 6. Strava sync unchanged (FR-002)
  `SyncStravaActivities` still reconciles only `HeatmapWindow::current()`. `ReconcileStravaWindow` deletes only Strava-sourced rows inside the window bounds. A test pins that a Strava-sourced and a Garmin-sourced activity dated before the window survive a sync.

  ### Query shape (Andrew, John)
  Dashboard request on a cache hit: the existing sync status queries plus **one** new `MIN(activity_date)`. On a cache miss, add the existing two window queries (daily totals and daily runs). There are no per-week or per-cell queries, and an older window costs the same as the current one.

  ### Risks & notes
  - **US-012 not yet in `release/2.0.0`:** the US-012 branch is 15 commits ahead of `release/2.0.0`, and this plan builds on its cache key (`v2`), `DailyRuns`, and `DayRun`. TASK-00 checks that US-012 is merged into `release/2.0.0` before it branches. If it is not merged, TASK-00 stops and asks.
  - **US-014** (same release) draws its chart for the shown window and invalidates through `HeatmapGridCache`. It inherits `forgetAthlete()` and `WindowNavigation`, so it needs no change of its own for navigation.
  - The PRD's FR-006 wording "across the 112 days" already means the shown window. No PRD edit is needed.

  ## Git & Branching
  - Mode: `GITFLOW` — no automatic push
  - Release: `2.0.0` → branch `feature/US-013-window-navigation` created by `php artisan larapilot:release-feature --semver=2.0.0 --spec=US-013 --slug=window-navigation`, from and toward `release/2.0.0`
  - TASK-00: bootstrap (above). Precondition: US-012 merged into `release/2.0.0`
  - Per task: one Conventional Commit `type(US-013): TASK-NN …`; code, tests, and domain docs ride in the same commit
  - Push / remote PR **only** when the user asks; merge into `release/2.0.0` after review approval

  ## Test Data Strategy
  - Mike extends `TrainingBlockSeeder` with **7 weeks of Garmin-imported history before the 16-week block**, with weekly totals 28.4, 31.0, 33.5, 36.2, 22.0, **0.0** (calf strain), and 18.6 km. These are the US-014 mockup rows, so US-013 and US-014 share one demo dataset. After `migrate:fresh --seed` two Previous steps are possible; the second reaches the oldest run (week of 30 Mar for the 5 Sep reference), where Previous disables
  - No model or schema change: `ActivityFactory` already has `garmin()`-style states. Add states only if a test needs one it lacks
  - Verify `php artisan migrate:fresh --seed` in TASK-10

  ## Test Strategy
  - Bar: `NORMAL` — PHPUnit feature and unit tests; **no** Dusk, Playwright, or browser/viewport suites
  - Unit: `HeatmapWindow` week math (ISO Monday start, a year boundary, mid-week, malformed, unparseable `2026-02-31`, future, previous/next clamping); `WindowNavigation` available/disabled rules
  - Feature: dashboard navigation (URLs, disabled states, past-window grid with no future cells and no partial total, legend from the shown window, identical sync status, malformed `to` incl. `?to[]=x` → 200 current window, guest read-only with `Http::preventStrayRequests()` and no domain-row writes); cache invalidation of **past** windows after an import and after a sync; Garmin import of old and future rows, conflict review on an old run, re-import no-op, legacy session key; Strava sync leaves older activities alone
  - Interleaved: each test task follows the implementation it covers
  - **Manual test handoff** (UI): at 375 / 768 / 1280 px, light and dark — no horizontal page scroll with the nav row; Tab reaches both controls with a visible focus ring; a screen reader announces the disabled control as "Previous 4 weeks, dimmed/unavailable button"; walk Previous to the oldest window and Next back to `/`
