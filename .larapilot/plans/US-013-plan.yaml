      - TASK-03
  -
    id: TASK-06
    title: 'Previous / Next controls: <x-window-nav> component and styles (mobile first, light + dark)'
    body: |-
      ## Description
      Render the two window controls above the grid as keyboard-reachable links named "Previous 4 weeks" and "Next 4 weeks", with a disabled control that is announced as disabled and is not a link (FR-019, FR-009).

      Mirrors: `.larapilot/mockups/US-014/past-window.html` (nav row, heading "16 weeks to 9 Aug", range line) · `.larapilot/mockups/US-014/index.html` (nav row on the current window) · `.larapilot/mockups/US-014/breakpoints.html` (320–1280 px) · `.larapilot/mockups/US-014/dark.html`. Design system: Tailwind CSS 4 (PRD `## Technical Architecture`), tokens of `resources/css/app.css` — no new token.

      **Agreed deviation** (decision 46f30df8a6f0ac7a): the drawn disabled `<span class="win-btn win-btn--off">` becomes `<button type="button" class="win-btn win-btn--off" disabled>`. Add a row to `.larapilot/mockups/US-014/README.md` `## Deviations` (create the section) naming US-013 as the owner of the nav row.

      ## Files Involved
      - resources/views/components/window-nav.blade.php (new — markup only, no arithmetic)
      - resources/views/dashboard.blade.php (place `<x-window-nav :navigation="$navigation" />` between the range line and `.dash`, as in the mockup)
