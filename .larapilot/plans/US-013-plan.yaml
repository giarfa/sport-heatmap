    id: TASK-00
    title: 'Bootstrap the feature branch on release/2.0.0'
    body: |-
      ## Description
      Bootstrap Gitflow for US-013 on release `2.0.0`: create `feature/US-013-window-navigation` from `release/2.0.0` and prepare the internal PR description toward `release/2.0.0`. Do **not** push unless the user asks.

      ## Files Involved
      - (git only — no application files)

      ## Steps
      1. Precondition: `git log --oneline release/2.0.0..feature/US-012-run-metrics-day-detail` is empty (US-012 merged into `release/2.0.0`). If it is not, **stop** and ask the user to merge US-012 first: this plan builds on its cache key, `DailyRuns`, and `DayRun`
      2. Commit or stash the pending `.larapilot/` changes of the US-012 branch, so the tree is clean
      3. `php artisan larapilot:release-feature --semver=2.0.0 --spec=US-013 --slug=window-navigation`
      4. Read `branch`, `base`, and `checked_out` from the JSON. Stop if `checked_out` is false and surface `reason`
      5. Draft internal PR title/body toward `base` (`release/2.0.0`)

