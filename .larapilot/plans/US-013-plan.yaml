    id: TASK-07
    title: 'Feature tests: dashboard window navigation, signed in and signed out'
    body: |-
      ## Description
      Cover every navigation acceptance criterion through HTTP: URLs, disabled states, past-window rendering, legend, sync status, bad input, guest read-only, and accessible names.

      ## Files Involved
      - tests/Feature/Dashboard/WindowNavigationTest.php (new — `php artisan make:test --phpunit Dashboard/WindowNavigationTest`)

      ## Steps
      1. Fix "today" with `$this->travelTo()` only where the controller reads the clock; build data with `ActivityFactory` (Garmin and Strava states) and sign in with `allowlistedAthlete()`
      2. `/` opens on the current window; Next is a disabled button; Previous links to `/?to=<Sunday 4 weeks earlier>`
      3. `/?to=` past window: shows that period's runs and weekly totals, the range "d M – d M Y", heading "16 weeks to …", no `hm-cell--future` cell, no partial tag; Next links forward (and to plain `/` when the step lands on current)
      4. Previous is disabled when the shown window holds the oldest run, and when no run is stored (CSV-less connected athlete with 0 activities, signed in)
      5. Legend: a past window with different distances renders different thresholds than the current one (FR-006)
      6. Sync status markup (chip + sync card) is identical between `/` and `/?to=…`
      7. `?to=2026-02-31`, `?to=garbage`, `?to[]=x`, a future Sunday → 200 and the current window; a Wednesday → the window ending that Sunday
      8. Signed-out visitor: same navigation; `Http::preventStrayRequests()`; counts of `activities`, `users`, `sync_runs` unchanged; an expired-token athlete's tokens unchanged after the visit (no refresh)
      9. Accessible names: the rendered HTML contains links whose text resolves to "Previous 4 weeks" / "Next 4 weeks", and `disabled` on the button form
      10. `php artisan test --compact --filter=WindowNavigationTest` — no Dusk/Playwright/browser suites

