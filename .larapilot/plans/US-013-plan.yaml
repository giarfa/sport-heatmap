    id: TASK-02
    title: 'Unit tests: HeatmapWindow navigation and parsing'
    body: |-
      ## Description
      Pin the window math TASK-01 adds, so the URL contract and the 4-week step cannot drift.

      ## Files Involved
      - tests/Unit/Support/Heatmap/HeatmapWindowTest.php (new — `php artisan make:test --phpunit --unit Support/Heatmap/HeatmapWindowTest` then move under the existing folder if make:test does not nest)

      ## Steps
      1. Read the `testing-best-practices` skill; follow `tests/Unit/Support/Heatmap/HeatmapBuilderTest.php` style (dates named, not time-travelled)
      2. Cases: a Sunday, a Monday, and a mid-week date map to the same window; a window spanning a year boundary (end week of 4 Jan 2027) starts on a Monday 15 weeks earlier and spans 112 days; `2026-02-31`, `2026-8-9`, `09-08-2026`, `''`, `abc` → current; a date in next week → current; today's own week → current and `isCurrent()` true
      3. `previous()` of current ends 4 weeks earlier; `next()` of that is current again; `next()` from 2 weeks behind is clamped to current; `next()` of current is current
      4. `php artisan test --compact --filter=HeatmapWindowTest`
      5. Do **not** add Dusk, Playwright, or browser suites

      ## Completion Criteria
      - [ ] Tests pass locally
      - [ ] Every parsing and clamping rule of TASK-01 has one case
      - [ ] Coverage matches the `NORMAL` bar

      ## Git Deliverables
      - Commit: `test(US-013): TASK-02 cover heatmap window navigation`
      - Push: **skip** (`git_mode: GITFLOW`)
      - PR: remote update only if the user asks
    type: Test
    status: TODO
    assignee: Anne
    estimate_hours: 2
    dependencies:
      - TASK-01
  -
    id: TASK-03
    title: 'Invalidate every cached window of an athlete on sync and import'
    body: |-
      ## Description
      Replace the single-key `HeatmapGridCache::forget()` with an athlete-wide invalidation, so after a confirmed Garmin import or a Strava sync no cached window grid survives the write (AC; FR-019 "no cached window survives the write").

      ## Files Involved
      - app/Support/Heatmap/HeatmapGridCache.php
      - app/Console/Commands/SyncStravaActivities.php
      - app/Actions/Garmin/ApplyGarminImport.php
      - tests/Feature/Dashboard/HeatmapGridCacheTest.php (adjust existing calls to the new API only — new cases are TASK-04)

      ## Steps
      1. Generation counter: `heatmap:grid:generation:{athleteId}` read with `get(…, 0)`, written with `forever()`; `forgetAthlete(User $athlete): void` increments it (`increment()`, falling back to `forever(…, 1)` when the key is missing)
      2. Key becomes `heatmap:grid:v3:{athleteId}:g{generation}:{windowStart}:{today}`; update the key() comment — `v3` names the key format, the generation segment is what makes one write invalidate every window on a store with no tags (`cache.default` is `database`); orphaned entries expire through `grid_cache_ttl`
      3. A read failure of the generation key is reported and treated as a miss-safe value (never serve a grid under a generation that cannot be read): same `try/catch` + `report()` shape as `remember()`
      4. Remove `forget(User, HeatmapWindow, CarbonInterface)`; callers use `forgetAthlete($athlete)` — `SyncStravaActivities` per athlete after its reconcile, `ApplyGarminImport` for any import with a target (keep its existing comment's rule)
      5. `php artisan test --compact tests/Feature/Dashboard tests/Feature/Garmin tests/Feature/Console`

      ## Completion Criteria
      - [ ] One `forgetAthlete()` call changes the key of every window of that athlete, and only that athlete
      - [ ] Sync and confirmed import call `forgetAthlete()`; no caller passes a window any more
      - [ ] Existing cache, sync, and import tests green

      ## Test Data
      - N/A — no model/schema changes in this task

      ## Domain Docs
      - [ ] `.larapilot/docs/devs/heatmap-dashboard.md` — cache key format v3, the generation counter, why not tags / why not a per-window forget loop
      - [ ] `.larapilot/docs/devs/activity-sync.md` and `.larapilot/docs/devs/garmin-csv-import.md` — the write now invalidates every window of the athlete
      - [ ] Folder `README.md` index rows updated
      - [ ] English, committed with this task

      ## Git Deliverables
      - Commit: `feat(US-013): TASK-03 invalidate every cached window on write`
      - Push: **skip** (`git_mode: GITFLOW`)
      - PR: update the local PR notes toward `release/2.0.0` — open/update the remote only if the user asks
    type: Impl
    status: TODO
    assignee: Alex
    estimate_hours: 2
    dependencies:
      - TASK-00
