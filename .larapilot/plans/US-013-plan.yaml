    title: 'Garmin import keeps runs of any age; only future-dated rows are skipped'
    body: |-
      ## Description
      Stop dropping Garmin rows outside the current 112 days: keep every running row dated today or earlier, skip and count only future-dated rows, rename the counter and its label, and raise the per-import run cap to 5,000 (FR-018 changed; decision 17affbd2ffbcf2fe).

      ## Files Involved
      - app/Support/Garmin/ParseGarminCsv.php (drop the `HeatmapWindow` argument; `futureDated` counter; `MAX_RUNS = 5_000` + comment)
      - app/Http/Controllers/Garmin/UploadGarminCsvController.php (call without the window)
      - app/Data/Garmin/ParsedGarminCsv.php, app/Data/Garmin/GarminImportSummary.php (`outsideWindow` → `futureDated`; `toArray()` writes `future_dated`; `fromArray()` also reads legacy `outside_window` — block comment: a pending upload serialized before the deploy must still open)
      - app/Actions/Garmin/ApplyGarminImport.php (pass `futureDated`)
      - resources/views/garmin/review.blade.php, resources/views/garmin/summary.blade.php ("Outside 16 weeks" → "Future-dated")
      - tests/Feature/Garmin/* and tests/Feature/Garmin/ParseGarminCsvTest.php (update existing assertions that expected outside-window skips — new cases are TASK-09)

      ## Steps
      1. In the parser keep the `> $todayDate` check only; remove `! $window->contains(...)`
      2. Rename across DTOs, action, and views; `grep -rn "outsideWindow\|outside_window\|Outside 16 weeks" app resources tests` is empty afterwards except the legacy read in `fromArray()`
      3. Raise `MAX_RUNS`; update its comment (a full export, years of runs; the 5 MB rule still bounds the file)
      4. `PlanGarminImport` and `ApplyGarminImport` need no logic change: confirm by reading that stored runs are matched by the file's dates, not by the window
      5. `php artisan test --compact tests/Feature/Garmin tests/Unit/Support/Garmin`

      ## Completion Criteria
      - [ ] A running row dated before the current window is planned and imported like any other
      - [ ] A row after today is skipped and counted as future-dated; the review and summary say "Future-dated"
      - [ ] A pending upload stored under the old key still opens the review
      - [ ] An import of up to 5,000 runs is accepted; 5,001 is rejected with the existing message
      - [ ] Existing Garmin tests green after updating the renamed counter

