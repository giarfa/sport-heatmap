    id: TASK-01
    title: 'Navigable HeatmapWindow: window from a URL date, previous, next, current'
    body: |-
      ## Description
      Teach `HeatmapWindow` to build the window that ends in the week of any date, to parse the `to` query value strictly without throwing, and to step 4 weeks back and forward with Next clamped to the current window (FR-019, FR-004).

      ## Files Involved
      - app/Support/Heatmap/HeatmapWindow.php
      - config/heatmap.php (`navigation_step_weeks => 4`, literal, documented like `window_weeks`; extend the `@var array{…}` shape)

      ## Steps
      1. `endingInWeekOf(CarbonInterface $day): self` — `endsOn` = Sunday of that ISO week, `startsOn` = Monday `window_weeks - 1` weeks earlier. Re-express `current()` through it
      2. `fromRequestedEnd(string $requested, CarbonInterface $today): self` — accept only `^\d{4}-\d{2}-\d{2}$`, parse with `CarbonImmutable::createFromFormat('!Y-m-d', …)`, reject when `->format('Y-m-d') !== $requested` (round-trip catches `2026-02-31`), and never throw. Empty, malformed, unparseable, or a week after the current week → `current($today)`. A mid-week date → its week
      3. `previous(): self` (back `navigation_step_weeks`), `next(CarbonInterface $today): self` (forward, never past `current($today)`), `isCurrent(CarbonInterface $today): bool`; reuse the existing `contains()` for date checks
      4. `/* … */` block comments for the non-obvious choices: why the URL names the window's **end** week, why an unparseable value falls back silently instead of 404/422 (AC: "without an error"), why an old window is not clamped to the oldest run
      5. `php artisan test --compact tests/Unit/Support/Heatmap` (existing tests stay green)

      ## Completion Criteria
      - [ ] Any `Y-m-d` maps to the window ending in its ISO week; malformed / unparseable / future values give the current window, no exception
      - [ ] `previous()` moves 4 weeks back; `next()` moves 4 weeks forward and never past the current window
      - [ ] `current()` behaviour unchanged (existing tests green)
      - [ ] Pint + Larastan clean for the touched files

      ## Test Data
      - N/A — no model/schema changes in this task

      ## Domain Docs
      - [ ] `.larapilot/docs/devs/heatmap-dashboard.md` updated — the window is navigable: URL date → window, 4-week step, Next clamp, strict parsing and its silent fallback; rejected alternatives (path segment, window start in the URL, 404 on bad input)
      - [ ] Folder `README.md` index row updated (last spec: US-013)
      - [ ] English, committed with this task

      ## Git Deliverables
      - Commit: `feat(US-013): TASK-01 navigable heatmap window`
      - Push: **skip** (`git_mode: GITFLOW`)
      - PR: update the local PR notes toward `release/2.0.0` — open/update the remote only if the user asks
    type: Impl
    status: TODO
    assignee: Alex
    estimate_hours: 3
    dependencies:
      - TASK-00
