    id: TASK-04
    title: 'Feature tests: past windows are invalidated by import and sync'
    body: |-
      ## Description
      Prove that a write reaches windows other than the current one, in both orders (cached before the write, read after).

      ## Files Involved
      - tests/Feature/Dashboard/HeatmapGridCacheTest.php

      ## Steps
      1. Use `ActivityFactory` states and `allowlistedAthlete()` / `allowlistAthletes()` from `Tests\TestCase`
      2. Warm the cache for the current window **and** a window 8 weeks back (GET `/` and `/?to=…`); confirm a Garmin import containing a run in the past window; GET both again → the new run is on the past window and the current one
      3. Same with `SyncStravaActivities` (`Http::fake()` + `Http::preventStrayRequests()` in `setUp()`): a run Strava returns inside the current window appears after the sync, and the previously cached past window is rebuilt (assert by a stored change visible in it)
      4. `forgetAthlete()` of athlete A leaves athlete B's cached grid untouched
      5. `php artisan test --compact --filter=HeatmapGridCacheTest`

      ## Completion Criteria
      - [ ] Tests pass locally
      - [ ] A cached past window never survives a confirmed import or a sync
      - [ ] Coverage matches the `NORMAL` bar

      ## Git Deliverables
      - Commit: `test(US-013): TASK-04 cover cache invalidation of past windows`
      - Push: **skip** (`git_mode: GITFLOW`)
      - PR: remote update only if the user asks
    type: Test
    status: TODO
    assignee: Anne
    estimate_hours: 2
    dependencies:
      - TASK-03
  -
    id: TASK-05
    title: 'Dashboard serves any window: ?to=, oldest run, navigation state, steady sync status'
    body: |-
      ## Description
      Make the home page render the window named by `?to=`, compute Previous / Next availability from the athlete's oldest stored run, keep the sync status identical on every window, and state the period above the grid (FR-019, FR-004, FR-006, FR-017).

      ## Files Involved
      - app/Http/Controllers/DashboardController.php
      - app/Support/Heatmap/OldestRunDate.php (new — `php artisan make:class Support/Heatmap/OldestRunDate`)
      - app/Data/Heatmap/WindowNavigation.php (new final readonly DTO)
      - app/Data/Heatmap/HeatmapGrid.php (`hasRuns(): bool` — a method, no new property)
      - app/Data/SyncStatus.php (empty-window copy for a past window, if the note stays on SyncStatus)
      - resources/views/dashboard.blade.php (heading, `<title>`, empty note from the shown grid — the nav markup itself is TASK-06)

      ## Steps
      1. Controller: read `to` through a private `requestedEnd(Request $request): string` returning `''` for anything non-string (`.ai/rules/http.md`); `$window = HeatmapWindow::fromRequestedEnd(…, $today)`; grid through `HeatmapGridCache::remember()` unchanged
      2. `OldestRunDate::__invoke(User $athlete): ?CarbonImmutable` — one `MIN(activity_date)`, served by the `(user_id, activity_date)` index; read fresh per request (comment why it is not inside the cached grid)
      3. `WindowNavigation` (built in the controller or by a static `for(HeatmapWindow $window, CarbonInterface $today, ?CarbonInterface $oldestRun)`): `previousUrl` = `route('dashboard', ['to' => previous end])` only when `oldestRun !== null && oldestRun < window->startsOn`; `nextUrl` = `null` on the current window, `route('dashboard')` (no `to`) when next is current, else `route('dashboard', ['to' => …])`; `heading()` "Last 16 weeks" / "16 weeks to 9 Aug"; `rangeLabel()` reuses `HeatmapGrid::label()` format ("18 May – 6 Sep 2026")
      4. `ResolveSyncStatus` is called with `HeatmapWindow::current($today)` — never the shown window — so chip, warning, sync card and skeleton are the same on every window; block comment states this
      5. Empty-window note follows `$grid->hasRuns()`; past-window copy "No runs stored in these 16 weeks." (current-window copy unchanged)
      6. Pass `navigation` to the view; `<title>` and `h1` use `navigation->heading()`
      7. `php artisan test --compact tests/Feature/Dashboard`

      ## Completion Criteria
      - [ ] `/` renders the current window exactly as before (existing dashboard tests green)
      - [ ] `/?to=<past Sunday>` renders that window's grid, weekly totals, legend, and date range; no future cells and no partial total
      - [ ] Previous / Next availability follows the oldest-run and current-window rules
      - [ ] Sync status identical on every window; empty note follows the shown window
      - [ ] At most one extra query per request (the `MIN`)

      ## Test Data
      - N/A — no model/schema changes in this task

      ## Domain Docs
      - [ ] `.larapilot/docs/devs/heatmap-dashboard.md` updated — request flow with `?to=`, `OldestRunDate`, `WindowNavigation` rules, why sync status always reads the current window, query shape
      - [ ] Folder `README.md` index row updated (last spec: US-013)
      - [ ] English, committed with this task

      ## Git Deliverables
      - Commit: `feat(US-013): TASK-05 serve any window on the dashboard`
      - Push: **skip** (`git_mode: GITFLOW`)
      - PR: update the local PR notes toward `release/2.0.0` — open/update the remote only if the user asks
    type: Impl
    status: TODO
