      ## Steps
      1. Overwrite path: `fill($row->toAttributes())` + explicit `source`; assert `garmin_activity_id` survives
      2. Tests: a CSV row within ±2 min of a `garminSynced()` run is a conflict in the review ("Clashes to decide 1"); Skip leaves it untouched; Overwrite keeps the Garmin id, writes CSV values, `source = garmin_csv`; new rows get `garmin_csv`; re-importing the same file changes nothing; upload/confirm throttle and summary counts unchanged (existing tests green)
      3. `php artisan test --filter=GarminImport`

