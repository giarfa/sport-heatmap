    id: TASK-05
    title: 'Tests: sync behaviour, idempotence, linking, failures, schedule, secret hygiene'
    body: |-
      ## Description
      Pin every sync acceptance criterion through `php artisan garmin:sync` and the action, against faked Garmin responses.

      ## Files Involved
      - `tests/Feature/Garmin/GarminSyncTest.php`
      - `tests/Feature/Garmin/GarminSyncCommandTest.php`
      - `tests/Feature/Console/ScheduleTest.php` — `test_nothing_is_scheduled` becomes "only `garmin:sync --scheduled` is scheduled, daily"; the `strava:sync` assertion stays

      ## Steps
      1. `setUp()`: `Http::preventStrayRequests()`, fake key, `token_cache_store` = `array`, `travelTo()` a fixed Saturday
      2. Paging: three faked pages (100, 100, 37) → three data calls with `start` 0/100/200, stops on the short page
      3. Type mapping & counts: running/trail/virtual stored with the right `SportType`; cycling `ignored`; tomorrow `future_dated`; missing `startTimeLocal` `invalid`
      4. Values: each stored column per plan rule 7, `source = garmin_api`, `garmin_activity_id` set; null metrics stored null, never 0
      5. Window: first sync sends no `startDate`; second sync sends `startDate` = newest Garmin run − 7 days; a failed half-done first sync is followed by another full-history read
      6. Edit on Garmin: a renamed activity within the span updates the run (`updated` = 1)
      7. Linking: a CSV run at 07:01:00 and an API activity at 07:02:30 on the same date → one run, id set, API values, `linked` = 1; 07:04:00 → a new run
      8. Idempotence: run twice → second result all zero, `Activity::max('updated_at')` unchanged; a run missing from the second response stays stored
      9. Partial failure: page 2 answers 503 → page-1 runs kept, row `failed` / `unreachable` with counts
      10. Cache: open `/` (grid cached), sync a new run in the window, open `/` again → the cell, intensity legend and trend show it
      11. No key: `Http::assertNothingSent()`, no `garmin_syncs` row, exit 0
      12. Concurrency: hold `Cache::lock('garmin:sync')` → refusal, exit 1, nothing sent, nothing recorded
      13. Secret hygiene: after success and after each failure, no table (`cache`, `garmin_syncs`, `activities`) and no `Log` call contains the fake key or token
      14. `php artisan test --filter='GarminSync|ScheduleTest'`; no browser/E2E suites

      ## Completion Criteria
      - [ ] Tests pass locally
      - [ ] Every _Sync (FR-002, FR-003)_ criterion has at least one assertion

      ## Test Data
      - N/A — factories from TASK-01, JSON fixtures from TASK-03

      ## Domain Docs
      - N/A — tests only

      ## Git Deliverables
      - Commit: `test(US-022): TASK-05 cover the Garmin sync and its schedule`
      - Push: **skip** (`git_mode: GITFLOW`)
      - PR: update the local PR notes
