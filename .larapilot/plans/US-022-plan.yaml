code: US-022
plan_body: |-
  **Release:** 3.1.0

  ## Technical Solution

  A second way runs enter: the owner's Garmin Connect Personal API, read once a day by the scheduler and on demand by a "Sync now" button. The CSV import stays as it is; both sources share `StartTimeMatcher` (±2 min, same local date) and the `activities` table.

  ### Components (all under the Garmin sub-namespace of each layer, `.ai/rules/app.md`)

  | Layer | Class | Job |
  | --- | --- | --- |
  | Enums | `ActivitySource` (`garmin_csv`, `garmin_api`), `GarminSyncTrigger` (`scheduled`, `manual`), `GarminSyncOutcome` (`running`, `succeeded`, `failed`), `GarminSyncFailure` (`key_rejected`, `unreachable`, `unexpected`) | Data-model vocabulary |
  | Model | `GarminSync` (`garmin_syncs`) | One row per attempt: trigger, started_at, finished_at, outcome, failure_cause, `full_history` flag, counts `new` / `updated` / `linked` / `ignored` / `future_dated` / `invalid` |
  | Support | `GarminPersonalApiClient` | Key → raw-JWT token exchange, token reuse from the **file** cache store until one hour before `exp`, activity search page, one re-exchange + retry on a data-call 401, HTTP failures mapped to `GarminApiException(GarminSyncFailure)` |
  | Data | `GarminApiActivity::fromApiPayload()`, `GarminSyncCounts`, `GarminSyncResult` | Readonly DTOs at the API boundary (`.ai/rules/data.md`); no raw payload reaches the action or Eloquent |
  | Support | `GarminRunningTypes::sportTypeForTypeKey()` | API `typeKey` → `Run` / `TrailRun` / `VirtualRun`, beside the existing CSV label map |
  | Action | `SyncGarminActivities` | Lock, record the attempt, choose the window, page, match / link / create / update, per-page transactions, grid-cache invalidation, finalise the row |
  | Console | `garmin:sync` (`app/Console/Commands/GarminSyncCommand`), scheduled daily in `routes/console.php` | Thin wrapper over the action; `--scheduled` marks the scheduler's trigger, a bare CLI run is `manual` |
  | HTTP | `POST /sync/garmin` → `Garmin\SyncGarminNowController`, `throttle:garmin-sync` | Sync now, in the `auth` + `password.set` group |
  | Status | `ImportStatus` + `ResolveImportStatus` extended | Last sync vs last import, latest failure, whether the sync is configured |
  | Views | `x-sync-warning`, action line, empty state, rail card | UI per decision aad88aa01db73362 |

  ### Key rules the implementation must hold

  1. **Token storage (decision dffd4adf33c2d285):** the access token lives only in `Cache::store(config('services.garmin.token_cache_store'))`, a literal `'file'` in `config/services.php`; never the default store (`CACHE_STORE=database` would put it in SQLite). Tests `Config::set()` it to `array`. The key is read only from `config('services.garmin.api_key')` (`env('GARMIN_API_KEY')` inside `config/` only).
  2. **Token lifetime:** the body of the token call is a raw JWT (trim whitespace and quotes); `exp` is read by base64url-decoding the payload segment (no signature check — we are the client, not the verifier). Cached until `exp - 3600`. An unreadable token or a missing `exp` is an `unexpected` failure, never a guessed TTL.
  3. **Failure mapping:** token call 401/403 → `key_rejected`; data call 401 → forget the token, re-exchange once, retry once; a second 401/403 → `key_rejected`; `ConnectionException`, timeout, 5xx, 429 → `unreachable`; any other status or an unreadable JSON body → `unexpected`. Exception messages and log context carry only the cause and the HTTP status — never the key, the token, a response body, or a URL with query (`.ai/rules/app.md`, **Never let credentials reach logs**). Chain the previous exception with a fresh message.
  4. **Window:** full history (no `startDate`) when no run carries a `garmin_activity_id` **or** no `succeeded` sync with `full_history = true` exists — so a first sync that failed half-way is re-run in full rather than shrinking to the last 7 days of what it stored. Otherwise `startDate` = (newest `activity_date` of a run with a Garmin id) − 7 days, `endDate` = today; this always covers at least the last 7 days and also bridges a run of failed nightly syncs. Paging: `start` += `limit` (literal page size 100) until a page returns fewer than `limit` items.
  5. **Matching, per API activity:** (a) a stored run with the same `garmin_activity_id` → compare every API-owned column, write only when something differs (`updated`), else untouched; (b) else the `StartTimeMatcher::closest()` among the owner's runs on that date **with no Garmin id** → gains the id, the API values, `source = garmin_api` (`linked`, no review); (c) else create (`new`). Candidates for one page are loaded in **one query** (owner's runs whose `activity_date` falls within the page's min/max date, on the `(user_id, activity_date)` index) — no per-activity query. A run absent from Garmin is never deleted.
  6. **Filtering:** non-running `typeKey` → `ignored`; local start date after today (same `now()` rule as `ParseGarminCsv`) → `future_dated`; missing `activityId`, `startTimeLocal`, `distance`, or `movingDuration` → `invalid` (counted, skipped, never aborts the sync).
  7. **Values:** `distance_meters = round(distance)`, `moving_time_seconds = round(movingDuration)`, `start_date_local` / `activity_date` from `startTimeLocal` (wall clock, built in UTC like `GarminCsvRow`), `average_pace_seconds_per_km = round(1000 / averageSpeed)` or null when `averageSpeed` is null or 0, `total_ascent_meters = round(elevationGain)` or null, `average_heart_rate = round(averageHR)` or null — never 0 for a missing metric. On an update or a link, a null API metric keeps the stored value (the same rule as a `--` cell on CSV Overwrite), so a metric backfilled from the CSV is never blanked.
  8. **Partial writes:** each page is written in its own `DB::transaction`; a failure on page N keeps pages 1..N-1, records `failed` with the cause and the counts so far. After any attempt that wrote at least one row (success or failure), `HeatmapGridCache::forgetAthlete()` runs, so every window, the intensity scale and the trend show the new data.
  9. **One sync at a time:** `Cache::lock('garmin:sync', 1800)->get()` on the default store (the lock holds no secret; `cache_locks` already exists). Not acquired → `GarminSyncAlreadyRunning`: Sync now flashes "A Garmin sync is already running — nothing started.", the command prints the same and exits 1; nothing is recorded, nothing is called. The lock is released in `finally`.
  10. **No key:** with an empty `GARMIN_API_KEY` the command prints that nothing is configured and exits 0, calls nothing, records nothing; the dashboard shows no Sync now, no sync status, no warning — exactly today's behaviour; `POST /sync/garmin` redirects to the dashboard with a notice and calls nothing.
  11. **CSV coexistence:** CSV rows keep `source = garmin_csv` (column default + explicit on Overwrite); Overwrite never touches `garmin_activity_id` (it is not in `toAttributes()` and not `#[Fillable]`). Accepted trade-off, documented in the domain doc: for a run with a Garmin id the API is authoritative, so a CSV Overwrite of a run dated within the next sync's re-read span is replaced by the API values at that sync.
  12. **Status (FR-007):** "last sync" = `finished_at` of the newest `succeeded` attempt (even one that wrote nothing); "last import" = newest `updated_at` among runs with `source = garmin_csv`; the chip shows the more recent. Warning while the newest **finished** attempt is `failed`: "Garmin key rejected — renew it" (`key_rejected`), "Garmin unreachable" (`unreachable`), "Garmin sync failed" (`unexpected`). Read fresh per request, outside the grid cache, two indexed queries on `garmin_syncs`.

  ### Data model (Mike)

  - `activities`: add `source` (string, not null, default `garmin_csv` — every existing row is a CSV import) and `garmin_activity_id` (unsigned big integer, nullable, unique). Both stay **out of `#[Fillable]`** (`.ai/rules/models.md`): the action assigns them explicitly.
  - `garmin_syncs`: `id`, `trigger`, `started_at`, `finished_at` (nullable while running), `outcome`, `failure_cause` (nullable), `full_history` (bool), six unsigned integer counts default 0, timestamps; index `(outcome, finished_at)` for the two status queries. No key, token, URL or response body column exists.
  - Integer primary keys, not UUIDs: the existing schema uses auto-increment ids and the PRD data model keeps them (Security baseline UUID default intentionally not applied — existing codebase opt-out).

  ### Scheduling & runtime

  - `Schedule::command('garmin:sync --scheduled')->dailyAt('05:00')->timezone(config('heatmap.display_timezone'))` — early morning in the owner's wall clock so yesterday's evening run is there at breakfast; Sync now covers the rest. `php artisan schedule:list` lists it.
  - No queue: the PRD records Sync now as synchronous inside its request. HTTP timeouts: connect 5 s, request 20 s. README recommends running the very first full-history sync from the CLI (`php artisan garmin:sync`) on the host, because a long history can exceed the web server's request timeout; a cut-off first sync is safe (rule 4 re-reads in full).

  ## Git & Branching
  - Mode: `GITFLOW` (no automatic push), release mode on
  - Branch: `feature/US-022-garmin-connect-sync` from `release/3.1.0`, opened by `php artisan larapilot:release-feature --semver=3.1.0 --spec=US-022 --slug=garmin-connect-sync`
  - TASK-00: bootstrap via `release-feature`
  - Per task: one Conventional Commit `type(US-022): TASK-NN …` with code, tests and domain docs together; no push, no remote PR unless the owner asks
  - PR base: `release/3.1.0` (not `develop`), drafted locally
  - Merge after `larapilot-review` approval (auto-approve is on)

  ## Test Data Strategy
  - Mike/Alex keep factories and seeders current in the same task as the schema change
  - `ActivityFactory`: new `garminSynced()` state (`source = garmin_api`, unique `garmin_activity_id` from a realistic 11-digit sequence); `garminImported()` sets `source = garmin_csv` explicitly
  - `GarminSyncFactory` (new): states `succeeded()`, `failed(GarminSyncFailure)`, `running()`, `manual()`, `scheduled()`, `fullHistory()`
  - `TrainingBlockSeeder`: the last 4 weeks of the 16-week block become API-synced runs (with Garmin ids), the rest stay CSV-imported; one `succeeded`, `full_history` scheduled sync row finished this morning, so the dashboard shows "Last sync" out of the box
  - **Never `migrate:fresh --seed` on the dev database** (`database/database.sqlite` holds the owner's real runs and there is no `.env.testing`): seeders are verified by `TrainingBlockSeederTest` / `SeederMeetsMigrationOwnerTest` on the in-memory test database; the additive migration is applied to dev with `php artisan migrate` only after copying `database/database.sqlite` aside

  ## Test Strategy
  - Bar: `NORMAL` — Pest/PHPUnit feature and unit tests (the project's existing class-based `Tests\TestCase` style); no Playwright, Dusk, browser or viewport suites
  - Every test touching the client: `Http::preventStrayRequests()` in `setUp()` + `Http::fake()` (`.ai/rules/tests.md`); `phpunit.xml` pins `GARMIN_API_KEY` to empty so the owner's real key in `.env` never reaches a test; the token store is `Config::set('services.garmin.token_cache_store', 'array')`
  - Signed-in tests use `signInOwner()`
  - Interleaved: client tests (TASK-03) right after the client, sync tests (TASK-05) right after the action, HTTP/status tests (TASK-07) right after the UI, coexistence tests inside TASK-08
  - Existing tests superseded by this spec are rewritten, not deleted silently: `ScheduleTest::test_nothing_is_scheduled`, `ImportStatusTest::test_no_state_renders_a_warning` (kept, scoped to no key), the `role="alert"` assertions in `StravaRemovedTest` (still valid with no key — keep them green)
  - Secret leakage is asserted, not assumed: after a sync, the `cache`, `garmin_syncs`, `activities` tables and every `Log` call contain neither the fake key nor the fake token
  - `RouteAccessTest` walks the route table, so the new `POST /sync/garmin` is covered by the signed-out and no-password gates automatically
  - **Manual test handoff (owner, after TASK-10):** with the real `GARMIN_API_KEY` in `.env`, back up `database/database.sqlite`, run `php artisan garmin:sync`, check the counts and that CSV runs were linked not duplicated, run it again (all zero), press Sync now on the dashboard, temporarily set a wrong key and check "Garmin key rejected — renew it", restore it and check the warning clears; check 375 / 768 / 1280 px in light and dark

  ## Quality
  - `php artisan larapilot:quality` (Pint + Larastan level 5) green before every `task-done`; `vendor/bin/pint --dirty --format agent` after PHP edits
  - `.ai/rules` honoured: single-action invokable controllers, no Form Request for a field-less POST, Actions never authorize, readonly DTOs at the boundary, block `/* … */` rationale comments, `#[Fillable]`/`#[Hidden]` attributes, full `@property` docblocks

  ## Risks
  - **Undocumented API:** no rate limit or max window is published — the client pages politely (sequential, 100 per page) and logs status codes only. A payload field that changes shape becomes `invalid` / `unexpected`, never a crash with a secret in the message.
  - **Long first sync over HTTP** — mitigated by the CLI recommendation and by rule 4.
  - **US-023** (same release) adds extended metrics to `GarminApiActivity` and the CSV row: keep `fromApiPayload()` and the API-owned column list in one place so US-023 extends them without touching the matching logic.
