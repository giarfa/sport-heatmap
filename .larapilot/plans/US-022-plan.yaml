    id: TASK-04
    title: 'SyncGarminActivities action, garmin:sync command, daily schedule'
    body: |-
      ## Description
      The sync itself: one lock, one recorded attempt, the window decision, paging, match / link / create / update with per-page transactions, grid-cache invalidation, and the Artisan command the scheduler runs once a day.

      ## Files Involved
      - `app/Actions/Garmin/SyncGarminActivities.php` — `__invoke(User $owner, GarminSyncTrigger $trigger): GarminSyncResult`; constructor-promoted private readonly `GarminPersonalApiClient`, `StartTimeMatcher`, `HeatmapGridCache`; no authorization inside (`.ai/rules/actions.md`)
      - `app/Data/Garmin/GarminSyncCounts.php`, `app/Data/Garmin/GarminSyncResult.php` (outcome, counts, `?GarminSyncFailure`), `app/Exceptions/Garmin/GarminSyncAlreadyRunningException.php`
      - `app/Console/Commands/GarminSyncCommand.php` (`php artisan make:command GarminSyncCommand --no-interaction`) — signature `garmin:sync {--scheduled}`
      - `routes/console.php` — `Schedule::command('garmin:sync --scheduled')->dailyAt('05:00')->timezone(config('heatmap.display_timezone'))`; replace the "Nothing is scheduled" comment with the why of the schedule
      - `app/Support/Garmin/` — owner resolution helper if needed (the single `giarfa` user, as the CSV import resolves it)

      ## Steps
      1. Lock: `Cache::lock('garmin:sync', 1800)->get()`; not acquired → throw `GarminSyncAlreadyRunningException` before any row or call; release in `finally`
      2. Record `GarminSync` (`running`, trigger, `started_at`, `full_history` per plan rule 4)
      3. Page loop: `start` += 100 until a short page. Per page: build DTOs; count `ignored` / `future_dated` / `invalid`; load candidates in **one query** (`$owner->activities()->onDaysBetween(min, max)->get()`), index by `garmin_activity_id`; then for each DTO apply plan rule 5 inside `DB::transaction` for the page; `garmin_activity_id` and `source` assigned explicitly (`forceFill` only for those two), API values through `fill()`; update only when `isDirty()`
      4. On `GarminApiException`: finalise the row `failed` + cause + counts so far; return the result (never rethrow to the scheduler with a secret); log `warning` with `['cause' => …, 'status' => …]` only
      5. Any written row → `HeatmapGridCache::forgetAthlete($owner)` (success or failure)
      6. Command: empty key → info line "GARMIN_API_KEY is not set — nothing to sync.", exit 0, nothing recorded; already running → the refusal line, exit 1; else print the counts table or the failure warning, exit 0 on success, 1 on failure; trigger `scheduled` with `--scheduled`, `manual` otherwise
      7. Block comments: why the window bridges failed nights, why candidates are loaded per page, why per-page transactions, why API-authoritative updates keep a stored metric the API leaves null
      8. `php artisan schedule:list` shows `garmin:sync --scheduled`; `php artisan test`

      ## Completion Criteria
      - [ ] Whole history on the first sync; later syncs from newest Garmin run − 7 days to today
      - [ ] Re-running changes nothing (no `updated_at` moves); a run gone from Garmin stays
      - [ ] A CSV run on the same date within ±2 min gains the id and API values; no duplicate, no review
      - [ ] A failure mid-way keeps earlier pages and records cause + counts
      - [ ] One sync at a time; no-key run calls and records nothing
      - [ ] No N+1: one candidate query per page
      - [ ] Tests pass; `php artisan larapilot:quality` green

      ## Test Data
      - N/A — no model/schema changes in this task (uses TASK-01 factories)

      ## Domain Docs
      - [ ] `.larapilot/docs/devs/garmin-api-sync.md` — **Purpose**, **Functional flow** step by step (lock → record → window → page → match/link/create/update → cache → finalise), failure paths, the schedule and its time, **Extension points & gotchas** (US-023 extends the API-owned columns; never move the lock to the default-store-free path)
      - [ ] `.larapilot/docs/devs/garmin-csv-import.md` — shared matching rule now has two callers
      - [ ] Folder `README.md` index row refreshed; English; committed with this task

      ## Git Deliverables
      - Commit: `feat(US-022): TASK-04 sync Garmin runs daily with garmin:sync`
      - Push: **skip** (`git_mode: GITFLOW`)
      - PR: update the local PR notes
