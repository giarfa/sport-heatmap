    id: TASK-02
    title: 'Garmin Personal API client, config, and the activity DTO'
    body: |-
      ## Description
      Hand-rolled client on Laravel's HTTP client (no package — PRD prior art): key → raw-JWT token, token reuse from the file cache store until one hour before `exp`, one activity-search page, one re-exchange + retry on a data-call 401, and every HTTP failure mapped to a cause that carries no secret. Plus the DTO that turns one API activity into run values.

      ## Files Involved
      - `config/services.php` — `garmin` block: `api_key => env('GARMIN_API_KEY')`; literals `base_url` (`https://personal.connectapi.garmin.com`), `token_path`, `activities_path`, `page_size` (100), `resync_days` (7), `token_cache_store` (`'file'`, decision dffd4adf33c2d285), `connect_timeout` (5), `timeout` (20) — endpoint URLs are literals (`.ai/rules/config.md`)
      - `.env.example` — empty `GARMIN_API_KEY=` under a `# Garmin Connect Personal API` comment
      - `phpunit.xml` — `<env name="GARMIN_API_KEY" value=""/>` so the owner's real key in `.env` never reaches a test
      - `app/Support/Garmin/GarminPersonalApiClient.php` (`php artisan make:class --no-interaction`)
      - `app/Exceptions/Garmin/GarminApiException.php` — carries `GarminSyncFailure $cause` and `?int $status`; fixed messages only
      - `app/Data/Garmin/GarminApiActivity.php` — final readonly; `fromApiPayload(array $payload): ?self` (null when a required field is missing/unreadable), `sportTypeKey`, `toRunAttributes()` + `metricAttributes()` (non-null metrics only)
      - `app/Support/Garmin/GarminRunningTypes.php` — add `sportTypeForTypeKey(string $typeKey): ?SportType` with the nine API keys from FR-003
      - `tests/Feature/Config/EnvironmentExampleTest.php` — `GARMIN_API_KEY` present and empty

      ## Steps
      1. Config + `.env.example` + `phpunit.xml`
      2. Client: `Http::baseUrl()->connectTimeout()->timeout()`; `token()` → `POST` with `Authorization: ApiKey {key}`; trim the body; base64url-decode the payload segment; read `exp`; `Cache::store(config('services.garmin.token_cache_store'))->put($key, $token, exp - 3600 - now)`; never the default store
      3. `activities(int $start, int $limit, ?CarbonInterface $startDate, ?CarbonInterface $endDate): array<int, array<string, mixed>>` with `Authorization: Bearer`, `Accept: application/json`; on 401: forget, re-exchange, retry once; second 401/403 → `key_rejected`
      4. Failure mapping per plan body rule 3; catch `ConnectionException` and `RequestException`; new exception with a fixed message (`'Garmin token exchange refused (HTTP 401).'`), previous chained — never `$e->getMessage()` of the HTTP exception (it embeds the URL and body)
      5. DTO per plan body rule 7: rounding, null for null/0 `averageSpeed`, null `elevationGain`/`averageHR`; `startTimeLocal` parsed `Y-m-d H:i:s` in UTC as wall clock (same as `GarminCsvRow::wallClock`)
      6. Block comments for every non-obvious choice (raw JWT, `exp` − 1 h, file store, chained message)

      ## Completion Criteria
      - [ ] No key, token, response body, or query URL in any exception message or log context
      - [ ] Token reused from the file store until one hour before `exp`; never written to the default cache
      - [ ] `GARMIN_API_KEY` empty in `.env.example` and `phpunit.xml`
      - [ ] `php artisan larapilot:quality` green

      ## Test Data
      - N/A — no model/schema changes in this task (fixtures for the API live in TASK-03)

      ## Domain Docs
      - [ ] `.larapilot/docs/devs/garmin-api-sync.md` — **Technical design** (client, DTO, config keys), **Architectural choices** (no package — Python-only official client; raw JWT read without verification; file store over the database cache, decision dffd4adf33c2d285; rejected: storing the token in a column, encrypting it in the database cache), **Key decisions & invariants** (failure mapping table, secret hygiene)
      - [ ] Folder `README.md` index row refreshed; English; committed with this task

      ## Git Deliverables
      - Commit: `feat(US-022): TASK-02 add the Garmin Personal API client and activity DTO`
      - Push: **skip** (`git_mode: GITFLOW`)
      - PR: update the local PR notes
