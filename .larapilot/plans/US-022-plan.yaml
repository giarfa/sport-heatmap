    id: TASK-03
    title: 'Tests: API client token lifecycle, failure mapping, DTO mapping'
    body: |-
      ## Description
      Pin the client and the DTO against faked Garmin responses; no test reaches Garmin.

      ## Files Involved
      - `tests/Feature/Garmin/GarminPersonalApiClientTest.php`
      - `tests/Unit/Data/Garmin/GarminApiActivityTest.php`
      - `tests/Unit/Support/Garmin/GarminRunningTypesTest.php` (API keys)
      - `tests/Fixtures/Garmin/api/` — `activities-page-*.json` built from the API facts in the spec (running, trail, virtual, cycling, a future-dated run, null metrics, `averageSpeed` 0)

      ## Steps
      1. `setUp()`: `Http::preventStrayRequests()`, `Config::set('services.garmin.api_key', 'test-key-…')`, `Config::set('services.garmin.token_cache_store', 'array')`
      2. A helper builds an unsigned JWT with a chosen `exp` (header.payload.signature, base64url)
      3. Cover: raw-JWT (non-JSON) body accepted; token reused across two calls (one exchange recorded); a token within one hour of `exp` is re-exchanged; `ApiKey` and `Bearer` headers sent; token call 401 and 403 → `key_rejected`; data 401 → one re-exchange + retry succeeds; data 401 twice → `key_rejected`; `Http::fake` connection exception, 500, 503, 429 → `unreachable`; 400 / malformed JSON / JWT without `exp` → `unexpected`
      4. For every failure: the exception message and `Log` (spy) contain neither the key nor the token; the default cache store holds no token
      5. DTO: every `typeKey` of FR-003 maps; `cycling`/`hiking` → null sport type; rounding of distance/moving time/ascent/HR; pace `round(1000 / averageSpeed)` (e.g. 3.0959 m/s → 323); null/0 speed → null pace; missing `activityId` / `startTimeLocal` → `fromApiPayload()` null
      6. `php artisan test --filter=Garmin`
      7. No Playwright, Dusk, browser or viewport suites

      ## Completion Criteria
      - [ ] Tests pass locally
      - [ ] Coverage matches the `NORMAL` bar (happy path, failure modes, secret hygiene)

      ## Test Data
      - N/A — JSON fixtures only, no model changes

      ## Domain Docs
      - N/A — tests only

