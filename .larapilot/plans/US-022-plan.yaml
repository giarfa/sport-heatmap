      ## Steps
      1. Migration on `activities`: `$table->string('source')->default('garmin_csv')`; `$table->unsignedBigInteger('garmin_activity_id')->nullable()->unique()`. `down()` drops the unique index first, then both columns (SQLite rebuild — see the comment in `remove_strava_from_schema`)
