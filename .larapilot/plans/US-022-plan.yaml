    id: TASK-06
    title: 'Sync now route, sync status, failure warning on the dashboard'
    body: |-
      ## Description
      The owner-facing half: a CSRF-protected, throttled `POST` Sync now that runs the sync in the request and reports what it did; a status line that shows the more recent of the last sync and the last CSV import; the failure warning; all hidden when no key is configured.

      **Design system:** Tailwind CSS (`.larapilot/mockups/heatmap-dashboard/README.md`), tokens already ported in `resources/css/app.css` (`--warn-bg`, `--warn-border`, `--warn-ink`, `.btn`, `.btn--secondary`, `.import-chip`). No new token, no new dependency.

      **Mirrors:** `.larapilot/mockups/heatmap-dashboard/states.html` (§3 "Sync stale or failed" banner — same structure and `role="alert"`, without the Strava "Reconnect" button and with the new copy), `.larapilot/mockups/heatmap-dashboard/index.html` (header chip, rail card, the action line under the map), `.larapilot/mockups/heatmap-dashboard/dark.html` (dark theme), `.larapilot/mockups/heatmap-dashboard/breakpoints.html` (chip hidden < 640 px, footer carries it). Placement decided with the owner (decision aad88aa01db73362): Sync now joins the action line (`Import Garmin CSV · Sync now · Sign out`) and is a secondary button in the empty-state card; a "Last sync" row joins the rail card. Any further deviation is agreed in chat first.

      ## Files Involved
      - `routes/web.php` — `Route::post('/sync/garmin', SyncGarminNowController::class)->middleware('throttle:garmin-sync')->name('garmin.sync')` inside the `auth` + `password.set` group, with a block comment
      - `app/Providers/AppServiceProvider.php` — `RateLimiter::for('garmin-sync', …)` `Limit::perMinute(3)` by user id, with the why
      - `app/Http/Controllers/Garmin/SyncGarminNowController.php` — single-action `__invoke`, collaborators as parameters; no Form Request (no submitted fields — `.ai/rules/http.md`); no key → redirect with "Garmin sync is not configured." and no call; catches `GarminSyncAlreadyRunningException` → "A Garmin sync is already running — nothing started."; success → "Sync finished: N new, N updated, N linked, N ignored, N future-dated." (plus "N unreadable" only when > 0); failure → "Sync failed: {warning}"; all through the existing `session('status')` flash
      - `app/Data/ImportStatus.php` — add `?CarbonInterface $lastSyncedAt`, `?GarminSyncFailure $syncFailure`, `bool $syncConfigured`; `chipLabel()` picks the more recent of "Last sync N ago" / "Last import N ago"; `syncWarning(): ?string`; `lastSyncLabel()` / `lastSyncRelative()`; `emptyWindowNote()` mentions the sync when configured
      - `app/Support/Garmin/ResolveImportStatus.php` — last import from `source = garmin_csv` only; newest succeeded `finished_at`; newest finished attempt's outcome/cause; skip both sync queries when no key
      - `resources/views/components/sync-warning.blade.php` (new), `dashboard.blade.php` (warning above the grid, action line), `dashboard-empty.blade.php` (Sync now secondary button + warning), `components/import-detail.blade.php` ("Last sync" row only when configured), rail `aria-label`
      - `tests/Unit/Data/ImportStatusTest.php` — new label cases

      ## Steps
      1. Route, limiter, controller
      2. `ImportStatus` / `ResolveImportStatus` changes; keep every user-facing string in `ImportStatus` / `GarminSyncFailure` — no date arithmetic in Blade
      3. Views mobile-first: the Sync now control is a `<form method="POST">` with `@csrf` and a `<button>` styled like the existing Sign out link (min 44 px tall, `:focus-visible` kept); the empty state uses `.btn .btn--secondary w-full`; the banner is `role="alert"` above the grid on both screens
      4. Copy (Marika): terse, factual, no exclamation marks — exact strings as above
      5. Smoke-check 375 / 768 / 1280 px, light and dark, during implement (manual under `NORMAL`)
      6. `php artisan test`

      ## Completion Criteria
      - [ ] Sync now visible only with a key; signed-out `POST` redirects to `/login` and calls nothing; throttled; refused while a sync runs
      - [ ] Summary or failure cause reported after Sync now
      - [ ] Chip/footer show the more recent of last sync and last import; warning shown while the newest finished attempt failed, gone after a success
      - [ ] With no key the dashboard renders exactly as before (no button, no sync row, no warning)
      - [ ] UI usable at mobile/tablet/desktop in both themes (manual smoke OK under `NORMAL`)
      - [ ] Tests pass; `php artisan larapilot:quality` green

      ## Test Data
      - N/A — no model/schema changes in this task

      ## Domain Docs
      - [ ] `.larapilot/docs/devs/heatmap-dashboard.md` — status resolution (sync vs import, the warning, no-key behaviour), Sync now entry points, the `garmin-sync` throttle; remove "no warning state"
      - [ ] `.larapilot/docs/devs/garmin-api-sync.md` — **Functional flow** of Sync now (request-time, flash messages, refusal)
      - [ ] Folder `README.md` index rows refreshed; English; committed with this task

      ## Git Deliverables
      - Commit: `feat(US-022): TASK-06 add Sync now and the Garmin sync status to the dashboard`
      - Push: **skip** (`git_mode: GITFLOW`)
      - PR: update the local PR notes
