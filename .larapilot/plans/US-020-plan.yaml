    body: |-
      ## Description
      Add PHPUnit coverage that keeps the gate whole as routes are added or removed (FR-021): every registered route is checked, not a hand-written list, so US-021 and later specs cannot open a route by accident.

      ## Files Involved
      - tests/Feature/Auth/RouteAccessTest.php (new)
      - tests/Feature/Routing/SecurityHeadersTest.php

      ## Steps
      1. Use existing factories from `database/factories/` (`owner()`, `ownerWithPassword()`) — do not duplicate factory definitions here
      2. `RouteAccessTest`: iterate `Route::getRoutes()`; skip `/login` and the health route `/up` (and vendor/dev routes such as `/larapilot/*` and `storage/*`, which are not in the deployed app); for each remaining route and method, a signed-out request (with a valid CSRF token for non-GET via `withoutMiddleware(ValidateCsrfToken::class)` only where needed) redirects to `/login` and writes no row. With a signed-in `giarfa` whose password is null, every remaining route except `password.change`, `password.update`, and `logout` redirects to `password.change`. Substitute route parameters if any appear (today none).
      3. Assert `GET /login` and `GET /password/change` carry `noindex, nofollow` and the four security headers, and that no response in the matrix carries `WWW-Authenticate`.
      4. Assert the sign-in limiter does not leak across usernames (5 failures for `giarfa` from one IP do not block the same IP signing in after the window, and do not block another IP).
      5. `php artisan test --compact --filter=RouteAccessTest`
      6. Do **not** add Playwright, Dusk, Pest browser, or viewport E2E suites

      ## Completion Criteria
      - [ ] Every registered route outside `/login` and `/up` is proven gated, from the route table
      - [ ] The forced-change redirect is proven on every route but the change page and sign-out
      - [ ] Sign-in and change-password pages keep `noindex, nofollow` and the security headers; no basic-auth challenge anywhere
      - [ ] Tests pass locally
      - [ ] Coverage matches the NORMAL bar

      ## Git Deliverables
      - Commit: `test(US-020): TASK-05 cover the route access matrix`
      - Push: **skip** (`git_mode: GITFLOW`)
      - PR: prepare/update local notes
