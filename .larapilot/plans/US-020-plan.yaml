code: US-020
plan_body: |
  **Release:** 3.0.0

  ## Technical Solution

  US-020 puts a single-owner sign-in in front of every route, on Laravel's built-in session guard — no Fortify, no starter kit, no HTTP basic auth (PRD Technical Architecture → Auth). It is the first of the two 3.0.0 stories; US-021 removes Strava afterwards, so this spec changes Strava code only where the gate forces it.

  **Gate shape (John).** `routes/web.php` becomes three groups:
  1. `guest` — `GET /login`, `POST /login` (throttled inside the sign-in action, not by a route limiter, because the key is username + IP).
  2. `auth` only — `GET /password/change`, `PUT /password/change`, `POST /logout`.
  3. `auth` + `password.set` — everything else: `/`, every `import/garmin/*` route, and the two Strava OAuth routes while they still exist.
  `/up` stays outside the web group (health route). `bootstrap/app.php`: `redirectGuestsTo(fn () => route('login'))` and `redirectUsersTo(fn () => route('dashboard'))`. The `auth` middleware stores the intended URL for GET requests (`redirect()->guest()`), so the owner lands on the page first requested.

  **Open-redirect guard.** The Strava callback deliberately avoided `redirect()->intended()` because an absolute intended URL passes the generator untouched. The sign-in controller pulls `url.intended` itself and accepts it only when it is a same-host URL (`Str::startsWith($intended, url('/'))` after normalisation); anything else falls back to `route('dashboard')`. A `/* */` block records why.

  **Sign-in (Alex, Lars).** `App\Actions\Auth\SignInOwner` is the one decision: throttle check → credential check → hit/clear limiter. Key `Str::transliterate(Str::lower($username)).'|'.$ip`, 5 attempts per 60 s; when `RateLimiter::tooManyAttempts` is true it throws a validation error with `availableIn()` seconds **before** any user lookup. The credential check is hand-written, not `Auth::attempt`: the Eloquent provider rejects a null hash, and `ConvertEmptyStringsToNull` turns an empty password into `null`. Rules: only `User::OWNER_USERNAME` (`'giarfa'`) is ever looked up; a stored null password accepts only an empty input; a stored hash accepts only a non-empty input that `Hash::check`s. An unknown username still runs one `Hash::check` against a fixed dummy hash so response time does not reveal the username (Lars). Success: `Auth::login($user, remember: false)`, `$request->session()->regenerate()`, limiter cleared. Failure: one generic message — "These credentials do not match our records." — on the `username` field, `withInput($request->only('username'))` so the password is never flashed back.

  **Forced first change.** `App\Http\Middleware\EnsureOwnerPasswordIsSet` (alias `password.set`) redirects a signed-in user whose `password` is null to `password.change`. The change routes carry the inverse check inside their controllers: once a password exists they redirect to the dashboard — the PRD lists a voluntary change after the first one as out of scope (FR-021). `ChangePasswordRequest`: `required|string|min:12|confirmed`, an explicit message per rule. The new value is assigned to the `hashed` cast, saved, the session regenerated, then redirect to the dashboard. **Lars note:** the PRD fixes the rule at 12 characters, so `Password::defaults()` (mixed case, symbols, uncompromised) is not applied — `uncompromised()` would also make an outbound call, which the PRD forbids after US-021. The hashing driver stays the framework default already in use; switching it is not in this spec.

  **One account (Mike).** A migration adds `users.username` (string, nullable, unique) and backfills the owner with the query builder (no model events, no `updated_at` bump, no other column touched): the first id of `config('strava.allowed_athlete_ids', [])` that matches a stored `strava_athlete_id`, else the lowest-id user with activities, else the lowest-id user; on an empty table it inserts `giarfa` (`name` `giarfa`, `email` `giarfa@heatmap.invalid`, null password, timestamps). The migration is self-contained — no app class — and reads the config with a `[]` default, so it still runs on a fresh database once US-021 deletes `config/strava.php`. Other user rows (a CSV-only athlete next to the Strava one, for instance) are left untouched and are no longer displayed; merging them is not in scope (accepted trade-off, documented in the domain doc). `down()` drops the unique index, then the column.

  **Owner-only dashboard and import (change requests FR-017, FR-018, FR-011, FR-019, FR-020).** `DashboardController` reads `$request->user()` (non-null behind `auth`); `ResolveDisplayedAthlete` and its allowlist ordering go. The empty screen for an owner with no activity stays as it is (US-021 reduces it). The Garmin import resolves its target as the signed-in owner: `ResolveGarminImportTarget` and `CreateCsvOnlyAthlete` are deleted, `PlanGarminImport` / `RememberedGarminImportPlan` / `ApplyGarminImport` take a non-null `User`, the review always shows stored run details (the guest masking `showsStoredRunDetails` goes). The `garmin-import` limiter keys by user id only. Throttle, 5 MB rule, CSRF, session binding, and the confirm lock stay.

  **Strava while it still exists.** `strava.fresh` is removed from every route: its allowlist check would 403 a `giarfa` with no Strava id, and the dashboard and import never call Strava. The class and alias stay for US-021 to delete. The OAuth routes move behind `auth` + `password.set`; the callback no longer calls `Auth::login`, and `ConnectStravaAthlete` writes the tokens onto the signed-in owner instead of finding or creating a user — so no route creates users. If the returned athlete id already belongs to another row, the callback renders the existing `strava.rejected` view and writes nothing. No other Strava behaviour changes here.

  **UI (Elise, Joe).** No new mockup: both pages mirror the existing Garmin upload form (`.larapilot/mockups/US-008/upload.html`, built in `resources/views/garmin/create.blade.php`) — the project's own Nordic token set in `resources/css/app.css` (`.card`, `.field-label`, `.field-hint`, `.field-error`, `.btn--primary`, `.btn-row`), inside `layouts/app.blade.php`, mobile-first at 375 px, light + dark. Labelled inputs, `aria-invalid` + `aria-describedby` on error, error paragraphs with `role="alert"`, one `h1`, `autocomplete="username"` / `current-password` / `new-password`. The layout header shows no status chip on these pages (they do not `@section('header-status')`). Copy (Marika): terse, factual, English.

  **Query shape.** No list endpoint changes; the owner lookup is one indexed `where username = ?` per sign-in. The dashboard keeps its per-athlete grid cache key.

  ## Git & Branching
  - Mode: GITFLOW — no automatic push, no remote PR unless the user asks in-session
  - Release mode on: the spec carries `**Release:** 3.0.0`; TASK-00 runs `php artisan larapilot:release-feature --semver=3.0.0 --spec=US-020 --slug=private-login`, which opens `release/3.0.0` (still `planned`) and branches `feature/US-020-private-login` from it
  - PR base: `release/3.0.0`, not `develop`; prepared locally
  - Per task: one Conventional Commit `type(US-020): TASK-NN …`; code, tests, and domain docs in the same commit
  - Merge after `larapilot-review` approval (auto-approve is on, still through review)

  ## Test Data Strategy
  - Alex maintains `UserFactory` and the seeders in the same task as the `username` migration (TASK-01)
  - `UserFactory`: new `owner()` state (`username` `giarfa`, null password — the first-sign-in state) and `ownerWithPassword(string $plain = 'correct horse battery')` state; the `csvOnly()` state keeps "no Strava identity" without depending on the deleted `CreateCsvOnlyAthlete` constants
  - Demo dataset: `TrainingBlockSeeder`'s fixed demo athlete becomes the owner — `username` `giarfa`, null password — so a fresh local database walks the first sign-in; the 16-week block plus 7 history weeks are unchanged
  - Never run `migrate:fresh --seed` against the dev database through artisan (it is the real default SQLite file); verify the seeder through `TrainingBlockSeederTest` on the test database

  ## Test Strategy
  - Bar: NORMAL — PHPUnit feature and unit tests, no browser, Dusk, Playwright, or viewport suite
  - New: `UsernameMigrationTest` (backfill for each owner-selection branch, empty database, untouched runs and columns, `down()`); `SignInTest` (form, generic error, retained username, throttle with seconds and no credential check, session regeneration, no remember cookie, intended redirect and the off-host rejection, guest-only `/login`, sign-out); `ForcedPasswordChangeTest` (empty-password first sign-in, every route redirected, 12-character/confirmation validation, hashed storage, empty password refused afterwards, other usernames refused); `RouteAccessTest` (iterates `Route::getRoutes()` so a route added later is covered automatically)
  - Updated: every dashboard, Garmin, and Strava feature test signs in through a new `Tests\TestCase::signInOwner()` helper; guest-path tests (`GuestGarminImportTest`, `CsvOnlyAthleteImportTest`, `ResolveGarminImportTargetTest`, `ResolveDisplayedAthleteTest`, the guest cases in `PublicDashboardTest`) are deleted or rewritten as redirect-to-`/login` assertions
  - Manual test handoff (UI): sign in at 375 px and 1280 px in light and dark, tab order and screen-reader announcement of the error, the throttle message after 5 wrong passwords
  - Gate: `php artisan test --compact`, `vendor/bin/pint --dirty --format agent`, `php artisan larapilot:quality`
