  -
    id: TASK-01
    title: 'Add users.username with the giarfa owner backfill, factory states and seeder'
    type: Impl
    status: TODO
    assignee: Mike
    estimate_hours: 3
    dependencies:
      - TASK-00
    body: |-
      ## Description
      Give the owner's record the sign-in identity `giarfa` (FR-021): a unique nullable `username` column, a migration that backfills the existing owner or creates the record on an empty database, the model docblock, and factory/seeder states so tests and the demo dataset walk the first sign-in.

      ## Files Involved
      - database/migrations/2026_10_26_xxxxxx_add_username_to_users_table.php (`php artisan make:migration add_username_to_users_table --table=users --no-interaction`)
      - app/Models/User.php
      - database/factories/UserFactory.php
      - database/seeders/TrainingBlockSeeder.php, database/seeders/DatabaseSeeder.php (docblock)
      - tests/Feature/Database/UsernameMigrationTest.php (new)
      - tests/Feature/Database/SchemaTest.php, tests/Feature/Database/TrainingBlockSeederTest.php

      ## Steps
      1. Migration `up()`: `$table->string('username')->nullable()->unique()->after('name')`. Then, with `DB::table('users')` only (no Eloquent, no model events, no `updated_at`), pick the owner: (a) iterate `config('strava.allowed_athlete_ids', [])` in order and take the first row whose `strava_athlete_id` matches; (b) else the lowest `id` with a row in `activities`; (c) else the lowest `id`. Update only `username = 'giarfa'` and `password = null`. When `users` is empty, insert `name` `giarfa`, `email` `giarfa@heatmap.invalid` (RFC 2606 reserved TLD, same convention as the existing `.invalid` placeholders), `password` null, `created_at`/`updated_at` now. A `/* */` block states why the migration uses no app class and why the config read has a `[]` default (US-021 deletes `config/strava.php`; the migration must still run on a fresh database).
      2. Migration `down()`: `dropUnique(['username'])`, then `dropColumn('username')` — schema only.
      3. `User`: `public const OWNER_USERNAME = 'giarfa';`, `@property string|null $username` in the class docblock. `username` stays **out** of `#[Fillable]` (identity column — `.ai/rules/models.md`); the migration and the factory assign it explicitly.
      4. `UserFactory`: `username` defaults to `null`; new `owner()` state (`username` = `User::OWNER_USERNAME`, `password` null) and `ownerWithPassword(string $plain = 'correct horse battery')` state (`password` = `$plain`, hashed by the cast). `csvOnly()` stops importing `CreateCsvOnlyAthlete` (deleted in TASK-04): keep it as "no Strava identity, no tokens" with literal placeholder name/email.
      5. `TrainingBlockSeeder`: the fixed demo athlete gets `username` `giarfa` and a null password, so a seeded database starts at the first sign-in. Update the `DatabaseSeeder` docblock (the demo athlete is the one account).
      6. `UsernameMigrationTest`: load the migration file (`$migration = require database_path('migrations/…')`), call `down()`, arrange each case, call `up()`, assert. Cases: allowlisted connected athlete chosen over a lower-id athlete with activities (`Config::set('strava.allowed_athlete_ids', …)`); no allowlist match → lowest-id with activities; no activities → lowest-id user; empty table → `giarfa` created with null password; the chosen row's activities count, `name`, `email`, Strava columns, and `updated_at` unchanged; only one row carries a username; `down()` removes the column.
      7. `SchemaTest`: assert `users.username` exists, is nullable, and is unique. `TrainingBlockSeederTest`: the seeded athlete is `giarfa` with a null password.
      8. `php artisan test --compact tests/Feature/Database` then the full suite (still green: no route changes yet).

      ## Completion Criteria
      - [ ] `users.username` is nullable and unique; `down()` drops it
      - [ ] Backfill picks allowlisted-connected → lowest-id with activities → lowest-id, and creates `giarfa` on an empty table
      - [ ] The owner's runs and every other column are untouched by the migration
      - [ ] `UserFactory` has `owner()` and `ownerWithPassword()`; `csvOnly()` no longer depends on `CreateCsvOnlyAthlete`
      - [ ] Seeder produces `giarfa` with a null password and the unchanged training block
      - [ ] Tests pass

      ## Test Data
      - [ ] `database/factories/UserFactory.php` updated in this same task (`owner()`, `ownerWithPassword()`, `username` default)
      - [ ] `TrainingBlockSeeder` seeds `giarfa` with a null password
      - [ ] Verified through `TrainingBlockSeederTest` on the test database — never `migrate:fresh --seed` on the dev SQLite file

      ## Domain Docs
      - [ ] `.larapilot/docs/devs/owner-authentication.md` created from `TEMPLATE.md` — data model section: `username`, nullable password as the "first sign-in armed" state, the owner-selection order and why, the empty-database insert, other user rows left undisplayed (accepted trade-off), recovery by clearing `users.password`
      - [ ] Folder `README.md` index row added for `owner-authentication`
      - [ ] English, committed with this task

      ## Git Deliverables
      - Commit: `feat(US-020): TASK-01 add users.username with the giarfa owner backfill`
      - Push: **skip** (`git_mode: GITFLOW`)
      - PR: prepare/update local notes
  -
    id: TASK-02
    title: 'Sign-in page, throttled credential check, and sign-out to /login'
    type: Impl
    status: TODO
    assignee: Alex
    estimate_hours: 4
    dependencies:
      - TASK-01
    body: |-
      ## Description
      Add the `/login` page and its POST handler on the session guard (FR-021): one generic error, the username kept, 5 attempts per username + IP per minute, session regenerated, no remember-me cookie, same-host intended redirect; sign-out returns to `/login`. The global gate is wired in TASK-04 — this task registers the routes and the guest/user redirects.

      ## Files Involved
      - app/Http/Controllers/Auth/ShowSignInFormController.php (new, invokable)
      - app/Http/Controllers/Auth/SignInController.php (new, invokable)
      - app/Http/Requests/Auth/SignInRequest.php (new)
      - app/Actions/Auth/SignInOwner.php (new)
      - app/Http/Controllers/SignOutController.php
      - resources/views/auth/login.blade.php (new)
      - routes/web.php, bootstrap/app.php
      - tests/Feature/Auth/SignInTest.php (new); tests/Feature/Strava/SignOutTest.php → moved to tests/Feature/Auth/SignOutTest.php

      ## Steps
      1. Routes: `Route::middleware('guest')->group(…)` with `GET /login` → `ShowSignInFormController` (name `login`) and `POST /login` → `SignInController` (name `login.store`). `bootstrap/app.php`: `redirectGuestsTo(fn (): string => route('login'))` (replacing the dashboard fallback and its outdated comment) and `redirectUsersTo(fn (): string => route('dashboard'))`.
      2. `SignInRequest`: `username` `required|string|max:255`, `password` `nullable|string|max:1024` (nullable on purpose: `ConvertEmptyStringsToNull` turns the first-sign-in empty password into `null`), explicit messages, `authorize()` returns true.
      3. `SignInOwner` (`__invoke(string $username, ?string $password, string $ip): ?User`, final readonly): throttle key `Str::transliterate(Str::lower($username)).'|'.$ip`; if `RateLimiter::tooManyAttempts($key, 5)` throw `ValidationException::withMessages(['username' => "Too many sign-in attempts. Try again in {$seconds} seconds."])` **before** any query. Look up only `User::OWNER_USERNAME` (`where('username', …)` with the input compared via `hash_equals` to the constant first — any other username is a failure). Stored null password → succeed only when the input is null or ''. Stored hash → succeed only for a non-empty input that `Hash::check`s. Unknown username → one `Hash::check` against a fixed dummy hash (timing). Failure: `RateLimiter::hit($key, 60)`, return null. Success: `RateLimiter::clear($key)`, return the user. `/* */` blocks record: why not `Auth::attempt` (null hash, empty-string conversion), why the throttle runs first, why the dummy hash.
      4. `SignInController`: call the action; null → `back()->withErrors(['username' => 'These credentials do not match our records.'])->withInput($request->only('username'))`. User → `Auth::login($user, remember: false)`, `$request->session()->regenerate()`, then the intended redirect: pull `url.intended`, accept it only if it is a string starting with `url('/').'/'` or equal to `url('/')`, else `route('dashboard')`. `/* */` block on the open-redirect reason (the Strava callback's earlier rationale).
      5. `SignOutController`: redirect to `route('login')`; refresh its docblock (no Strava wording about tokens beyond what still holds).
      6. `resources/views/auth/login.blade.php` — **Mirrors:** `.larapilot/mockups/US-008/upload.html` (form idiom; no dedicated US-020 mockup). Design system: the project's own tokens in `resources/css/app.css`. `@extends('layouts.app')`, title "Sign in — Sport Heatmap", one `h1` "Sign in", `.card` form with `@csrf`, `<label for>` + `.field-label` per input, `autocomplete="username"` / `current-password`, `value="{{ old('username') }}"`, password input never prefilled, errors in `.field-error` with `role="alert"` linked by `aria-describedby` + `aria-invalid="true"`, `.btn--primary` "Sign in" (≥44 px). Mobile-first: full-width card at 375 px, `max-w-sm` from `sm:`. No `header-status` section.
      7. `SignInTest` (`php artisan make:test --phpunit Auth/SignInTest` then move under `tests/Feature/Auth/`): form renders in the layout with `noindex, nofollow`, CSRF token field, labelled inputs, and no `WWW-Authenticate` header; correct password signs in and lands on the dashboard; wrong password and wrong username give the same message, keep `username` in old input, and never flash the password; 5 failures then the 6th is refused with the seconds message and `Hash::check` not called (spy the hasher or assert via `RateLimiter::attempts`); the limiter is per username + IP (another IP is not blocked); session id changes on sign-in; no `remember_web_*` cookie; intended URL honoured for an in-app URL and ignored for an off-host one; a signed-in owner on `/login` is redirected to the dashboard. `SignOutTest`: POST `/logout` ends the session and redirects to `/login`.
      8. `php artisan test --compact tests/Feature/Auth`, then the full suite.

      ## Completion Criteria
      - [ ] `/login` renders inside `layouts/app.blade.php` with labelled fields, announced errors, light/dark, no horizontal scroll at 375 px
      - [ ] Wrong username or password → "These credentials do not match our records.", username kept, password empty
      - [ ] 6th attempt within a minute for the same username + IP refused with the seconds to wait, no credential check
      - [ ] Session regenerated, no remember-me cookie, intended same-host URL honoured, off-host ignored
      - [ ] Signed-in owner on `/login` → dashboard; `POST /logout` → `/login`
      - [ ] UI usable at mobile/tablet/desktop (manual smoke)
      - [ ] Tests pass

      ## Test Data
      - N/A — no model/schema changes in this task (uses `UserFactory::owner()` / `ownerWithPassword()` from TASK-01)

      ## Domain Docs
      - [ ] `.larapilot/docs/devs/owner-authentication.md` — functional flow (sign-in, throttle, generic error, sign-out), technical design (routes, controllers, `SignInOwner`), architectural choices (session guard over Fortify/starter kits, hand-written check over `Auth::attempt`, the intended-URL guard, the dummy hash)
      - [ ] Folder `README.md` index row refreshed
      - [ ] English, committed with this task

      ## Git Deliverables
      - Commit: `feat(US-020): TASK-02 add the owner sign-in page and sign-out to /login`
      - Push: **skip** (`git_mode: GITFLOW`)
      - PR: prepare/update local notes
  -
    id: TASK-03
    title: 'Forced first password change: middleware and change-password page'
    type: Impl
    status: TODO
    assignee: Alex
    estimate_hours: 3
    dependencies:
      - TASK-02
    body: |-
      ## Description
      While `giarfa` has no password, every signed-in route except the change-password page and sign-out leads to the change-password page (FR-021). A valid new password (≥12 characters, confirmed) is stored hashed, the session regenerated, and the owner lands on the dashboard. Once set, the change is no longer forced and the page itself redirects to the dashboard (no voluntary change — out of the FR).

      ## Files Involved
      - app/Http/Middleware/EnsureOwnerPasswordIsSet.php (new) + alias `password.set` in bootstrap/app.php
      - app/Http/Controllers/Auth/ShowChangePasswordFormController.php (new)
      - app/Http/Controllers/Auth/ChangePasswordController.php (new)
      - app/Http/Requests/Auth/ChangePasswordRequest.php (new)
      - resources/views/auth/change-password.blade.php (new)
      - routes/web.php
      - README.md (first sign-in + recovery section)
      - tests/Feature/Auth/ForcedPasswordChangeTest.php (new)

      ## Steps
      1. `EnsureOwnerPasswordIsSet::handle`: a signed-in `User` whose `password` is null → `redirect()->route('password.change')`; otherwise `$next`. No-op for guests (the `auth` middleware runs first in every group that uses it).
      2. Routes inside `Route::middleware('auth')`: `GET /password/change` (name `password.change`), `PUT /password/change` (name `password.update`). `POST /logout` moves into the same `auth` group. Add `password.set` to the existing dashboard and `import/garmin` routes now — it is a no-op for guests, so those still-open routes keep working until TASK-04 regroups them under `auth`.
      3. `ShowChangePasswordFormController`: password already set → redirect to dashboard; else render the view. `ChangePasswordController`: same guard first; then `$user->password = $request->validated('password')` (hashed cast), `save()`, `$request->session()->regenerate()`, redirect to `route('dashboard')`.
      4. `ChangePasswordRequest`: `password` `required|string|min:12|confirmed`, messages: "Enter a new password.", "Use at least 12 characters.", "The two passwords do not match."; `authorize()` returns true. `/* */` block: the PRD fixes 12 characters; `Password::defaults()` is not applied (its `uncompromised()` is an outbound call the PRD rules out).
      5. `resources/views/auth/change-password.blade.php` — **Mirrors:** `.larapilot/mockups/US-008/upload.html` (same form idiom as TASK-02). `h1` "Set your password", one line of copy ("This instance has no password yet. Choose one with at least 12 characters."), two labelled inputs (`autocomplete="new-password"`), `.field-hint` with the 12-character rule linked by `aria-describedby`, `role="alert"` errors on the field, `.btn--primary` "Save password", plus a sign-out form button (the only other route allowed). `@method('PUT')`, `@csrf`. Mobile-first, light/dark.
      6. `README.md`: "First sign-in" (open the site, user `giarfa`, empty password, set a password of 12+ characters — do it right after every deploy that runs the migration, PRD accepted risk) and "Recovery" (`UPDATE users SET password = NULL WHERE username = 'giarfa'` on the SQLite file re-arms the first sign-in).
      7. `ForcedPasswordChangeTest`: `giarfa` with a null password signs in with an empty password; afterwards `/`, a window URL, and `import/garmin` redirect to `password.change`, while `password.change` and `POST /logout` do not; empty, 11-character, and mismatched values are refused with the message at the field and the column stays null; a valid value is stored as a hash (`Hash::check` true, not the plain text), the session id changes, and the response lands on the dashboard; after that, signing in with an empty password fails with the generic error and `/` no longer redirects; `GET /password/change` with a password set redirects to the dashboard; a non-empty password while none is stored is refused; username `admin` (or `GIARFA` if the lookup is exact) is refused with the generic error.
      8. `php artisan test --compact tests/Feature/Auth`, then the full suite.

      ## Completion Criteria
      - [ ] Empty-password first sign-in works only while no password is stored
      - [ ] Every route but the change page and sign-out redirects to the change page while no password is stored
      - [ ] Empty, <12, or mismatched value refused at the field, nothing stored
      - [ ] Valid value stored hashed, session regenerated, owner lands on the dashboard
      - [ ] Once set: empty password refused, no forced redirect, change page redirects to the dashboard
      - [ ] README documents the first sign-in and the recovery
      - [ ] UI usable at mobile/tablet/desktop (manual smoke)
      - [ ] Tests pass

      ## Test Data
      - N/A — no model/schema changes in this task

      ## Domain Docs
      - [ ] `.larapilot/docs/devs/owner-authentication.md` — forced-change flow, the `password.set` middleware, why the page closes after the first change, the 12-character rule vs `Password::defaults()`, the accepted empty-password risk and its mitigation, recovery
      - [ ] Folder `README.md` index row refreshed
      - [ ] English, committed with this task

      ## Git Deliverables
