code: US-009
plan_body: |-
  ## Technical Solution

  US-009 changes **who** a signed-out visitor sees, nothing else. The whole behavioural change lives in `App\Support\Strava\ResolveDisplayedAthlete`; `DashboardController`, `HeatmapGridCache`, `ResolveSyncStatus`, the views, routes and middleware keep their code (the controller only gets its docblock refreshed).

  **Resolver after this spec** (`ResolveDisplayedAthlete::__invoke(): ?User`):
  1. Non-empty allowlist → the existing query (`select id, strava_athlete_id … whereIn strava_athlete_id`) and the walk in configured order. A hit is returned unchanged — a connected allowlisted athlete always beats the fallback, even while other stored athletes have activities (AC1).
  2. Otherwise (blank allowlist, or no listed id has a user row) → the **fallback**: `User::query()->select(['id', 'strava_athlete_id'])->whereHas('activities')->orderBy('id')->first()` — the lowest `users.id` with at least one activity of either source (Strava or Garmin CSV), whatever the allowlist says (AC2, FR-017).
  3. Fallback empty → `null`; the controller keeps rendering `strava.connect` with 200 (AC3).

  **Query shape (John / Mike):** blank allowlist = 1 query (the fallback); allowlist hit = 1 query (unchanged); allowlist miss = 2 queries. The `whereHas` compiles to `exists (select * from activities where users.id = activities.user_id)`, served by the existing `(user_id, activity_date)` index — no migration, no new index. No N+1: the resolver returns one model; `DailyRunningDistance` and `ResolveSyncStatus` already query by `user_id`.

  **Read-only (Lars, AC4):** the fallback selects only `id` and `strava_athlete_id` exactly like the allowlist query, so no guest request can decrypt or refresh a token; nothing on the guest path calls `EnsureFreshAccessToken` or `StravaClient`; no write. Tests assert the absence of the token attributes on the resolved model and an unchanged database snapshot plus `Http::assertNothingSent()`.

  **Unchanged by construction:**
  - Sign-in (AC5): the allowlist still gates `StravaCallbackController`, and the `strava.fresh` middleware still ends the session and answers 403 for a signed-in athlete removed from the allowlist — the fallback runs only when `Auth::user()` is null. Guests never see the Garmin import entry point (view checks `auth()`).
  - Sync status (AC6): resolved outside the grid cache on every request; `sync_runs` is instance-wide, so the fallback athlete gets the same warning (title, escaped reason, reconnect link) as the owner.
  - Cache switch (AC7): `HeatmapGridCache` keys on `heatmap:grid:{athlete id}:{window start}:{today}`, so when an allowlisted athlete connects the next visit resolves a different id and misses the fallback athlete's cache entry. Needs a regression test only, no code (Tom's planning note answered).
  - `noindex, nofollow`, "Powered by Strava", the 375 px layout, table semantics and themes (AC8 / FR-008 / FR-009) live in `layouts/app.blade.php` and the grid component, which this spec does not touch.

  **Accepted risk (Violet):** the fallback can publicly display an athlete removed from the allowlist — accepted by the owner on 2026-10-11 (PRD `### Privacy & legal`, "Accepted risk — fallback display"). Not reopened here; the domain docs replace the old "displayed athlete is always on the allowlist" invariant with this one and point to the PRD.

  **Superseded US-007 behaviour:** existing tests that assert the old rule are rewritten in TASK-01 (not deleted silently), so every commit keeps the suite green:
  - `ResolveDisplayedAthleteTest::test_an_empty_allowlist_displays_nobody_without_querying` → an empty allowlist with no activities displays nobody in exactly one query.
  - `ResolveDisplayedAthleteTest::test_a_connected_athlete_off_the_allowlist_is_never_displayed` → an athlete off the allowlist **without activities** is never displayed; a new case shows one **with** activities is displayed by the fallback.
  - `PublicDashboardTest::test_an_athlete_removed_from_the_allowlist_is_never_displayed` → the removed athlete with a run is displayed while nobody allowlisted has connected, then the allowlisted athlete replaces them.

  ## Git & Branching
  - Mode: GITFLOW (no automatic push)
  - Branch: `feature/US-009-fallback-displayed-athlete` from `develop`
  - TASK-00: bootstrap
  - Per task: one Conventional Commit `type(US-009): TASK-NN …`; code, tests and domain docs ride in the same commit
  - Push / remote PR only when the user asks in-session
  - Merge into `develop` after `larapilot-review` approval (auto-approve is ON)

  ## Test Data Strategy
  - No model, migration, enum or relationship change — factories and seeders stay as they are (`N/A` in every task).
  - The Demonstrates scenario already works from the existing `TrainingBlockSeeder`: `migrate:fresh --seed` creates athlete `10000001` with the 16-week block and the sync runs; with `STRAVA_ALLOWED_ATHLETE_IDS` blank the fallback displays it.
  - Tests build their scenarios with the existing `User::factory()->stravaConnected()` / `stravaTokenExpired()`, `Activity::factory()->for($athlete)->onDate(...)` (plus `garminImported()` for the "either source" case), and `SyncRun::factory()` / `->failed()`.

  ## Test Strategy
  - Bar: NORMAL — PHPUnit feature tests, Strava HTTP faked with `Http::preventStrayRequests()` in `setUp()`; config overridden with `Config::set()` through the `allowlistAthletes()` / `allowlistedAthlete()` helpers. No Playwright, Dusk, browser or viewport suites.
  - Resolver level (TASK-01, `tests/Feature/Strava/ResolveDisplayedAthleteTest.php`): fallback with a blank allowlist; fallback when the listed id has no user row; allowlisted connected athlete beats an older athlete with activities; lowest `users.id` wins among several; a Garmin-only athlete qualifies; athletes without activities never qualify; token attributes absent on the fallback model; query counts (1 / 1 / 2).
  - Page level (TASK-02, `tests/Feature/Dashboard/PublicDashboardTest.php`): the six cases the spec lists plus the sync warning, noindex/attribution and no-Garmin-entry for the fallback athlete, and the signed-in removed-athlete 403.
  - Manual test handoff (TASK-03): the Demonstrates walk-through in a private window, then the 375 px / dark-theme smoke check — FR-009 is unchanged code, verified by eye rather than a new suite.
  - Gate: `php artisan test --compact` green and `php artisan larapilot:quality` (Pint + Larastan level 5) clean before `spec-review`.
