    id: TASK-02
    title: 'Cover the fallback home page: read-only, sync warning, cache switch, sign-in unchanged'
    body: |-
      ## Description
      Add page-level PHPUnit coverage in `tests/Feature/Dashboard/PublicDashboardTest.php` for every fallback behaviour the spec lists (AC2–AC9), using a guest `GET /` with Strava HTTP faked. Traces to FR-017, FR-007, FR-008.

      ## Files Involved
      - tests/Feature/Dashboard/PublicDashboardTest.php
      - tests/Feature/Strava/StravaConnectFlowTest.php (only if the removed-athlete 403 case fits better beside the existing guard tests)

      ## Steps
      1. Reuse the existing `runOn()`, `databaseSnapshot()` and `getDashboard()` helpers, the `allowlistAthletes()` / `allowlistedAthlete()` TestCase helpers and existing factory states — no new factory definitions. `Http::preventStrayRequests()` stays in `setUp()`.
      2. Add, one behaviour per test:
         - `test_a_guest_sees_the_fallback_athletes_map_with_a_blank_allowlist` — 200, `dashboard` view, grid cell accessible name, week total, `>Intensity</h3>` legend, sync chip ("Synced 6 hours ago") and `>Sync</h3>` detail;
         - `test_a_guest_sees_the_fallback_athlete_when_the_listed_athlete_has_not_connected`;
         - `test_a_connected_allowlisted_athlete_beats_the_fallback` — older athlete with a run vs allowlisted athlete; only the allowlisted run is visible;
         - keep `test_a_guest_gets_the_connect_screen_when_no_allowlisted_athlete_has_connected` and rename it to `test_a_guest_gets_the_connect_screen_when_no_stored_athlete_has_an_activity` (a connected athlete without activities is also present);
         - `test_a_fallback_guest_request_writes_nothing_and_sends_no_request` — `stravaTokenExpired` fallback athlete, blank allowlist, `databaseSnapshot()` unchanged, `Http::assertNothingSent()`;
         - `test_switching_from_the_fallback_to_an_allowlisted_athlete_never_serves_the_cached_fallback_grid` — visit once (fallback grid cached), connect an allowlisted athlete, visit again: their run visible, the fallback run absent;
         - `test_a_guest_sees_the_same_sync_warning_for_the_fallback_athlete` — failed `SyncRun` with `<script>` reason: title, escaped reason, reconnect link;
         - `test_the_fallback_page_keeps_noindex_the_attribution_and_no_garmin_entry_point`;
         - `test_a_signed_in_athlete_removed_from_the_allowlist_still_gets_403_while_the_fallback_would_display_them` — removed athlete with activities, `actingAs`, blank allowlist → 403 `strava.rejected`, guest afterwards.
      3. `php artisan test --compact tests/Feature/Dashboard/PublicDashboardTest.php`, then the full suite.
      4. Do **not** add Playwright, Dusk, Pest browser or viewport suites.

      ## Completion Criteria
      - [x] Each case above passes against the TASK-01 implementation
      - [x] Every guest test runs with `Http::preventStrayRequests()` and asserts no request where relevant
      - [x] Coverage matches the NORMAL bar; full suite green

      ## Git Deliverables
      - Commit: `test(US-009): TASK-02 cover the fallback home page`
      - Push: **skip** (`git_mode: GITFLOW`)
      - PR: update the local PR notes
