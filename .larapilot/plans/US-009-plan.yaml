  -
    id: TASK-01
    title: 'Fall back to the lowest-id stored athlete with activities in ResolveDisplayedAthlete'
    body: |-
      ## Description
      Extend `ResolveDisplayedAthlete` so that, when no allowlisted athlete has a user row (blank allowlist or every listed id unconnected), it returns the stored athlete with the lowest `users.id` that has at least one activity of either source — selecting only `id` and `strava_athlete_id` — and `null` only when no stored athlete has any activity. Rewrite the US-007 tests that assert the superseded rule, add resolver-level coverage, and update both domain docs that carry the old invariant. Traces to FR-017 (AC1–AC4).

      ## Files Involved
      - app/Support/Strava/ResolveDisplayedAthlete.php
      - app/Http/Controllers/DashboardController.php (docblock only)
      - app/Support/Strava/AthleteAllowlist.php (docblock of `athleteIds()` only — the order still decides among connected allowlisted athletes)
      - tests/Feature/Strava/ResolveDisplayedAthleteTest.php
      - tests/Feature/Dashboard/PublicDashboardTest.php (rewrite `test_an_athlete_removed_from_the_allowlist_is_never_displayed` only)
      - .larapilot/docs/devs/strava-connection.md
      - .larapilot/docs/devs/heatmap-dashboard.md
      - .larapilot/docs/devs/README.md

      ## Steps
      1. In `ResolveDisplayedAthlete::__invoke()`:
         - keep the allowlist branch as is when the allowlist is non-empty; return its hit unchanged (a connected allowlisted athlete always wins);
         - drop the early `return null` for an empty allowlist — it now falls through to the fallback;
         - add a private method (e.g. `firstStoredAthleteWithActivities(): ?User`) running `User::query()->select(['id', 'strava_athlete_id'])->whereHas('activities')->orderBy('id')->first()`;
         - add a `/* … */` block comment at the fallback stating why: FR-017 shows stored data rather than the connect screen; lowest `users.id` is a stable, documented tie-break; only `id` and `strava_athlete_id` are selected so no guest request can decrypt or refresh a token; the owner accepted displaying a removed athlete (PRD "Accepted risk — fallback display");
         - rewrite the class docblock: allowlisted first in configured order, otherwise the fallback, read-only by construction.
      2. `DashboardController` docblock: the connect screen now appears only when no stored athlete has any activity. No logic change.
      3. `AthleteAllowlist::athleteIds()` docblock: the order decides among connected allowlisted athletes; with none connected the home page falls back (see `ResolveDisplayedAthlete`).
      4. `ResolveDisplayedAthleteTest` (keep `Http::preventStrayRequests()` in `setUp()`):
         - rewrite `test_an_empty_allowlist_displays_nobody_without_querying` → `test_an_empty_allowlist_with_no_activities_displays_nobody_in_one_query`;
         - rewrite `test_a_connected_athlete_off_the_allowlist_is_never_displayed` → `test_an_athlete_off_the_allowlist_without_activities_is_never_displayed`;
         - keep `test_allowlisted_ids_without_a_user_row_display_nobody` (no activities stored → still `null`);
         - add `test_a_blank_allowlist_falls_back_to_the_lowest_id_athlete_with_activities` (two athletes with activities + one older athlete without → the lowest id **with** activities);
         - add `test_an_unconnected_allowlist_falls_back_to_a_stored_athlete_with_activities`;
         - add `test_a_connected_allowlisted_athlete_beats_an_older_athlete_with_activities` (allowlisted athlete has no activity and a higher id → still displayed);
         - add `test_a_garmin_only_athlete_qualifies_for_the_fallback` (`Activity::factory()->garminImported()`);
         - add `test_the_fallback_athlete_is_resolved_without_its_tokens_or_any_request` (`stravaTokenExpired` state; token attributes absent; `Http::assertNothingSent()`);
         - keep `test_a_non_empty_allowlist_costs_exactly_one_query` for the hit case; add `test_an_unconnected_allowlist_costs_two_queries`.
      5. `PublicDashboardTest::test_an_athlete_removed_from_the_allowlist_is_never_displayed` → `test_a_removed_athlete_is_displayed_until_an_allowlisted_athlete_connects`: with a blank allowlist the removed athlete's 12.3 km run is shown on `dashboard`; after `allowlistedAthlete()` connects with its own run, the page shows 7.7 km and not 12.3 km.
      6. Domain docs (English):
         - `strava-connection.md` → **Displayed athlete** flow: step 1 becomes "empty allowlist → skip to the fallback", add the fallback step and the query counts; replace the invariant "the displayed athlete is always on the allowlist" with "a connected allowlisted athlete is always displayed ahead of the fallback; the fallback selects no token column" (_Breaks if:_ the fallback runs before the allowlist walk, or widens its `select`); add an Architectural choices row: fallback = lowest `users.id` with an activity — rejected: connect screen (US-007 behaviour; shows nothing although data exists), most recent activity (the displayed athlete would flip daily), a new `STRAVA_PUBLIC_ATHLETE_ID` env var; reference the PRD accepted risk; `Last updated by: US-009`.
         - `heatmap-dashboard.md` → Functional flow step 2 (signed-out branch + new fallback + connect screen only with no activities at all); replace the "displayed athlete is on the allowlist" invariant; refresh the "Several allowlisted athletes" gotcha; `Last updated by: US-009`.
         - `README.md` index rows of both domains → last spec `US-009`.
      7. `php artisan test --compact tests/Feature/Strava/ResolveDisplayedAthleteTest.php tests/Feature/Dashboard` then the full `php artisan test --compact`; `vendor/bin/pint --dirty --format agent`.

      ## Completion Criteria
      - [x] Blank allowlist or unconnected allowlist resolves the lowest `users.id` with at least one activity, Strava or Garmin
      - [x] A connected allowlisted athlete is still returned first, in configured order
      - [x] No stored activity → `null` (controller renders the connect screen with 200)
      - [x] The fallback selects only `id` and `strava_athlete_id`; no HTTP request; query counts 1 / 1 / 2 asserted
      - [x] Superseded US-007 tests rewritten, not deleted; full suite green
      - [x] Both domain docs and the index describe the fallback and the accepted risk

      ## Test Data
      - N/A — no model/schema changes; tests use the existing `User`, `Activity` (incl. Garmin source) and `SyncRun` factory states

      ## Domain Docs
      - [x] `.larapilot/docs/devs/strava-connection.md` updated — displayed-athlete flow, replaced invariant, architectural choice with rejected alternatives
      - [x] `.larapilot/docs/devs/heatmap-dashboard.md` updated — functional flow step 2, invariant, gotcha
      - [x] Folder `README.md` index rows updated (`US-009`)
      - [x] English, committed with this task

      ## Git Deliverables
      - Commit: `feat(US-009): TASK-01 fall back to the first stored athlete with activities`
      - Push: **skip** (`git_mode: GITFLOW`)
      - PR: update the local PR notes
