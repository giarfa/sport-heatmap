    id: TASK-03
    title: 'README fallback copy and manual test handoff'
    body: |-
      ## Description
      Update the README wherever it states the old rule, then run the quality gate and record the manual test handoff for the unchanged UI (FR-009). Traces to AC10.

      ## Files Involved
      - README.md

      ## Steps
      1. README, `.env` table row `STRAVA_ALLOWED_ATHLETE_IDS`: still "blank means nobody may connect"; add that the home page shows the first connected listed id, otherwise the first stored athlete (lowest id) with at least one activity, whatever the allowlist says.
      2. README, seeded-data note under `migrate:fresh --seed`: replace "allowlist the seeded athlete id `10000001` in your local `.env`" with: with `STRAVA_ALLOWED_ATHLETE_IDS` blank the seeded athlete is shown by the fallback; once your own allowlisted athlete connects, they replace it. Keep the warning that seeding production publishes a demo athlete.
      3. README, **The dashboard** section: replace "While no allowlisted athlete has connected yet, the home page shows the connect screen instead" with the fallback rule, the connect screen only when no stored athlete has any activity, and one line on the accepted risk (removing an athlete from the allowlist no longer hides their stored rows; deleting them does).
      4. Copy stays terse and factual (Marika's register in the PRD).
      5. `php artisan larapilot:quality` (Pint + Larastan level 5) and `php artisan test --compact` — both clean.
      6. Manual test handoff (write into the PR notes):
         - `php artisan migrate:fresh --seed`, `STRAVA_ALLOWED_ATHLETE_IDS=` blank, open the Herd URL `/` in a private window → 16-week heatmap, weekly totals, legend, sync chip/detail, "Owner? Connect with Strava" line, no Garmin import link;
         - same page at 375 px (no page scroll), 768 and 1280 px, light and dark theme;
         - set `STRAVA_ALLOWED_ATHLETE_IDS` to an id with no user row → still the seeded map; delete the activities (`migrate:fresh` without `--seed`) → connect screen, 200.

      ## Completion Criteria
      - [x] README `.env` row, seeded-data note and dashboard section describe the fallback
      - [x] `larapilot:quality` clean, full suite green
      - [x] Manual test handoff recorded in the PR notes

      ## Test Data
      - N/A — documentation only

      ## Domain Docs
      - N/A — the domain docs were updated with the behaviour change in TASK-01

      ## Git Deliverables
      - Commit: `docs(US-009): TASK-03 document the home page fallback in the README`
      - Push: **skip** (`git_mode: GITFLOW`)
      - PR: finalize the local PR notes with the manual test handoff
