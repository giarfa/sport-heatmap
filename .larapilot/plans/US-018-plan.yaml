    id: TASK-04
    title: 'Reuse the review plan while upload and stored runs are unchanged'
    body: |-
      ## Description
      Reloading `GET /import/garmin/review` reuses the plan already computed for the pending upload, as long as the target athlete and the planner's inputs from the database (the stored runs on the upload's dates) haven't changed. A stored run added, changed, or removed on one of those dates, a different target, or a new upload re-plans.

      ## Files Involved
      - app/Support/Garmin/RememberedGarminImportPlan.php (new: `php artisan make:class Support/Garmin/RememberedGarminImportPlan --no-interaction`, `final readonly`, invokable)
      - app/Support/Garmin/PendingGarminImport.php (`rememberPlan()`, `rememberedPlan()`)
      - app/Http/Controllers/Garmin/ShowGarminImportReviewController.php
      - .larapilot/docs/devs/garmin-csv-import.md
      - CHANGELOG.md (Unreleased → Security)

      ## Steps
      1. `PendingGarminImport`: `rememberPlan(array $entry): void` writes `garmin_import.pending.plan`, and `rememberedPlan(): ?array` reads it back (null when absent or not an array). Document the array shape in PHPDoc: `array{athlete: int, stamp: string, new: array<int, int>, conflicts: array<int, int>, already_imported: array<int, int>}`. `put()` and `forget()` already replace/drop the whole entry. Say in the class PHPDoc that this is how a new upload invalidates the remembered plan.
      2. `RememberedGarminImportPlan::__invoke(?User $athlete, ParsedGarminCsv $parsed): GarminImportPlan`, with constructor-promoted `PlanGarminImport` and `PendingGarminImport`:
         - `$athlete === null` → return the plan from `PlanGarminImport` and remember nothing (no database work to save).
         - Stamp: `sha256` of `json_encode` of `$athlete->activities()->onDates($dates)->toBase()->orderBy('id')->get(['id', 'source', 'start_date_local', 'activity_date', 'distance_meters', 'moving_time_seconds'])`. Comment why these columns are exactly the planner's inputs, and why `updated_at` isn't used (one-second resolution, not touched by query-builder writes).
         - Reuse when the remembered `athlete` and `stamp` match. Rebuild `GarminImportPlan` from `$parsed->rows` by index plus one `Activity::whereKey($ids)->get()->keyBy('id')`. If a row index or stored id is missing, fall through to a re-plan.
         - Otherwise call `PlanGarminImport` and remember `{athlete, stamp, new, conflicts (index => stored id), already_imported (index => stored id)}`.
      3. `ShowGarminImportReviewController`: inject `RememberedGarminImportPlan` instead of `PlanGarminImport`, and update its PHPDoc (plans once, reused on reload). `ConfirmGarminImportController` stays as it is: it plans fresh inside the lock. Add a one-line comment there on why it doesn't reuse (the fingerprint must compare against the database as it is at write time).
      4. Run the whole Garmin suite (`php artisan test --compact tests/Feature/Garmin tests/Unit/Support/Garmin`); stale-fingerprint, token, and guest-masking tests stay green.
      5. `vendor/bin/pint --dirty --format agent`

      ## Completion Criteria
      - [x] A second review render with nothing changed reuses the plan (no planner query)
      - [x] Added, changed, or removed stored runs on an upload date, a changed target, or a new upload re-plan
      - [x] The fingerprint the review renders still matches the confirm's fresh plan when nothing changed
      - [x] Tests pass

      ## Test Data
      - N/A — no model/schema changes in this task

      ## Domain Docs
      - [x] `.larapilot/docs/devs/garmin-csv-import.md` updated: Functional flow (review reuses its plan; what invalidates it), Technical design (new class, session sub-key, stamp columns), Architectural choices (session over cache; stamp of planner inputs over `updated_at`/count aggregates; confirm still re-plans), Key decisions & invariants (*reuse only when every planner input is unchanged; breaks if the planner starts reading a column the stamp leaves out*)
      - [x] Folder `README.md` index row updated
      - [x] English, committed with this task

      ## Git Deliverables
      - Commit: `fix(US-018): TASK-04 reuse the Garmin review plan while nothing changed`. Body names the root cause: every review render re-planned the whole upload against the database
      - Push: **skip** (`git_mode: GITFLOW`)
      - PR: update local notes only
