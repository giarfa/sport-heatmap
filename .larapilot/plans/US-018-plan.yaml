    id: TASK-05
    title: 'Regression tests for review throttle and plan reuse'
    body: |-
      ## Description
      Add PHPUnit coverage: the eleventh review request in a minute answers 429; a second review render doesn't re-plan; stored-run changes on an upload date re-plan. Each test fails without its fix.

      ## Files Involved
      - tests/Feature/Garmin/GarminImportAccessTest.php
      - tests/Feature/Garmin/GarminImportReviewReuseTest.php (new: `php artisan make:test --phpunit GarminImportReviewReuseTest --no-interaction`, moved under `Garmin/`)

      ## Steps
      1. Read the `testing-best-practices` skill first; follow the existing Garmin tests' fixture helpers and the `allowlistedAthlete()` helper for signed-in cases.
      2. `GarminImportAccessTest`: `test_an_eleventh_guest_review_in_a_minute_is_throttled`. Upload once (one hit on the shared limiter), then make review requests until the limit is used up, then one more → `assertTooManyRequests()`. Count against the **shared** limit (upload + reviews = 10) and say so in the test.
      3. Reuse test: upload a CSV that clashes with a stored run, render the review, then capture queries with `DB::listen` during a second render and assert that no `select *` over `activities` filtered on `activity_date` runs. Check it fails: point the controller back at `PlanGarminImport`, confirm the failure, then restore it.
      4. Invalidation tests (one each): on an upload date, a stored run **added** inside tolerance → the reload shows the new conflict; **changed** (start moved beyond 2 minutes, via the model) → the conflict disappears; **removed** → the conflict disappears. A new upload re-plans (its conflicts are shown, not the previous upload's).
      5. `php artisan test --compact tests/Feature/Garmin`; do **not** add browser/Dusk/E2E

      ## Completion Criteria
      - [x] Eleventh review in a minute → 429; fails without the route throttle
      - [x] Second render doesn't re-plan; fails without the reuse
      - [x] Added, changed, and removed stored runs re-plan
      - [x] Existing Garmin tests green: conflict review, Overwrite/Skip, apply-to-all, summary counts, session binding

      ## Git Deliverables
