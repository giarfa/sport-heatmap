    id: TASK-03
    title: 'Throttle the review and index stored runs by date'
    body: |-
      ## Description
      `GET /import/garmin/review` shares the `garmin-import` limiter with upload and confirm, and `PlanGarminImport` matches each row only against stored runs on its own date, not against every stored run on all the upload's dates (OWASP A04).

      ## Files Involved
      - routes/web.php
      - app/Providers/AppServiceProvider.php (limiter PHPDoc/comment only)
      - app/Models/Activity.php (new `#[Scope] onDates`)
      - app/Support/Garmin/PlanGarminImport.php
      - tests/Feature/Garmin/GarminImportAccessTest.php (`importRoutes()` review row → `true`)
      - .larapilot/docs/devs/garmin-csv-import.md

      ## Steps
      1. `routes/web.php`: add `->middleware('throttle:garmin-import')` to the review route, and change the group comment from "on upload and confirm" to "on upload, review, and confirm" (review re-plans the upload against stored runs: work a guest could otherwise repeat without limit).
      2. `AppServiceProvider`: update the PHPDoc above `registerRateLimiters()` to list review. The limiter definition stays the same.
      3. `Activity`: add `protected function onDates(Builder $query, array $dates): void` with `#[Scope]` like `onDaysBetween`, moving the existing `CarbonImmutable`-binding comment from `PlanGarminImport` into it. PHPDoc `@param array<int, string> $dates` (Y-m-d).
      4. `PlanGarminImport`: query through `->onDates($dates)`. Build two indexes once: by stored `start_date_local` date for the identity pass, and by `activity_date` for the closest-pair pass. Look rows up by `startDateLocal->format('Y-m-d')`, and skip runs already claimed by identity. Keep the ordering rules and their comments (identity first, closest pairs first, ties to the earlier row then the lower id). Add a `/* … */` block saying why: the per-row scan of every stored run was rows × runs work on each review reload.
      5. `GarminImportAccessTest::importRoutes()`: set `'review' => ['garmin.import.review', true]`.
      6. `php artisan test --compact tests/Feature/Garmin tests/Unit/Support/Garmin`; every existing case is green with no expectation changes.
      7. `vendor/bin/pint --dirty --format agent`

      ## Completion Criteria
      - [x] Review route carries `throttle:garmin-import`
      - [x] Matching uses per-date indexes; plans identical to before (existing Garmin tests unchanged and green)
      - [x] Date binding lives once, in `Activity::onDates`
      - [x] Tests pass

      ## Test Data
      - N/A: a query scope only, no column or relationship change; `ActivityFactory` and the seeders are unchanged

      ## Domain Docs
      - [x] `.larapilot/docs/devs/garmin-csv-import.md` updated: the route table marks review as throttled `garmin-import`; Technical design notes the per-date matching and `Activity::onDates`; the guarded-by list in Key decisions (CSRF, 5 MB, throttle, review) includes review in the throttle
      - [x] Folder `README.md` index row updated
      - [x] English, committed with this task

      ## Git Deliverables
      - Commit: `fix(US-018): TASK-03 throttle the Garmin import review and match stored runs by date`. Body names the root cause: the review route had no throttle, and each render compared every row with every stored run on the upload's dates
      - Push: **skip** (`git_mode: GITFLOW`)
      - PR: update local notes only
