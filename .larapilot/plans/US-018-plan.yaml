    id: TASK-01
    title: 'Global SetSecurityHeaders middleware'
    body: |-
      ## Description
      Every web response, 404 included, carries `Content-Security-Policy: frame-ancestors 'none'`, `X-Frame-Options: DENY`, `X-Content-Type-Options: nosniff`, `Referrer-Policy: same-origin`, and `Strict-Transport-Security` on secure requests only. This makes the Garmin review's Overwrite controls unclickable from a framing page (OWASP A05).

      ## Files Involved
      - app/Http/Middleware/SetSecurityHeaders.php (new: `php artisan make:middleware SetSecurityHeaders --no-interaction`)
      - bootstrap/app.php (`$middleware->append(SetSecurityHeaders::class)`)
      - .larapilot/docs/devs/heatmap-dashboard.md
      - .larapilot/docs/devs/README.md
      - CHANGELOG.md (Unreleased → Security)

      ## Steps
      1. Middleware `handle(Request $request, Closure $next): Response`. After `$next`, set each header **only when the response does not already have it** (`$response->headers->has()`). Add a `/* … */` block on why: the Larapilot dev dashboard's own route middleware sets `SAMEORIGIN` + `frame-ancestors 'self'` on purpose to iframe its mockups, and a second CSP would be enforced too, with `'none'` winning.
      2. HSTS `max-age=31536000` only when `$request->isSecure()`. Comment why there's no `includeSubDomains`/`preload`, and that behind a TLS proxy `isSecure()` needs trusted proxies (deployment isn't defined yet).
      3. Keep the CSP to `frame-ancestors` only. Comment that a `default-src` would block Vite assets and the inline review script.
      4. Register it as **global** middleware in `bootstrap/app.php` with a short comment: a 404 matches no route, so group middleware would miss it.
      5. Run the app tests (`php artisan test --compact`); the existing suite stays green. Open the dashboard and `/larapilot/design` in the browser: the dashboard renders, and the Larapilot mockup thumbnails still load in their iframes.
      6. `vendor/bin/pint --dirty --format agent`

      ## Completion Criteria
      - [x] The four headers are on the dashboard, Garmin pages, and a 404; HSTS only on HTTPS
      - [x] A header a route already set is left alone (the Larapilot design viewer still frames its mockups)
      - [x] No asset or script blocked (CSP is `frame-ancestors` only)
      - [x] Tests pass

      ## Test Data
      - N/A — no model/schema changes in this task

      ## Domain Docs
      - [x] `.larapilot/docs/devs/heatmap-dashboard.md` updated: request handling now passes through the global `SetSecurityHeaders` (the header list, HSTS only on HTTPS, don't-overwrite rule and why, CSP limited to `frame-ancestors`, TLS-proxy gotcha), plus Architectural choices (global vs `web` group; strict values vs SAMEORIGIN)
      - [x] Folder `README.md` index row updated (last touched by US-018)
      - [x] English, committed with this task

      ## Git Deliverables
      - Commit: `fix(US-018): TASK-01 send security headers on every web response`. Body names the root cause: `bootstrap/app.php` registered no header middleware, so any page, the Garmin review included, could be framed
      - Push: **skip** (`git_mode: GITFLOW`)
      - PR: update local notes only
