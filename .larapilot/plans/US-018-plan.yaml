code: US-018
plan_body: |-
  **Release:** 2.0.2

  ## Technical Solution

  Two Low findings from the v2.0.0 assessment (OWASP A04, A05), fixed separately on one branch. Traces to FR-018 and Technical Architecture › Security (Lars).

  ### 1. Security headers on every web response (A05 — UI redress)
  - New `app/Http/Middleware/SetSecurityHeaders.php` (`php artisan make:middleware SetSecurityHeaders --no-interaction`), registered as **global** middleware with `$middleware->append(SetSecurityHeaders::class)` in `bootstrap/app.php`. Global, not on the `web` group: a 404 matches no route, so group or route middleware never sees it, and the AC asserts the headers on a 404. The global pipeline receives the rendered exception response, so 404 and 500 pages carry the headers too.
  - Headers: `Content-Security-Policy: frame-ancestors 'none'`, `X-Frame-Options: DENY`, `X-Content-Type-Options: nosniff`, `Referrer-Policy: same-origin`. Add `Strict-Transport-Security: max-age=31536000` only when `$request->isSecure()`. Leave out `includeSubDomains`, because this host can't vouch for sibling subdomains on a personal domain, and leave out `preload`.
  - The CSP is **only** `frame-ancestors`. It has no `default-src` or `script-src`, so Vite assets and the inline `data-resolve-all` script behave as before.
  - **Don't overwrite a header a route already set** (`$response->headers->has(...)` guard per header). Reason: the Larapilot dev dashboard (require-dev, never registered on a deployed host) uses its own route middleware `AddLarapilotSecurityHeaders` to send `X-Frame-Options: SAMEORIGIN` + `frame-ancestors 'self'` on purpose, so it can iframe its mockups. Overwriting that, or appending a second CSP (browsers enforce every CSP they get, so `'none'` would win), would break the dashboard's design viewer. No app route sets these headers, so every app response gets the strict values.
  - Gotcha for later: behind a TLS-terminating proxy, `isSecure()` is false until trusted proxies are set up. Deployment isn't defined yet (PRD), so this goes in the domain doc and isn't built now.

  ### 2. Throttle the Garmin import review (A04 — resource exhaustion)
  - `routes/web.php`: `GET /import/garmin/review` gets `->middleware('throttle:garmin-import')`. That's the limiter upload and confirm already use (10/min per signed-in owner, else per IP; `AppServiceProvider::registerRateLimiters`). Update the route-group comment and the limiter PHPDoc to say review too. Cancel, form and summary do no matching work and stay unthrottled.

  ### 3. Date-indexed matching in `PlanGarminImport`
  - Replace the rows × stored-runs scans with per-date indexes built once. The identity pass looks up stored runs by `start_date_local` date (what `GarminCsvRow::isIdenticalTo` compares). The closest-pair pass looks them up by `activity_date` (what `StartTimeMatcher::difference` compares). Use the row's `startDateLocal->format('Y-m-d')` as the lookup key in both passes. A stored run claimed by identity is skipped from then on (a claimed-id set, or forgotten from both indexes). The results stay **identical**: identity before conflicts, closest pairs first, ties to the earlier row and then the lower stored id. The existing flow tests are the regression net.
  - Move the date-binding quirk (bind `CarbonImmutable`, never `toDateString()`, see the existing comment) into a new `#[Scope] onDates(Builder $query, array $dates)` on `App\Models\Activity`, next to `onDaysBetween`. The planner and the new stamp then share one copy instead of two that could drift.

  ### 4. Reuse the review's plan on reload
  - New `app/Support/Garmin/RememberedGarminImportPlan.php` (`final readonly`, invokable: `__invoke(?User $athlete, ParsedGarminCsv $parsed): GarminImportPlan`). It's the review's way to get a plan; `ShowGarminImportReviewController` calls it instead of `PlanGarminImport`.
  - **Stamp** = `sha256` of the plan's inputs from the database: `$athlete->activities()->onDates($dates)->toBase()->orderBy('id')->get(['id', 'source', 'start_date_local', 'activity_date', 'distance_meters', 'moving_time_seconds'])`. These are exactly the columns the planner reads, so the stamp changes if and only if a re-plan could give a different plan. It doesn't depend on `updated_at`, which has one-second resolution in SQLite and isn't bumped by query-builder writes.
  - **Remembered entry** (session, inside the pending-upload entry): `{athlete: ?int, stamp: string, new: int[], conflicts: array<int,int> (row index => stored id), already_imported: array<int,int>}`. `PendingGarminImport` stays the only reader and writer of that session key. Add `rememberPlan(array $entry): void` and `rememberedPlan(): ?array` stored under `garmin_import.pending.plan`. `put()` already replaces the whole entry, so **a new upload drops the remembered plan**, and `forget()` drops it with the upload.
  - **Reuse** when the entry exists, its `athlete` equals the resolved target's id, and its `stamp` equals the fresh stamp. Then rebuild the `GarminImportPlan` from `$parsed->rows` (by index) and one `Activity::whereKey($ids)->get()->keyBy('id')` for the conflict and already-imported ids, so the review still shows the stored side fresh. Any missing id or row index means re-plan instead. **Otherwise** call `PlanGarminImport` and remember the result.
  - With no target athlete (a first guest import), the plan has no database work. Plan directly and remember nothing.
  - **Confirm is unchanged**: it still plans fresh inside `Cache::lock('garmin-import:confirm')` and compares the fingerprint. Since the stamp covers every planner input, a reused plan's fingerprint equals a fresh plan's fingerprint whenever the review reused it. That keeps the stale-review guard exactly as it is.
  - Why the session and not the cache: the plan is bound to the visitor's upload like the pending rows, so it's never visible to another visitor, and it goes away with the upload (the same reasons `pending_imports` was rejected for a table).

  ### Out of scope
  - The CSV parser, confirm/apply logic, guest masking, and the accepted risk of the open import stay as they are. No schema change, no new dependency.

  ## Git & Branching
  - Mode: GITFLOW (no automatic push)
  - Release: 2.0.2. TASK-00 runs `php artisan larapilot:release-feature --semver=2.0.2 --spec=US-018 --slug=garmin-review-throttle-and-headers`, which creates `feature/US-018-garmin-review-throttle-and-headers` from `release/2.0.2`
  - Per task: one Conventional Commit `type(US-018): TASK-NN …`; the commit that holds a fix names its root cause in the body
  - PR toward `release/2.0.2` (not `develop`), prepared locally; push/remote PR only if the user asks
  - Merge into `release/2.0.2` after `larapilot-review` approval

  ## Test Data Strategy
  - No model, migration, or relationship changes. The new `Activity::onDates` scope adds no column, so `ActivityFactory` and the seeders are unchanged (AC: factory/seeder not applicable)
  - Tests build their state with the existing `Activity` and `User` factories and the `tests/Fixtures/Garmin/*.csv` fixtures. Signed-in cases use `allowlistedAthlete()` from `Tests\TestCase`

  ## Test Strategy
  - Bar: NORMAL. PHPUnit feature tests, no browser/Dusk/E2E
  - Headers: `tests/Feature/Routing/SecurityHeadersTest.php` asserts all four headers on `GET /`, on `GET /import/garmin` and on an unknown URL (404). HSTS is absent on `http://` and present on `https://`. A header set by a route is kept. Removing the middleware makes it fail
  - Throttle: `GarminImportAccessTest` changes the `review` row of `importRoutes()` to throttled and adds an eleventh-review-in-a-minute → 429 test. Removing the route middleware makes it fail
  - Reuse: a second review render doesn't run the planner's `select *` over the upload's dates (seen through `DB::listen`), which fails without the reuse. A stored run added, changed (start moved out of tolerance), or removed on an upload date makes the reload re-plan and show the new conflict set. A new upload re-plans
  - Regression: the whole Garmin suite (`tests/Feature/Garmin`, `tests/Unit/Support/Garmin`) stays green: conflict review, Overwrite/Skip, apply-to-all, summary counts, session binding, stale fingerprint
  - Manual test handoff (Oliver re-test): framing `/import/garmin/review` from another origin is refused; a reload loop on the review hits 429
