    body: |-
      ## Description
      Fix: `composer.lock` pins `symfony/http-foundation` v8.1.6, affected by PKSA-xmwy-rmx5-m7h4 / CVE-2026-108082 (ReDoS in `HeaderUtils::split()` through the `Cache-Control` request header, reachable unauthenticated before routing and throttling). Update the lock to a fixed release (8.1.7 or later; 8.1.9 is available) touching only the packages the update needs.

      ## Files Involved
      - composer.lock
      - CHANGELOG.md

      ## Steps
      1. `composer update symfony/http-foundation` — no `-W`. If Composer refuses, retry with `--with-dependencies` and note every extra package that moved in the commit body
      2. `composer show symfony/http-foundation` → version ≥ 8.1.7
      3. `git diff --stat composer.lock` and inspect: only `symfony/http-foundation` (plus anything step 1 provably required); `content-hash` unchanged; `composer.json` unchanged
      4. `composer audit` → "No security vulnerability advisories found"
      5. CHANGELOG `## [Unreleased]` → `### Security`: one line — a crafted `Cache-Control` header can no longer tie up the host (symfony/http-foundation updated, CVE-2026-108082) (US-017)
      6. `php artisan test --compact`

      ## Completion Criteria
      - [ ] `symfony/http-foundation` ≥ 8.1.7 in `composer.lock`
      - [ ] `composer audit` reports no advisory
      - [ ] Only the packages the update needs changed in the lock; `composer.json` untouched
      - [ ] CHANGELOG Unreleased Security entry added
