    id: TASK-02
    title: 'Ship production-safe values in .env.example and align the README'
    body: |-
      ## Description
      Fix: `.env.example` — which `composer setup` copies to `.env` — ships development defaults, so a host built from it renders the debug page on any 500 and writes one never-rotating debug log. Ship the production values and make development the documented opt-in.

      ## Files Involved
      - .env.example
      - README.md ("Local setup on Herd", "Before putting this on a real host")
      - CHANGELOG.md

      ## Steps
      1. `.env.example`: `APP_ENV=production` (line 2), `APP_DEBUG=false` (4), `APP_URL=https://heatmap.example.com` (5), `LOG_STACK=daily` (19), `LOG_LEVEL=warning` (21), `SESSION_SECURE_COOKIE=true` (37). Nothing else changes
      2. Rewrite the comment above `SESSION_SECURE_COOKIE` so it holds before and after US-019 (no remember-me mention): e.g. `# Keep true on every HTTPS host: without it the sign-in cookies are also sent over plain HTTP.`
      3. README "Local setup on Herd", step 3: after `composer setup` copied the production example, set the development overrides in `.env` — `APP_ENV=local`, `APP_DEBUG=true`, `APP_URL=https://sport-heatmap.test` (optionally `LOG_LEVEL=debug`); keep the note that `APP_URL` must match the Herd domain. `SESSION_SECURE_COOKIE=true` stays, Herd serves HTTPS
      4. README "Before putting this on a real host": replace "Three settings are not safe at their `.env.example` defaults" with a table of the production keys **as the example's own values** (`APP_ENV=production`, `APP_DEBUG=false`, `APP_URL` = the host's `https` URL, `LOG_STACK=daily`, `LOG_LEVEL=warning`, `SESSION_SECURE_COOKIE=true`) and the instruction to keep them; the `SESSION_SECURE_COOKIE` row's "Why" drops the remember-me wording the same way as step 2. Marika's terse register; the host checklist and the file must agree value for value
      5. CHANGELOG `## [Unreleased]` → `### Security`: one line — `.env.example` now ships production-safe values; local development sets the overrides listed in the README (US-017)
      6. `php artisan test --compact` (the suite runs with `phpunit.xml` env, unaffected by `.env.example`)

      ## Completion Criteria
      - [ ] `.env.example` ships `APP_ENV=production`, `APP_DEBUG=false`, an `https` `APP_URL`, `LOG_STACK=daily`, `LOG_LEVEL=warning`, `SESSION_SECURE_COOKIE=true`
      - [ ] The `SESSION_SECURE_COOKIE` comment and README row no longer mention a remember-me cookie, and stay true once US-019 lands
      - [ ] README "Local setup on Herd" names the development overrides (`APP_ENV=local`, `APP_DEBUG=true`, Herd `https://….test` `APP_URL`)
      - [ ] README "Before putting this on a real host" lists the production keys as the example's own values
      - [ ] CHANGELOG Unreleased Security entry added
      - [ ] Full suite passes

      ## Test Data
      - N/A — no model/schema changes

      ## Domain Docs
      - N/A — configuration example and README only, no domain behavior change (acceptance criterion)

      ## Git Deliverables
      - Commit: `fix(config): US-017 TASK-02 ship production-safe values in .env.example` — body names the root cause (the example `composer setup` copies to `.env` carried Laravel's development defaults, so a host built from it ran with debug pages and an unrotated debug log) and notes that the `SESSION_SECURE_COOKIE` comment is now US-019-neutral
      - Push: **skip** (`git_mode: GITFLOW`)
      - PR: update local PR notes
    type: Impl
    status: TODO
    assignee: Alex
    estimate_hours: 1
    dependencies:
      - TASK-00
  -
    id: TASK-03
    title: 'Regression test: .env.example ships production-safe values'
    body: |-
      ## Description
      Add PHPUnit coverage that reads `.env.example` and fails while any development default is back: `APP_DEBUG=true`, `APP_ENV=local`, `LOG_STACK=single`, `LOG_LEVEL=debug`, `SESSION_SECURE_COOKIE=false`, or a non-`https` `APP_URL`.

      ## Files Involved
      - tests/Feature/Config/EnvironmentExampleTest.php (new — `php artisan make:test --phpunit EnvironmentExampleTest --no-interaction`, then move under `Config/` next to `StravaConfigTest`)

      ## Steps
      1. Class docblock states why it exists (v2.0.0 assessment, OWASP A05/A09; `composer setup` copies the file to `.env`), in the style of `tests/Unit/ComposerDependenciesTest.php`
      2. Private helper parses `base_path('.env.example')` into `array<string, string>`: skip blanks and `#` lines, split on the first `=`, strip surrounding double quotes. Read the file — never `env()`/`config()`, which `phpunit.xml` overrides
      3. `#[DataProvider]` of `array<string, array{string, string}>` key → production value: `APP_ENV`/`production`, `APP_DEBUG`/`false`, `LOG_STACK`/`daily`, `LOG_LEVEL`/`warning`, `SESSION_SECURE_COOKIE`/`true`; one test asserts the key exists and equals the value, with a message naming what a host would inherit
      4. Separate test: `parse_url($values['APP_URL'], PHP_URL_SCHEME)` is `https`
      5. Prove red on the pre-fix file: `git show develop:.env.example > .env.example && php artisan test --compact --filter=EnvironmentExampleTest` (expect failures for every key), then `git checkout -- .env.example` and re-run green
      6. Do **not** add Playwright, Dusk, or browser suites

      ## Completion Criteria
      - [ ] Test fails on the pre-fix `.env.example` (all six cases) and passes on the fixed one
      - [ ] Coverage matches the NORMAL bar
      - [ ] `.env.example` restored to the fixed content before committing

      ## Test Data
      - N/A — reads a repository file, no factories

      ## Domain Docs
      - N/A — test only

      ## Git Deliverables
      - Commit: `test(US-017): TASK-03 guard .env.example against development defaults`
      - Push: **skip** (`git_mode: GITFLOW`)
      - PR: update local PR notes
    type: Test
    status: TODO
    assignee: Anne
    estimate_hours: 0.75
    dependencies:
      - TASK-02
