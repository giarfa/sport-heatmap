code: US-017
plan_body: |-
  **Release:** 2.0.2

  ## Technical Solution

  Two independent root causes, two fix commits, no application code change.

  1. **Vulnerable dependency (OWASP A06).** `composer.lock` pins `symfony/http-foundation` v8.1.6, affected by PKSA-xmwy-rmx5-m7h4 / CVE-2026-108082 (ReDoS in `HeaderUtils::split()` reachable via the `Cache-Control` request header before routing and throttling). Fixed versions available: v8.1.7, v8.1.8, v8.1.9. Fix: `composer update symfony/http-foundation` — lock-only, **without** `--with-all-dependencies`; escalate to `--with-dependencies` only if Composer refuses, and record which extra packages moved and why in the commit body. `composer.json` constraints do not change (the package is a transitive dependency of `laravel/framework`). Acceptance: `git diff composer.lock` touches only `symfony/http-foundation` (plus anything the update provably required) and the `content-hash` stays unchanged.
  2. **Development defaults in `.env.example` (OWASP A05/A09).** `composer setup` copies `.env.example` to `.env`, so a host built from the repository inherits `APP_ENV=local`, `APP_DEBUG=true`, `APP_URL=http://localhost`, `LOG_STACK=single`, `LOG_LEVEL=debug`, `SESSION_SECURE_COOKIE=false`. Fix: the example ships the production values (`APP_ENV=production`, `APP_DEBUG=false`, `APP_URL=https://heatmap.example.com`, `LOG_STACK=daily`, `LOG_LEVEL=warning`, `SESSION_SECURE_COOKIE=true`); development becomes the explicit opt-in documented in README "Local setup on Herd". `config/logging.php` already rotates `daily` at `LOG_DAILY_DAYS` (default 14), and no code logs at `info`/`debug` that an operator relies on (`SyncStravaActivities` writes console output, not log lines), so `warning` loses nothing.

  **`SESSION_SECURE_COOKIE` comment and US-019.** The spec asks that the comment stop mentioning the remember-me cookie once US-019 removes it, updated by whichever spec lands second. This plan writes the comment (and the matching README row) in wording that is true both before and after US-019 — "keep true on every HTTPS host: without it the sign-in cookies are sent over plain HTTP too" — so US-019 has nothing to update. TASK-02 records this in its commit body so US-019's planner sees it.

  **Out of scope:** application code, config files (`config/*.php` defaults stay as Laravel ships them — the fix is the example file a host is built from), deploy scaffolding (still deferred to `larapilot-ship` per the PRD).

  ## Git & Branching
  - Mode: GITFLOW (no automatic push)
  - Release: 2.0.2 — branch `feature/US-017-deps-and-env-defaults` from `release/2.0.2` via `php artisan larapilot:release-feature` (it opens `release/2.0.2`, still `planned`, from `develop`)
  - TASK-00: bootstrap via `release-feature`
  - Per task: one atomic commit. Following the US-016 precedent and this spec's acceptance criteria, fix commits carry the root-cause scope: `fix(deps): US-017 TASK-01 …`, `fix(config): US-017 TASK-02 …`; test/chore commits use `test(US-017): TASK-NN …`
  - Push / remote PR: **skip** unless the user asks; internal PR toward `release/2.0.2`
  - Merge into `release/2.0.2` after `larapilot-review` approval

  ## Test Data Strategy
  - No schema, model, or relationship change — factories and seeders are untouched (acceptance criterion: not applicable)
  - No `migrate:fresh --seed` step: per project memory the dev database is the default SQLite file holding real data; nothing in this spec needs a reseed

  ## Test Strategy
  - Bar: NORMAL — PHPUnit (the project uses PHPUnit, not Pest), no browser/E2E
  - New regression test `tests/Feature/Config/EnvironmentExampleTest.php`: parses `.env.example` (lines `KEY=VALUE`, comments and blanks skipped, surrounding quotes stripped) and asserts, via a `#[DataProvider]`, the production value of `APP_ENV`, `APP_DEBUG`, `LOG_STACK`, `LOG_LEVEL`, `SESSION_SECURE_COOKIE`, plus that `APP_URL` parses with scheme `https`. It reads the file — never `env()` — because `phpunit.xml` overrides `APP_ENV` and the test must judge what a host would inherit. Proven red against the pre-fix file before it is committed
  - Dependency fix is guarded by `composer audit` (already a CI step in `.github/workflows/ci.yml`); no PHPUnit test pins a package version
  - Gate (TASK-04): `php artisan test --compact`, `php artisan larapilot:quality`, `composer audit` all green
  - Manual security handoff (Lars/Oliver): re-send a crafted `Cache-Control` header to `/up`; on a copy of the app with `.env` built from `.env.example` (plus `APP_KEY`), force a 500 and confirm a generic error page with no stack trace or environment details, and that `storage/logs/laravel-YYYY-MM-DD.log` is written

  ## Documentation
  - README "Local setup on Herd" and "Before putting this on a real host" (TASK-02), CHANGELOG `[Unreleased] › Security` (TASK-01, TASK-02)
  - Developer domain docs: **none** — no domain behavior changes (acceptance criterion)

  ## Risks
  - `composer update` pulling more than the target package → refuse silently growing the lock; justify any extra package in the commit body
  - A developer re-running `composer setup` locally now gets production values → README step 3 lists the overrides; their existing `.env` is never overwritten (`file_exists('.env') ||`)
