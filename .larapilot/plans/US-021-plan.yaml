    id: TASK-03
    title: 'Irreversible migration: delete Strava runs, drop Strava columns and sync_runs; Garmin-only models, factories, seeder'
    type: Impl
    status: TODO
    assignee: Mike
    estimate_hours: 5
    dependencies:
      - TASK-02
    body: |-
      ## Description
      One migration removes Strava from the data and the schema, which the owner accepted as irreversible on 2026-10-26. It:
      - deletes every `strava`-sourced activity, keeping every `garmin_csv` activity with all its values
      - drops `users.strava_athlete_id`, `strava_access_token`, `strava_refresh_token`, `strava_token_expires_at`, the `sync_runs` table, `activities.strava_activity_id`, and `activities.source`
      - flushes the cache so no window shows a deleted run

      Models, factories, and the seeder become Garmin-only in this same task.

      ## Files Involved
      - database/migrations/xxxx_xx_xx_xxxxxx_remove_strava_from_schema.php (`php artisan make:migration remove_strava_from_schema --no-interaction`)
      - app/Models/User.php (Strava `@property` lines, `#[Hidden]` entries, casts, `isCsvOnly()`, the activities relation docblock)
      - app/Models/Activity.php (`strava_activity_id`, `source`, `$attributes` default, `isGarminSourced()`, `stravaUrl()`, casts, docblock)
      - app/Models/SyncRun.php, app/Enums/SyncRunStatus.php, app/Enums/ActivitySource.php (delete)
      - app/Enums/SportType.php (docblock: types are Garmin running types mapped at import)
      - app/Data/Garmin/GarminCsvRow.php (`toAttributes()` loses `source`, array shape updated)
      - app/Support/Garmin/PlanGarminImport.php (every stored run is an identity/conflict candidate: drop the `isGarminSourced()` filter, rename `$garminByStartDate`)
      - app/Support/Garmin/ResolveImportStatus.php (drop the TASK-01 source filter and its temporary comment)
      - app/Actions/Garmin/ApplyGarminImport.php (comments on the Strava twin / sync)
      - app/Support/Heatmap/DailyRuns.php (select list), app/Data/Heatmap/DayRun.php (drop `stravaUrl`, `sourceLabel()`)
      - app/Support/Heatmap/HeatmapGridCache.php (key `v5` → `v6`, with the reason added to the block comment)
      - database/factories/ActivityFactory.php, UserFactory.php, SyncRunFactory.php (delete)
      - database/seeders/TrainingBlockSeeder.php
      - tests/Feature/Database/RemoveStravaMigrationTest.php (new)
      - tests/Feature/Database/SchemaTest.php, UsernameMigrationTest.php, TrainingBlockSeederTest.php, SeederMeetsMigrationOwnerTest.php
      - tests/Feature/Models/UserStravaColumnsTest.php (delete)
      - tests/Unit/Models/ActivityTest.php, tests/Unit/Data/Heatmap/DayRunTest.php, tests/Unit/Support/Heatmap/DailyRunsTest.php, tests/Unit/Support/Garmin/PlanGarminImportTest.php, tests/Feature/Garmin/* (fixtures that used `source` / `strava_activity_id`)

      ## Steps
      1. Migration `up()`, in this order, with a `/* … */` block on each decision (`.ai/rules/app.md`):
         a. `DB::table('activities')->where('source', 'strava')->delete()`. A Garmin-overwritten twin is already `garmin_csv` and survives with all its values.
         b. `Schema::table('activities')`: `dropUnique(['strava_activity_id'])` first (SQLite rebuilds the table and fails on a dangling index), then `dropColumn(['strava_activity_id', 'source'])`. Keep the `(user_id, activity_date)` index.
         c. `Schema::table('users')`: `dropUnique` on `strava_athlete_id` if `SchemaTest` shows one, then `dropColumn` of the four Strava columns.
         d. `Schema::dropIfExists('sync_runs')`.
         e. `Cache::flush()`. The deleted runs are inside every cached grid window and can be referenced by a remembered Garmin import plan, and the store holds nothing that cannot be rebuilt.
      2. `down()` restores the schema only, with a block comment that the deleted rows cannot come back:
         - `users.strava_*` nullable (token columns `text`, as `SchemaTest` pins)
         - `activities.strava_activity_id` nullable unique
         - `activities.source` string defaulting to `garmin_csv`
         - `sync_runs` re-created with its original columns
      3. Models: remove every Strava column from `@property`, `#[Fillable]`, `#[Hidden]`, and casts (`.ai/rules/models.md`). Delete `SyncRun` and the two enums.
      4. Garmin import: `GarminCsvRow::toAttributes()` without `source`. In `PlanGarminImport`, every stored run on the date is a candidate (FR-018 "a stored run on the same date within ±2 minutes"). Keep the existing tie rules and their comments.
      5. `DayRun` / `DailyRuns`: drop `stravaUrl` / `sourceLabel()` and the column from the select. Bump the grid cache key to `v6` (a cached class changed shape).
      6. Factories:
         - `ActivityFactory` default is an imported Garmin run. `garminImported()` folds into the default or stays as an alias. `garminOverwritten()` is deleted.
         - `UserFactory` loses every Strava state.
         - `SyncRunFactory` is deleted.
      7. `TrainingBlockSeeder`: every run Garmin-sourced, no `SyncRun`, owner `giarfa`. The double-run days stay, and the mixed-source week becomes a plain double-run day. Keep about 15% of runs without heart rate.
      8. Tests:
         - `RemoveStravaMigrationTest` follows the `UsernameMigrationTest` pattern: roll back to before the migration, insert rows with raw `DB::table`, then migrate up. It asserts:
           - strava rows deleted
           - a `garmin_csv` row (new) and a `garmin_csv` row carrying a `strava_activity_id` (overwritten twin) kept with every value
           - the four user columns, `sync_runs`, `strava_activity_id`, and `source` gone
           - a grid cached before the migration is not served after it
           - `down()` restores the columns and the table with zero activities restored
         - `SchemaTest` pins the new schema.
         - `UsernameMigrationTest` rolls back through the new migration first (step count or `--path`).
         - The seeder tests assert no `sync_runs` table and Garmin-only rows.
         - `PlanGarminImportTest` covers a conflict against a run imported in an earlier session.
      9. Verify the seed on a throwaway database only (never `database/database.sqlite`):
         - `php artisan config:show database.connections.sqlite.database`
         - `touch <scratchpad>/us021.sqlite`
         - `DB_DATABASE=<scratchpad>/us021.sqlite php artisan migrate:fresh --seed --force`
         - Delete the file afterwards.
      10. `php artisan test`, `vendor/bin/pint --dirty --format agent`, then `grep -rni strava app database/factories database/seeders config routes resources`. Hits are allowed only in the old migrations, which stay untouched.

      ## Completion Criteria
      - [ ] The migration deletes every `strava` activity and keeps every `garmin_csv` activity with all its values
      - [ ] `users` has no Strava column; `sync_runs` and `activities.strava_activity_id` are gone; `activities.source` no longer exists, so no `strava` value is possible
      - [ ] `down()` restores the schema only, never the deleted rows
      - [ ] After the migration the cached grid is flushed; no window shows a deleted run
      - [ ] Conflicts are matched against every stored run on the same date within ±2 minutes; re-import stays idempotent
      - [ ] `migrate:fresh --seed` succeeds on a throwaway SQLite file
      - [ ] Tests pass

      ## Test Data
      - [ ] `database/factories/ActivityFactory.php` and `UserFactory.php` Garmin-only; `SyncRunFactory.php` deleted
      - [ ] `TrainingBlockSeeder` produces Garmin-sourced runs only, with no `SyncRun`
      - [ ] Factories and seeder updated in **this same task** as the migration

      ## Domain Docs
      - [ ] `.larapilot/docs/devs/garmin-csv-import.md` gains the `activities` data model and the metric columns from `activity-sync.md`, plus the "every stored run is a candidate" rule, and records the dropped `source` column (and why it was dropped rather than narrowed) under Architectural choices
      - [ ] `.larapilot/docs/devs/activity-sync.md` deleted, and its index row removed from `README.md`
      - [ ] `heatmap-dashboard.md`: cache key `v6` and the post-migration flush; `owner-authentication.md`: `users` columns
      - [ ] English, committed with this task

      ## Git Deliverables
      - Commit: `feat(US-021): TASK-03 delete Strava runs and drop the Strava schema`
      - Push: **skip** (`git_mode: GITFLOW`)
      - PR: update the local PR notes toward `release/3.0.0`; remote only if the user asks
