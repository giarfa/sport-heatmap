      - [ ] `.larapilot/docs/devs/activity-sync.md`: the nightly sync, `sync_runs`, and the OAuth/token sections removed. Only the `activities` data-model and metric-column sections remain, until TASK-03 folds them into `garmin-csv-import.md`.
      - [ ] `heatmap-dashboard.md` (footer, day detail) and `owner-authentication.md` (sign-out no longer mentions tokens) corrected
      - [ ] English, committed with this task

