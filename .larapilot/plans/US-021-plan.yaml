code: US-021
plan_body: |
  **Release:** 3.0.0

  ## Technical Solution

  US-021 removes Strava from the codebase, the schema, and the data, leaving the Garmin CSV import (FR-018) as the only way runs enter. The work is ordered by layer so that every task commit leaves the suite green:

  1. **Dashboard first (TASK-01)** — the dashboard stops depending on Strava. `SyncStatus` / `ResolveSyncStatus` / `SyncHealth` are replaced by a Garmin-only `ImportStatus` (`App\Data\ImportStatus`) resolved by `App\Support\Garmin\ResolveImportStatus`. It reads the newest `updated_at` of the owner's imported runs, so a re-import that writes nothing does not move it (Eloquent does not touch a clean model). The status line reads "last import N ago" / "No runs imported yet" (FR-007). There is no warning, stale, failed, reconnect, or first-sync skeleton state. An owner with no runs gets a Garmin-only empty state instead of `strava.connect` (FR-017). The absolute "Last import" stamp moves from `strava.sync_timezone` to `heatmap.display_timezone` (env `HEATMAP_DISPLAY_TIMEZONE`, default `Europe/Rome`), so the stamp keeps the hour the owner reads today.
  2. **Strava code out (TASK-02)** — this removes the routes, controllers, OAuth service, HTTP client, actions, `strava:sync` command, its schedule entry, the `strava.fresh` middleware and alias, the allowlist, exceptions, data objects, the `strava-oauth` rate limiter, `config/strava.php`, the `STRAVA_*` keys in `.env.example`, the `strava/*` views, the reconnect notice, the "Powered by Strava" footer, and the "View on Strava" links. The Strava tests and helpers go too. The `.ai/rules` that cite Strava as their example are rewritten.
  3. **Irreversible migration (TASK-03)** — one migration, `remove_strava_from_schema`:
     - deletes every `activities` row whose `source` is `strava`, keeping every `garmin_csv` row with all its values, the Garmin-overwritten Strava twins included
     - drops `users.strava_*` (four columns), the `sync_runs` table, `activities.strava_activity_id` (its unique index dropped first, for SQLite), and `activities.source`
     - flushes the cache store

     `down()` restores the schema only: nullable `users.strava_*`, a nullable unique `strava_activity_id`, `source` defaulting to `garmin_csv`, and an empty `sync_runs`. It never restores rows. The models, factories, and seeder go Garmin-only in the same task. The grid cache key moves `v5` → `v6` because `DayRun` loses `stravaUrl`.
  4. **Regression matrix (TASK-04, Anne)** and **docs + changelog + quality gate (TASK-05, Albert)**.

  **Design decisions (John / Mike):**
  - **`activities.source` is dropped, not narrowed.** After the migration every row is a Garmin import, so the column carries no information. The PRD data model (Technical Architecture → Data model) already lists `activities` without it. Dropping it is the strongest form of "no `strava` value remains possible". `ActivitySource`, `Activity::isGarminSourced()`, and the source filter in `PlanGarminImport` go with it, so every stored run is a conflict / identity candidate (FR-018: "a stored run on the same date within ±2 minutes").
  - **The cache flush lives in the migration (`Cache::flush()`)** with a block comment. The deleted runs sit inside every cached grid of every window, and `RememberedGarminImportPlan` entries can point at deleted activities. The store holds nothing that cannot be rebuilt: grids, remembered plans, and throttle counters. A per-athlete generation bump would need the `User` model inside a migration. The `v6` key bump is still made because a cached class changed shape (the `HeatmapGridCache::key()` contract).
  - **The applied migrations are not edited.** `2026_10_26_201636_add_username_to_users_table` keeps reading `config('strava.allowed_athlete_ids', [])`. With the config file gone it gets `[]` and still runs on a fresh database, where the Strava columns still exist at that point.
  - **Folder structure:** the import status sits with the import (`app/Support/Garmin`), and `app/Support/Sync` and `app/Support/Strava` are removed. The `.ai/rules/app.md` rule about integration sub-folders stays, with the Garmin folders as its example.
  - **Query shape:** `ResolveImportStatus` makes two indexed queries: `max(updated_at)` and a window `count()` on the `(user_id, activity_date)` prefix. No relation is loaded in a loop, so there is no N+1 risk. `DailyRuns` drops the `strava_activity_id` column from its select list.

  ## Git & Branching
  - Mode: GITFLOW (no automatic push)
  - Release: 3.0.0. The branch is `feature/US-021-remove-strava` from `release/3.0.0` via `php artisan larapilot:release-feature`, and the PR base is `release/3.0.0`.
  - Precondition: US-020 is DONE but `feature/US-020-private-login` is not merged into `release/3.0.0` yet. TASK-00 merges it locally first (Sarah), because US-021 is blocked by US-020 and edits the same files (`routes/web.php`, `TestCase`, the dashboard).
  - TASK-00 bootstrap, then one Conventional Commit per task (`type(US-021): TASK-NN …`). There is no push and no remote PR unless the user asks.
  - Merge into `release/3.0.0` after `larapilot-review` approval.

  ## Test Data Strategy
  - Alex/Mike keep factories and seeders Garmin-only in TASK-03, the same task as the migration:
    - `ActivityFactory` has no `strava_activity_id`, no `source`, and no Strava twin state.
    - `UserFactory` has no `stravaConnected` / `stravaTokenExpired` / `stravaTokenExpiringSoon` states.
    - `SyncRunFactory` is deleted.
  - Demo dataset: `TrainingBlockSeeder` keeps its 16-week block plus the seven lead-in weeks. Every run is now a Garmin import, the double-run days stay, the "mixed source" week becomes a plain double-run day, and the share of runs without heart rate stays about 15%. There are no `SyncRun` rows. The owner stays `giarfa` (`SeederMeetsMigrationOwnerTest`).
  - Verification: never run `migrate:fresh` / `db:seed` against `database/database.sqlite`. It is the real dev database, and there is no `.env.testing`. Check the target with `php artisan config:show database.connections.sqlite.database`. Then run `DB_DATABASE=<scratchpad>/us021.sqlite php artisan migrate:fresh --seed --force` on a throwaway file. `php artisan test` runs on `:memory:` (phpunit.xml).

  ## Test Strategy
  - Bar: NORMAL. Pest/PHPUnit feature and unit tests (the project uses PHPUnit classes), with no Dusk, Playwright, browser, or viewport suite.
  - Interleaved: each implementation task rewrites or deletes the tests of the code it changes, so its commit is green.
    - TASK-01: `ImportStatusTest` and `ResolveImportStatusTest` replace the sync ones, and the empty state replaces `ConnectScreenTest`.
    - TASK-02: the `tests/Feature/Strava/*` tests and the Strava unit tests are deleted.
    - TASK-03: a migration test, `SchemaTest`, and the seeder tests.
  - TASK-04 (Anne) adds `tests/Feature/StravaRemovedTest.php`, the acceptance matrix. It checks:
    - no `strava` route name or URI
    - `strava:sync` is not an Artisan command and the schedule is empty
    - no rendered page contains "Strava"
    - `.env.example` has no `STRAVA_` key
    - the status-line states, and the ±2-minute conflict rule against a stored run
  - Load-bearing regressions stay green: the percentile bucketing (R-7, `.ai/rules/heatmap.md`), the grid builder, the window navigation, the weekly trend, and the full Garmin import flow (throttle, 5 MB, session binding, Overwrite/Skip, idempotence).
  - **Manual test handoff:**
    - Sign in, open `/` with no runs, and check the empty state offers only "Import Garmin CSV".
    - Import `client-materials/Activities (1).csv`, and check the chip reads "Last import … ago" and the day detail has no external link.
    - Re-import the same file, and check the chip does not move.
    - Check at 375 px and in dark mode that the footer reads "runs only · distances in kilometres" and nothing else.

  ## Ship notes (Jack — for /larapilot-ship of 3.0.0)
  - The migration deletes the Strava-sourced runs **irreversibly**, which the owner accepted on 2026-10-26. Back up the production SQLite file before the deploy that runs it.
  - After deploy:
    - remove the `STRAVA_*` keys from the production environment
    - set `HEATMAP_DISPLAY_TIMEZONE` if the owner is not in `Europe/Rome`
    - revoke the former app at strava.com/settings/apps
    - re-import the full Garmin Connect history, so the days that came only from Strava are back
  - A scheduler cron entry, if one exists on the host, is now a harmless no-op and can be removed.

  ## Aurora
  No cost impact. This removes an integration and a background job and adds nothing.
