    body: |-
      ## Description
      Delete every piece of code that talks to Strava or shows it (FR-001, FR-002, FR-008, FR-010, FR-012, FR-015 withdrawn). After this task no `strava` route, command, scheduled task, config key, or view exists, and no page renders "Powered by Strava", "Connect with Strava", a Strava link, a reconnect notice, or the rejection page. The schema is untouched here (TASK-03).

