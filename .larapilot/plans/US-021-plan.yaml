    id: TASK-01
    title: 'Garmin-only status line, import detail, and empty state on the dashboard'
    type: Impl
    status: TODO
    assignee: Alex
    estimate_hours: 5
    dependencies:
      - TASK-00
    body: |-
      ## Description
      Make the dashboard Garmin-only (FR-007, FR-017). The status is "last import N ago", read from the newest imported run, with no warning state of any kind. An owner with no runs gets an empty state that offers only the Garmin CSV import. After this task nothing on the dashboard reads `sync_runs`, `config('strava.*')`, or a Strava route.

      **Mirrors:** `.larapilot/mockups/heatmap-dashboard/index.html` (header chip, rail detail card, footer line), `.larapilot/mockups/heatmap-dashboard/states.html` (the "empty" state; the "not connected", "athlete rejected", "sync stale/failed", and "loading" states are retired by this spec), `.larapilot/mockups/heatmap-dashboard/dark.html`. Design system: **Tailwind CSS** (`.larapilot/design-systems/tailwind/`, per the mockup README). Reuse the existing tokens (`--ink-muted`, `--accent`, `.card`, `.btn`) and add no new ones. The retired states are a deviation the spec records (accepted 2026-10-26). Run `decision-log --topic="mockup deviation" --spec=US-021` and add a `## Deviations` row to `.larapilot/mockups/heatmap-dashboard/README.md`.

      ## Files Involved
      - app/Data/ImportStatus.php (new, `final readonly`; replaces app/Data/SyncStatus.php)
      - app/Support/Garmin/ResolveImportStatus.php (new; replaces app/Support/Sync/ResolveSyncStatus.php — delete `app/Support/Sync/`)
      - app/Enums/SyncHealth.php (delete)
      - app/Http/Controllers/DashboardController.php
      - app/Data/Heatmap/WindowNavigation.php (`emptyWindowNote()` takes `ImportStatus`)
      - config/heatmap.php (`display_timezone`)
      - .env.example (`HEATMAP_DISPLAY_TIMEZONE=Europe/Rome`)
      - resources/views/dashboard.blade.php
      - resources/views/dashboard-empty.blade.php (new — replaces the dashboard's use of `strava.connect`)
      - resources/views/components/import-chip.blade.php, import-detail.blade.php (renamed from sync-chip / sync-detail)
      - resources/views/components/sync-warning.blade.php, heatmap-skeleton.blade.php, weekly-trend-skeleton.blade.php (delete — they only served the sync states)
      - resources/css/app.css (`.sync-*` → `.import-*`; delete `.sync-alert*`, `.sync-dot--warn`, and the skeleton pulse)
      - tests/Unit/Data/SyncStatusTest.php → tests/Unit/Data/ImportStatusTest.php
      - tests/Unit/Support/Sync/ResolveSyncStatusTest.php → tests/Unit/Support/Garmin/ResolveImportStatusTest.php
      - tests/Feature/Dashboard/SyncStatusTest.php → tests/Feature/Dashboard/ImportStatusTest.php
      - tests/Feature/Dashboard/ConnectScreenTest.php → tests/Feature/Dashboard/EmptyStateTest.php
      - tests/Feature/Dashboard/OwnerDashboardTest.php, WindowNavigationTest.php (adjust to the new status)

      ## Steps
      1. `ImportStatus` has `?CarbonInterface $lastImportedAt` and `int $runsInWindow`. Every string comes from it, with no date arithmetic in Blade:
         - `chipLabel()`: "Last import {relative}", or "No runs imported yet"
         - `footerLabel()`: lcfirst of the chip label
         - `detailHeading()`: "Import"
         - `lastImportLabel()`: `j M Y, H:i` in `config('heatmap.display_timezone')`, or "Never"
         - `lastImportRelative()`
         - `emptyWindowNote()`: "No runs found in the last 16 weeks. The map fills in after your next import."

         It has no `needsWarning`, no `showsSkeleton`, no `recoveryLabel`, and no outcome row (one source, nothing to report).
      2. `ResolveImportStatus(User, HeatmapWindow)`: `max('updated_at')` over the owner's activities, plus the window `count()` via `onDaysBetween`. **Until TASK-03 drops the column, keep `where('source', ActivitySource::GarminCsv)` and leave a `/* … */` block that TASK-03 removes**, because Strava rows still exist before the migration. Keep the existing block comment on why `updated_at` is read rather than a new column (re-import that writes nothing does not move it).
      3. `config/heatmap.php`: `'display_timezone' => env('HEATMAP_DISPLAY_TIMEZONE', 'Europe/Rome')` with its doc block, and extend the `@var array{…}` shape. It is a deployment choice, so env is correct per `.ai/rules/config.md`.
      4. `DashboardController`: inject `ResolveImportStatus`. When `$oldestRun === null`, return `view('dashboard-empty', ['status' => …])`, rendered rather than redirected (a redirect would loop), and drop the `strava_athlete_id` check. Read the status fresh every request, never cached (keep the block comment). Remove the skeleton branch.
      5. `dashboard-empty.blade.php` extends `layouts.app` and mirrors the card of `states.html` "empty":
         - the logo mark
         - "See your training at a glance"
         - "Import a Garmin Connect CSV export to build your 16-week heatmap."
         - one primary `btn` "Import Garmin CSV" → `route('garmin.import.create')`
         - the sign-out form

         It shows the `header-status` chip ("No runs imported yet") and the `footer-status` text. Mobile first: full-width button at 375 px, 44 px tap target.
      6. `dashboard.blade.php`:
         - chip and detail via the renamed components; no `sync-warning`; no skeleton branches
         - rail `aria-label="Legend, weekly trend and import detail"`
         - the bottom line loses "Runs missing from Strava?" and becomes "Import Garmin CSV · Sign out" (Marika: terse, no motivational copy)
      7. `import-detail`: rows "Last import" (absolute + relative) and "Runs in window".
      8. `.env.example`: add `HEATMAP_DISPLAY_TIMEZONE=Europe/Rome` next to the heatmap keys. The `STRAVA_*` keys leave in TASK-02.
      9. Tests (NORMAL):
         - chip/footer copy for: no runs, a run imported 3 days ago, and a re-import that writes nothing (time unchanged)
         - absolute stamp in `display_timezone` (`Config::set`)
         - no warning markup (`role="alert"`) in any state
         - empty state: the "Import Garmin CSV" link only, no "Strava" text, signed-out → `/login`
         - viewing writes no row
      10. `php artisan test`, `vendor/bin/pint --dirty --format agent`.

      ## Completion Criteria
      - [ ] Status line reads "last import N ago" from the newest imported run; "No runs imported yet" with none; a no-op re-import does not move it
      - [ ] No stale / failed / reconnect / first-sync state exists in code or views
      - [ ] Owner with no runs sees the Garmin-only empty state; the dashboard keeps the "Import Garmin CSV" entry point
      - [ ] UI usable at 375 / 768 / 1280 px, light and dark (manual smoke OK under NORMAL)
      - [ ] Mockup deviation logged and listed in the mockup README
      - [ ] Tests pass

      ## Test Data
      - N/A — no model/schema changes in this task (factories already have `garminImported()` runs)

      ## Domain Docs
      - [ ] `.larapilot/docs/devs/heatmap-dashboard.md` rewritten for the import status, the empty state, and `display_timezone`. Under Architectural choices, record why there is no warning state (nothing runs in the background) and why `updated_at` is read rather than an import log.
      - [ ] Folder `README.md` index row updated
      - [ ] English, committed with this task

      ## Git Deliverables
      - Commit: `feat(US-021): TASK-01 Garmin-only import status and empty state`
      - Push: **skip** (`git_mode: GITFLOW`)
      - PR: update the local PR notes toward `release/3.0.0`; remote only if the user asks
