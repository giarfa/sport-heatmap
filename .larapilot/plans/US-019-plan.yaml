    id: TASK-03
    title: 'POST /logout and the Sign out control on the dashboard'
    body: |-
      ## Description
      Fix: add a CSRF-protected `POST /logout` (named `logout`) that ends the session and keeps the Strava tokens, and a "Sign out" control on the signed-in dashboard (AC 1, 2, 4).

      ## Files Involved
      - app/Http/Controllers/SignOutController.php (new)
      - routes/web.php
      - resources/views/dashboard.blade.php
      - README.md
      - CHANGELOG.md
      - .larapilot/docs/devs/strava-connection.md
      - .larapilot/docs/devs/heatmap-dashboard.md
      - .larapilot/docs/devs/README.md

      ## Mirrors
      - `.larapilot/mockups/US-014/index.html`: the "ways in" text line under the map. The control is added with the same link idiom (Tailwind design system, `--accent` token, `min-h-11`). There is no new mockup and nothing deviates from it

      ## Steps
      1. `php artisan make:controller SignOutController --invokable --no-interaction`. `__invoke(Request $request): RedirectResponse` calls `Auth::logout()`, `$request->session()->invalidate()`, `$request->session()->regenerateToken()`, then `return redirect()->route('dashboard');`. Add a PHPDoc on why it is idempotent (a guest gets a fresh session and the dashboard) and why it never touches the Strava token columns (sign-out is not deauthorisation, FR-012; the nightly sync runs on them)
      2. `routes/web.php`: `Route::post('/logout', SignOutController::class)->name('logout');` outside the Strava and Garmin groups. Add a block comment: POST only, so a cross-site link or prefetch can't sign the owner out; CSRF comes from the `web` group; no `auth` middleware, because no `login` route exists and a guest would get a 500; no `strava.fresh`, because signing out must not reach Strava; no throttle, because the route does no work
      3. `dashboard.blade.php`: in the signed-in `@else` branch of the ways-in line, after the Import Garmin CSV link, add `<span aria-hidden="true">·</span>` and `<form method="POST" action="{{ route('logout') }}" class="inline">@csrf<button type="submit" class="inline-flex min-h-11 items-center underline underline-offset-2" style="color: var(--accent);">Sign out</button></form>`. Update the Blade comment above the line to say a signed-in owner also gets Sign out there, for the same header-width reason
      4. Mobile-first smoke check at 375, 768, and 1280 px, light and dark: the line wraps without horizontal scroll, the button keeps its 44 px target and a visible focus ring, and Tab reaches it after Import Garmin CSV
      5. `README.md` › "Signing in": add that a signed-in owner signs out with **Sign out** under the map, that no remember-me cookie is set so a session lasts `SESSION_LIFETIME` minutes, that signing out keeps the Strava connection and the nightly sync, and that after upgrading to 2.0.2 one sign-out revokes any older remember-me cookie. Fix the line near 263 ("from the discreet … line under the map") so it doesn't contradict this
      6. `CHANGELOG.md` `[Unreleased] › Security`: "The owner can sign out from the dashboard; signing out keeps the Strava connection and the nightly sync (US-019)."
      7. `php artisan test --compact tests/Feature/Strava tests/Feature/Dashboard tests/Feature/Routing` and `vendor/bin/pint --dirty --format agent`

      ## Completion Criteria
      - [x] `POST /logout` (`route('logout')`) logs out, invalidates the session, regenerates the CSRF token, and redirects to `dashboard`; no `GET` route
      - [x] Guests posting to it get the dashboard with no error
      - [x] Strava token columns untouched by sign-out
      - [x] Sign out control rendered only for a signed-in owner, as a native form button, keyboard reachable, 44 px, both themes
      - [x] UI usable at mobile/tablet/desktop (manual smoke under NORMAL)
      - [x] README and CHANGELOG updated
      - [x] Tests pass

      ## Test Data
      - N/A — no model/schema change

      ## Domain Docs
      - [x] `.larapilot/docs/devs/strava-connection.md`:
        - Functional flow gets a sign-out step: POST, CSRF, idempotent for guests, tokens kept, sync unaffected.
        - Technical design table gets a `SignOutController` + `logout` route row.
        - Architectural choices gets rows for POST-only with no `auth` middleware (rejected: `auth` → missing `login` route) and no `strava.fresh` on sign-out (rejected: sign-out depending on Strava).
        - Key decisions: sign-out ≠ deauthorisation (FR-012).
      - [x] `.larapilot/docs/devs/heatmap-dashboard.md`: the ways-in line description (~line 156) gets "· Sign out" for a signed-in owner, as a form button with the reason; the matching Architectural choices row is updated
      - [x] Folder `README.md` index rows: last updated by US-019
      - [x] English, committed with this task

      ## Git Deliverables
