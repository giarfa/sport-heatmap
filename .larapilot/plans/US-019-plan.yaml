    body: |-
      ## Description
      Close the spec: the full suite and quality gate are green, no remember-me wording is left anywhere, and the Oliver re-test handoff is written (AC 6, 8).

      ## Files Involved
      - .env.example (only if a remember-me mention is found)
      - README.md (only if a remember-me mention is found)

      ## Steps
      1. `grep -rni 'remember' .env.example README.md app routes resources .larapilot/docs/devs`. The only acceptable hits are `remember_token` in `User::$hidden`, the cache/plan "remember" helpers, and the doc text that describes the pre-2.0.2 recallers. Fix any other hit. The `SESSION_SECURE_COOKIE` comment should already say "the sign-in cookies" (US-017)
      2. `php artisan test --compact` (full suite)
      3. `php artisan larapilot:quality` (Pint + Larastan level 5). Fix findings in the file's own task scope
      4. Write the manual test handoff for Oliver into the PR notes:
         - Sign in, copy the session cookie, sign out, replay the cookie → guest.
         - DevTools shows no `remember_web_*` cookie after sign-in.
         - A browser holding a pre-2.0.2 recaller: sign out once, then confirm it doesn't sign back in.
         - At 375 px, both themes: "Sign out" is reachable and 44 px.

      ## Completion Criteria
      - [x] Full suite green
      - [x] Quality gate green
      - [x] No stale remember-me wording in `.env.example`, README, code comments, or domain docs
      - [x] Oliver re-test handoff in the PR notes

      ## Test Data
      - N/A — no model/schema change

      ## Domain Docs
      - [x] N/A unless step 1 finds stale wording in `.larapilot/docs/devs/`; then that file is corrected in this task

      ## Git Deliverables
      - Commit: `chore(US-019): TASK-05 verify suite, quality gate and remember-me wording` (only if step 1 or 3 changed a file; otherwise no commit)
      - Push: **skip** (`git_mode: GITFLOW`)
      - PR: update local PR notes with the handoff
