    id: TASK-01
    title: 'Sign in without a remember-me cookie'
    body: |-
      ## Description
      Fix: the Strava callback stops issuing a ~400-day `remember_web_*` cookie, so a session ends with the session lifetime or on sign-out (AC 3).

      ## Files Involved
      - app/Http/Controllers/Strava/StravaCallbackController.php
      - app/Http/Middleware/EnsureFreshStravaToken.php (comments only)
      - .larapilot/docs/devs/strava-connection.md
      - .larapilot/docs/devs/README.md
      - CHANGELOG.md

      ## Steps
      1. `StravaCallbackController` line 124: `Auth::login($user)`. Add to the block comment above it why there is no `remember`: `SESSION_LIFETIME` is the only bound on a signed-in device, a recaller outlives it by about 400 days and signs a lost or shared device back in, and the nightly sync runs on the stored tokens and needs no session. Keep the fixation comment and the literal `route('dashboard')` redirect unchanged
      2. `EnsureFreshStravaToken`: reword the allowlist comment ("the session plus the remember-me cookie it mints") and the `endSession()` PHPDoc. The app no longer mints a recaller; `Auth::logout()` still drops one a browser kept from before 2.0.2, so the teardown code stays as it is
      3. `CHANGELOG.md` `[Unreleased] › Security`: "Signing in no longer sets a year-long remember-me cookie; a session now ends with the session lifetime (US-019)."
      4. `php artisan test --compact tests/Feature/Strava` and `vendor/bin/pint --dirty --format agent`

      ## Completion Criteria
      - [x] `Auth::login` is called without `remember`; no other change to the callback's gate order, fixation, or redirect
      - [x] Middleware comments describe the post-fix behavior; `endSession()` code unchanged
      - [x] CHANGELOG entry added
      - [x] Strava suite green

      ## Test Data
      - N/A — no model/schema change; `remember_token` stays in the schema, unused

      ## Domain Docs
      - [x] `.larapilot/docs/devs/strava-connection.md`: the functional flow step that says `Auth::login($user, remember: true)` becomes `Auth::login($user)`. The middleware step and the "Allowlist re-checked on every authenticated request" row no longer claim the app mints a remember-me cookie. Add an Architectural choices row "No remember-me cookie — session lifetime is the bound", with "`remember: true` (US-002)" as the rejected alternative and why. Add a gotcha: recallers issued before 2.0.2 stay valid until one sign-out cycles `remember_token`
      - [x] Folder `README.md` index row: last updated by US-019
      - [x] English, committed with this task

      ## Git Deliverables
      - Commit: `fix(US-019): TASK-01 sign in without a remember-me cookie`. The body names the root cause: `Auth::login($user, remember: true)` from US-002 issued a recaller with Laravel's default ~400-day lifetime, which outlived the 120-minute session
      - Push: **skip** (`git_mode: GITFLOW`)
      - PR: update local PR notes
