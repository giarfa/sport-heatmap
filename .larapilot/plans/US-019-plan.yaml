code: US-019
plan_body: |-
  **Release:** 2.0.2

  ## Technical Solution

  One Low finding from the v2.0.0 assessment (OWASP A07, `.larapilot/docs/security/red-team-v2.0.0.md` → "There is no sign-out, and a remember-me cookie is always issued"), fixed as two separate changes on one branch. Traces to FR-001 and Technical Architecture › Security (Lars) › Sign-out.

  **Root cause:** US-002 signed the owner in with `Auth::login($user, remember: true)` (`app/Http/Controllers/Strava/StravaCallbackController.php:124`) and added no route that ends a session. The `remember_web_*` recaller uses Laravel's default lifetime (about 400 days) and signs a device back in after the 120-minute session expires, so the session lifetime never bounded access.

  ### 1. No remember-me cookie on sign-in
  - `StravaCallbackController`: `Auth::login($user)`, with no `remember`. Add a block comment on why: the session lifetime (`SESSION_LIFETIME=120`) is the only bound; a recaller would outlive it by a year; the nightly sync needs no session. The existing fixation comment (`Auth::login` migrates the session id) and the literal `route('dashboard')` redirect (no `intended()`) stay as they are.
  - `app/Http/Middleware/EnsureFreshStravaToken.php`: keep `endSession()` exactly as it is, but reword the two comments that say sign-in *mints* a remember-me cookie. After this fix the app never issues one; `Auth::logout()` still drops one a browser kept from before 2.0.2, which is why the teardown does not change.
  - **Cookies issued before 2.0.2:** browsers that already hold a recaller keep signing in until it is revoked. `SessionGuard::logout()` cycles `users.remember_token` when it is set, so **one sign-out on any device revokes every older recaller**. This goes in the domain doc and in the Oliver re-test handoff ("after deploy, sign out once"). No migration and no forced token wipe: `remember_token` stays in the schema, unused (AC).

  ### 2. Sign-out
  - New single-action controller `app/Http/Controllers/SignOutController.php` (`php artisan make:controller SignOutController --invokable --no-interaction`). It sits flat beside `DashboardController` and not under `Strava/`, because the session belongs to the app, not to the integration (`.ai/rules/app.md`). `__invoke(Request $request): RedirectResponse` calls `Auth::logout()`, `$request->session()->invalidate()`, `$request->session()->regenerateToken()`, then `redirect()->route('dashboard')`. These are the same three teardown calls `EnsureFreshStravaToken::endSession()` makes; the controller doesn't share them through a helper, because two three-line call sites aren't worth a new class.
  - `routes/web.php`: `Route::post('/logout', SignOutController::class)->name('logout');`, with a block comment on what each choice avoids:
    - **POST only** (AC). A `GET /logout` answers 405, so a link, a prefetch, or an `<img>` on another site can't sign the owner out.
    - **CSRF** comes from the `web` group, so a request with no token answers 419.
    - **No `auth` middleware.** A guest would be redirected to `route('login')`, which doesn't exist, and the result is a 500. Signing out is idempotent instead, so a guest who posts gets a fresh session and the dashboard with no error (AC).
    - **No `strava.fresh`.** Signing out must not refresh a Strava token or depend on Strava being reachable.
    - **No throttle.** The route does no work beyond what any web request costs.
  - **Strava tokens are kept.** `Auth::logout()` touches only the session and `remember_token`. `strava_access_token`, `strava_refresh_token` and `strava_token_expires_at` stay, so `strava:sync` (FR-002) still runs for the athlete (AC). Sign-out is not deauthorisation, which is FR-012.

  ### 3. Sign-out control on the dashboard
  - `resources/views/dashboard.blade.php`: in the `@else` (signed-in) branch of the "ways in" text line under the map, after "Import Garmin CSV", add ` · ` (`aria-hidden` separator, same as the guest branch) and `<form method="POST" action="{{ route('logout') }}" class="inline">@csrf<button type="submit" class="inline-flex min-h-11 items-center underline underline-offset-2" style="color: var(--accent);">Sign out</button></form>`. A native `<button>` is keyboard reachable and announced as a button; the 44 px target (`min-h-11`), the accent token, and both themes come from the existing link idiom. Guests don't get it. Update the Blade comment above the line.
  - **Placement:** the text line, not the header. The layout comment already records that the 375 px header has no width for a second control and that there is no nav. Copy (Marika, terse register): "Sign out". The control ends the session, so the label is a verb. No confirmation dialog and no flash notice: the reloaded page shows "Owner? Connect with Strava", which tells the owner they are signed out.
  - **Design:** this is no new screen, so there is no new mockup. The line mirrors the latest dashboard mockup `.larapilot/mockups/US-014/index.html` (ways-in line) and adds one control built from the same link idiom (Tailwind tokens, `heatmap-dashboard` design system). This addition is required by the AC; it is not a deviation.

  ### Out of scope
  - Strava deauthorisation (FR-012), token deletion, a "sign out of all devices" control, a custom session lifetime, and a header/nav redesign. No schema change, no new dependency.
  - `.env.example`: US-017 (already merged into `release/2.0.2`) reworded the `SESSION_SECURE_COOKIE` comment to "the sign-in cookies", and the README env table already says the same. This spec **verifies** that no remember-me mention is left (TASK-05) and edits the file only if one is found.

  ## Git & Branching
  - Mode: GITFLOW (no automatic push)
  - Release: 2.0.2. TASK-00 runs `php artisan larapilot:release-feature --semver=2.0.2 --spec=US-019 --slug=sign-out-no-remember-me`, which creates `feature/US-019-sign-out-no-remember-me` from `release/2.0.2`
  - **Before TASK-00:** the working tree is on `feature/US-018-garmin-review-throttle-and-headers`, with uncommitted Larapilot artifacts (backlog, decisions, US-018 spec, usage ledger, the plan lock). Commit them on the US-018 branch first, or `release-feature` refuses to check out (`checked_out: false`)
  - US-018 is in REVIEW and not yet merged into `release/2.0.2`. Both specs touch `routes/web.php` and `CHANGELOG.md` `[Unreleased] › Security`. Whichever merges second runs `php artisan larapilot:release-sync --semver=2.0.2` or resolves the conflict (Sarah). The two hunks are independent
  - Per task: one Conventional Commit `type(US-019): TASK-NN …`; the fix commits (TASK-01, TASK-03) name the root cause in the body
  - PR toward `release/2.0.2` (not `develop`), prepared locally; push and remote PR only if the user asks
  - Merge into `release/2.0.2` after `larapilot-review` approval

  ## Test Data Strategy
  - No model, migration, or relationship change. `remember_token` stays unused, so `UserFactory`, `ActivityFactory`, `SyncRunFactory`, and the seeders are unchanged (AC: factory/seeder not applicable)
  - Tests sign the owner in with `allowlistedAthlete()` from `Tests\TestCase` (`.ai/rules/tests.md`), never a bare factory user, so `strava.fresh` keeps exercising the allowlist
  - Sync-after-sign-out uses the existing Strava HTTP fakes with `Http::preventStrayRequests()` in `setUp()`

  ## Test Strategy
  - Bar: NORMAL. PHPUnit feature tests, no browser/Dusk/E2E
  - **Remember cookie (TASK-02):** in `StravaConnectFlowTest`, a successful callback response carries no cookie named `Auth::guard()->getRecallerName()` (`remember_web_*`), and the `users.remember_token` of the athlete stays null. This fails on the current code. The existing fixation (session id changes) and literal-dashboard-redirect tests stay green
  - **Sign-out (TASK-04):** new `tests/Feature/Strava/SignOutTest.php` (`php artisan make:test --phpunit SignOutTest`, moved under `Strava/` beside the connect tests):
    - `POST /logout` signed in ends the session (`assertGuest`), redirects to `dashboard`, changes the session id and the CSRF token, and the next `GET /` renders as a guest ("Connect with Strava" shown, "Sign out" not)
    - `GET /logout` → 405
    - with no CSRF token → 419. Tests skip CSRF (`PreventRequestForgery::runningUnitTests()`), so this test binds an anonymous subclass of `Illuminate\Foundation\Http\Middleware\PreventRequestForgery` that returns `false` there, and sends no `Sec-Fetch-Site` header (`hasValidOrigin` would let a same-origin request through)
    - a guest posting → redirect to `dashboard`, no exception
    - after sign-out the athlete's Strava token columns are unchanged and `strava:sync` completes a successful `SyncRun` for that athlete against the faked API
    - a signed-in owner who held a pre-fix recaller has `remember_token` cycled by the sign-out
  - **Control (TASK-04):** in `tests/Feature/Dashboard/PublicDashboardTest.php` (or `SignOutTest`): signed in, `GET /` renders a form with `action` = `route('logout')`, method POST, a `_token` field, and a "Sign out" button; as a guest, neither
  - Regression: `tests/Feature/Strava`, `tests/Feature/Dashboard`, `tests/Feature/Routing` stay green, then the full suite
  - **Manual test handoff (Oliver re-test):** sign in, copy the session cookie, sign out, replay the old cookie → guest. Sign in and check DevTools for no `remember_web_*` cookie. On a browser that holds a pre-2.0.2 recaller, sign out once and confirm it no longer signs back in. At 375 px the ways-in line wraps cleanly and "Sign out" stays a 44 px target in both themes
