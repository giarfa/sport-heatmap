    id: TASK-05
    title: 'Cache the assembled grid and invalidate it on sync'
    body: |-
      ## Description
      Cache the assembled grid per the PRD, keyed so the midnight rollover invalidates itself, and forget it
      when a sync succeeds.

      ## Files Involved
      - app/Http/Controllers/DashboardController.php
      - app/Support/Heatmap/HeatmapGridCache.php
      - app/Console/Commands/SyncStravaActivities.php
      - config/heatmap.php

      ## Steps
      1. `php artisan make:class Support/Heatmap/HeatmapGridCache` — owns the key and the TTL so the
         controller and the sync command cannot drift apart on the format. Key:
         `heatmap:grid:{userId}:{windowStart}:{today}`
      2. Add the block comment `.ai/rules/app.md` requires, stating the failure mode the date in the key
         avoids: the grid changes at the calendar-day rollover, not only when a sync runs. Keying on the
         window alone would let yesterday's cached grid survive midnight and render today as a future cell —
         stale data presented as current, which the PRD names as the one fatal failure mode
      3. Controller resolves through the cache: hit returns the `HeatmapGrid`, miss builds and stores it. TTL
         from `config('heatmap.grid_cache_ttl')` — a literal in `config/heatmap.php` alongside
         `window_weeks`, **not** an `env()` lookup, per `.ai/rules/config.md`
      4. `SyncStravaActivities` forgets the current athlete's key after a successful run, so a mid-day sync is
         visible immediately. A failed run leaves the cache alone — there is nothing new to show
      5. `php artisan larapilot:quality --fix`

      ## Completion Criteria
      - [x] A second dashboard request in the same day does not re-run the aggregate query
      - [x] A successful sync makes the next request rebuild the grid
      - [x] A cached grid does not survive into the next calendar day
      - [x] A failed sync does not clear the cache
      - [x] TTL is a literal in `config/heatmap.php`, read via `config()`, never `env()` from app code
      - [x] `php artisan larapilot:quality` passes

      ## Test Data
      - N/A — no model or schema changes in this task

