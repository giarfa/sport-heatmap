    id: TASK-01
    title: 'Daily distance query, grid DTOs and the heatmap builder'
    body: |-
      ## Description
      Build the read path and the grid model: one athlete-scoped aggregate query, a pure builder, and the
      readonly DTOs that carry the numbers, the formatting and the accessible names.

      ## Files Involved
      - app/Enums/DayCellState.php
      - app/Data/Heatmap/DayCell.php
      - app/Data/Heatmap/WeekRow.php
      - app/Data/Heatmap/HeatmapGrid.php
      - app/Support/Heatmap/DailyRunningDistance.php
      - app/Support/Heatmap/HeatmapBuilder.php

      ## Steps
      1. `php artisan make:enum DayCellState` — cases `Rest`, `Ran`, `Future` (TitleCase keys). These are the
         three treatments the spec requires be mutually distinguishable; a boolean pair would let a future
         rest day exist, which is not a thing
      2. `php artisan make:class Support/Heatmap/DailyRunningDistance` — invokable,
         `__invoke(User $athlete, HeatmapWindow $window): array<string, int>` keyed `Y-m-d` => summed metres.
         One `selectRaw('activity_date, SUM(distance_meters) as meters')->groupBy('activity_date')` bounded by
         `whereBetween('activity_date', [...])` on the `activities()` relation. Never loop and query per day —
         112 queries where one belongs
      3. `php artisan make:class Data/Heatmap/DayCell` — `final readonly`, promoted constructor
         (`CarbonImmutable $date`, `int $distanceMeters`, `DayCellState $state`). Methods:
         - `kilometres(): string` — `number_format($this->distanceMeters / 1000, 1)`
         - `accessibleName(): string` — `"Tuesday 19 May 2026: 8.2 km"` / `"Monday 18 May 2026: rest day,
           0 km"` / `"Sunday 6 Sep 2026: not yet"`
         - `pointerTitle(): string` — `"Tuesday 19 May 2026 — 8.2 km"` / `"... — rest"`; future cells have none
      4. `php artisan make:class Data/Heatmap/WeekRow` — `final readonly` (`CarbonImmutable $weekStart`,
         `array<int, DayCell> $days`, `int $totalMeters`, `bool $isPartial`, `bool $isCurrent`), with
         `kilometres()` and `weekLabel()` (`"18 May"`). Assert seven days in the constructor
      5. `php artisan make:class Data/Heatmap/HeatmapGrid` — `final readonly` (`array<int, WeekRow> $weeks`,
         `CarbonImmutable $startsOn`, `CarbonImmutable $endsOn`) plus `label()` -> `"18 May – 6 Sep 2026"`
      6. `php artisan make:class Support/Heatmap/HeatmapBuilder` — invokable,
         `__invoke(HeatmapWindow $window, array $dailyMeters, CarbonInterface $today): HeatmapGrid`. Walk the
         window week by week from `startsOn`, seven days per row, oldest first. A day after `$today` is
         `Future` with 0 metres and is excluded from the week total; a day at or before `$today` with no entry
         is `Rest`; otherwise `Ran`. A row containing at least one `Future` cell is `isPartial` and
         `isCurrent`
      7. Add the block comment `.ai/rules/app.md` requires above the future-day branch: the builder takes
         `$today` as an argument rather than reading the clock so every date rule is testable by naming a
         date, not by travelling time
      8. Full `@property`/`@param`/`@return` docblocks with array-shape types — Larastan runs at level 5 with
         no IDE helper, so the docblock is the only type source
      9. `php artisan larapilot:quality --fix`

      ## Completion Criteria
      - [x] `DailyRunningDistance` returns summed metres per date for one athlete inside the window, in a
            single query
      - [x] `HeatmapBuilder` returns exactly 16 `WeekRow`s of exactly 7 `DayCell`s, oldest week first
      - [x] Future days in the current week are `DayCellState::Future` and are excluded from the week total
      - [x] `kilometres()` renders one decimal; `accessibleName()` returns the three exact mockup strings
      - [x] `php artisan larapilot:quality` passes (Pint + Larastan level 5)

      ## Test Data
      - N/A — no migration, model or schema change; existing `Activity`/`User` factories are sufficient

      ## Git Deliverables
      - Commit: `feat(US-004): TASK-01 assemble the heatmap grid from daily running distance`
      - Push: **skip** (`git_mode: GITFLOW`)
      - PR: update the local PR notes
