  -
    id: TASK-03
    title: 'Heatmap geometry CSS, persisted theme and Strava attribution (parallel with TASK-01)'
    body: |-
      ## Description
      Lay the visual foundation: heatmap geometry CSS, the three cell treatments, the dashboard/rail layout,
      the persisted light-dark theme, and the Strava attribution in the layout footer.

      ## Files Involved
      - resources/css/app.css
      - resources/views/layouts/app.blade.php

      ## Steps
      1. **Tokens.** Add `--lv-0`, `--lv-future-border`, `--cell-ring` and the provisional `--lv-run` to both
         palettes, using the exact hexes from the mockup README:
         - light: `--lv-0:#e2e8f0`, `--lv-run:#3987e5`, `--lv-future-border:#cbd5e1`,
           `--cell-ring:rgba(15,23,42,0.08)`
         - dark: `--lv-0:#1e293b`, `--lv-run:#2a78d6`, `--lv-future-border:#334155`,
           `--cell-ring:rgba(248,250,252,0.10)`
         Replace the standing "do not add ramp levels ahead of US-005" comment with one that says level 0 and
         the future border are here now, `--lv-run` is provisional, and `--lv-1` .. `--lv-4` still belong to
         US-005. **Do not re-tune any hex by eye** — the ramp was validated against these card surfaces and
         the mockup README records the validator commands
      2. **Theme selectors.** Move the dark palette out of the bare `@media (prefers-color-scheme: dark)`
         block into two selectors carrying the same tokens: `html.dark`, and
         `@media (prefers-color-scheme: dark) { html:not(.light) { ... } }`. Add the block comment stating
         why both exist: the class lets an explicit choice persist, the media query keeps a JS-disabled
         visitor on their OS preference
      3. **Geometry.** Add the heatmap CSS verbatim from the mockup README — `.hm` with
         `table-layout:fixed; border-collapse:separate; border-spacing:0`, `<colgroup>` widths 13% / 9.5% /
         20.5%, `.hm-td { padding:2px }`, `.hm-cell` as a square `aspect-ratio:1/1` block with the inset ring,
         `.hm-th-week`, `.hm-th-day`, `.hm-th-total`, `.hm-total`, `.hm-total-num`, `.hm-total-unit`,
         `.hm-partial`, `.hm-row-current`, plus the 480 px and 1024 px steps. Carry over the README's warning
         as a comment: **never reintroduce `border-spacing`** — it is added on top of `width:100%` and pushes
         Sunday and the total column off a 375 px viewport
      4. **Cell states.** `.hm-cell--rest { background: var(--lv-0) }`,
         `.hm-cell--ran { background: var(--lv-run) }`,
         `.hm-cell--future { background: transparent; box-shadow: none; border: 1px dashed
         var(--lv-future-border) }`. Three treatments, mutually distinct in both themes
      5. **Layout.** `.dash` (single-column grid, `gap:1rem`), `.dash-grid { max-width:34rem; margin-inline:
         auto }`, `.rail`, and the 1024 px rule switching `.dash` to
         `grid-template-columns: minmax(0,34rem) minmax(0,1fr)` with `.dash-grid` losing its centring. The
         34 rem cap is load-bearing — without it cells inflate to ~90 px at desktop and the density dies
      6. **Layout header.** Make the header `sticky top-0 z-10`. Add the theme toggle to the right of the
         header: `type="button"`, `data-theme-toggle`, `aria-pressed`, `h-11 w-11` (44 x 44 px), an
         `sr-only` "Toggle dark mode" label and the `aria-hidden` moon icon from the mockup. Leave room in the
         same flex row for the sync chip US-006 adds
      7. **No-flash script.** Inline in `<head>`, before the stylesheet: read `localStorage.theme`; apply
         `dark` or `light` to `documentElement`; if unset, leave both off so the media query decides. Then a
         small `resources/js/app.js` handler for the toggle click that flips the class, writes
         `localStorage.theme` and syncs `aria-pressed`. The head script must be inline — deferring it to the
         bundle is what causes the light flash on a dark-theme reload
      8. **Footer.** Replace the placeholder line with the attribution: a link to `https://www.strava.com`
         reading "Powered by Strava", then `· runs only · distances in kilometres`. This is contractual under
         the Strava API Agreement (FR-008), not decoration — it stays in the layout so no view change can drop
         it
      9. `npm run build`, then smoke-check the existing screens at 375, 768 and 1280 px in both themes
      10. `php artisan larapilot:quality --fix`

