    id: TASK-06
    title: 'Feature tests for the rendered dashboard, caching and isolation'
    body: |-
      ## Description
      Feature-test the rendered dashboard, the cache behaviour and the athlete isolation, and write the manual
      handoff for the responsive and theme criteria automation cannot reach at this bar.

      ## Files Involved
      - tests/Feature/Dashboard/HeatmapGridTest.php
      - tests/Feature/Dashboard/HeatmapGridCacheTest.php
      - tests/Feature/Dashboard/ConnectScreenTest.php (adjust if the layout change broke an assertion)
      - .larapilot/docs/test-results/US-004-manual.md

      ## Steps
      1. `php artisan make:test --phpunit HeatmapGridTest`. `Http::preventStrayRequests()` in `setUp()`;
         sign in through `allowlistedAthlete()` — a user straight from the factory silently stops exercising
         the allowlist guard
      2. Build the window with `Activity::factory()->for($athlete)->onDate($date)` on named dates rather than
         seeding, so no assertion depends on the seeder's random draws
      3. Assert, one named test each:
         - the response contains 112 day cells and 16 week totals
         - a known day's distance renders in kilometres to one decimal
         - a known rest day renders `"rest day, 0 km"` in its accessible name
         - a future day in the current week renders `"not yet"` and the dashed treatment
         - the current week's total is marked partial; a completed week's is not
         - `<caption class="sr-only">`, `scope="col"` and `scope="row"` are present
         - the skip link and "Powered by Strava" are present
         - **neither `mi` nor `miles` appears anywhere in the response**
         - another athlete's activities in the same window do not appear in this athlete's grid
         - an athlete with no activities renders the full grid of rest and future cells, not a blank page
      4. `HeatmapGridCacheTest`: a second request in the same day serves the cached grid; a successful sync
         forgets it; a different calendar day produces a different key
      5. Re-run the existing dashboard tests — `ConnectScreenTest` asserts layout invariants US-004 touches
         (the footer line and the header). Fix any assertion the layout change legitimately invalidated;
         do not weaken one to make it pass
      6. Verify the demo dataset still exercises the screen: `php artisan migrate:fresh --seed` then load the
         dashboard. If the seeded current week never leaves a future day or a rest day, adjust
         `TrainingBlockSeeder` **in this task** and record it under `## Test Data` below
      7. Write `.larapilot/docs/test-results/US-004-manual.md` with the checks the `NORMAL` bar does not
         automate: no horizontal scroll at 320 / 375 / 768 / 1024 / 1280 px; cells do not inflate past the
         34 rem cap; the rail appears at >= 1024 px; first visit follows the OS theme; the toggle persists
         across a reload with no flash; focus outlines visible on the toggle and the skip link; the toggle is
         44 x 44 px
      8. `php artisan test --compact` (full suite) and `php artisan larapilot:quality`
      9. Do **not** add Playwright, Dusk, Pest browser or viewport suites — `settings.testing` is `NORMAL`

      ## Completion Criteria
      - [x] Every assertion above is a passing named test
      - [x] Athlete isolation and the empty-window case are covered
      - [x] Cache hit, sync invalidation and day-rollover keying are covered
      - [x] The full suite passes; no pre-existing test was weakened to accommodate the layout change
      - [x] `.larapilot/docs/test-results/US-004-manual.md` lists the responsive and theme checks for the
            reviewer
      - [x] `php artisan larapilot:quality` passes

      ## Test Data
      - Existing `Activity`/`User` factories are used directly; no new factory is introduced
      - [x] `TrainingBlockSeeder` adjusted **only if** step 6 shows the seeded current week fails to produce a
            future day or a rest day — otherwise `N/A`

