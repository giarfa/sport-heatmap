code: US-004
plan_body: |-
  ## Technical Solution

  US-004 turns the 112-day window US-003 already reconciles into the screen the product exists for: a
  16 x 7 `<table>` of daily running distance with a trailing weekly-total column, mobile-first, in both
  themes. It ships the **geometry, the semantics and the numbers**. It deliberately does **not** ship the
  intensity ramp (US-005) or the sync status surface (US-006).

  ### The seam, end to end

  ```
  HeatmapWindow::current()          (US-003, already on the branch)
    -> DailyRunningDistance         one grouped aggregate query, athlete-scoped
    -> HeatmapBuilder               pure: daily totals + window + today -> HeatmapGrid
    -> HeatmapGrid / WeekRow / DayCell   readonly DTOs, formatting and accessible names live here
    -> <x-heatmap-grid>             Blade renders; no logic, no arithmetic
  ```

  **John:** the builder is pure and takes `today` as an argument rather than reading the clock, because
  every interesting case in this spec — the partial current week, future cells, a window crossing a month
  or a year boundary — is a statement about a specific date. A builder that calls `now()` internally can
  only be tested by travelling time; one that accepts the date can be tested by naming it.

  **Mike:** one query serves the whole grid:

  ```php
  $athlete->activities()
      ->whereBetween('activity_date', [$window->startsOn, $window->endsOn])
      ->selectRaw('activity_date, SUM(distance_meters) as meters')
      ->groupBy('activity_date')
  ```

  It rides the `(user_id, activity_date)` index US-001 created. ~100 rows collapse to at most 112 pairs.
  There is no `daily_mileage` table and none is added — the PRD rejects one explicitly. Days with no run
  never appear in the result set; the builder materialises them as rest days, which is why the query
  returning fewer than 112 rows is the normal case and not a bug.

  ### Classes

  | Class | Responsibility |
  | --- | --- |
  | `app/Support/Heatmap/DailyRunningDistance.php` | Invokable. `__invoke(User $athlete, HeatmapWindow $window): array<string,int>` keyed `Y-m-d` => metres |
  | `app/Support/Heatmap/HeatmapBuilder.php` | Invokable. Pure assembly of `HeatmapGrid` from totals + window + today. No DB, no clock |
  | `app/Data/Heatmap/HeatmapGrid.php` | `final readonly`. `weeks: array<int, WeekRow>`, `startsOn`, `endsOn`; `label()` for the "18 May - 6 Sep 2026" subtitle |
  | `app/Data/Heatmap/WeekRow.php` | `final readonly`. `weekStart`, `days: array<int, DayCell>` (7, Monday first), `totalMeters`, `isPartial`, `isCurrent`; `kilometres()`, `weekLabel()` |
  | `app/Data/Heatmap/DayCell.php` | `final readonly`. `date`, `distanceMeters`, `state`; `kilometres()`, `accessibleName()`, `pointerTitle()` |
  | `app/Enums/DayCellState.php` | `Rest` / `Ran` / `Future` — the three treatments the spec requires be visually distinct |

  `app/Data/Heatmap/` and `app/Support/Heatmap/` follow the settled house rule (`.ai/rules/app.md`):
  sub-namespace each layer by the concern it serves, exactly as `Strava/` already does.

  **Formatting lives on the DTO, not in Blade.** `kilometres()` returns `number_format($meters / 1000, 1)`
  and `accessibleName()` returns the exact strings the mockup README fixes:

  - `"Tuesday 19 May 2026: 8.2 km"`
  - `"Monday 18 May 2026: rest day, 0 km"`
  - `"Sunday 6 Sep 2026: not yet"`

  That makes the accessibility contract a unit assertion instead of a template expression nobody can
  test. It is also the only place the string `km` is constructed, which is how the "no miles anywhere"
  criterion stays enforceable.

  ### Controller

  `DashboardController::__invoke()` gains the two collaborators as `__invoke` parameters, per
  `.ai/rules/http.md` (single-action invokable, no constructor injection, no Form Request — there is no
  user input on this route). The signed-out branch is untouched.

  ### Grid caching

  The PRD (`### Performance & Scalability`) specifies the assembled grid is cached and invalidated when a
  sync completes. Implemented as recorded in the decision journal:

  - Key: `heatmap:grid:{userId}:{windowStart}:{today}`.
  - **The calendar day must be in the key.** "Invalidate on sync completion" alone is wrong: with no sync
    between them, yesterday's cached grid would survive midnight and render today's cell as a future
    cell — the grid changes at the day rollover, not only at sync. The date in the key makes the rollover
    self-invalidating and the explicit forget handles the intra-day case.
  - `SyncStravaActivities` forgets the key after a successful run.

  US-005 layers levels onto this same cached grid; **US-006 never caches sync status** — presenting stale
  data as current is the one failure mode the PRD names as fatal to the product.

  ### Front end

  Tailwind 4 via Vite, Blade, no JavaScript framework — per the PRD's recorded topology. The heatmap
  geometry is plain CSS in `resources/css/app.css` (utility classes cannot express `<colgroup>` widths or
  `aspect-ratio` cells cleanly), the page chrome stays Tailwind utilities.

  **Elise — the geometry is a contract, not a suggestion.** From the mockup README:

  ```css
  .hm { width:100%; table-layout:fixed; border-collapse:separate; border-spacing:0; }
  .hm-col-week { width:13%; } .hm-col-day { width:9.5%; } .hm-col-total { width:20.5%; }
  .hm-td { padding:2px; }
  .dash-grid { max-width:34rem; }
  ```

  Gaps come from `td` padding. **Do not reintroduce `border-spacing`** — it is applied on top of
  `width:100%` and pushes Sunday and the whole total column off a 375 px viewport. That was the first
  version of the mockup and it was wrong. The `34rem` cap is equally load-bearing: without it cells
  inflate to ~90 px at desktop and the density that makes a heatmap readable at a glance is gone.
  Desktop gets the side rail, not bigger squares.

  **Joe — theme.** Tokens move out of the bare `@media (prefers-color-scheme: dark)` block into two
  selectors that both carry the dark palette:

  ```css
  html.dark { /* dark tokens */ }
  @media (prefers-color-scheme: dark) { html:not(.light) { /* dark tokens */ } }
  ```

  A no-flash inline script in `<head>` resolves `localStorage.theme` before first paint; the toggle
  writes `dark` or `light` and flips the class. A visitor with JS disabled still gets their OS preference
  from the media query — which is why the media query survives rather than being replaced by the script.

  ### Scope seam with US-005 — read before styling a cell

  US-004 must render three visually distinct treatments (rest / ran / future) but the five-level ramp is
  US-005's, and `resources/css/app.css` carries a standing comment saying so. Therefore:

  - `--lv-0` (rest) and `--lv-future-border` (dashed, transparent) land **now** — the spec requires rest
    and out-of-range to be distinguishable from each other and from a heat level.
  - Every day with a run renders at a single provisional fill, `--lv-run` (`#3987e5` light / `#2a78d6`
    dark — the validated level-2 step, not a new colour).
  - US-005 replaces `--lv-run` with `--lv-1` .. `--lv-4` and swaps the `hm-cell--ran` class for
    `hm-l1` .. `hm-l4`. That is two CSS rules and one Blade expression, and it is deliberately cheap.

  **Do not** add the ramp levels or the legend in this spec, and do not re-tune any hex by eye — the ramp
  was computed and validated against the real card surfaces and the mockup README records the validator
  commands.

  ### Rail

  The `.dash` / `.rail` two-column layout at >= 1024 px is US-004's, because the spec requires it. The two
  cards it holds are placeholders carrying a forward reference — the legend card is US-005, the sync card
  is US-006 — following the same house convention the current `dashboard.blade.php` already uses.

  ### Attribution

  "Powered by Strava" moves into the layout footer, so it is present on every screen and cannot be lost
  when a view changes. It is contractual under the Strava API Agreement (FR-008), not decoration.

  ## Git & Branching

  - Mode: **`GITFLOW`** (from `settings.git_mode`) — branch and atomic per-task commits, PR description
    prepared locally, **no `git push` and no remote PR** unless the user asks in session.
  - Branch: `feature/US-004-heatmap-grid` from `develop`.
  - **Blocker cleared in TASK-00 (Sarah):** `develop` does **not** contain US-003's code —
    `app/Support/Heatmap/HeatmapWindow.php` exists only on `feature/US-003-strava-daily-sync`, and
    `develop` is at `chore(US-003): record the technical plan`. US-003 is approved and DONE, so TASK-00
    merges that branch into `develop` first. Branching before the merge starts US-004 on a tree missing
    its own dependency.
  - TASK-00 bootstrap: yes (Gitflow mode).
  - Per task: one Conventional Commit `type(US-004): TASK-NN summary`; never batch tasks.
  - `php artisan larapilot:quality` (Pint + Larastan level 5) green before each `task-done`.
  - Merge to `develop` only after human `larapilot-review` approval.

  ## Test Data Strategy

  - **No schema change and no new model in this spec** — every task's `## Test Data` is `N/A` except where
    noted. `Activity`, `User` and `SyncRun` factories and `TrainingBlockSeeder` already exist from US-001.
  - The seeded 16-week block is the demo dataset the spec's `Demonstrates` clause names: it already
    contains an illness week, a peak week and a partial current week, so future cells and the partial
    total render without any new fixture.
  - `TrainingBlockSeeder` is re-verified in TASK-06 only as a consumer — `php artisan migrate:fresh --seed`
    must still produce a grid that renders. If a gap appears (e.g. no rest day in the current week), the
    seeder is adjusted **in that same task**, and `## Test Data` upgrades from `N/A` accordingly.
  - Tests build their own windows with `Activity::factory()->for($athlete)->onDate($date)` rather than
    seeding, so a date-sensitive assertion never depends on the seeder's random draws.

  ## Test Strategy

  - Bar: **`NORMAL`** (from `settings.testing`). Feature, unit and view assertions. **No** Playwright, no
    Dusk, no Pest browser, no automated viewport matrix.
  - **Anne — the load-bearing tests are the builder's.** Every date rule in this spec is a pure function of
    (window, today, totals), so they belong in unit tests where each case is one named assertion:
    16 rows x 7 columns; ISO-8601 Monday first; oldest week top, current week bottom; the partial current
    week totalling only elapsed days; future cells in the current week; a window spanning a month
    boundary; a window spanning a year boundary; a day with two runs summing into one cell; a rest day
    distinct from a future day.
  - DTO unit tests pin the formatting and the accessible names — one decimal, correct rounding
    (8 249 m -> `8.2`), and the three exact `accessibleName()` strings.
  - One feature test renders the dashboard from data and asserts the structural criteria: 112 day cells,
    16 totals, `<caption class="sr-only">`, `scope="col"` / `scope="row"`, the skip link, "Powered by
    Strava", and that **neither `mi` nor `miles` appears anywhere in the response**.
  - Isolation: another athlete's activities in the same window must not appear in the grid.
  - `Http::preventStrayRequests()` in `setUp()` per `.ai/rules/tests.md`; athletes signed in via
    `allowlistedAthlete()` so the allowlist guard keeps being exercised.
  - **Manual test handoff (Anne)** — the responsive and theme criteria are not automatable at this bar.
    TASK-06 writes them to `.larapilot/docs/test-results/US-004-manual.md` for the reviewer:
    no horizontal scroll at 320 / 375 / 768 / 1024 / 1280 px; cells do not inflate past the 34 rem cap;
    the rail appears at >= 1024 px; first visit follows the OS theme; the toggle persists across a reload;
    focus outlines visible on the toggle and the skip link; toggle target is 44 x 44 px.
