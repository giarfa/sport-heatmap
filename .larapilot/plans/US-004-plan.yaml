    id: TASK-02
    title: 'Unit tests for the grid builder and cell formatting'
    body: |-
      ## Description
      Unit-test the grid builder and the DTO formatting — the week-boundary and accessible-name rules that
      carry this spec.

      ## Files Involved
      - tests/Unit/Support/Heatmap/HeatmapBuilderTest.php
      - tests/Unit/Data/Heatmap/DayCellTest.php
      - tests/Unit/Data/Heatmap/WeekRowTest.php

      ## Steps
      1. `php artisan make:test --phpunit --unit HeatmapBuilderTest` (and the two DTO tests). These need no
         database: build `HeatmapWindow` and the totals array directly and pass an explicit `$today`
      2. Builder cases, one named test each:
         - 16 rows of 7 cells, oldest week first, current week last
         - columns are ISO-8601 Monday through Sunday
         - a day after `$today` in the current week is `Future`
         - a day at or before `$today` with no run is `Rest`, and is **not** the same state as `Future`
         - the current week's total covers only elapsed days, and the row reports `isPartial`
         - a completed week is not `isPartial` even when it contains rest days
         - two runs on one date sum into a single cell
         - a window spanning a **month** boundary keeps every date in its correct weekday column
         - a window spanning a **year** boundary does the same (drive it with a January `$today`)
         - a window with no runs at all yields 112 `Rest`/`Future` cells and 16 zero totals
      3. `DayCell` cases: one decimal formatting; rounding (`8_249` -> `8.2`, `8_250` -> `8.3`); the three
         exact `accessibleName()` strings; `pointerTitle()` for ran and rest
      4. `WeekRow` cases: `kilometres()` one decimal; `weekLabel()`; a non-seven-day construction is rejected
      5. `php artisan test --compact tests/Unit/Support/Heatmap tests/Unit/Data/Heatmap`
      6. Do **not** add Playwright, Dusk, Pest browser or viewport suites — `settings.testing` is `NORMAL`

      ## Completion Criteria
      - [x] Every builder case above is a passing named test
      - [x] Rest and Future are asserted as distinct states, not just distinct distances
      - [x] Month-boundary and year-boundary windows are covered
      - [x] Coverage matches the `NORMAL` bar; no browser or viewport tooling introduced

      ## Git Deliverables
      - Commit: `test(US-004): TASK-02 cover the grid builder and cell formatting`
      - Push: **skip** (`git_mode: GITFLOW`)
      - PR: update the local PR notes
