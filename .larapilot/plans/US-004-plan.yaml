    id: TASK-04
    title: 'Render the grid: Blade component, dashboard rail and controller wiring'
    body: |-
      ## Description
      Render the grid: an anonymous Blade component for the table, the dashboard page with its side rail, and
      the controller wiring that feeds them.

      ## Files Involved
      - resources/views/components/heatmap-grid.blade.php
      - resources/views/dashboard.blade.php
      - app/Http/Controllers/DashboardController.php

      ## Steps
      1. `<x-heatmap-grid :grid="$grid" />` — an anonymous component taking the `HeatmapGrid` DTO. It renders
         markup only; every number and every string comes from a DTO method. No arithmetic in Blade
      2. Table structure, exactly as the mockup fixes it:
         - `<table class="hm">` with `<caption class="sr-only">` describing the grid's shape
         - `<colgroup>`: `hm-col-week`, `<col span="7" class="hm-col-day">`, `hm-col-total`
         - `<thead>`: an empty `<td>` carrying an `sr-only` "Week starting", then seven
           `<th scope="col"><abbr title="Monday">Mo</abbr></th>` headers, then `<th scope="col">Week</th>`.
           **Two-letter abbreviations** per the recorded decision — single letters make Tu/Th and Sa/Su
           ambiguous, and the mockup verified two letters fit at 320 px
         - each row: `<th scope="row" class="hm-th-week">` with an `sr-only` "Week of " prefix and
           `weekLabel()`, then seven `<td class="hm-td">`, then the total `<td class="hm-total">`
         - each day cell: `<span class="sr-only">{{ $day->accessibleName() }}</span>` followed by
           `<span aria-hidden="true" class="hm-cell hm-cell--{state}" title="...">`. The visible square is
           `aria-hidden` and the name is the `sr-only` span — colour never carries meaning alone
         - future cells get no `title`
         - the current row adds `hm-row-current`; a partial total appends
           `<span class="hm-partial">partial</span>`
      3. `dashboard.blade.php`: the `h1` ("Last 16 weeks"), the `$grid->label()` subtitle, then
         `<div class="dash">` holding `<section class="card dash-grid">` with the component and
         `<aside class="rail" aria-label="Legend and sync detail">`. The rail holds two placeholder cards
         carrying forward references — the intensity legend is US-005, the sync detail is US-006 — matching
         the convention already used in this view
      4. `DashboardController::__invoke(DailyRunningDistance $dailyDistance, HeatmapBuilder $buildGrid)` —
         collaborators as `__invoke` parameters per `.ai/rules/http.md`, not constructor-injected. Resolve
         `HeatmapWindow::current()`, fetch the totals for `Auth::user()`, build the grid, pass it to the view.
         The signed-out branch returning `strava.connect` is unchanged
      5. `npm run build`; check the seeded dashboard at 320, 375, 768, 1024 and 1280 px in both themes — no
         horizontal scroll, no cell inflation past the cap, rail appears at 1024
      6. `php artisan larapilot:quality --fix`

      ## Completion Criteria
      - [x] The dashboard renders 16 rows x 7 day cells plus 16 week totals from real data
      - [x] Every cell carries its accessible name; the coloured square is `aria-hidden`
      - [x] Future days in the current week render as the dashed treatment and the row's total is marked
            partial
      - [x] `<caption class="sr-only">`, `scope="col"` and `scope="row"` are all present
      - [x] Distances render in kilometres to one decimal; "mi" and "miles" appear nowhere
      - [x] Usable at 320 / 375 / 768 / 1024 / 1280 px with no horizontal scroll (manual smoke at this bar)
      - [x] `php artisan larapilot:quality` passes

