    type: Impl
    status: DONE
    assignee: Alex
    estimate_hours: 1.5
    dependencies:
      - TASK-03
    body: |-
      ## Description
      When the signed-in owner's Strava token can no longer be refreshed, end the session and redirect to `/`. The guest request that follows shows the public dashboard with the "Your Strava connection expired" banner instead of a connect-only screen (AC 7). The allowlist-removal 403 stays unchanged (AC 8).

      ## Files Involved
      - app/Http/Middleware/EnsureFreshStravaToken.php
      - tests/Feature/Strava/ReconnectStateTest.php

      ## Steps
      1. In the `StravaReconnectRequiredException` catch: keep `$this->endSession($request);`, then `return redirect()->route('dashboard')->with('strava.reconnect', true);`
      2. Rewrite the block comment: the flash lands in the session `invalidate()` just regenerated. Post/Redirect/Get keeps the URL `/` and does not repeat the banner on reload. Rejected alternatives: continuing `$next` as a guest (couples the middleware to a route that happens to serve guests) and the old connect-only screen (AC 7)
      3. Update the class PHPDoc ("standing guard on every authenticated screen", "a no-op for guests") so it reflects the redirect
      4. `ReconnectStateTest`:
         - `test_a_dead_refresh_token_shows_the_reconnect_screen_rather_than_a_server_error` → rename to `test_a_dead_refresh_token_signs_the_owner_out_onto_the_public_map_with_the_expiry_banner`: `assertRedirect(route('dashboard'))`, `assertGuest()`, then `followingRedirects()` (or a second `get('/')` carrying the session) → 200, `dashboard` view, the owner's grid, the text `Your Strava connection expired`
         - `test_undecryptable_tokens_show_the_reconnect_screen` → same redirect + banner expectation. The displayed athlete's tokens are undecryptable, but the guest path never reads them, so the follow-up request must still be 200 — assert it
         - add `test_the_expiry_banner_is_shown_once` — a second guest `GET /` after the follow-up does not show the banner
         - `test_removing_an_athlete_from_the_allowlist_ends_their_session_immediately` and `test_the_middleware_is_a_no_op_for_a_guest` stay green, unchanged
      5. `php artisan test --compact tests/Feature/Strava/ReconnectStateTest.php tests/Feature/Dashboard`
      6. `vendor/bin/pint --dirty --format agent`

      ## Completion Criteria
      - [x] Dead-token owner → signed out → `/` renders the public map with the banner, 200
      - [x] Undecryptable tokens follow the same path without a 500
      - [x] Banner is flashed once, not sticky
      - [x] Allowlist-removal 403 unchanged
