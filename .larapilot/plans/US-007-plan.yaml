code: US-007
plan_body: |
  ## Technical Solution

  US-007 makes `GET /` a public, read-only view of one athlete's heatmap. No new route, no schema change, no new package: the existing controller, grid cache, and sync-status resolver are reused, and the only new class is the resolver that picks *which* athlete a signed-out visitor sees. Delivery target is MVP, so this is a thin vertical slice on the US-004/US-006 code — the full spec is covered, nothing is trimmed.

  ### 1. Who is displayed — `ResolveDisplayedAthlete` (🔐 Lars, 📐 John)
  - `App\Support\Strava\AthleteAllowlist` gains `athleteIds(): array<int, string>` — the allowlist **in configured order**, the single reader of `config('strava.allowed_athlete_ids')`. `allows()` is rewritten on top of it; its strict comparison and fail-closed behavior are unchanged.
  - New `App\Support\Strava\ResolveDisplayedAthlete` (`final readonly`, `__invoke(): ?User`, same shape as `ResolveSyncStatus`):
    - empty allowlist → `null` with **no query**;
    - otherwise **one** query: `User::query()->select(['id', 'name', 'strava_athlete_id'])->whereIn('strava_athlete_id', $ids)->get()->keyBy('strava_athlete_id')`, then the first id of `athleteIds()` present in that map. Order comes from the allowlist, never from the database.
    - The narrow `select` is deliberate: the encrypted token columns are **never loaded** on the guest path, so it cannot decrypt, refresh, or re-save them, even by accident. Lars's note on the spec — guests never reach `EnsureFreshAccessToken` — holds by structure, not by convention.
    - "Connected user record" = a `users` row carrying that `strava_athlete_id`. Token state does not matter: an owner whose refresh token is dead is still displayed (AC 7 depends on that).
    - An athlete removed from the allowlist is never selected because the `whereIn` is built from the allowlist, even while their rows remain stored.
  - Query shape: `users.strava_athlete_id` already carries a unique index (US-001). No N+1 — one query, at most 2 rows.

  ### 2. Public read path — `DashboardController` (🔧 Alex)
  - `$athlete = Auth::user() ?? $resolveDisplayedAthlete()`. When both are `null` → `view('strava.connect')` with 200 (AC 3, which supersedes US-002's criterion).
  - Signed-in path **unchanged**: an owner sees their own map, after the `strava.fresh` middleware has already re-checked the allowlist and the token. With one athlete on the allowlist (the PRD's single-athlete instance), guest and owner resolve the same `User` id.
  - Shared cache by construction: `HeatmapGridCache` keys on `{user id}:{window start}:{today}`, so a guest and the owner hit the same entry; `ResolveSyncStatus` stays outside the cache and runs on every request (FR-007, AC 9). Neither class changes.
  - The guest path writes nothing to `users`, `activities`, or `sync_runs` and makes no HTTP call. The only writes a guest request can cause are the framework's session row and a grid-cache entry, which the spec allows (shared cache).
  - The controller's PHPDoc and the block comment on the `! Auth::check()` branch are rewritten: the "signed-out visit renders the connect screen" rationale is now the "no allowlisted athlete has connected yet" fallback.

  ### 3. Dead token → public map with the banner — `EnsureFreshStravaToken` (🔧 Alex, 🔐 Lars)
  - The `StravaReconnectRequiredException` branch keeps `endSession()` and replaces the `strava.connect` view with `redirect()->route('dashboard')->with('strava.reconnect', true)`. The flash goes into the session that `invalidate()` just regenerated, so it survives into the next request, which a guest makes. That request renders the public map (or the connect fallback) with the "Your Strava connection expired" banner.
  - **Chosen:** Post/Redirect/Get, so the URL is `/`, a reload does not repeat the banner, and the middleware does not depend on the guarded route also serving guests. **Rejected:** carrying on with `$next($request)` as a guest in the same request. That ties the middleware to the dashboard's guest behavior and would silently render any future guarded route signed-out. **Rejected:** keeping the connect-only screen, which AC 7 forbids.
  - The allowlist-removal branch (403 + session ended) is **unchanged** (AC 8).
  - The guest no-op at the top of `handle()` is unchanged, and it is the guarantee behind AC 6.

  ### 4. Shared notices — `<x-session-notices />` (✨ Joe)
  - New anonymous component `resources/views/components/session-notices.blade.php` renders both flash notices the connect screen renders today: the OAuth-cancellation `session('status')` (role=status) and the reconnect banner, now driven by `session('strava.reconnect')` (role=alert, same `--warn-*` tokens and copy).
  - Used by `strava/connect.blade.php` (replacing its inline blocks and the now-unused `$reconnect` view variable) **and** by `dashboard.blade.php`. The OAuth callback's cancel path redirects to `route('dashboard')`, and a guest now lands on the public map there whenever an athlete is connected. Without the shared component that notice would be lost.

  ### 5. Guest UI (✨ Joe, 🎨 Elise, ✍️ Marika)
  - **Discreet entry point:** a single `@guest` line at the bottom of the dashboard's `content` section: muted `Owner?` followed by a text link **Connect with Strava** to `route('strava.redirect')`, `var(--ink-muted)` with underline, `inline-flex min-h-11` for a 44 px tap target, and a visible `focus-visible` ring. It is a link, not a button. Strava orange stays reserved for the connect-screen button (mockup README). It is not added to the header: at 375 px the header already holds the mark, the sync chip, and the theme toggle, and a fourth control risks horizontal scroll (FR-009).
  - Signed-in owners do not see it. The connect screen keeps its full button and does not get the extra line.
  - The sync warning renders for guests exactly as for the owner: title, HTML-escaped reason, and the **Reconnect Strava** link (`x-sync-warning`, unchanged). The PRD records that choice.
  - **Copy (Marika):** layout `<meta name="description">` drops "Private": `Training dashboard — daily running distance over the last 16 weeks.` The noindex comment in `layouts/app.blade.php` is rewritten from "private instance" to "public but not promoted (PRD → SEO & discoverability)". `<meta name="robots" content="noindex, nofollow">` stays in the layout. So does the "Powered by Strava" footer, which every screen inherits, guests included (AC 10).
  - The 375 px layout, table semantics, accessible cell names, and light/dark themes come from US-004–US-006 components that render unchanged for guests (AC 11). No new mockup is needed: the only new element is one text line that follows the existing footer typography. Elise's annotation sits in this plan, and the manual test handoff checks it.

  ### Out of scope / unchanged
  - SEO (🔎 Emma): the PRD declares SEO & discoverability not applicable. No sitemap, no `llms.txt`, no new `robots.txt` rules; `noindex, nofollow` is the whole contract.
  - Privacy (⚖️ Violet): the owner accepted the Strava API Agreement risk on 2026-10-11 (PRD `### Privacy & legal`), so no new legal task. No cookie beyond the existing session cookie.
  - No new route, no Form Request, no Policy (`.ai/rules/http.md`), no new dependency (💰 Aurora: zero cost impact).

  ## Git & Branching
  - Mode: `GITFLOW` — no automatic push
  - Branch: `feature/US-007-public-dashboard` from `develop` (TASK-00)
  - Per task: one Conventional Commit `type(US-007): TASK-NN …`; code, tests, and domain docs ride in the same commit (except the TASK-01 catch-up, which commits alone)
  - Push / remote PR **only** when the user asks in-session; the internal PR description toward `develop` is kept locally
  - Merge to `develop` after `larapilot-review` approval (auto-approve is ON for autopilot)

  ## Test Data Strategy
  - No migration, model attribute, or relationship changes in this spec, so factories and seeders stay as they are.
  - Tests reuse the existing `UserFactory` states `stravaConnected()`, `stravaTokenExpired()`, plus `ActivityFactory::onDate()` and `SyncRunFactory`, and allowlist through `Tests\TestCase::allowlistAthletes()` / `allowlistedAthlete()` (`.ai/rules/tests.md`).
  - "Removed from the allowlist" = a connected user created by the factory **without** being passed to `allowlistAthletes()`. No new state is needed.
  - Demo dataset: `TrainingBlockSeeder` already creates athlete `10000001` with a realistic 16-week block. To see the public map locally after `php artisan migrate:fresh --seed`, put `10000001` in the **local** `.env` `STRAVA_ALLOWED_ATHLETE_IDS` (development only — README note added in TASK-07).
  - Verify `php artisan migrate:fresh --seed` still succeeds before TASK-07 `task-done`.

  ## Test Strategy
  - Bar: `NORMAL` — PHPUnit feature and unit tests (this project uses PHPUnit, not Pest: `php artisan make:test --phpunit`). **No** Playwright, Dusk, browser, or viewport E2E.
  - Every test touching the dashboard sets `Http::preventStrayRequests()` in `setUp()`. Config is overridden with `Config::set()` only.
  - Interleaved: TASK-02 brings its own resolver tests. TASK-04 (Anne) covers the guest read path right after TASK-03. TASK-05 updates `ReconnectStateTest` alongside the middleware change. TASK-06 asserts the entry point. TASK-07 runs the full suite and the quality gate.
  - Load-bearing assertions (each AC test in the spec):
    1. guest sees a populated map: 200, `dashboard` view, grid + week totals + legend + sync chip + sync detail;
    2. no allowlisted athlete connected → `strava.connect`, 200;
    3. removed athlete is never displayed, and the next allowlisted connected athlete in config order is;
    4. **read-only:** a guest request against an athlete whose token is **expired** (`stravaTokenExpired`) leaves the `users`, `activities`, and `sync_runs` row counts and the user's `updated_at` and encrypted token columns unchanged, and `Http::assertNothingSent()`. The expired token is what proves "never triggers a token refresh";
    5. dead-token owner → redirect to `/` → public map with the "Your Strava connection expired" banner, `assertGuest()`;
    6. guest sees the sync warning, with a failure reason containing `<script>` rendered escaped;
    7. guest and owner share the grid cache entry (owner warms it; the guest request does not rebuild it), and the sync status reflects a `SyncRun` created between the two requests;
    8. guest response carries `noindex, nofollow` and "Powered by Strava".
  - **Manual test handoff** (TASK-07): private window at 375 / 768 / 1280 px in light and dark, keyboard tab order reaches the footer link, VoiceOver reads one cell name.

  ## Developer Domain Docs
  - `data.dev_docs.documented` is `false` on a codebase with three existing domains, so **TASK-01 is the First-change catch-up** (`runtime-dev-docs-catchup.md`). It writes `strava-connection.md`, `activity-sync.md`, `heatmap-dashboard.md`, and the README index, describing the code **as it is before US-007**, in its own commit.
  - Every later task updates the domain it touches in its own commit: `strava-connection.md` (allowlist ordering, displayed athlete, dead-token redirect) and `heatmap-dashboard.md` (public read path, shared cache, guest UI).

  ## Risks
  - **Strava API Agreement** — accepted by the owner (PRD); not re-opened.
  - **Multi-athlete allowlist** — a second allowlisted athlete who signs in sees their own map while guests see the first one. That is the intended behavior per AC 2; it is documented in `heatmap-dashboard.md` as an invariant, not a bug.
  - **Partial `User` model** on the guest path — the narrow `select` would make an accidental `save()` or token read fail loudly rather than write. The behavior is intended and documented in the resolver's block comment.
