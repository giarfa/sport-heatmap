    id: TASK-04
    title: 'Cover the guest read path: populated map, fallbacks, read-only, warning, cache'
    type: Test
    status: DONE
    assignee: Anne
    estimate_hours: 2.5
    dependencies:
      - TASK-03
    body: |-
      ## Description
      Add PHPUnit feature coverage for the signed-out dashboard at the `NORMAL` bar: the spec's guest test list, minus the dead-token case, which TASK-05 owns.

      ## Files Involved
      - tests/Feature/Dashboard/PublicDashboardTest.php — new (`php artisan make:test --phpunit PublicDashboardTest --no-interaction`, moved under `Dashboard/`)

      ## Steps
      1. `setUp()`: `Http::preventStrayRequests()`. Use existing factories (`UserFactory::stravaConnected()` / `stravaTokenExpired()`, `ActivityFactory::for($athlete)->onDate(...)`, `SyncRunFactory`) and `allowlistAthletes()`. Do not duplicate factory definitions
      2. Cases:
