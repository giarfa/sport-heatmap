    id: TASK-02
    title: 'Resolve the displayed athlete from the ordered allowlist'
    type: Impl
    status: DONE
    assignee: Alex
    estimate_hours: 2
    dependencies:
      - TASK-01
    body: |-
      ## Description
      Add the read-only resolver that decides which athlete a signed-out visitor sees: the first id in `STRAVA_ALLOWED_ATHLETE_IDS`, in configured order, that has a connected user record (AC 2). It must never load, decrypt, or refresh tokens.

      ## Files Involved
      - app/Support/Strava/AthleteAllowlist.php — add `athleteIds(): array<int, string>`; rewrite `allows()` on top of it
      - app/Support/Strava/ResolveDisplayedAthlete.php — new (`php artisan make:class Support/Strava/ResolveDisplayedAthlete --no-interaction`)
      - tests/Feature/Strava/ResolveDisplayedAthleteTest.php — new (`php artisan make:test --phpunit ResolveDisplayedAthleteTest --no-interaction`, moved under `Strava/`)
      - tests/Unit/Support/Strava/AthleteAllowlistTest.php — add an ordering case for `athleteIds()`
      - config/strava.php — comment on the allowlist block: order now decides the displayed athlete
      - .env.example — comment above `STRAVA_ALLOWED_ATHLETE_IDS`: the first connected id is shown on the public home page

      ## Steps
      1. `AthleteAllowlist::athleteIds()` returns `config('strava.allowed_athlete_ids', [])` as `array<int, string>`, in order. `allows()` = `in_array($id, $this->athleteIds(), strict: true)`, behavior unchanged
      2. `ResolveDisplayedAthlete` — `final readonly class`, constructor-promoted `private AthleteAllowlist $allowlist`, `__invoke(): ?User`:
         - empty `athleteIds()` → return `null` before querying
         - `User::query()->select(['id', 'name', 'strava_athlete_id'])->whereIn('strava_athlete_id', $ids)->get()->keyBy('strava_athlete_id')`
         - iterate `$ids` in order and return the first match, else `null`
         - block comments (`.ai/rules/app.md`): why order comes from config and not the DB, why the narrow `select` (no token columns ever reach the guest path), why token state is ignored (dead-token owner must still be displayed)
      3. Tests (`Http::preventStrayRequests()` in `setUp()`; `Config::set` / `allowlistAthletes()`):
         - returns `null` for an empty allowlist and runs no query (`DB::enableQueryLog()` → 0 queries)
         - returns `null` when allowlisted ids have no user row
         - with `['222', '111']` allowlisted and both connected → returns `222`
         - with `['222', '111']` and only `111` connected → returns `111`
         - a connected user **not** on the allowlist is never returned, even when they are the only row
         - an athlete in `stravaTokenExpired()` state is still returned; the returned model has no `strava_access_token` / `strava_refresh_token` attributes loaded
         - exactly one query when the allowlist is non-empty
      4. `php artisan test --compact tests/Feature/Strava/ResolveDisplayedAthleteTest.php tests/Unit/Support/Strava/AthleteAllowlistTest.php`
      5. `vendor/bin/pint --dirty --format agent`

      ## Completion Criteria
      - [x] `athleteIds()` preserves configured order; `allows()` behavior unchanged (existing tests green)
      - [x] Resolver returns the first connected allowlisted athlete in config order, or `null`
      - [x] Resolver never selects token columns and runs ≤ 1 query
      - [x] `.env.example` and `config/strava.php` comments state the ordering semantics
      - [x] Tests pass

      ## Test Data
      - N/A — no model/schema changes; tests use `UserFactory::stravaConnected()` / `stravaTokenExpired()`

      ## Domain Docs
      - [x] `.larapilot/docs/devs/strava-connection.md` updated — allowlist order now selects the displayed athlete; the resolver, its single query, the narrow select, and the rejected "order by DB id" alternative
      - [x] `README.md` index row "Last touched by" refreshed
      - [x] English, committed with this task

      ## Git Deliverables
      - Commit: `feat(US-007): TASK-02 resolve the displayed athlete from the ordered allowlist`
      - Push: **skip** (`git_mode: GITFLOW`)
      - PR: update the local PR notes toward `develop` — open/update the remote PR only if the user asks
