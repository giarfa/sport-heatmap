    body: |-
      ## Description
      Make `GET /` render the displayed athlete's heatmap, legend, and sync status for signed-out visitors, fall back to the connect screen when nobody is displayable, and share the flash notices between the dashboard and the connect screen (AC 1, 3, 6, 9).

      ## Files Involved
      - app/Http/Controllers/DashboardController.php
      - resources/views/components/session-notices.blade.php — new anonymous component
      - resources/views/strava/connect.blade.php — use `<x-session-notices />`, drop the `$reconnect` variable
      - resources/views/dashboard.blade.php — include `<x-session-notices />` above the heading block
      - CHANGELOG.md — `## [Unreleased]` → `### Changed`

      ## Steps
      1. `DashboardController::__invoke` adds the `ResolveDisplayedAthlete $resolveDisplayedAthlete` parameter (collaborators as `__invoke` params — `.ai/rules/http.md`):
         - `/** @var User|null $athlete */ $athlete = Auth::user() ?? $resolveDisplayedAthlete();`
         - `null` → `return view('strava.connect');`
         - the rest (window, `$gridCache->remember(...)`, `$resolveSyncStatus(...)`, `view('dashboard', ...)`) stays as-is and serves both paths
         - rewrite the PHPDoc and add a block comment: the guest path is read-only by structure. It never calls `EnsureFreshAccessToken` or `StravaClient`, the middleware is a no-op for guests, and the resolver loads no token columns. Same cache key for guest and owner, so the cache is shared. Sync status is still resolved outside the cache
      2. `session-notices` component: move the two blocks from `strava/connect.blade.php` verbatim (cancellation `session('status')` with `role="status"`; reconnect alert `role="alert"` with `--warn-*` tokens and the copy "Your Strava connection expired. Connect again to keep the heatmap up to date."). The reconnect block now reads `session('strava.reconnect')`. Comment why the component is shared: the OAuth cancel path redirects to `dashboard`, which guests now see as the public map
      3. `dashboard.blade.php`: render `<x-session-notices />` at the top of `content`, constrained to the dashboard width (not `max-w-sm mx-auto`) so the 375 px layout holds — pass a `class` attribute or let the component accept `$attributes->merge()`
      4. CHANGELOG Unreleased → `### Changed`: the home page shows the owner's heatmap read-only without signing in, and signing in stays allowlist-only (US-007)
      5. Smoke-check at 375 / 768 / 1280 px in Herd as a guest (private window) with `TrainingBlockSeeder` data and `10000001` allowlisted locally
      6. `php artisan test --compact tests/Feature/Dashboard` — existing guest tests (no user rows) must still get `strava.connect`
      7. `vendor/bin/pint --dirty --format agent`

      ## Completion Criteria
