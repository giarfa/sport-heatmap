  -
    id: TASK-01
    title: "Count the window's last day in every activity_date range (scope, cache v5, regression test)"
    body: |-
      ## Description
      Fix: a run on the last day of a window is missing from the grid (FR-004, FR-005, FR-006, FR-019, FR-020). Add an `Activity::onDaysBetween()` scope that compares `activity_date` as a half-open range of plain date strings. Route every `activity_date` range query through it, and bump the grid cache key so no grid cached before the fix is served again. The root cause is in the plan's Technical Solution.

      ## Files Involved
      - app/Models/Activity.php — `#[Scope] protected function onDaysBetween(Builder $query, CarbonInterface $firstDay, CarbonInterface $lastDay): void` + block comment with the root cause; keep the class `@property` docblock intact (`.ai/rules/models.md`)
      - app/Support/Heatmap/DailyRunningDistance.php
      - app/Support/Heatmap/DailyRuns.php
      - app/Support/Heatmap/LeadInDistance.php — replace the `>= / <` pair and rewrite its block comment to point at the scope
      - app/Support/Sync/ResolveSyncStatus.php — `runsInWindow()`
      - app/Actions/Strava/ReconcileStravaWindow.php — the stored-rows load (inside the `orWhere` closure: `$query->onDaysBetween(...)->orWhereIn(...)`, keep the grouping) and the delete
      - app/Support/Garmin/PlanGarminImport.php — block comment only: the `whereIn` must keep binding CarbonImmutable values (grammar `Y-m-d H:i:s` = the written format), never `toDateString()`
      - app/Support/Heatmap/HeatmapGridCache.php — key segment `v4` → `v5`, comment extended (content fixes bump too)
      - tests/Feature/Dashboard/LastDayOfWindowTest.php (new) — the regression test
      - tests/Feature/Dashboard/HeatmapGridCacheTest.php — update any hard-coded `v4` key
      - .larapilot/docs/devs/heatmap-dashboard.md, .larapilot/docs/devs/activity-sync.md, .larapilot/docs/devs/README.md

      ## Steps
      1. Write `LastDayOfWindowTest` first and watch it fail. Use the setup of the sibling tests (`WindowNavigationTest`, `DayDetailTest`): `Carbon::setTestNow`, and an athlete from `allowlistedAthlete()` or the displayed athlete the public dashboard renders (`.ai/rules/tests.md`). Two cases:
         - "today" is Saturday 17 Oct 2026, with a run on Sunday 11 Oct 2026 of 17 507 m stored through `Activity::factory()`. `GET /?to=2026-10-11` shows `17.5` in the Sunday cell, the week total, the last trend bar's accessible name and the day detail.
         - "today" is Sunday 11 Oct 2026, with a run that day. `GET /` shows it on the current window.
      2. Add the scope and route `DailyRunningDistance`, `DailyRuns`, `LeadInDistance`, `ResolveSyncStatus::runsInWindow`, and both `ReconcileStravaWindow` queries through it. The query count doesn't change; `WeeklyTrendTest`'s lead-in query counter matches `"activity_date" < ?`, which the scope still produces.
      3. Add the `PlanGarminImport` block comment. Bump the cache key to `v5`.
      4. `php artisan test` — the full suite, so `WeeklyTrendTest`, `LeadInDistanceTest`, `ReconcileStravaWindowTest` and the Garmin flows stay green.
      5. `vendor/bin/pint --dirty --format agent`.

      ## Completion Criteria
      - [x] A run on the last day of a past window and of the current window on a Sunday appears in its cell, its detail, the week total, the trend's last bar, and the intensity calibration
      - [x] No `activity_date` range comparison in `app/` uses `whereBetween` with date strings any more (`grep -rn "whereBetween('activity_date'" app` is empty)
      - [x] Stored rows unchanged, no migration
      - [x] Grid cache key is `v5`
      - [x] `LastDayOfWindowTest` fails on `release/2.0.0` and passes on the branch
      - [x] Tests pass

      ## Test Data
      - N/A — the stored format does not change, so `ActivityFactory` and the seeders stay as they are. Do **not** run `migrate:fresh --seed` (the development database holds real data)

      ## Domain Docs
      - [x] `.larapilot/docs/devs/heatmap-dashboard.md`: new subsection on how `activity_date` is stored (`Y-m-d 00:00:00` through the `date` cast, on every write path) and how window ranges must compare it (`Activity::onDaysBetween`, half-open, never `whereBetween` with date strings, never `whereDate`). Note the rejected alternatives and the `v5` cache bump under Key decisions & invariants / Extension points & gotchas
      - [x] `.larapilot/docs/devs/activity-sync.md`: the reconcile window queries and the sync-status window count use the same scope
      - [x] Folder `README.md` index rows updated (`Last updated by: US-015`)
      - [x] English, committed with this task

      ## Git Deliverables
      - Commit: `fix(US-015): TASK-01 count the window's last day in every activity_date range`
      - Push: **skip** (`git_mode: GITFLOW`)
      - PR: prepare/update locally toward `release/2.0.0`; open remote only if the user requests
      - Commit body names the root cause: the `date` cast writes `Y-m-d 00:00:00`, SQLite compares TEXT, so `<= 'Y-m-d'` excluded the window's last day
