code: US-015
plan_body: |
  **Release:** 2.0.0

  ## Technical Solution

  FR-004 says each cell holds that day's total distance. That breaks for the last day of every window (always a Sunday). `Activity::activity_date` is cast `date`, so every write path stores it in the model date format `2026-10-11 00:00:00`. That covers Eloquent and the factory, the Strava upsert (CarbonImmutable bound by the grammar) and the Garmin import. The local DB has 263 rows, all in that one format. `DailyRunningDistance`, `DailyRuns` and `ResolveSyncStatus::runsInWindow` bound the window with `whereBetween('activity_date', [startsOn->toDateString(), endsOn->toDateString()])`. SQLite compares TEXT, and `'2026-10-11 00:00:00' <= '2026-10-11'` is false, so the last day drops out.

  ### Approach — compare as a half-open day range, change no stored row
  1. **One query scope owns the rule.** Add `#[Scope] protected function onDaysBetween(Builder $query, CarbonInterface $firstDay, CarbonInterface $lastDay): void` to `App\Models\Activity` (the `Illuminate\Database\Eloquent\Attributes\Scope` attribute, Laravel 13). It applies `where('activity_date', '>=', firstDay->toDateString())` and `where('activity_date', '<', CarbonImmutable::instance($lastDay)->addDay()->toDateString())`. A half-open range of plain date strings is correct whether a row holds `Y-m-d` or `Y-m-d 00:00:00`. Both sort `>=` their own day and `<` the next day, so the comparison no longer depends on the write format. A block comment above it states the root cause.
  2. **Route every `activity_date` range through it:**
     - `App\Support\Heatmap\DailyRunningDistance` — `onDaysBetween($window->startsOn, $window->endsOn)`. Fixes the cell distance, the week total, the trend bar (built from the same rows) and the intensity calibration (it reads these daily totals).
     - `App\Support\Heatmap\DailyRuns` — same. Fixes the day detail.
     - `App\Support\Heatmap\LeadInDistance` — `onDaysBetween($leadInStart, $window->startsOn->subDay())`. Same result as today's hand-written `>= / <` pair. That pair worked only because of the string ordering, and its block comment becomes a pointer to the scope.
     - `App\Support\Sync\ResolveSyncStatus::runsInWindow` — **same bug, not named in the spec.** The CSV-only "runs in window" count misses a run on the window's last day. Fix it here so AC 3 ("every `activity_date` range comparison in the app") holds.
     - `App\Actions\Strava\ReconcileStravaWindow` — both `whereBetween('activity_date', [$window->startsOn, $window->endsOn])` calls (the stored-rows load inside the `orWhere` closure, and the delete). They bind Carbon objects, so they compare `Y-m-d 00:00:00` with equality and are **correct today**, but only because both sides use the same format. Moving them to the scope makes every comparison follow one rule, without changing what they return.
  3. **Exact-date matching stays as is.** `PlanGarminImport` uses `whereIn('activity_date', [CarbonImmutable …])`, which binds through the grammar's `Y-m-d H:i:s`, the same format the rows are written in. Add a block comment saying it must keep binding Carbon objects, not `toDateString()`. `OldestRunDate` (`MIN()` parsed with `CarbonImmutable::parse`) and `StartTimeMatcher` (compares formatted Carbon values) need no change.
  4. **Grid cache:** bump the key segment `heatmap:grid:v4` → `v5` in `HeatmapGridCache::key()` and extend its block comment: a fix that changes the content of a cached grid gets a bump too, not only a change to its shape. Proving the TTL instead wouldn't work. The key carries `$today` and the TTL is 86 400 s, so a past window cached before the deploy would keep hiding its Sunday until midnight.

  ### Rejected alternatives
  - **Store `Y-m-d` and migrate the rows.** A `date:Y-m-d` cast only changes serialization, not storage. Storing plain dates would need a custom cast or a `$dateFormat` override, plus a data migration. It would also break `PlanGarminImport`'s Carbon-bound `whereIn`, and for a while the formats would be mixed. That's more risk than a read-side fix, and the read-side fix leaves no stored row changed.
  - **`whereDate()`.** Laravel compiles it on SQLite as `strftime('%Y-%m-%d', activity_date)`. That wraps the column, so the query can't use the `(user_id, activity_date)` index that serves the only query the dashboard makes (PRD Data model).
  - **`endsOn->endOfDay()` bound.** It works for the current format, but it hard-codes the `00:00:00` time suffix, which is the same coupling to the write format that caused this bug.

  ### Laravel idioms & quality (Andrew)
  No new class, route, package or migration. The shared rule lives in a model scope, and the query count and shape are unchanged: the grid still runs 3 grouped queries on a cache miss and the index still serves them. Every non-obvious decision gets a `/* … */` block comment (`.ai/rules/app.md`). Larastan level 5 and Pint run via `php artisan larapilot:quality`.

  ### Cost (Aurora)
  None.

  ## Git & Branching
  - Mode: GITFLOW, no automatic push
  - Release: **2.0.0**. TASK-00 runs `php artisan larapilot:release-feature --semver=2.0.0 --spec=US-015 --slug=last-day-of-window`, which branches `feature/US-015-last-day-of-window` **from `release/2.0.0`**
  - Per task: one Conventional Commit `type(US-015): TASK-NN …`, with code, tests and domain docs together. The TASK-01 commit body names the root cause (AC)
  - PR prepared locally toward `release/2.0.0` (not `develop`); push / remote PR only if the user asks
  - Merge into `release/2.0.0` after `larapilot-review` approval (auto-approve is on). US-015 is the last open story of v2.0.0, so approval hands over to `/larapilot-release`

  ## Test Data Strategy
  - The stored format does not change and no model, migration, enum or relationship changes, so **no factory or seeder change** (AC: "updated only if the stored format changes").
  - Tests use the existing `ActivityFactory` on the in-memory SQLite of `phpunit.xml`. That's where the bug shows, because the factory writes through Eloquent's `date` cast. To prove the scope doesn't depend on the format, insert one row with a raw `Y-m-d` value via `DB::table('activities')`.
  - **Never run `php artisan migrate:fresh --seed`** in this spec. The development database holds real data (it contains the 2026-10-11 17 507 m run the bug report cites), so manual verification reads it as it is.

  ## Test Strategy
  - Bar: NORMAL. Pest-free PHPUnit classes like the existing suite (`Tests\TestCase`, `RefreshDatabase`), no Playwright, Dusk or browser E2E.
  - **Regression (TASK-01, ships with the fix):** a Feature test that stores a run through Eloquent on the window's last Sunday and GETs `/?to=2026-10-11`. The response shows 17.5 km in the Sunday cell, in the week total, in the last trend bar, and in the day detail. A second case freezes today on a Sunday and checks today's run appears on the current window. Both fail on `release/2.0.0` without the fix.
  - **Boundaries (TASK-02):** the window's first day and the lead-in's last day count exactly once (no double count across the boundary). The scope accepts both stored formats. `ResolveSyncStatus` counts a last-day run. `ReconcileStravaWindow` still deletes a Strava run on the window's last day that Strava no longer returns, and still keeps a Garmin one. The cache key uses `v5`.
  - **Manual test handoff:** on Herd, open `/?to=2026-10-11`. The Sunday cell shows 17.5 km and its detail, and the week's total and last trend bar include it.
