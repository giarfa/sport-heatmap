    id: TASK-02
    title: 'Cover window boundaries, sync status and reconcile on the last day'
    body: |-
      ## Description
      Add PHPUnit coverage for the window boundaries and every query the fix touched. The regression test proves the bug is fixed; these tests prove nothing gets counted twice and nothing else moved.

      ## Files Involved
      - tests/Unit/Models/ActivityTest.php — the scope
      - tests/Unit/Support/Heatmap/DailyRunsTest.php
      - tests/Feature/Dashboard/LeadInDistanceTest.php
      - tests/Feature/Dashboard/HeatmapGridTest.php (or a `DailyRunningDistance` case beside it)
      - tests/Unit/Support/Sync/ResolveSyncStatusTest.php
      - tests/Feature/Strava/ReconcileStravaWindowTest.php
      - tests/Feature/Dashboard/HeatmapGridCacheTest.php

      ## Steps
      1. Reuse `ActivityFactory`; do not duplicate factory definitions.
      2. `onDaysBetween` includes the first and last day and excludes the day before and the day after. It does so both for a row stored through Eloquent (`Y-m-d 00:00:00`) and for a row inserted with `DB::table('activities')` as a raw `Y-m-d`.
      3. `DailyRunningDistance` / `DailyRuns`: runs on the window's first Monday and last Sunday are both returned. A run on the Sunday before the window isn't.
      4. `LeadInDistance`: the Sunday just before the window is in lead-in week 3, and the window's first Monday isn't in the lead-in. Together with step 3, that means no run is counted on both sides of the boundary.
      5. `ResolveSyncStatus`: a CSV-only athlete's "runs in window" count includes a run on the window's last day.
      6. `ReconcileStravaWindow`: a Strava run stored on the window's last day that Strava no longer returns is deleted. A Garmin run on that day survives (`Http::fake()` + `Http::preventStrayRequests()`, `.ai/rules/tests.md`).
      7. `HeatmapGridCache`: a grid cached under the `v4` key is not served (the key now uses `v5`).
      8. Sanity check: `git stash` the TASK-01 app changes (or check out `release/2.0.0`'s versions of the five query classes) and confirm `LastDayOfWindowTest` and the step-3/5 boundary tests fail. Then restore.
      9. `php artisan test`. Do **not** add Playwright, Dusk, Pest browser, or viewport E2E suites.

      ## Completion Criteria
      - [x] Boundary days covered for the window and the lead-in, no double count
      - [x] Scope proven independent of the stored format
      - [x] Sync status and reconcile covered on the last day
      - [x] Regression tests shown to fail without the fix
      - [x] Tests pass locally

      ## Git Deliverables
      - Commit: `test(US-015): TASK-02 cover the window boundaries of every activity_date range`
      - Push: **skip** (`git_mode: GITFLOW`)
      - PR: prepare/update locally toward `release/2.0.0`; open remote only if the user requests
