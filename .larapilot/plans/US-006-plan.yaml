    id: TASK-04
    title: 'Build the chip, warning, detail and skeleton components'
    body: |-
      ## Description
      Build the four Blade components and open the two layout yields they hang from. Markup only — every string and every branch comes from `SyncStatus`.

      ## Files Involved
      - resources/views/components/sync-chip.blade.php _(new)_
      - resources/views/components/sync-warning.blade.php _(new)_
      - resources/views/components/sync-detail.blade.php _(new)_
      - resources/views/components/heatmap-skeleton.blade.php _(new)_
      - resources/views/layouts/app.blade.php

      ## Steps
      1. `layouts/app.blade.php` — replace the `{{-- The sync status chip US-006 adds… --}}` comment with `@yield('header-status')` in that exact slot, and add `@yield('footer-status')` to the footer paragraph after the "distances in kilometres" text. Yields, not a view composer or shared variable: `strava/connect.blade.php` and `strava/rejected.blade.php` extend this same layout and must render with neither.
      2. `sync-chip` — `@props(['status'])`; dot span (`aria-hidden`) + `$status->chipLabel()`; `aria-hidden="true"` on the whole chip when `$status->chipIsRedundant()` is true, so the `role="alert"` banner is the single announcement.
      3. `sync-warning` — `<div role="alert" class="sync-alert">`, the mockup's triangle icon `aria-hidden`, `$status->warningTitle()`, `$status->warningReason()` (escaped `{{ }}` — it can carry a Strava error string), and the `Reconnect Strava` anchor to `route('strava.redirect')` with `$status->recoveryLabel()`.
      4. `sync-detail` — the rail card: `<h3>Sync</h3>` and a `<dl>` with **Last run** (`lastRunLabel()` plus `lastRunRelative()` on its own line), **Outcome** (dot + `outcomeLabel()`), **Runs in window** (`$status->runsInWindow`). Never-synced prints `Never` and `—` rather than an empty row.
      5. `heatmap-skeleton` — the grid card with `aria-busy="true" aria-live="polite"`, an `sr-only` "Loading your heatmap…", and a `<table class="hm" aria-hidden="true">` of six skeleton rows using the same `<colgroup>` percentages as `heatmap-grid`, so the geometry is identical.
      6. Implement **mobile-first** per the mockup README: chip hidden below 640 px with the footer line taking over, banner full-width at every breakpoint, detail card stacking under the grid below 1024 px and entering the rail at and above it. Smoke-check at 375, 768 and 1280 px.
      7. `vendor/bin/pint --dirty --format agent`.

      ## Completion Criteria
      - [x] Four components render from `SyncStatus` alone — no dates, no conditionals building strings in Blade
      - [x] Banner is `role="alert"`; skeleton region is `aria-busy` + `aria-live="polite"` with its table `aria-hidden`
      - [x] Chip is `aria-hidden` whenever a banner is on the page
      - [x] Layout exposes both yields; connect and rejected screens are visually unchanged
      - [x] Usable at 375 / 768 / 1280 px (manual smoke is sufficient at `NORMAL`)

