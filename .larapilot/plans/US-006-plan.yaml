    id: TASK-03
    title: 'Add sync status and skeleton design tokens (parallel with TASK-01)'
    body: |-
      ## Description
      Add the two missing design tokens and the CSS the four new components need, in the same hand-authored token style the file already uses. No component markup in this task.

      ## Files Involved
      - resources/css/app.css

      ## Steps
      1. Add `--ok-dot` and `--skeleton` to **all three** token blocks, transcribed from the mockup: `:root` → `#0ca30c` / `#e2e8f0`; `html.dark` → `#22c55e` / `#1e293b`; and the `@media (prefers-color-scheme: dark)` block → the dark pair, matching how `--warn-*` and `--lv-*` are already triplicated. Missing the third block is the flash-of-wrong-token bug the layout's inline script exists to avoid.
      2. `.sync-chip` — pill, `hidden` below 640 px and `inline-flex` at and above it (mockup: the chip appears at `sm`, the footer carries it below); `.sync-chip-dot` 6 px round, colour from a modifier class (`--ok` → `var(--ok-dot)`, `--warn` → `var(--warn-ink)`).
      3. `.sync-alert` — the amber banner: `var(--warn-bg)` / `var(--warn-border)` / `var(--warn-ink)`, 0.5 rem radius, icon and text in a two-column flex; `.sync-alert-title` semibold; `.sync-alert-action` a 44 px-tall bordered button using `var(--warn-border)`.
      4. `.sync-detail` — the rail card's `<dl>`: label/value rows, `font-variant-numeric: tabular-nums` on the value so the timestamp aligns with the legend numbers above it.
      5. `.skeleton` — `background: var(--skeleton)`, 0.1875 rem radius. The pulse keyframes go **inside** `@media (prefers-reduced-motion: no-preference)`, never declared then disabled.
      6. Reuse `.hm-cell` for the skeleton cells so the geometry is the grid's, not a copy of it — the criterion is that nothing shifts when data lands.
      7. `npm run build` to confirm the stylesheet compiles.

