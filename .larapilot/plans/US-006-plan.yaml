    title: 'Document the sync states, the threshold and the manual checklist'
    body: |-
      ## Description
      Baseline documentation for the states this spec introduces: what each one means, what trips it, and how to reach it locally for review. Baseline tier only — the PRD records no OpenAPI (no public API) and no extended docs.

      ## Files Involved
      - README.md

      ## Steps
      1. Add a **Sync status** subsection under the existing sync documentation: the five states, the condition that produces each, and the 48-hour threshold with a pointer to `config('strava.stale_after_hours')` and why it is a literal.
      2. Document how to reach each state in local dev without editing the seeder — delete the newest `sync_runs` row for never-synced, re-time it past 48 hours for stale, set its status to `failed` with a message for the warning, null its `finished_at` for the in-flight skeleton.
      3. Note that a failed sync deliberately leaves the cached grid in place, so the map keeps showing the last good data under the warning — otherwise a reader will file it as a bug.
      4. Record Anne's manual test handoff (the five states at 375/1280 px in both themes, reduced-motion check) so review has the checklist.
      5. `CHANGELOG.md` Unreleased → `Added` line for the sync status indicator, stale warning and empty states, since this is user-facing behaviour.

      ## Completion Criteria
      - [ ] README documents the five states, the threshold, and how to reproduce each locally
      - [ ] The deliberate cache behaviour under a failed sync is written down
