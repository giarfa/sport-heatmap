    id: TASK-02
    title: 'Unit-test the state machine, the 48-hour boundary and the resolver'
    body: |-
      ## Description
      Pin the state machine before any of it reaches a template: precedence, the 48-hour boundary from both sides, the skeleton condition, and the resolver's counting and ordering.

      ## Files Involved
      - tests/Unit/Data/SyncStatusTest.php _(new)_
      - tests/Unit/Support/Sync/ResolveSyncStatusTest.php _(new)_

      ## Steps
      1. `php artisan make:test --phpunit --unit SyncStatusTest` and `ResolveSyncStatusTest`, then move them under the paths above to match the existing `tests/Unit/Support/...` layout.
      2. `SyncStatusTest` — construct `SyncRun` instances via the factory (`make()` where no database row is needed) and cover every row of the plan's unit table: no rows; failure over a recent success; failure with no success ever; **exactly** 48 h → `Healthy`; 48 h + 1 s → `Stale`; healthy 6 h; running-only → `NeverSynced` + `showsSkeleton()`; running after a success → `showsSkeleton()` false.
      3. Assert the strings too, not only the enum: `chipLabel()`, `warningTitle()` and `warningReason()` for each warning state. These are the sentences the athlete reads; a silent copy regression is exactly the failure this spec exists to prevent.
      4. Freeze time with `$this->travelTo(...)` so `diffForHumans()` output is deterministic.
      5. `ResolveSyncStatusTest` — `RefreshDatabase`; `Http::preventStrayRequests()` in `setUp()` per `.ai/rules/tests.md`. Cover: the most recent run and the most recent *successful* run are picked independently; the runs-in-window count includes only activities inside `HeatmapWindow::current()` and only this athlete's, using `allowlistedAthlete()` and the `Activity` factory's `onDate()` state.
      6. `php artisan test --compact tests/Unit/Data/SyncStatusTest.php tests/Unit/Support/Sync/ResolveSyncStatusTest.php`
      7. No browser, viewport or E2E work — `settings.testing` is `NORMAL`.

      ## Completion Criteria
      - [x] Every case in the plan's unit table has a test
      - [x] Both sides of the 48-hour boundary asserted
      - [x] Warning copy asserted, not just the health enum
      - [x] Suite green

      ## Git Deliverables
      - Commit: `test(US-006): TASK-02 cover the sync state machine and resolver`
      - Push: **skip** (`git_mode: GITFLOW`)
      - PR: update the local PR notes
