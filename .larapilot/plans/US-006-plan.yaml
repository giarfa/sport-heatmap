    id: TASK-01
    title: 'Resolve sync health into a SyncStatus value object'
    body: |-
      ## Description
      Build the domain layer FR-007 needs: the health enum, the `SyncStatus` DTO that owns the decision **and** every string, and the resolver that reads the three values it is built from. No Blade in this task — the next tasks consume a finished object.

      ## Files Involved
      - app/Enums/SyncHealth.php _(new)_
      - app/Data/SyncStatus.php _(new)_
      - app/Support/Sync/ResolveSyncStatus.php _(new)_
      - app/Enums/SyncRunStatus.php _(add `label()`, `dotModifier()`)_
      - config/strava.php _(add `stale_after_hours`)_

      ## Steps
      1. `php artisan make:enum SyncHealth` (or `make:class`) — cases `Healthy`, `Failed`, `Stale`, `NeverSynced`, TitleCase per the PHP rules.
      2. `app/Data/SyncStatus.php` — `final readonly`, promoted public properties (`SyncHealth $health`, `?SyncRun $lastRun`, `?SyncRun $lastSuccessfulRun`, `int $runsInWindow`, `bool $isSyncing`), built by a named static factory `SyncStatus::from(?SyncRun $lastRun, ?SyncRun $lastSuccessfulRun, int $runsInWindow, CarbonInterface $now)` per `.ai/rules/data.md`. spatie/laravel-data is **not** installed — plain PHP.
      3. Implement the precedence exactly as the plan's state table orders it: no rows → `NeverSynced`; last run failed → `Failed`; never succeeded → `NeverSynced`; last success `finished_at` **strictly** older than `now - stale_after_hours` → `Stale`; else `Healthy`.
      4. Query methods: `needsWarning()`, `showsSkeleton()` (`$isSyncing && $lastSuccessfulRun === null`), `hasRuns()`.
      5. String methods — the only place this copy exists: `chipLabel()`, `chipIsRedundant()`, `footerLabel()`, `warningTitle()`, `warningReason()`, `recoveryLabel()`, `lastRunLabel()`, `lastRunRelative()`, `outcomeLabel()`, `outcomeModifier()`. Transcribe the plan's copy table verbatim, including the en-dash-free terse register the PRD pins ("synced 6 hours ago", "18.4 km").
      6. Timestamps: staleness and the chip read `finished_at`; the detail card reads `started_at`. Format the absolute stamp in `config('strava.sync_timezone')` — the sync hour is expressed in it, so a 04:12 row must not print as 02:12.
      7. `app/Support/Sync/ResolveSyncStatus.php` — `final readonly`, invokable, `__invoke(User $athlete, HeatmapWindow $window, ?CarbonInterface $now = null): SyncStatus`. Three queries as specified in the plan; no eager-load surface, no loop, no query inside a conditional that could run per row.
      8. `config/strava.php` — `'stale_after_hours' => 48` as a **literal** beside `sync_hour`, with the `/* … */` block explaining why it is not an `env()` lookup, and add it to the file's `@var` array shape.
      9. `.ai/rules/app.md`: every non-obvious decision carries a `/* … */` block **at the decision site** — the precedence order, the strict boundary, why `finished_at` and not `started_at`, why `sync_runs` has no `user_id`, and why `activities_upserted` is not the runs-in-window source.
      10. Do not widen any exception message: `error_message` is rendered to the page, and it must keep carrying status codes and reasons only, never tokens or URLs.
      11. `vendor/bin/pint --dirty --format agent` and `php artisan larapilot:quality`.

      ## Completion Criteria
      - [x] `SyncHealth`, `SyncStatus`, `ResolveSyncStatus` in place; DTO is `final readonly` with a named static factory
      - [x] Precedence and the strict 48-hour boundary implemented as specified
      - [x] Every user-facing string lives on the DTO — no date maths or concatenation left for Blade
      - [x] `stale_after_hours` is a config literal, documented, in the `@var` shape
      - [x] Resolver issues three queries and no more
      - [x] Pint and Larastan level 5 green

      ## Test Data
      - N/A — no model, migration, factory or seeder changes in this task

      ## Git Deliverables
      - Commit: `feat(US-006): TASK-01 resolve sync status into a value object`
      - Push: **skip** (`git_mode: GITFLOW`)
      - PR: update the local PR notes
