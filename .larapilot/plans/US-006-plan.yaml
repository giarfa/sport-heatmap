code: US-006
plan_body: |
  ## Technical Solution

  FR-007 is the criterion the PRD calls fatal if it fails: *stale data presented silently as current*. So the sync state is resolved on **every request**, from the live `sync_runs` table, and is deliberately kept **out of** `HeatmapGridCache` — the grid may legitimately be a cached copy of the last good data, but the sentence that describes it must never be.

  **New classes**

  | Class | Role |
  | --- | --- |
  | `app/Enums/SyncHealth.php` | The four states the dashboard branches on: `Healthy`, `Failed`, `Stale`, `NeverSynced`. |
  | `app/Data/SyncStatus.php` | Final readonly DTO built by a named static factory `SyncStatus::from()`. Owns the health decision and **every user-facing string** — `chipLabel()`, `warningTitle()`, `warningReason()`, `lastRunLabel()`, `outcomeLabel()` — so no date arithmetic or string building reaches Blade. Same contract `IntensityScale` follows in US-005. |
  | `app/Support/Sync/ResolveSyncStatus.php` | Final readonly invokable: three small queries in, one `SyncStatus` out. The only place the dashboard learns about `sync_runs`. |
  | `resources/views/components/sync-chip.blade.php` | Header chip: dot + `Synced 6 hours ago`. |
  | `resources/views/components/sync-warning.blade.php` | `role="alert"` banner above the grid. |
  | `resources/views/components/sync-detail.blade.php` | Rail card: last run, outcome, runs in window. Replaces the US-005 placeholder. |
  | `resources/views/components/heatmap-skeleton.blade.php` | Loading skeleton in the grid's exact geometry. |

  **Changed**

  - `app/Enums/SyncRunStatus.php` — gains `label()` and `dotModifier()`; the three status words stop being Blade literals.
  - `app/Http/Controllers/DashboardController.php` — resolves the status and passes it to the view. Stays a single-action invokable with collaborators type-hinted on `__invoke` (`.ai/rules/http.md`).
  - `resources/views/dashboard.blade.php` — banner above the grid card, empty-window line inside it, real sync card in the rail, skeleton branch.
  - `resources/views/layouts/app.blade.php` — `@yield('header-status')` in the slot the layout already reserves for it, and `@yield('footer-status')` for the sub-640 px footer variant. The connect and rejected screens share this layout and must stay untouched, which is why this is a yield and not a view composer.
  - `resources/css/app.css` — `--ok-dot` and `--skeleton` tokens in **all three** blocks (`:root`, `html.dark`, and the `prefers-color-scheme: dark` block for the unset case), plus `.sync-*` and `.skeleton` classes.
  - `config/strava.php` — `stale_after_hours => 48`, a literal beside `sync_hour` (`.ai/rules/config.md`: FR-007's threshold is a product invariant, not a deployment knob — no environment file gets to widen how stale is "fine").

  ### The state machine — one table, five renderings

  `SyncStatus::from()` decides in this precedence order. Precedence matters: a failure that follows a recent success must still warn, because the map is now frozen at the last good sync.

  | # | Condition | `SyncHealth` | Renders |
  | --- | --- | --- | --- |
  | 1 | no `sync_runs` row at all | `NeverSynced` | first-run banner + grid |
  | 2 | most recent run `status = failed` | `Failed` | alert banner (names `error_message`) + grid |
  | 3 | no run has ever succeeded (history is `running` only) | `NeverSynced` | first-run banner + grid, **or the skeleton** when a run is in flight |
  | 4 | last success `finished_at` **more than** 48 h before now | `Stale` | alert banner + grid |
  | 5 | otherwise | `Healthy` | chip only |

  **Boundary is strict:** exactly 48 hours old is still `Healthy`; 48 h + 1 s is `Stale`. TASK-02 pins both sides.

  **Which timestamp:** staleness and the chip read `finished_at` — the moment data actually became current. The detail card's "Last run" reads `started_at`, which is what the mockup prints and what the table is indexed on. A succeeded run always has both.

  **The skeleton is a real state, not decoration.** The page is server-rendered with no client framework, so there is no async fetch to spin over. The skeleton renders exactly when `isSyncing && lastSuccessfulRun === null` — a connected athlete whose first sync is in flight, which is the only moment the product has geometry to hold open and no data to put in it. Rendering it in any other state would be a lie about work in progress.

  ### Copy (Marika — exact strings, transcribed from the mockup where it draws the state)

  | State | Chip | Banner title | Banner body |
  | --- | --- | --- | --- |
  | `Healthy` | `Synced {rel}` | — | — |
  | `Failed` | `Sync failed {rel}` | `Last sync failed {rel}` | `{error_message} The map below is showing data from {j M}.` |
  | `Failed`, never succeeded | `Sync failed {rel}` | `Last sync failed {rel}` | `{error_message} No sync has ever completed, so the map below is empty.` |
  | `Stale` | `Synced {rel}` | `Last successful sync was {rel}` | `The nightly sync has not completed since {j M}. The map below is showing data from then.` |
  | `NeverSynced` | `Never synced` | `Waiting for the first sync` | `No sync has completed yet. The nightly job runs at {sync_hour}:00 {sync_timezone}.` |

  `{rel}` is Carbon `diffForHumans()` — `6 hours ago`, `2 days ago`. The footer variant below 640 px is lowercase, per the mockup: ` · synced 6 hours ago`.

  **Recovery action:** every warning state offers the same single control — **`Reconnect Strava`** → `route('strava.redirect')`, styled as the mockup draws it in state 3. It is uniform on purpose: re-running OAuth is idempotent and harmless, it is the fix for the most common failure (a revoked or rejected refresh token), and Elise's one-primary-action-per-screen rule rejects a banner that offers a menu. FR-010's manual re-sync button is **not** in this spec and must not appear.

  **Empty window** (mockup state 6, verbatim, inside the grid card above the table):
  `No runs found in the last 16 weeks. The map fills in after your next activity syncs.`

  ### Data & queries (Mike, John)

  `ResolveSyncStatus` issues exactly **three** queries, all trivially indexed:

  1. latest run — `SyncRun::query()->latest('started_at')->first()` (the `started_at` index the US-001 migration added exists for precisely this)
  2. latest success — same, filtered on `status = succeeded`
  3. runs in the window — `$athlete->activities()->whereBetween('activity_date', [...])->count()`, served by the existing `(user_id, activity_date)` index

  No new index, no new column, no migration, no model change. `sync_runs` has **no `user_id`** and that is the PRD's recorded data model, not an oversight: this is a single-athlete instance and the sync is instance-wide. The athlete argument scopes query 3 only.

  **Interpretation note (Tom).** The criterion reads "*last run timestamp, outcome, and the number of runs in the window, sourced from `sync_runs`*". Timestamp and outcome come from `sync_runs`; the runs-in-window count **cannot** — `activities_upserted` is a churn counter (the sync command's own comment records that unchanged rows are deliberately not counted), so using it would print `0` after an idempotent re-run of an unchanged window. The count is therefore read from `activities` inside the window, which is exactly the `68` the mockup's sync card shows beside its 68-run dataset.

  **Cache boundary.** `HeatmapGridCache` keeps its US-004 behaviour untouched. A **failed** sync does not call `forget()`, so the grid correctly keeps serving the last good data — which is what makes "the grid still renders what it has, under the warning" work without any new invalidation logic.

  ### Accessibility (Elise, Violet)

  - The warning banner is `role="alert"`, per the mockup README's live-region contract.
  - The loading card carries `aria-busy="true"` **and** `aria-live="polite"` with an `sr-only` "Loading your heatmap…"; its skeleton table is `aria-hidden="true"` so a screen reader is never walked through 42 empty cells.
  - The header chip repeats information the banner already announces. In every warning state the chip is `aria-hidden="true"` — visual redundancy is fine, double announcement is not. In `Healthy` it is the only carrier and stays exposed.
  - The skeleton pulses **only** under `@media (prefers-reduced-motion: no-preference)` — the animation is added inside that query, never added then disabled.
  - The `Reconnect Strava` control is 44 px tall like every other button in this product, and inherits the settled `:focus-visible` ring.
  - `error_message` is rendered through `{{ }}`, escaped. Per `.ai/rules/app.md` these messages are already written to carry status codes and reasons, never tokens — TASK-01 must not widen them, and Lars checks that at review.
  - Contrast: the amber warn triple (`--warn-bg` / `--warn-border` / `--warn-ink`) is already committed in all three token blocks from an earlier spec and is used unchanged; only `--ok-dot` and `--skeleton` are new.

  ### Out of scope

  FR-010 manual re-sync (no "Sync now" button — the recovery action is Reconnect only), FR-011 day-cell detail, FR-012 disconnect, auto-refresh or polling of any kind, and every change to grid geometry, weekly totals, the intensity scale, or the sync pipeline itself.

  ## Git & Branching

  - Mode: **GITFLOW** (from `settings.git_mode`) — Gitflow discipline **without** automatic push.
  - **Precondition, and this one blocks TASK-00:** `feature/US-005-intensity-scale` is **12 commits ahead of `develop` and US-005 is still in `REVIEW`**. US-006 edits the very files US-005 delivered — `dashboard.blade.php`'s rail placeholder and the `app.css` token blocks — so branching from today's `develop` would fork from a tree without them and guarantee a conflict. TASK-00 waits for the US-005 human approval, merges it `--no-ff`, then branches. The same sequence US-004 → US-005 already used.
  - Note for the record: the spec header says **Blocked by: US-003**, which is the *data* dependency (`sync_runs` is written by the US-003 sync command). The *code* dependency is **US-005**. Both are satisfied by the TASK-00 sequence; no spec edit is requested.
  - Branch: `feature/US-006-sync-status` from `develop`.
  - One atomic Conventional Commit per task: `type(US-006): TASK-NN summary`. Never batch tasks into one commit.
  - **No `git push` and no remote PR** unless the user explicitly asks in-session. The PR description toward `develop` is prepared locally.
  - `vendor/bin/pint --dirty --format agent` and `php artisan larapilot:quality` before each commit; tests green before every `task-done`.
  - Merge to `develop` only after human `larapilot-review` approval.

  ## Test Data Strategy

  - **No new or changed Eloquent models, migrations, relationships, factories or seeders.** Every task declares `## Test Data: N/A`.
  - `SyncRunFactory` already ships every state this spec needs, from US-001: `failed()` (recent, with a realistic non-secret `error_message`), `stale()` (succeeded 49–96 h ago — written for this exact criterion), `running()` (in flight, `finished_at` null), and the default succeeded-a-few-hours-ago definition. The "never synced" case is the absence of rows and needs no state.
  - `TrainingBlockSeeder::createSyncRuns()` already composes stale → failed → succeeded so that `migrate:fresh --seed` lands on the **healthy** dashboard. Unchanged.
  - The other four states are reachable in local dev by deleting or re-timing the last row; TASK-07 documents how, so the states can be reviewed without editing the seeder.
  - Tests sign athletes in through `allowlistedAthlete()` / `allowlistAthletes()` from `Tests\TestCase` — never a raw factory user (`.ai/rules/tests.md`) — and set `Http::preventStrayRequests()` in `setUp()`.

  ## Test Strategy

  - Bar: **NORMAL** (from `settings.testing`). PHPUnit feature and unit tests only. **No** Playwright, Dusk, browser tests, viewport matrix, or axe automation — those are `BEST`-bar and are explicitly not planned.
  - Interleaved, not stacked: TASK-02 follows TASK-01; TASK-06 follows TASK-05.
  - The suite is PHPUnit, not Pest (`.ai/rules/boost/tests.md`): `php artisan make:test --phpunit`.

  **Unit — `SyncStatus` and `ResolveSyncStatus`** (TASK-02):

  | Case | Expectation |
  | --- | --- |
  | no rows | `NeverSynced`; chip `Never synced`; banner is the first-run copy |
  | last run failed, earlier success 6 h ago | `Failed` — the failure wins over the recent success |
  | last run failed, no success ever | `Failed`, body says the map is empty |
  | last success finished **exactly** 48 h ago | `Healthy` — the boundary is strict |
  | last success finished 48 h + 1 s ago | `Stale` |
  | last success 6 h ago, no failure | `Healthy`, no banner |
  | history is `running` only | `NeverSynced` **and** `showsSkeleton()` true |
  | `running` with an earlier success | health from the earlier success; `showsSkeleton()` **false** — the grid stays up |
  | `ResolveSyncStatus` counts | runs inside the window only; activities dated outside it and another athlete's activities are excluded |
  | `ResolveSyncStatus` ordering | picks the most recent run and the most recent *successful* run independently |

  **Feature — rendered dashboard** (TASK-06), one test per acceptance criterion:

  - Recent success renders the relative time (`Synced 6 hours ago`) and **no** `role="alert"`.
  - Failed last run renders `role="alert"` carrying the run's own `error_message` and the `Reconnect Strava` action pointing at `route('strava.redirect')`.
  - Success older than 48 hours renders the stale warning naming the date the data is from.
  - Never-synced renders the first-run banner, not a 500 and not a blank rail.
  - **Stale data is never presented as current:** in the failed and stale cases assert the warning **and** that the grid table still rendered — the criterion is a conjunction and must be tested as one.
  - Zero runs in the window renders the empty line above a grid that is still a full table, not an error page.
  - Sync detail card shows the last-run timestamp, the outcome word, and the runs-in-window count; the count matches activities in the window and ignores one placed outside it.
  - First sync in flight renders the skeleton with `aria-busy="true"` and the polite live region, and does **not** render the empty-window line.
  - The connect screen (signed out) still renders with **no** chip and no banner — the layout yields must not leak into the shared shell.

  **Manual tests recommended** (Anne — handoff, allowed at `NORMAL`): view each of the five states at 375 px and 1280 px in both themes; confirm the amber banner clears contrast on both surfaces, the skeleton stops animating under an OS "reduce motion" setting, and the header chip disappears below 640 px while the footer line takes over.

  ## Definition of Done

  | Criterion | Task | Evidence |
  | --- | --- | --- |
  | Relative last-successful-refresh always shown | TASK-01, TASK-04 | TASK-06 feature |
  | Failed or >48 h → warning naming the reason + recovery action | TASK-01, TASK-04 | TASK-02 unit, TASK-06 feature |
  | Stale data never presented as current; grid still renders | TASK-05 | TASK-06 feature (conjunct assertion) |
  | Sync detail: last run, outcome, runs in window | TASK-01, TASK-04 | TASK-06 feature |
  | Skeleton preserves grid geometry; animates only under `prefers-reduced-motion: no-preference` | TASK-03, TASK-04 | TASK-06 + manual |
  | Connected, no runs → empty grid with explanatory line | TASK-05 | TASK-06 feature |
  | `aria-busy` + polite live region; `role="alert"` on the warning | TASK-04 | TASK-06 feature |
  | Tests: recent success, failed run, >48 h, never synced | TASK-02, TASK-06 | suite green |
