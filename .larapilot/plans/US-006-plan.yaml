    body: |-
      ## Description
      Bring the approved US-005 work into `develop`, then branch this spec from it. `feature/US-005-intensity-scale` is 12 commits ahead of `develop`; US-006 edits `resources/views/dashboard.blade.php` (the rail placeholder US-005 left) and `resources/css/app.css` (its token blocks), so branching from `develop` as it stands today would fork from a tree without them. Do **not** push — `git_mode` is `GITFLOW`.

      ## Files Involved
