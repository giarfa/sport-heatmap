    id: TASK-05
    title: 'Wire the dashboard: warning, empty state, skeleton and rail card'
    body: |-
      ## Description
      Wire the dashboard: resolve the status in the controller, render the banner above the grid, the empty-window line inside it, the real sync card in the rail, and the skeleton on a first sync in flight.

      ## Files Involved
      - app/Http/Controllers/DashboardController.php
      - resources/views/dashboard.blade.php

      ## Steps
      1. `DashboardController::__invoke` — add `ResolveSyncStatus $resolveSyncStatus` as an `__invoke` parameter beside the existing collaborators (`.ai/rules/http.md`: single-action invokable, collaborators type-hinted on `__invoke`, not constructor-injected), call it with the same `$window` and `$today` the grid already uses, and pass `status` to the view.
      2. Resolve the status **outside** `$gridCache->remember()`. A cached grid is legitimate; a cached "synced 6 hours ago" is the failure mode this whole spec exists to prevent. Record that with a `/* … */` block at the call site.
      3. `dashboard.blade.php`:
         - `@section('header-status')` → `<x-sync-chip :status="$status" />`; `@section('footer-status')` → the lowercase footer variant, `sm:hidden`.
         - `@if ($status->needsWarning())` → `<x-sync-warning :status="$status" />` **above** the `.dash` block, so it precedes the grid card at every breakpoint.
         - Grid card: `@if ($status->showsSkeleton())` render `<x-heatmap-skeleton />`, `@else` render the empty-window line when `$status->runsInWindow === 0`, then `<x-heatmap-grid :grid="$grid" />`. The grid renders under every warning state — the criterion is a conjunction, never an either/or.
         - Rail: replace the `Sync detail arrives with the next spec.` placeholder card with `<x-sync-detail :status="$status" />`; the legend card above it is untouched.
      4. Verify the empty-window line does **not** appear in the skeleton state — an in-flight first sync has nothing to report yet.
      5. `php artisan test --compact` and `php artisan larapilot:quality`; `vendor/bin/pint --dirty --format agent`.

      ## Completion Criteria
      - [x] Controller stays a single-action invokable; status resolved outside the grid cache
      - [x] Warning renders above the grid; the grid still renders beneath it
      - [x] Empty-window line renders on a connected account with zero runs, and not in the skeleton state
      - [x] Rail placeholder replaced by the real sync card; legend unaffected
      - [x] Existing suite still green
      - [x] UI usable at mobile/tablet/desktop (manual smoke)

