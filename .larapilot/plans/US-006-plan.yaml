      ## Steps
      1. **Blocking check:** confirm US-005 is `DONE` via `php artisan larapilot:spec-show US-005`. If it is still `REVIEW`, stop and take it through `/larapilot-review` first — do not merge an unapproved branch.
      2. `git checkout develop`
      3. `git merge --no-ff feature/US-005-intensity-scale` — the same sequence US-005's own TASK-00 used to bring US-004 in
      4. Confirm the merged tree is sound: `php artisan test --compact` and `php artisan larapilot:quality`
      5. `git checkout -b feature/US-006-sync-status`
      6. Draft the internal PR title (`US-006: Sync status, stale-data warning and empty states`) and body (link the plan, list TASK-01…TASK-07) — keep it local
