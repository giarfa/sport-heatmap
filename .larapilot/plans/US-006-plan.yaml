    title: 'Feature-test every rendered sync and empty state'
    body: |-
      ## Description
      Cover the rendered dashboard: one test per acceptance criterion, including the conjunction that the warning and the grid appear together.

      ## Files Involved
      - tests/Feature/Dashboard/SyncStatusTest.php _(new)_

      ## Steps
      1. `php artisan make:test --phpunit SyncStatusTest`, placed under `tests/Feature/Dashboard/` beside `HeatmapGridTest` and `HeatmapLegendTest`; mirror their `setUp()` — `RefreshDatabase`, `Http::preventStrayRequests()`, `$this->travelTo('2026-09-05 09:00:00')`.
      2. Use `allowlistedAthlete()` and `actingAs()`; build sync history from the existing `SyncRunFactory` states (`failed()`, `stale()`, `running()`, default) and activities from `Activity::factory()->for($athlete)->onDate(...)`.
      3. Tests, one per criterion:
         - recent success → response contains `Synced 6 hours ago` and **no** `role="alert"`
         - failed last run → `role="alert"` present, contains that run's `error_message`, and the `Reconnect Strava` action links to `route('strava.redirect')`
         - success older than 48 hours → stale warning naming the date the data is from
         - never synced → first-run banner, HTTP 200, rail still rendered
         - **stale data never presented as current** → in both the failed and stale cases assert the warning **and** that the grid table rendered in the same response
         - connected with zero runs in the window → the empty line and a full grid table, not an error
         - sync detail card → last-run timestamp, outcome word, and a runs-in-window count that excludes an activity deliberately dated outside the window
         - first sync in flight → `aria-busy="true"`, the polite live region, and no empty-window line
         - signed out → the connect screen renders with no chip and no banner
      4. `php artisan test --compact tests/Feature/Dashboard/SyncStatusTest.php`, then the full suite.
      5. Do **not** add Playwright, Dusk, Pest browser or viewport suites — `settings.testing` is `NORMAL`.

      ## Completion Criteria
      - [ ] One test per acceptance criterion, all passing
      - [ ] Warning-plus-grid asserted as a conjunction in both stale and failed cases
      - [ ] Runs-in-window count proven to ignore activities outside the window
      - [ ] Full suite and `php artisan larapilot:quality` green

