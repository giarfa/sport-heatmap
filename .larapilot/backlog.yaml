    code: US-007
    title: 'Public read-only dashboard on the home page'
    epic:
      code: EP-003
      title: 'Heatmap dashboard'
    priority: HIGH
    points: 3
    status: DONE
    body: |
      #### US-007: Public read-only dashboard on the home page

      **Epic:** EP-003 | **Priority:** HIGH | **Points:** 3 | **Status:** DONE
      **Blocked by:** -
      **Type:** Change request
      **Supersedes:** US-002 criterion "Visiting the dashboard while signed out renders the connect screen, not an error" — now only when no allowlisted athlete has connected yet
      **Traces to:** FR-017 (MoSCoW: Must) · FR-001 (changed) · FR-007 · FR-008 · FR-009 — no journey (the PRD has no `## User Journeys`)
      **Prior art:** built-in — a public route on the existing controller and cache; no package involved

      **User Story**
      As the Committed Amateur Runner,
      I want my heatmap to open on the home page without a Strava sign-in,
      so that I can check it on any device instantly and share the link with anyone.

      **Demonstrates**
      Opening `/` in a private browser window, with no session, shows the owner's last synced 16-week heatmap,
      weekly totals, legend, and sync status. Signing in is still possible from a discreet "Connect with Strava"
      entry point, and still restricted to the allowlist.

      **Acceptance Criteria**
      - [x] A signed-out `GET /` returns 200 and renders the displayed athlete's heatmap grid, weekly totals, legend, sync chip, and sync detail — the same content the signed-in owner sees
      - [x] The displayed athlete is the first id in `STRAVA_ALLOWED_ATHLETE_IDS`, in configured order, that has a connected user record; an athlete removed from the allowlist is never displayed, even while their rows remain stored
      - [x] When no allowlisted athlete has connected yet, a signed-out visit renders the existing connect screen with 200, not an error
      - [x] Signed-out visitors see a discreet "Connect with Strava" entry point; the OAuth flow is unchanged — an allowlisted athlete signs in, any other athlete is rejected with nothing persisted
      - [x] When the last sync failed or is stale, signed-out visitors see the same warning as the owner — title, failure reason (HTML-escaped), and reconnect link
      - [x] A signed-out request is strictly read-only: it writes no row to `users`, `activities`, or `sync_runs`, sends no HTTP request to Strava, and never triggers a token refresh
      - [x] A signed-in owner whose token can no longer be refreshed is signed out and lands on the public dashboard with the "Your Strava connection expired" banner, not on a connect-only screen
      - [x] A signed-in athlete removed from the allowlist still gets the 403 rejection with the session ended (unchanged)
      - [x] Signed-out visitors and the owner share the same grid cache; the sync status is still read fresh on every request (FR-007)
      - [x] The page keeps `<meta name="robots" content="noindex, nofollow">`, and the "Powered by Strava" attribution is visible to signed-out visitors (FR-008)
      - [x] FR-009 holds for signed-out visitors: the 375 px layout without page scroll, table semantics with an accessible name per cell, light and dark themes
      - [x] Feature tests (Strava HTTP faked): guest sees a populated map; no-athlete-connected fallback; removed athlete not displayed; a guest request writes nothing and sends no HTTP request; dead-token owner lands on the public map with the banner; guest sees the sync warning

      **Notes for planning**
      - ⚖️ Violet: the owner accepted the Strava API Agreement risk ("display a user's data only to that user") on 2026-10-11 — PRD `### Privacy & legal`. Do not reopen it in planning.
      - 🔐 Lars: guests must never reach `EnsureFreshAccessToken` — the displayed athlete is resolved for reading only.
      - The developer domain doc for the dashboard/auth domain is updated in this spec.
