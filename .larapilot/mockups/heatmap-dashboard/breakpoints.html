<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Breakpoints — training heatmap</title>
<meta name="description" content="Private training dashboard — daily running distance over the last 16 weeks.">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<script src="https://cdn.tailwindcss.com"></script>
<script>tailwind.config = { darkMode: 'class', theme: { extend: { fontFamily: { sans: ['Inter','ui-sans-serif','system-ui','sans-serif'] } } } }</script>
<link rel="preconnect" href="https://fonts.bunny.net">
<link href="https://fonts.bunny.net/css?family=inter:400,500,600,700" rel="stylesheet">
<style>
  /* ---- Design tokens -------------------------------------------------------
     Intensity ramp: single-hue blue sequential, validated with the dataviz
     validator against the real card surfaces (#ffffff light / #0f172a dark):
     light  -> monotone L, adjacent dL >= 0.06, lightest step 2.11:1, hue spread 3deg
     dark   -> same gates, step nearest surface 2.20:1
     Do not substitute steps by eye. Re-run the validator if you change one. */
  :root {
    --surface-page: #f8fafc;  /* slate-50  */
    --surface-card: #ffffff;
    --hairline:     #e2e8f0;  /* slate-200 */
    --ink:          #0f172a;  /* slate-900 */
    --ink-muted:    #64748b;  /* slate-500 */
    --accent:       #4338ca;  /* indigo-700 — focus & links, never a data colour */
    --warn-bg:      #fffbeb;  /* amber-50  */
    --warn-border:  #fcd34d;  /* amber-300 */
    --warn-ink:     #92400e;  /* amber-800 */
    --ok-dot:       #0ca30c;
    --skeleton:     #e2e8f0;

    --lv-0: #e2e8f0;
    --lv-1: #86b6ef;
    --lv-2: #3987e5;
    --lv-3: #256abf;
    --lv-4: #104281;
    --lv-future-border: #cbd5e1;
    --cell-ring: rgba(15, 23, 42, 0.08);
  }
  html.dark {
    --surface-page: #020617;  /* slate-950 */
    --surface-card: #0f172a;  /* slate-900 */
    --hairline:     #1e293b;  /* slate-800 */
    --ink:          #f8fafc;
    --ink-muted:    #94a3b8;  /* slate-400 */
    --accent:       #a5b4fc;  /* indigo-300 */
    --warn-bg:      #2a1f05;
    --warn-border:  #854d0e;
    --warn-ink:     #fcd34d;
    --ok-dot:       #22c55e;
    --skeleton:     #1e293b;

    --lv-0: #1e293b;
    --lv-1: #184f95;
    --lv-2: #2a78d6;
    --lv-3: #5598e7;
    --lv-4: #9ec5f4;
    --lv-future-border: #334155;
    --cell-ring: rgba(248, 250, 252, 0.10);
  }

  body { background: var(--surface-page); color: var(--ink); }
  .sr-only { position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0; }
  .skip-link { position:absolute; left:-9999px; }
  .skip-link:focus { left:0.75rem; top:0.75rem; z-index:50; padding:0.5rem 0.75rem; border-radius:0.5rem;
    background:var(--surface-card); color:var(--ink); outline:2px solid var(--accent); outline-offset:2px; }
  :where(a, button, [tabindex]):focus-visible { outline:2px solid var(--accent); outline-offset:2px; border-radius:0.375rem; }

  .card { background: var(--surface-card); border:1px solid var(--hairline); border-radius:0.75rem; }

  /* ---- Heatmap -------------------------------------------------------------
     Column widths are percentages on <colgroup> and gaps are cell padding, so
     the grid always sums to exactly 100% of its container. Never reintroduce
     border-spacing here: it is added ON TOP of width:100% and pushes Sunday
     and the week-total column off a 375px viewport. */
  .hm { width:100%; table-layout:fixed; border-collapse:separate; border-spacing:0; }
  .hm-col-week  { width:13%; }
  .hm-col-day   { width:9.5%; }
  .hm-col-total { width:20.5%; }

  .hm-th-week { padding:0 0.375rem 0 0; text-align:right; font-size:0.625rem; font-weight:500;
    color:var(--ink-muted); font-variant-numeric:tabular-nums; white-space:nowrap; vertical-align:middle; }
  .hm-th-day { padding:0 0 0.375rem; font-size:0.625rem; font-weight:600; color:var(--ink-muted); text-align:center; }
  .hm-th-day abbr { text-decoration:none; }
  .hm-th-total { padding:0 0 0.375rem 0.375rem; font-size:0.625rem; font-weight:600; color:var(--ink-muted); text-align:right; }
  .hm-td { padding:2px; }
  .hm-cell { display:block; width:100%; aspect-ratio:1/1; border-radius:0.1875rem;
    box-shadow: inset 0 0 0 1px var(--cell-ring); }
  .hm-l0 { background: var(--lv-0); }
  .hm-l1 { background: var(--lv-1); }
  .hm-l2 { background: var(--lv-2); }
  .hm-l3 { background: var(--lv-3); }
  .hm-l4 { background: var(--lv-4); }
  .hm-future { background: transparent; box-shadow:none; border:1px dashed var(--lv-future-border); }
  .hm-total { text-align:right; font-size:0.6875rem; color:var(--ink); vertical-align:middle;
    font-variant-numeric:tabular-nums; white-space:nowrap; padding:0 0 0 0.375rem; }
  .hm-total-num { font-weight:600; }
  .hm-total-unit { color:var(--ink-muted); }
  .hm-partial { display:block; font-size:0.5625rem; font-weight:500; color:var(--ink-muted);
    text-transform:uppercase; letter-spacing:0.04em; line-height:1.1; }
  .hm-row-current .hm-th-week { color:var(--ink); font-weight:600; }

  .hm-legend-title { font-size:0.75rem; font-weight:600; color:var(--ink); }
  .hm-legend-note { margin-top:0.125rem; font-size:0.75rem; color:var(--ink-muted); }
  .hm-legend-list { margin-top:0.5rem; display:flex; flex-wrap:wrap; gap:0.375rem 1rem; }
  .hm-key { display:flex; align-items:center; gap:0.375rem; font-size:0.6875rem; color:var(--ink-muted); }
  .hm-key-swatch { width:0.75rem; height:0.75rem; aspect-ratio:auto; border-radius:0.1875rem; flex:none; }
  .hm-key-name { font-weight:600; color:var(--ink); }
  .hm-key-range { font-variant-numeric:tabular-nums; }

  @media (min-width: 480px) {
    .hm-th-week { font-size:0.6875rem; }
    .hm-th-day, .hm-th-total { font-size:0.6875rem; }
    .hm-total { font-size:0.8125rem; }
    .hm-td { padding:3px; }
    .hm-cell { border-radius:0.25rem; }
    .hm-key { font-size:0.75rem; }
  }
  @media (min-width: 1024px) {
    .hm-col-week { width:11%; }
    .hm-col-day { width:9.7%; }
    .hm-col-total { width:21.1%; }
    .hm-th-week { font-size:0.75rem; }
    .hm-total { font-size:0.875rem; }
    .hm-td { padding:4px; }
  }

  /* ---- Dashboard layout ----------------------------------------------------
     The grid is capped at a readable cell density (~48px) instead of stretching
     to the container. Desktop enhancement is a side rail, not bigger squares. */
  .dash { display:grid; gap:1rem; align-items:start; }
  .dash-grid { max-width:34rem; margin-inline:auto; width:100%; }
  .states .dash-grid { margin-inline:0; }
  .rail { display:grid; gap:1rem; }
  @media (min-width: 1024px) {
    .dash { grid-template-columns: minmax(0, 34rem) minmax(0, 1fr); gap:1.5rem; }
    .dash-grid { margin-inline:0; }
  }

  .skeleton { background: var(--skeleton); border-radius:0.1875rem; }
  @media (prefers-reduced-motion: no-preference) {
    .skeleton { animation: pulse 1.6s ease-in-out infinite; }
    @keyframes pulse { 0%,100% { opacity:1 } 50% { opacity:0.55 } }
  }
</style>
</head>
<body class="min-h-screen font-sans antialiased">
  
    <header class="sticky top-0 z-10 border-b" style="background:var(--surface-card); border-color:var(--hairline);">
      <div class="mx-auto flex h-14 max-w-5xl items-center justify-between px-3 sm:px-6">
        <a href="index.html" class="flex items-center gap-2" style="color:var(--ink);">
          <svg width="22" height="22" viewBox="0 0 32 32" aria-hidden="true" class="shrink-0">
            <rect x="3"  y="17" width="12" height="12" rx="3" fill="#86b6ef"/>
            <rect x="17" y="17" width="12" height="12" rx="3" fill="#2a78d6"/>
            <rect x="3"  y="3"  width="12" height="12" rx="3" fill="#3987e5"/>
            <rect x="17" y="3"  width="12" height="12" rx="3" fill="#104281"/>
          </svg>
          <span class="text-sm font-semibold tracking-tight">Heatmap</span>
        </a>
        <div class="flex items-center gap-1">
          
          <button type="button" data-theme-toggle aria-pressed="false"
                  class="grid h-11 w-11 place-items-center rounded-lg" style="color:var(--ink-muted);">
            <span class="sr-only">Toggle dark mode</span>
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
              <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
            </svg>
          </button>
        </div>
      </div>
    </header>
  <main class="mx-auto max-w-full px-3 py-6 sm:px-6">
    <h1 class="text-lg font-semibold tracking-tight sm:text-xl">Breakpoints</h1>
    <p class="mt-0.5 mb-4 text-sm" style="color:var(--ink-muted);">
      The same document at three widths — one responsive implementation, no separate mobile page.
      <a href="index.html" class="underline underline-offset-2" style="color:var(--accent);">Back to the dashboard</a>.
    </p>
    <div class="flex gap-5 overflow-x-auto pb-4">
      <figure class="shrink-0">
        <figcaption class="mb-2 text-xs font-semibold" style="color:var(--ink-muted);">320 px — smallest supported</figcaption>
        <iframe src="index.html" title="Dashboard at 320 px — smallest supported" width="320" height="900"
                class="rounded-xl border" style="border-color:var(--hairline); background:var(--surface-card);"></iframe>
      </figure>
      <figure class="shrink-0">
        <figcaption class="mb-2 text-xs font-semibold" style="color:var(--ink-muted);">375 px — phone (design origin)</figcaption>
        <iframe src="index.html" title="Dashboard at 375 px — phone (design origin)" width="375" height="900"
                class="rounded-xl border" style="border-color:var(--hairline); background:var(--surface-card);"></iframe>
      </figure>
      <figure class="shrink-0">
        <figcaption class="mb-2 text-xs font-semibold" style="color:var(--ink-muted);">768 px — tablet</figcaption>
        <iframe src="index.html" title="Dashboard at 768 px — tablet" width="768" height="900"
                class="rounded-xl border" style="border-color:var(--hairline); background:var(--surface-card);"></iframe>
      </figure>
      <figure class="shrink-0">
        <figcaption class="mb-2 text-xs font-semibold" style="color:var(--ink-muted);">1280 px — desktop</figcaption>
        <iframe src="index.html" title="Dashboard at 1280 px — desktop" width="1280" height="900"
                class="rounded-xl border" style="border-color:var(--hairline); background:var(--surface-card);"></iframe>
      </figure>
    </div>
  </main>
  
<script>
  /* Mockup default is LIGHT so the primary reference screenshots light.
     PRODUCT CONTRACT (Alex): on first visit follow prefers-color-scheme,
     then persist the user's explicit choice. */
  (function () {
    var root = document.documentElement;
    if (localStorage.getItem('theme') === 'dark') root.classList.add('dark');
    document.addEventListener('click', function (e) {
      var btn = e.target.closest('[data-theme-toggle]');
      if (!btn) return;
      root.classList.toggle('dark');
      var dark = root.classList.contains('dark');
      localStorage.setItem('theme', dark ? 'dark' : 'light');
      document.querySelectorAll('[data-theme-toggle]').forEach(function (b) {
        b.setAttribute('aria-pressed', dark ? 'true' : 'false');
      });
    });
  })();
</script>
</body>
</html>
