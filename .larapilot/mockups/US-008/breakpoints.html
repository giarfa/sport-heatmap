<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<title>Garmin import — breakpoints</title>
<link rel="stylesheet" href="import.css">
<style>
  .frames { display: flex; flex-wrap: wrap; gap: 1.5rem; padding: 1.5rem; align-items: flex-start; }
  figure { margin: 0; }
  figcaption { font-size: 0.75rem; color: var(--ink-muted); margin-bottom: 0.375rem; }
  iframe { border: 1px solid var(--hairline); border-radius: 0.5rem; background: #fff; height: 900px; }
</style>
</head>
<body>
<div class="frames">
  <figure><figcaption>review · 375 px · light (design origin)</figcaption><iframe src="review.html" width="375" title="Review at 375 px, light"></iframe></figure>
  <figure><figcaption>review · 375 px · dark</figcaption><iframe src="review.html#dark" width="375" title="Review at 375 px, dark"></iframe></figure>
  <figure><figcaption>review · 768 px</figcaption><iframe src="review.html" width="768" title="Review at 768 px"></iframe></figure>
  <figure><figcaption>review · 1280 px · dark</figcaption><iframe src="review.html#dark" width="1280" title="Review at 1280 px, dark"></iframe></figure>
  <figure><figcaption>upload · 375 px</figcaption><iframe src="upload.html" width="375" title="Upload at 375 px"></iframe></figure>
  <figure><figcaption>summary · 375 px · dark</figcaption><iframe src="summary.html#dark" width="375" title="Summary at 375 px, dark"></iframe></figure>
</div>
</body>
</html>
